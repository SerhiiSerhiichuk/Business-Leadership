<!DOCTYPE html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Сто днів CRM</title>
<style>
:root{--ink:#1E2761;--ink2:#384080;--bg:#F3F6FC;--card:#fff;--gold:#C9962C;--goldsoft:#F3E4C6;--mut:#5B6685;--line:#DDE4F5;--hero:#1E2761;--red:#B3492F;--green:#2E7D6B;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#E8ECFF;--ink2:#B9C2F0;--bg:#10142B;--card:#1A2040;--gold:#E0AE45;--goldsoft:#3A3420;--mut:#A3ADD3;--line:#2E3664;--hero:#2B3575;--green:#4FB59E;--red:#E0795C}}
:root[data-theme="dark"]{--ink:#E8ECFF;--ink2:#B9C2F0;--bg:#10142B;--card:#1A2040;--gold:#E0AE45;--goldsoft:#3A3420;--mut:#A3ADD3;--line:#2E3664;--hero:#2B3575;--green:#4FB59E;--red:#E0795C}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.serif{font-family:Cambria,Georgia,serif}#app{display:flex;justify-content:center;padding:28px 16px}.st{width:100%;max-width:720px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:34px 30px;box-shadow:0 18px 40px -26px rgba(30,39,97,.4)}
@media(max-width:480px){.card{padding:24px 18px}}
.k{font-size:13px;color:var(--mut);margin:0 0 8px}h1{font-size:26px;line-height:1.2;margin:0}h2{font-size:18px;margin:26px 0 10px}p{margin:0 0 12px}.mut{color:var(--mut)}.sm{font-size:14px}
input,textarea{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);font:inherit;font-size:15px;color:var(--ink);background:var(--bg)}
.btn{display:inline-flex;justify-content:center;align-items:center;padding:13px 22px;border-radius:10px;border:1.5px solid var(--line);font:inherit;font-weight:600;font-size:15px;cursor:pointer;background:var(--bg);color:var(--ink)}
.pri{background:var(--ink);color:var(--bg);border-color:var(--ink);width:100%}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.row .btn{flex:1;min-width:150px}
.pg{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:18px}.pg i{display:block;height:100%;background:var(--gold);transition:width .3s}
.bar{margin-bottom:9px}.bl{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;margin-bottom:3px}.bt{height:11px;background:var(--bg);border:1px solid var(--line);border-radius:7px;overflow:hidden}.bt i{display:block;height:100%;border-radius:7px;transition:width .4s}
.hero{background:var(--hero);color:#fff;border-radius:14px;padding:20px 22px;margin-top:18px}.hero p{color:#DCE1F5;font-size:14.5px}.hero b{color:#fff}.hero .lb{font-size:12px;color:#F3E4C6;font-weight:700}.hero .nm{font-size:22px;font-weight:700;margin:2px 0 10px}
.box{margin-top:14px;padding:14px 16px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:14px}
.quote{margin:14px 0;padding:14px 16px;border-radius:14px;background:var(--goldsoft);border:1px solid var(--line);font-size:15.5px;line-height:1.5;color:#1E2761}
:root[data-theme="dark"] .quote{color:var(--ink)}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .quote{color:var(--ink)}}
.sc{display:flex;gap:14px;align-items:center;margin-bottom:12px}.ic{flex:none;width:52px;height:52px;border-radius:14px;background:var(--goldsoft);display:flex;align-items:center;justify-content:center}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:700;margin:0 6px 6px 0;border:1px solid var(--line)}.chip.up{color:var(--green);background:color-mix(in srgb,#2E7D6B 16%,var(--bg))}.chip.dn{color:var(--red);background:color-mix(in srgb,#B3492F 16%,var(--bg))}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.link{display:block;margin:18px auto 0;background:none;border:none;color:var(--mut);font-size:13px;text-decoration:underline;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(10,14,40,.62);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}.ov .card{max-height:90vh;overflow:auto;width:100%;max-width:760px}
.cb{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:13px 14px;margin-bottom:8px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px;cursor:pointer}.cb .em{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}.cb:hover{border-color:var(--gold)}
ol{margin:6px 0 0;padding-left:20px}li{margin-bottom:6px}

html,body{background:linear-gradient(180deg,#E4EAFA 0,var(--bg) 360px) no-repeat,var(--bg)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background:var(--bg)}}
.card{position:relative;overflow:hidden;padding-top:42px;border:none}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:linear-gradient(90deg,#E08BA4,#D7B25A,#7C8BC9,#A98BD1,#5FB5AE,#8DBB5A,#B6A472,#6FB8A2)}
.pic{background:var(--hero);border-radius:14px;padding:16px 14px 10px;margin:0 0 20px;box-shadow:0 10px 24px -16px rgba(30,39,97,.7)}.pic svg{display:block}
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--hero);color:#fff;border-radius:12px;padding:10px 14px;margin-bottom:16px}
.pill{background:#C9962C;color:#fff;font-weight:800;font-size:12px;padding:3px 11px;border-radius:20px;white-space:nowrap}.bt2{font-weight:700;font-size:14px}
.ic{background:color-mix(in srgb,var(--c,#C9962C) 24%,var(--card));border:2px solid var(--c,#C9962C);border-radius:50%;width:56px;height:56px}
.two{display:grid;grid-template-columns:1fr 150px;gap:14px;align-items:center}.scene{width:150px;height:112px;border-radius:12px;overflow:hidden}.scene svg{display:block;width:100%;height:100%}
@media(max-width:560px){.two{grid-template-columns:1fr 104px}.scene{width:104px;height:78px}}
.sbar{margin:0 0 14px}.stx{display:flex;justify-content:space-between;font-size:13.5px;font-weight:700;margin-bottom:5px}
.strack{position:relative;height:14px;border-radius:8px;overflow:hidden;background:linear-gradient(90deg,#D9534F 0%,#E8B923 50%,#3FA66B 100%)}.srest{position:absolute;right:0;top:0;bottom:0;background:var(--line);transition:width .4s ease}
.cq{border-radius:14px;padding:14px 16px;color:#fff;margin-bottom:12px;line-height:1.5}.cq.good{background:#2E7D6B}.cq.mid{background:#A9751C}.cq.bad{background:#B3492F}.cq b{display:block;font-size:15px;margin-bottom:4px}
.cb{border-left:6px solid var(--c,var(--line))}.cb .em{background:var(--c,var(--ink));color:#fff}
.bg{display:inline-block;min-width:44px;text-align:center;padding:2px 8px;border-radius:999px;font-weight:800;font-size:12.5px;color:#fff}.bg.good{background:#2E7D6B}.bg.mid{background:#A9751C}.bg.bad{background:#B3492F}
.big{font-size:52px;font-weight:800;line-height:1.1;margin:6px 0 4px}
.cs{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px;margin:0 0 10px;cursor:pointer;color:var(--ink)}
.cs:hover{border-color:#C9962C;background:var(--goldsoft)}
.csp{width:92px;height:68px;border-radius:12px;overflow:hidden;flex:none;border:1.5px solid var(--line)}.csp svg{display:block;width:100%;height:100%}
.cst{display:flex;flex-direction:column;gap:3px;min-width:0}.cst b{font-size:15px}
@media(max-width:560px){.csp{width:72px;height:54px}}
.chips8{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.chip8{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:12px;font-size:12.5px;font-weight:600;line-height:1.3;background:color-mix(in srgb,var(--c) 20%,var(--card));border:2px solid var(--c);opacity:.42;filter:saturate(.45);transition:opacity .2s,filter .2s}
.chip8 .n8{font-weight:800;color:var(--ink2);min-width:12px}.chip8 .i8{font-size:16px;flex:none}
.chip8.on{opacity:1;filter:none;font-weight:800;box-shadow:0 6px 16px -8px var(--c)}
@media(max-width:480px){.chips8{gap:6px}.chip8{font-size:11.5px;padding:6px 8px;gap:6px}}
</style></head><body><div id="app"></div>
<script>
(function(){
var MAXPTS=16;
var COL=["#E08BA4","#D7B25A","#7C8BC9","#A98BD1","#5FB5AE","#8DBB5A","#B6A472","#6FB8A2"];
var KS=[
{n:1,t:"Створити відчуття терміновості",c:"Люди не бачили, навіщо зміни, тож їх сприймали як примху керівництва, а підтримка трималася на наказах."},
{n:2,t:"Зібрати коаліцію змін",c:"Проєкт тримався на одній-двох людях: звільнення чи збій одразу обвалювали темп, а скептиків не було кому переконувати."},
{n:3,t:"Сформувати бачення",c:"Кожен уявляв майбутнє по-своєму, і спільного орієнтира не було: людям доводилося домислювати мету змін самим."},
{n:4,t:"Донести бачення",c:"Інформація була, але не про вигоду для людей: порожнечу заповнювали чутки, і довіра знижувалась."},
{n:5,t:"Усунути перешкоди",c:"Старі правила, премії й нестача навчання лишилися, тож нове обходили: працювати по-новому було невигідно."},
{n:6,t:"Забезпечити швидкі перемоги",c:"Без видимого результату пілота скептики вирішили, що зміни — лише витрати, і підтримка слабшала."},
{n:7,t:"Закріпити успіхи й рухатися далі",c:"Успіх оголосили закінченням, імпульс зник, а процеси, що не вписувалися в нове, ніхто не змінив."},
{n:8,t:"Вкорінити зміни в культурі",c:"Нові дії не вписали в оцінювання й адаптацію, тож у складні моменти люди поверталися до старого."}];
function O(k,pts,lbl,t,r,w){return{k:k,pts:pts,lbl:lbl,t:t,r:r,w:w}}
var STAGES_CRM=[
{days:"1–10",title:"Чому саме зараз",ctx:"Директорка Ірина підписала закупівлю CRM. Відділ продажів досі веде клієнтів у таблицях, і за квартал загубили кілька великих заявок. Ви — керівник змін, у вас сто днів.",o:[
O("g",2,"Цифри втрат","Порахувати, скільки грошей і клієнтів компанія втратила за квартал через таблиці, і показати ці цифри на нараді керівників відділів.","Фінансова директорка довго дивиться на суму: «Це більше, ніж коштує вся система». Богдан мовчить, а потім просить показати заявки поіменно.","Цифри втрат пояснюють, чому зміни потрібні саме зараз (крок 1): керівники бачать ціну бездіяльності й перестають вважати проєкт примхою."),
O("m",1,"Слайди на зборах","Провести загальні збори, показати слайди про те, що компанія має стати сучаснішою, і оголосити, що CRM запровадять цього року.","Збори минули тихо: кілька кивків і жодного запитання. У коридорі чути: «Ну, буде ще одна система, подивимося».","Люди почули, що зміни будуть, але не побачили, чому вони потрібні вже зараз (крок 1 виконано наполовину): терміновості немає, тож поспішати ніхто не буде."),
O("p",0,"Наказ про дату","Одразу вибрати постачальника й оголосити наказом дату переходу, щоб не втрачати час на обговорення, зустрічі та зайві суперечки.","Наказ з’явився в чаті о п’ятій вечора. Богдан пише: «Нас навіть не спитали». Ознайомлення підписали всі, проте навіщо це, ніхто не пояснив.","Наказ запускає рух, але без пояснення, навіщо зміни (крок 1 пропущено): люди виконують формально, а опір лишається невидимим.")]},
{days:"11–20",title:"Хто поведе зміни",ctx:"Ірина погодила перехід, і керівники визнали, що проблема справжня. Але проєкт досі тримається лише на вас, а продавці не знають, кому з колег можна довіряти в цій історії.",o:[
O("g",2,"Група впливових","Зібрати групу з Олени (їй довіряють продавці), Богдана (відомого скептика) і Тараса (фінанси й ІТ) та разом очолити перехід.","Олена: «Якщо в групі Богдан, то нас точно ніхто не обдурить». Богдан спершу кривиться, а потім просить дати йому реальні заявки для перевірки.","Група з людей, яким довіряють різні відділи (крок 2), ділить відповідальність і тягне за собою інших: проєкт більше не тримається на одній людині."),
O("m",1,"Помічники з ІТ","Призначити двох помічників з ІТ-відділу, які налаштовуватимуть систему й щотижня звітуватимуть вам про хід робіт і проблеми.","Помічники сумлінно налаштовують систему, але продавці називають їх «ІТшниками з нового проєкту» і з питаннями до них не підходять.","Група є, але в ній немає людей, яким довіряють продавці (крок 2 виконано наполовину): технічно проєкт рухається, а впливу на колег у нього мало."),
O("p",0,"Вести самому","Вести проєкт самостійно, щоб швидше ухвалювати рішення, а до колег звертатися лише тоді, коли виникне конкретна потреба.","Через тиждень ви не встигаєте відповідати на запитання відділів. Скептики кажуть: «Він що, сам усе вирішує?» і чекають першого збою.","Один керівник без коаліції (крок 2 пропущено) не має ні сил, ні впливу: щойно з’явиться збій чи опір, підтримати проєкт буде нікому.")]},
{days:"21–32",title:"Куди ми йдемо",ctx:"Група працює. Усі знають, що CRM буде, але уявляють її по-різному: продавці бояться контролю, склад чекає додаткової паперової роботи, а клієнти нічого не чули.",o:[
O("g",2,"Бачення на сторінку","Разом із групою написати бачення на одну сторінку: що зміниться для продавця, складу й клієнта і якою буде робота через рік.","Група сперечається над кожним реченням, але ввечері на аркуші з’являється фраза, яку може повторити кожен: «Жодна заявка більше не губиться».","Коротке бачення, яке пояснює, що зміниться для кожного (крок 3), дає всім спільний орієнтир і знімає страхи, які люди домислювали самі."),
O("m",1,"Опис постачальника","Узяти опис майбутньої системи з презентації постачальника й використати його як бачення проєкту для компанії без змін і доповнень.","Текст звучить правильно, але в ньому багато слів про функції та мало про людей. Тарас: «Це не про нас, це про їхній продукт».","Є опис, але немає бачення саме для вашої компанії (крок 3 виконано наполовину): воно не відповідає на питання «що це дає мені»."),
O("p",0,"Без бачення","Не писати бачення: спершу налаштувати систему, а пояснити людям, навіщо вона, коли все запрацює й можна буде показати результат.","Налаштування просувається швидко, а в чаті з’являється запитання: «Це щоб нас контролювати?» Відповіді ніхто не дає, чутки множаться.","Без бачення (крок 3 пропущено) люди самі домислюють, що означає система: найчастіше — контроль і скорочення.")]},
{days:"33–45",title:"Розповісти людям",ctx:"Бачення готове, і група його підтримує. Але про нього знають лише ті, хто його писав. До запуску пілота лишається кілька тижнів, а продавці й склад досі не чули пояснення.",o:[
O("g",2,"Розмова з відділами","Пройти бачення з кожним відділом, вислухати запитання, а потім повторювати його на нарадах і в робочому чаті простими прикладами.","Склад уперше чує про зручніші накладні, а продавці — що система не буде звітом для контролю. Пролунали живі запитання, чесніших розмов давно не було.","Бачення працює, коли його повторюють різними каналами й слухають запитання (крок 4): люди бачать, що зміни стосуються їх і що їм відповідають."),
O("m",1,"Розсилка постачальника","Розіслати всім презентацію постачальника з переліком функцій і датою запуску, не пояснюючи, що це дає кожному з відділів.","Більшість відкрила файл на першій сторінці. Продавці знайшли слово «контроль», склад — «нові обов’язки». Питання «а мені що з цього» лишилося без відповіді.","Інформація поширена, але не пояснена (крок 4 виконано наполовину): люди отримали факти, а відповіді на головне питання «що це змінить для мене» — ні."),
O("p",0,"Плакати в офісі","Повісити в офісі плакати «Ми стаємо сучаснішими» й чекати, що люди самі зрозуміють, що це означає для їхньої щоденної роботи.","Під плакатом хтось дописав: «Сучасніші — значить, звільнять?» Налаштування просувається швидко, але чутки йдуть швидше за графік.","Гасло без пояснень не доносить бачення (крок 4 пропущено): порожнечу заповнюють чутки, і довіра до проєкту знижується.")]},
{days:"46–62",title:"Що заважає працювати",ctx:"Налаштування майже завершено. Але форма угоди має двадцять три поля, бонуси досі рахують за старими таблицями, а навчання ніхто не проводив.",o:[
O("g",2,"Спростити й навчити","Скоротити форму до семи ключових полів, перенести облік бонусів у систему й виділити тиждень на навчання з наставниками.","Олена: «Семи полів мені вистачить, і бонус нарешті враховує систему». Фінансовий директор бурчить через витрати на наставників, але підписує.","Форма, бонуси й навчання — головні перешкоди (крок 5): прибрані, вони перестають змушувати людей обирати між системою й власною вигодою."),
O("m",1,"Навчання за день","Провести загальне навчання для всіх за один день, а форму й облік бонусів залишити, як було, до самого кінця пілотного періоду.","Після восьми годин слайдів учасники пам’ятають лише два пункти меню. Богдан: «Чудово, а як це впишеться в мій бонус?» Відповіді нема.","Навчання знімає частину перешкод, але форма й бонуси лишаються (крок 5 виконано наполовину): працювати в системі й далі невигідно."),
O("p",0,"Контроль наказом","Нічого не змінювати й пообіцяти перевіряти, чи вносять продавці дані, а тих, хто не вносить, нагадувати персонально й вимагати пояснень.","Через тиждень Богдан надсилає в чат фото таблиці: «Дані поки там, зручніше». Продавці вносять угоди двічі й дедалі частіше питають, навіщо цей контроль.","Вимога без усунення причин (крок 5 пропущено) нагадує тиск: система лишається додатковою роботою, а не зручністю.")]},
{days:"63–78",title:"Пілот",ctx:"Є пілот: група Олени з дванадцяти продавців. Перші тижні дали змішані результати, у системі вже є реальні дані.",o:[
O("g",2,"Мета й показ результатів","Поставити пілоту мету на шість тижнів і показати іншим відділам реальні результати: швидші відповіді клієнтам, менше загублених заявок.","Через три тижні час відповіді клієнтам скоротився на третину. Олена розповідає про це на нараді сама, а троє продавців з інших груп просяться в пілот.","Чітка мета й відкритий показ результатів дають видиму коротку перемогу (крок 6), яка переконує скептиків краще за слова."),
O("m",1,"Пілот без мети","Продовжити пілот без чіткої мети й вважати успіхом сам факт, що група дванадцяти почала вносити угоди в систему.","Звіт для директорки складається з кількості записів. Ірина питає: «А що це змінило для клієнтів?» Чіткої відповіді немає, і ентузіазм групи трохи згасає.","Активність не дорівнює результату (крок 6 виконано наполовину): без вимірюваної мети показати нікому, що пілот дав користь."),
O("p",0,"Запуск для всіх","Пропустити довгий пілот і за два тижні підключити всі відділи одразу, щоб скоротити терміни та витрати на підтримку системи.","Підключення сталося в понеділок. До обіду склад не міг оформити відвантаження, а три продавці звернулися в ІТ з одним і тим самим питанням.","Без пілота немає перевіреної перемоги (крок 6 пропущено): швидкість економить терміни, але множить помилки на всіх одночасно.")]},
{days:"79–90",title:"Не святкувати зарано",ctx:"Пілот довів користь: час відповіді скоротився, а скептики мовчать. Ірина хоче оголосити проєкт завершеним на святковому обіді.",o:[
O("g",2,"Рухатися далі","Подякувати групі, не оголошуючи завершення, і використати довіру, щоб підключити склад і змінити суміжні процеси разом із системою.","Склад отримує свої пріоритети в системі, а Тарас пропонує змінити процес повернень. Ірина погоджується: «Свято буде, коли це стане звичним».","Не зупинятися після успіху (крок 7): довіра від перемог використана для подальших змін, а не витрачена на святкування."),
O("m",1,"Вимога до всіх","Оголосити успіх пілоту й вимагати від решти відділів перейти в систему до кінця місяця без змін процесів і навчання.","Відділи переходять у систему за зразком пілота, але процеси в них інші. Скарги: «В Олени працює, а в нас форми не підходять».","Успіх використано для тиску, але суміжні процеси не змінено (крок 7 виконано наполовину): пілотна група перемогла, решта не вписується."),
O("p",0,"Завершити проєкт","Оголосити проєкт завершеним, закрити робочу групу й повернути її учасників до звичних обов’язків без передачі досвіду іншим відділам.","На святі багато тостів. Через два тижні Олена повертається до своїх клієнтів, групи більше немає, а питання нових відділів ніхто не збирає.","Раннє оголошення перемоги (крок 7 пропущено) зупиняє рух: тих, хто ще не вписався в систему, ніхто не веде.")]},
{days:"91–100",title:"Нова норма",ctx:"Система працює, але відкат ще можливий. Наближається кінець року: переглядають посадові інструкції, бонуси й програму адаптації нових співробітників.",o:[
O("g",2,"Вписати в правила","Вписати роботу в системі в посадові інструкції та бонуси й показувати новачкам, як вона пов’язана з успіхом компанії.","Новачок отримує в перший день профіль у системі та історію клієнтів. Богдан: «Дивно, але я вже не уявляю, як було без цього».","Звичка закріплюється, коли нові дії стають частиною оцінювання, інструкцій і адаптації (крок 8), а не окремим проєктом."),
O("m",1,"Закрити таблиці","Закрити старі таблиці й нагадати в розсилці, що система — єдиний спосіб працювати з клієнтами, вимагаючи дисципліни від усіх відділів.","Таблиці зникли, але деякі продавці ведуть нотатки в месенджерах, а наприкінці кварталу з’являється «тимчасова» таблиця. Вимога є, причин триматися мало.","Заборона закриває старий шлях, але без змін в оцінюванні та адаптації (крок 8 виконано наполовину) нова поведінка тримається лише на контролі."),
O("p",0,"Подяка й далі","Обмежитися подякою за зусилля й перейти до наступних проєктів, вважаючи, що нова звичка закріпиться сама, без змін у правилах.","Кілька місяців усе тримається. Потім навесні нові продавці ведуть клієнтів у таблицях «як зручніше», а дані в системі застарівають.","Без закріплення (крок 8 пропущено) старі способи повертаються, щойно закінчується увага керівництва.")]}
];
function ST(days,title,ctx,a,b,c){return{days:days,title:title,ctx:ctx,o:[O("g",2,a[0],a[1],a[2],a[3]),O("m",1,b[0],b[1],b[2],b[3]),O("p",0,c[0],c[1],c[2],c[3])]}}
var D=["1–10","11–20","21–32","33–45","46–62","63–78","79–90","91–100"];
var T8=["Чому саме зараз","Хто поведе зміни","Куди ми йдемо","Розповісти людям","Що заважає працювати","Пілот","Не святкувати зарано","Нова норма"];
var STAGES_AGILE=[
ST(D[0],T8[0],"Відділ розробки «Софтлайн» випускає великі релізи двічі на рік. Замовники довго чекають, а після кожного релізу приходить хвиля помилок. Технічний директор Максим просить вас перевести відділ на гнучкі команди зі спринтами.",
["Цифри очікування","Зібрати дані про тривалість очікування, кількість помилок після релізів і відмови замовників та показати їх на нараді тімлідів.","Тімліди вперше бачать цифри разом: сорок днів очікування й три замовники, що пішли. Юрій мовчить, а потім питає, чи є розбивка за проєктами.","Цифри про очікування й помилки показують ціну старого процесу (крок 1): тімліди бачать, що проблема стосується їх самих."],
["Лекція про Agile","Провести лекцію про переваги гнучких методів і сказати, що найкращі компанії світу давно так працюють, а нам треба наздоганяти.","Лекція сподобалась, але в чаті питають: «А що не так у нас?» Юрій сумнівається: «Це мода, у нас усе працює».","Люди почули, що це модно, але не побачили проблеми в себе (крок 1 виконано наполовину): без особистої причини поспішати ніхто не буде."],
["Наказ про спринти","Видати наказ про перехід на двотижневі спринти з наступного місяця, щоб не витрачати час на обговорення й суперечки з командами.","Наказ з’явився в чаті в понеділок. Юрій відповідає: «Тобто звичайні завдання тепер називаються спринтами?» Нікому нічого не пояснили.","Наказ запускає форму, але не змінює мислення (крок 1 пропущено): команди проводять формальні «спринти» й роблять усе по-старому."]),
ST(D[1],T8[1],"Максим підтримує перехід, але команди сприймають його як ініціативу «зверху». Ви не знаєте, кого з розробників слухають колеги, а проєкт поки тримається на вас.",
["Група лідерів","Зібрати групу з Соломії (її слухають тімліди), скептика Юрія, продакт-менеджера Назара й тестувальниці, щоб разом вести перехід.","Соломія: «Якщо Юрій у групі, то він перевірить кожну ідею». Юрій перший пропонує пілотну команду й сам обирає критерії успіху.","Група з поважаних людей різних ролей, включно зі скептиком (крок 2), ділить відповідальність: перехід перестає бути ініціативою одного керівника."],
["Двоє скрам-майстрів","Найняти двох досвідчених скрам-майстрів ззовні, які навчатимуть команди нових правил і щотижня звітуватимуть технічному директору.","Скрам-майстри працюють сумлінно, але розробники називають їх «людьми Максима» й чекають, коли ті підуть.","Фахівці є, але немає внутрішніх лідерів (крок 2 виконано наполовину): знання приходять ззовні, а авторитету в командах у них мало."],
["Вести самому","Вести перехід самостійно через спільний чат, щоб швидко ухвалювати рішення, а команди залучати лише на етапі налаштування процесів.","За два тижні ви не встигаєте відповідати на запитання тімлідів. Юрій пише: «Тобто всі правила пишете ви один?» і чекає збою.","Один керівник без коаліції (крок 2 пропущено) не має ні сил, ні впливу: перший збій залишить проєкт без підтримки."]),
ST(D[2],T8[2],"Група працює. Проте розробники уявляють гнучкість по-різному: одні чекають менше нарад, інші — більше свободи, а Юрій боїться хаосу.",
["Картина тижня","Разом із групою описати на одній сторінці, як виглядатиме робочий тиждень команди через рік і що це дасть замовникові й розробникові.","Група довго сперечається, але фраза «Замовник бачить нову версію щодві тижні» влучає в усіх. Юрій дописує про якість коду.","Коротка картина майбутнього, зрозуміла розробнику й замовнику (крок 3), дає спільний орієнтир і знімає страх хаосу."],
["Готовий посібник","Узяти опис ролей і процесів з підручника з Agile та використати його як бачення, не пристосовуючи до специфіки відділу.","Документ правильний, але в ньому багато термінів і мало про проєкти відділу. Назар: «Це опис чужої компанії, а не наш».","Є зразок, але немає бачення саме для вашого відділу (крок 3 виконано наполовину): воно не відповідає, що зміниться в щоденній роботі."],
["Без бачення","Не писати бачення: налаштувати інструменти й дошки завдань, а пояснити, навіщо це, пізніше, коли команди звикнуть до нового ритму.","Інструменти налаштовано швидко. У чаті питають: «Це щоб рахувати наші години?» Відповіді ніхто не дає, і чутки множаться.","Без бачення (крок 3 пропущено) люди самі домислюють мету змін: найчастіше як посилення контролю над часом."]),
ST(D[3],T8[3],"Картина майбутнього готова, і її підтримує група. Але про неї знає лише група, а до першого спринту залишається місяць.",
["Розмови з командами","Пройти бачення з кожною командою, відповісти на запитання й повторювати його на щотижневих зустрічах простими прикладами.","Розробники питають про тестування й вихідні. Соломія показує, як це працює на їхньому поточному проєкті, і напруга спадає.","Бачення працює, коли його повторюють у різних форматах і слухають запитання (крок 4): люди бачать, що зміни стосуються їхніх завдань."],
["Лист на пошту","Розіслати всім довгий документ з описом процесів і ролей та попросити прочитати його до початку першого спринту.","Документ відкрило менше половини, більшість не дійшла до другої сторінки. Тімліди чекають пояснень, а їх немає.","Інформація поширена, але не пояснена (крок 4 виконано наполовину): люди мають факти, а відповіді на запитання «що це змінить для мене» немає."],
["Плакати зі словами","Розмістити в офісі плакати з гаслами «Швидше. Гнучкіше. Краще» й чекати, що команди самі зрозуміють, що це означає.","Хтось дописав під плакатом: «Швидше — значить, без вихідних?» Розмови про гнучкість у кулуарах швидко стають розмовами про звільнення.","Гасло без пояснень не доносить бачення (крок 4 пропущено): порожнечу заповнюють чутки, і довіра до проєкту знижується."]),
ST(D[4],T8[4],"Перший спринт наближається. Але на кожну зміну потрібно сім погоджень, премії залежать від кількості завершених проєктів, а навчання ніхто не планував.",
["Прибрати перешкоди","Скоротити погодження до двох, змінити премії так, щоб вони залежали від результату команди, і провести тиждень навчання з наставниками.","Юрій: «Двох погоджень мені вистачить, а премії нарешті не залежать від того, хто що встиг». Фінансовий директор бурчить, але підписує.","Погодження, премії та навчання — головні перешкоди (крок 5): прибрані, вони перестають змушувати вибирати між новим процесом і власною вигодою."],
["Лише курс","Організувати для всіх відділів дводенний курс про гнучкі методи, а погодження й систему премій залишити без змін до кінця року.","Після курсу всі пам’ятають слово «ретроспектива», але релізи й далі йдуть через сім погоджень. Юрій: «Курс гарний, а працювати як?»","Навчання знімає частину перешкод, але погодження й премії лишаються (крок 5 виконано наполовину): працювати по-новому й далі невигідно."],
["Вимагати результат","Нічого не змінювати й чекати, що команди самі впораються з перешкодами та покажуть нові результати вже за перші два спринти.","Через два тижні Юрій надсилає в чат форму погодження: «Ось що заважає». Команди ведуть одночасно два процеси й виснажуються.","Вимога без усунення причин (крок 5 пропущено) нагадує тиск: нові правила лишаються додатковою роботою, а не полегшенням."]),
ST(D[5],T8[5],"Пілотна команда Соломії з восьми людей уже кілька тижнів працює за новим процесом. Результати змішані, але дані вже є.",
["Мета й показ","Поставити пілоту мету на два місяці й показати іншим командам реальні результати: швидші випуски й менше помилок після релізу.","Команда випускає зміни щодва тижні, помилок удвічі менше. Соломія розповідає про це на нараді, і дві команди просяться в пілот.","Чітка мета й відкритий показ результатів дають видиму коротку перемогу (крок 6), яка переконує скептиків краще за слова."],
["Пілот без мети","Продовжити пілот без чіткої мети й вважати успіхом сам факт, що команда регулярно проводить спринти й веде дошку завдань.","Звіт для Максима складається з кількості спринтів. Він питає: «А що змінилося для замовників?» Чіткої відповіді немає.","Активність не дорівнює результату (крок 6 виконано наполовину): без вимірюваної мети показати нікому, що пілот дав користь."],
["Усе й одразу","Не чекати результатів пілоту й за два тижні перевести всі команди на нові правила, щоб скоротити терміни та витрати на підтримку.","У понеділок усі команди почали спринти. До п’ятниці дві команди не випустили жодної зміни, а Юрій надіслав Максиму ультиматум.","Без пілота немає перевіреної перемоги (крок 6 пропущено): швидкість економить терміни, але множить помилки на всі команди одночасно."]),
ST(D[6],T8[6],"Пілот довів користь: команда Соломії випускає зміни втричі частіше. Максим хоче оголосити перехід завершеним на святкуванні.",
["Рухатися далі","Подякувати групі, не оголошуючи завершення, і використати довіру, щоб підключити тестувальників і змінити процеси підтримки замовників.","Тестувальники й підтримка отримують свої місця в новому процесі. Назар пропонує змінити договори із замовниками. Максим: «Свято потім».","Не зупинятися після успіху (крок 7): довіра від перемог використана для подальших змін, а не витрачена на святкування."],
["Вимога до всіх","Оголосити успіх пілоту й вимагати від решти команд працювати за його зразком, не змінюючи процесів тестування й підтримки.","Інші команди копіюють правила, але тестування працює за старим графіком. Скарги: «В Соломії виходить, а в нас тести не встигають».","Успіх використано для тиску, але суміжні процеси не змінено (крок 7 виконано наполовину): пілотна команда перемогла, решта не вписується."],
["Завершити проєкт","Оголосити перехід завершеним, закрити робочу групу й повернути її учасників до звичних обов’язків без передачі досвіду іншим.","На святкуванні багато тостів. Через два тижні Соломія повертається до свого проєкту, а нові питання команд лишаються без відповіді.","Раннє оголошення перемоги (крок 7 пропущено) зупиняє рух: тих, хто ще не вписався в нові правила, ніхто не веде."]),
ST(D[7],T8[7],"Нові правила працюють, але відкат можливий. Наближається перегляд посадових інструкцій, премій і програми адаптації нових розробників.",
["Вписати в правила","Вписати нові ролі й процеси в посадові інструкції та премії й показувати новачкам, як вони пов’язані з якістю продукту.","Новачок у перший день отримує місце в команді та дошку завдань. Юрій: «Дивно, але я вже не уявляю роботи без ретроспектив».","Звичка закріплюється, коли нові дії стають частиною оцінювання, інструкцій і адаптації (крок 8), а не окремим проєктом."],
["Заборонити старе","Заборонити старі форми звітності й нагадати в розсилці, що спринти — єдиний спосіб планування, вимагаючи дисципліни від усіх.","Старі звіти зникли, але наприкінці кварталу команди ведуть окремі таблиці «для себе». Вимога є, а причин тримати новий порядок мало.","Заборона закриває старий шлях, але без змін в оцінюванні та адаптації (крок 8 виконано наполовину) нова поведінка тримається лише на контролі."],
["Подяка й далі","Обмежитися подякою за зусилля й перейти до наступних проєктів, вважаючи, що нові правила закріпляться без змін у документах.","Кілька місяців усе тримається. Потім нові розробники пишуть код «як звикли», а спринти лишаються лише в календарі.","Без закріплення (крок 8 пропущено) старі способи повертаються, щойно закінчується увага керівництва."])
];
var STAGES_CALLS=[
ST(D[0],T8[0],"Директорка Віра помітила: кожен третій оператор іде за рік, а клієнти скаржаться на формальні відповіді. Оператори працюють за кількістю дзвінків і ризикують штрафом за розмову довше п’яти хвилин. Ви очолюєте зміни.",
["Цифри й записи","Показати керівникам змін, скільки коштують плинність і повторні дзвінки клієнтів, і дати послухати записи розмов без відповіді.","Керівники слухають запис, де клієнт утретє дзвонить з тим самим питанням. Ростислав: «Мені б такий дзвінок не зарахували, а скільки їх таких?»","Цифри плинності й повторних дзвінків та записи розмов (крок 1) показують ціну старої системи: керівники бачать, що проблема коштує грошей."],
["Лист про цінності","Розіслати лист про те, що компанія має дбати про клієнтів, і пообіцяти, що наступного року система оцінювання буде оновлена.","Лист прочитали. Старші змін зітхають: «Знову гарні слова». Операторів турбує лише, чи не з’являться нові штрафи.","Люди почули про цінності, але не побачили проблеми в цифрах (крок 1 виконано наполовину): терміновості немає, тож поспішати ніхто не буде."],
["Правила наказом","Одразу ввести нову систему оцінювання наказом, щоб не втрачати час на обговорення й не давати нагоди скаржитися чи сперечатися.","Наказ надійшов у п’ятницю ввечері. Ростислав: «Мене спитали? Ні». Оператори думають, що це новий спосіб скоротити премії.","Наказ запускає зміни, але без пояснення, навіщо вони (крок 1 пропущено): люди виконують формально, а опір лишається невидимим."]),
ST(D[1],T8[1],"Віра підтримує зміни, керівники визнали проблему. Проте оператори не знають, кому довіряти, а проєкт поки тримається лише на вас.",
["Група з операторів","Зібрати групу з Катерини (оператори її поважають), скептика Ростислава, HR Любові й аналітика Артема та разом вести зміни.","Катерина: «Якщо Ростислав у групі, то нас не обманюють». Ростислав спершу криво всміхається, а потім приносить ідею оцінювати розмови за результатом.","Група з поважаних людей різних ролей, включно зі скептиком (крок 2), ділить відповідальність і тягне за собою інших: проєкт не тримається на одній людині."],
["Помічники з HR","Призначити двох фахівців з HR, які розроблятимуть нову систему оцінювання й щотижня звітуватимуть директорці про хід роботи.","HR охоче готує схему. Оператори називають її «папером від кадрів» і не несуть жодного зауваження.","Група є, але в ній немає людей, яким довіряють оператори (крок 2 виконано наполовину): технічно проєкт рухається, а вплив на колег малий."],
["Вести самому","Розробити нову систему оцінювання самостійно й показати її колективу, коли вона буде готова й затверджена директоркою.","Через два тижні ви не встигаєте відповідати на запитання змін. Оператори: «А хто це все придумав?» і чекають першої помилки.","Один керівник без коаліції (крок 2 пропущено) не має ні сил, ні впливу: перша помилка залишить проєкт без підтримки."]),
ST(D[2],T8[2],"Група працює. Оператори уявляють нову систему по-різному: одні бояться, що слухатимуть кожну розмову, інші вважають, що штрафи просто перейменують.",
["Розмова як результат","Разом із групою описати на сторінці, як виглядатиме розмова з клієнтом і зарплата оператора, коли оцінюють вирішення проблеми.","Група сперечається над кожним реченням, але фраза «Клієнт не дзвонить удруге» зрозуміла всім. Ростислав дописує про свободу в розмові.","Коротке бачення, зрозуміле й операторам, і клієнтам (крок 3), дає спільний орієнтир і знімає страхи, які люди домислювали самі."],
["Шаблон з інтернету","Взяти готову модель оцінювання якості обслуговування з презентації консультанта й використати її як бачення без змін і доповнень.","Модель гарна на слайдах, але в ній немає наших дзвінків і наших клієнтів. Артем: «Це опис чужого центру, а не нашого».","Є готовий зразок, але немає бачення для вашого колл-центру (крок 3 виконано наполовину): воно не відповідає на питання «що це дає мені»."],
["Без бачення","Не писати бачення: спершу побудувати систему звітів і шкали оцінювання, а пояснити людям мету, коли все буде готове й налаштоване.","Шкали готові, і в чаті з’являється питання: «Це щоб звільнити тих, хто повільніший?» Відповіді нема, чутки множаться.","Без бачення (крок 3 пропущено) люди самі домислюють, що означають зміни: найчастіше — скорочення й додатковий контроль."]),
ST(D[3],T8[3],"Бачення готове, його підтримує група. Але про нього знають лише ті, хто його писав, а нова система стартує за кілька тижнів.",
["Розмови зі змінами","Пройти бачення з кожною зміною, відповісти на запитання операторів і повторювати його на планерках простими прикладами.","Оператори питають про бонуси й записи розмов. Катерина показує приклад: оцінка за вирішене питання, а не за секунди. Напруга спадає.","Бачення працює, коли його повторюють різними каналами й слухають запитання (крок 4): люди бачать, що зміни стосуються їх і що їм відповідають."],
["Розсилка схеми","Розіслати всім схему нової системи оцінювання із шкалами й формулами, не пояснюючи, що це змінить у щоденній роботі оператора.","Схему відкрили, але без розмови її не зрозуміли. Оператори питають: «Скільки я тепер отримаю?» Відповіді на головне питання немає.","Інформація поширена, але не пояснена (крок 4 виконано наполовину): люди отримали схему, а відповіді на питання «що це змінить для мене» — ні."],
["Плакати в кімнаті","Повісити в кімнаті відпочинку плакати «Клієнт — наша мета» й чекати, що оператори самі побачать, що це означає на практиці.","Під плакатом хтось дописав: «Мета — наш штраф». Розмови про нову систему в курилці швидко стають розмовами про звільнення.","Гасло без пояснень не доносить бачення (крок 4 пропущено): порожнечу заповнюють чутки, і довіра до проєкту знижується."]),
ST(D[4],T8[4],"Запуск наближається. Але премії досі залежать від кількості дзвінків, у системі немає поля для результату розмови, а тренінгів із якості ніхто не проводив.",
["Прибрати перешкоди","Прибрати штрафи за тривалість, додати в систему поле результату розмови, перенести премії на якість і провести тиждень тренінгів.","Ростислав: «Нарешті не рахують секунди, і я можу пояснити клієнту все до кінця». Фінансист бурчить через премії, але затверджує.","Штрафи, система обліку й тренінги — головні перешкоди (крок 5): прибрані, вони перестають змушувати вибирати між якістю й премією."],
["Лише тренінги","Провести для всіх операторів дводенні тренінги зі спілкування, а штрафи й облік дзвінків залишити без змін до кінця кварталу.","Після тренінгу оператори чемніші, але штрафи й далі «горять». Ростислав: «Тренінг класний. А що, якщо розмова триватиме шість хвилин?»","Тренінги знімають частину перешкод, але штрафи й премії лишаються (крок 5 виконано наполовину): працювати по-новому й далі невигідно."],
["Контроль наказом","Нічого не змінювати й обіцяти перевіряти, чи оператори дослухають клієнта, а тих, хто поспішає, нагадувати персонально й просити пояснень.","Через тиждень Ростислав пише в чат: «Хочете якість? Дайте час». Оператори поспішають закінчити розмову, щоб уникнути штрафу, і сперечаються з керівниками.","Вимога без усунення причин (крок 5 пропущено) нагадує тиск: нові правила лишаються додатковою вимогою, а не полегшенням."]),
ST(D[5],T8[5],"Є пілот: зміна Катерини з дванадцяти операторів працює за новою системою. Результати змішані, але вже є реальні дані.",
["Мета й показ","Поставити пілоту мету на шість тижнів і показати іншим змінам реальні результати: менше повторних дзвінків і вищі оцінки клієнтів.","Через три тижні повторних дзвінків на третину менше. Катерина розповідає про це сама, і дві інші зміни просяться до пілоту.","Чітка мета й відкритий показ результатів дають видиму коротку перемогу (крок 6), яка переконує скептиків краще за слова."],
["Пілот без мети","Продовжити пілот без чіткої мети й вважати успіхом сам факт, що зміна Катерини вже працює за новими правилами оцінювання.","Звіт для Віри складається з кількості проведених оцінювань. Вона питає: «А що змінилося для клієнтів?» Чіткої відповіді немає.","Активність не дорівнює результату (крок 6 виконано наполовину): без вимірюваної мети показати нікому, що пілот дав користь."],
["Запуск для всіх","Пропустити пілот і за два тижні перевести всі зміни на нову систему, щоб скоротити терміни та витрати на підтримку роботи.","У понеділок усі зміни почали по-новому. До обіду система не прийняла результат розмови, а троє операторів звернулися до керівників з тим самим питанням.","Без пілота немає перевіреної перемоги (крок 6 пропущено): швидкість економить терміни, але множить помилки на всіх одночасно."]),
ST(D[6],T8[6],"Пілот довів користь: повторних дзвінків значно менше. Віра хоче оголосити проєкт завершеним на корпоративі.",
["Рухатися далі","Подякувати групі, не оголошуючи завершення, і використати довіру, щоб змінити критерії для старших змін і вступне навчання операторів.","Старші змін отримують нові критерії, Любов пропонує переписати вступне навчання. Віра: «Свято буде, коли це стане звичним».","Не зупинятися після успіху (крок 7): довіра від перемог використана для подальших змін, а не витрачена на святкування."],
["Вимога до всіх","Оголосити успіх пілоту й вимагати від решти змін працювати за його зразком, не змінюючи навчання й критеріїв для старших змін.","Зміни копіюють правила, але критерії для старших лишилися старими. Скарги: «У Катерини працює, а в нас — незрозуміло».","Успіх використано для тиску, але суміжні процеси не змінено (крок 7 виконано наполовину): пілотна зміна перемогла, решта не вписується."],
["Завершити проєкт","Оголосити проєкт завершеним, закрити робочу групу й повернути її учасників до звичних обов’язків без передачі досвіду іншим змінам.","На корпоративі багато тостів. Через два тижні Катерина повертається до своїх операторів, групи немає, а питання нових змін ніхто не збирає.","Раннє оголошення перемоги (крок 7 пропущено) зупиняє рух: тих, хто ще не вписався в нову систему, ніхто не веде."]),
ST(D[7],T8[7],"Нова система працює, але відкат ще можливий. Наближається перегляд посадових інструкцій, премій і програми вступного навчання нових операторів.",
["Вписати в правила","Вписати оцінку за вирішення питання в посадові інструкції та премії й показувати новачкам, як вона пов’язана з лояльністю клієнтів.","Новачок у перший день слухає записи розмов із результатом «вирішено». Ростислав: «Дивно, але я вже не вмію рахувати секунди».","Звичка закріплюється, коли нові дії стають частиною оцінювання, інструкцій і адаптації (крок 8), а не окремим проєктом."],
["Заборонити старе","Скасувати старі показники й нагадати в розсилці, що нова система — єдиний спосіб оцінювання, вимагаючи дисципліни від усіх змін.","Старі показники зникли, але деякі керівники ведуть «особисті» таблиці дзвінків, а наприкінці року «тимчасово» повертають штрафи.","Заборона закриває старий шлях, але без змін в оцінюванні та адаптації (крок 8 виконано наполовину) нова поведінка тримається лише на контролі."],
["Подяка й далі","Обмежитися подякою за зусилля й перейти до наступних проєктів, вважаючи, що нова система закріпиться без змін у документах.","Кілька місяців усе тримається. Навесні нові керівники повертають штрафи за тривалість, а оператори мовчки вертаються до старих звичок.","Без закріплення (крок 8 пропущено) старі способи повертаються, щойно закінчується увага керівництва."])
];
var STAGES_BANK=[
ST(D[0],T8[0],"У відділеннях «Прикарпатського банку» щодня черги: клієнти приходять оплатити комуналку й переказати гроші, а операціоністи не встигають консультувати. Директорка роздрібу Леся хоче перевести прості операції в мобільний застосунок.",
["Цифри черг","Порахувати, скільки часу відділення витрачають на прості операції й скільки клієнтів пішли до конкурентів, і показати це керівникам відділень.","Керівники бачать: сорок відсотків часу йде на комунальні платежі. Олексій: «А на консультації коли?» Питає про відтік клієнтів.","Цифри про час і відтік показують ціну старої моделі (крок 1): керівники бачать, що проблема стосується їхніх відділень, а не лише ІТ."],
["Збори про тренди","Скликати збори керівників, розповісти про цифрові тренди в банках світу й оголосити, що наступного року застосунок стане пріоритетом.","Збори були вдалими, з оплесками. Олексій у коридорі: «Тренди — це добре. А відділення куди?» Нікому нічого не ясно.","Люди почули про тренд, але не побачили проблеми у своїх відділеннях (крок 1 виконано наполовину): терміновості немає, тож поспішати ніхто не буде."],
["Наказ про застосунок","Видати наказ, що з початку кварталу всі прості операції відділень переводять у застосунок, щоб не втрачати час на обговорення з керівниками.","Наказ надійшов у п’ятницю. Олексій: «У нас багато літніх клієнтів, куди їх тепер?» Керівники підписують ознайомлення й нічого не змінюють.","Наказ запускає рух, але без пояснення, навіщо зміни (крок 1 пропущено): люди виконують формально, а опір лишається невидимим."]),
ST(D[1],T8[1],"Леся отримала підтримку правління, і керівники визнали проблему. Проте проєкт тримається на ІТ-відділі, а відділення не знають, кому з колег довіряти.",
["Група впливових","Зібрати групу з Наталі (найкращої операціоністки), скептика Олексія, ІТ-фахівця Ореста й Дарини з маркетингу та разом вести перехід.","Наталя: «Якщо Олексій у групі, то нас не залишать самих із застосунком». Олексій першим пропонує обрати відділення для пілоту.","Група з поважаних людей різних ролей, включно зі скептиком (крок 2), ділить відповідальність і тягне за собою інших: проєкт не залежить від ІТ-відділу."],
["Команда ІТ","Доручити перехід ІТ-відділу, який розробить застосунок і щотижня звітуватиме Лесі про готовність нових функцій і хід тестування.","ІТ сумлінно готує застосунок, але відділення називають його «іграшкою айтишників». Оператори не надсилають жодного відгуку.","Команда є, але в ній немає людей, яким довіряють відділення (крок 2 виконано наполовину): технічно проєкт рухається, а вплив на колег малий."],
["Вести самостійно","Вести проєкт самостійно й радитися з керівниками відділень лише тоді, коли виникне конкретна потреба або потрібне буде рішення.","За два тижні ви не встигаєте відповідати на запитання відділень. Олексій: «Це хтось один так вирішив?» і чекає на перший збій.","Один керівник без коаліції (крок 2 пропущено) не має ні сил, ні впливу: перший збій залишить проєкт без підтримки."]),
ST(D[2],T8[2],"Група працює. Керівники уявляють застосунок по-різному: одні бачать заміну відділень, інші — просто додаткову функцію, а клієнти нічого не чули.",
["Картина відділення","Разом із групою описати, чим займатиметься відділення, коли прості операції перейдуть у застосунок, і що отримає клієнт.","Група сперечається, але фраза «У відділенні — поради, а не черги» зрозуміла всім. Олексій дописує про клієнтів похилого віку.","Коротке бачення, яке пояснює, що зміниться для клієнта й працівника (крок 3), дає спільний орієнтир і знімає страхи, які люди домислювали самі."],
["Опис від ІТ","Взяти опис майбутнього застосунку з технічного завдання ІТ-відділу й використати його як бачення для всього банку без змін.","Опис правильний, але в ньому про функції, а не про людей. Наталя: «Тут нічого про те, чим займатимусь я».","Є опис, але немає бачення для відділень (крок 3 виконано наполовину): воно не відповідає на питання «що це дає мені»."],
["Без бачення","Не писати бачення: спершу запустити застосунок, а пояснити, що буде з відділеннями, коли клієнти звикнуть користуватися ним самостійно.","Застосунок запущено, і в чаті питають: «Тобто відділення закриють?» Відповіді ніхто не дає, чутки множаться.","Без бачення (крок 3 пропущено) люди самі домислюють, що означає застосунок: найчастіше — закриття відділень і скорочення."]),
ST(D[3],T8[3],"Бачення готове, його підтримує група. Але про нього знають лише ті, хто його писав, а запуск застосунку за кілька тижнів.",
["Розмови з відділеннями","Пройти бачення з кожним відділенням, вислухати побоювання операціоністів і повторювати його на зустрічах простими прикладами.","Операціоністи питають про роботу й літніх клієнтів. Наталя показує, як це працює в її відділенні, і напруга спадає.","Бачення працює, коли його повторюють різними каналами й слухають запитання (крок 4): люди бачать, що зміни стосуються їх і що їм відповідають."],
["Лист зі слайдами","Розіслати відділенням презентацію з функціями застосунку й датою запуску, не пояснюючи, що це дає кожній посаді й відділенню.","Презентацію переглянули швидко. Олексій: «Тут про програму, а про людей — нічого». Питання «що буде зі мною» лишилось без відповіді.","Інформація поширена, але не пояснена (крок 4 виконано наполовину): люди отримали факти, а відповіді на запитання «що це змінить для мене» — ні."],
["Плакати у відділенні","Повісити у відділеннях плакати «Банк у вашому телефоні» й чекати, що працівники самі зрозуміють, що це означає для їхньої роботи.","Під плакатом хтось дописав: «Банк у телефоні — а ми де?» Розмови про застосунок швидко стають розмовами про скорочення.","Гасло без пояснень не доносить бачення (крок 4 пропущено): порожнечу заповнюють чутки, і довіра до проєкту знижується."]),
ST(D[4],T8[4],"Запуск наближається. Але премії операціоністів залежать від кількості операцій у відділенні, клієнту складно зареєструватися, а консультантів із застосунку немає.",
["Прибрати перешкоди","Змінити премії так, щоб вони враховували допомогу клієнтам із застосунком, спростити реєстрацію й провести тиждень навчання консультантів.","Наталя: «Нарешті мої консультації враховують». Фінансовий директор бурчить, але підписує. Олексій першим приводить клієнтів на реєстрацію.","Премії, реєстрація й навчання — головні перешкоди (крок 5): прибрані, вони перестають змушувати вибирати між застосунком і власною вигодою."],
["Лише навчання","Провести для всіх операціоністів дводенне навчання роботи із застосунком, а систему премій і складну реєстрацію залишити до кінця року.","Після навчання працівники вміють показати застосунок, але преміюють їх так само за кількість операцій. Олексій: «Навіщо мені відправляти клієнтів у телефон?»","Навчання знімає частину перешкод, але премії й реєстрація лишаються (крок 5 виконано наполовину): працювати по-новому й далі невигідно."],
["Контроль наказом","Нічого не змінювати й обіцяти перевіряти, чи пропонують операціоністи застосунок клієнтам, а тих, хто не пропонує, змушувати писати пояснення.","Через тиждень Олексій пише: «З паперами зручніше». Операціоністи пропонують застосунок формально й дедалі частіше питають, навіщо цей контроль.","Вимога без усунення причин (крок 5 пропущено) нагадує тиск: нові правила лишаються додатковою роботою, а не полегшенням."]),
ST(D[5],T8[5],"Є пілот: відділення Наталі з восьми працівників уже кілька тижнів пропонує клієнтам застосунок. Результати змішані, але вже є реальні дані.",
["Мета й показ","Поставити пілоту мету на шість тижнів і показати іншим відділенням реальні результати: коротші черги й більше часу на консультації.","Через три тижні черга скоротилася на третину. Наталя розповідає про це сама, і три відділення просяться в пілот.","Чітка мета й відкритий показ результатів дають видиму коротку перемогу (крок 6), яка переконує скептиків краще за слова."],
["Пілот без мети","Продовжити пілот без чіткої мети й вважати успіхом сам факт, що відділення Наталі щодня пропонує клієнтам застосунок.","Звіт для Лесі складається з кількості реєстрацій. Вона питає: «А що змінилося для клієнтів?» Чіткої відповіді немає.","Активність не дорівнює результату (крок 6 виконано наполовину): без вимірюваної мети показати нікому, що пілот дав користь."],
["Запуск для всіх","Пропустити пілот і за два тижні запустити застосунок в усіх відділеннях, щоб скоротити терміни та витрати на підтримку роботи.","У понеділок усі відділення почали по-новому. До обіду реєстрація зависла, а троє операціоністів звернулися в ІТ з одним і тим самим питанням.","Без пілота немає перевіреної перемоги (крок 6 пропущено): швидкість економить терміни, але множить помилки на всіх відділеннях одночасно."]),
ST(D[6],T8[6],"Пілот довів користь: черги в пілотному відділенні скоротилися. Леся хоче оголосити проєкт завершеним на святкуванні.",
["Рухатися далі","Подякувати групі, не оголошуючи завершення, і використати довіру, щоб змінити процеси в усіх відділеннях і додати нові послуги в застосунок.","Відділення отримують нові процеси, а Орест додає кредитний калькулятор. Леся: «Свято буде, коли це стане звичним».","Не зупинятися після успіху (крок 7): довіра від перемог використана для подальших змін, а не витрачена на святкування."],
["Вимога до всіх","Оголосити успіх пілоту й вимагати від решти відділень працювати за його зразком, не змінюючи процесів консультацій і преміювання.","Відділення копіюють правила, але консультації й премії лишилися старими. Скарги: «У Наталі виходить, а в нас клієнти приходять із паперами».","Успіх використано для тиску, але суміжні процеси не змінено (крок 7 виконано наполовину): пілотне відділення перемогло, решта не вписується."],
["Завершити проєкт","Оголосити проєкт завершеним, закрити робочу групу й повернути її учасників до звичних обов’язків без передачі досвіду іншим відділенням.","На святкуванні багато тостів. Через два тижні Наталя повертається до клієнтів, групи більше немає, а питання нових відділень ніхто не збирає.","Раннє оголошення перемоги (крок 7 пропущено) зупиняє рух: тих, хто ще не вписався в нову модель, ніхто не веде."]),
ST(D[7],T8[7],"Застосунок працює, але відкат ще можливий. Наближається перегляд посадових інструкцій, премій і програми адаптації нових операціоністів.",
["Вписати в правила","Вписати допомогу клієнтам із застосунком у посадові інструкції та премії й показувати новачкам, як вона пов’язана з лояльністю клієнтів.","Новачок у перший день вчиться показувати застосунок клієнту. Олексій: «Дивно, але черги мені вже не потрібні».","Звичка закріплюється, коли нові дії стають частиною оцінювання, інструкцій і адаптації (крок 8), а не окремим проєктом."],
["Заборонити старе","Скасувати прості операції на касі й нагадати в розсилці, що застосунок — єдиний спосіб оплати, вимагаючи дисципліни від усіх відділень.","Прості операції на касі зникли, але деякі відділення проводять їх «в порядку винятку». Вимога є, а причин триматися мало.","Заборона закриває старий шлях, але без змін в оцінюванні та адаптації (крок 8 виконано наполовину) нова поведінка тримається лише на контролі."],
["Подяка й далі","Обмежитися подякою за зусилля й перейти до наступних проєктів, вважаючи, що нова модель закріпиться без змін у документах.","Кілька місяців усе тримається. Навесні нові операціоністи знову приймають платежі на касі, а клієнти повертаються до черг.","Без закріплення (крок 8 пропущено) старі способи повертаються, щойно закінчується увага керівництва."])
];
var STAGES_ECO=[
ST(D[0],T8[0],"Кондитерська фабрика «Солодка долина» отримала попередження від двох великих мереж: за рік вони приймають лише перероблювану упаковку. Власник Георгій просить вас очолити перехід. Пластик поки дешевий і звичний.",
["Цифри контрактів","Порахувати, скільки продажів фабрика втратить, якщо мережі припинять закупівлі, і показати ці цифри керівникам цехів і закупівель.","Христина із закупівель називає цифру: чверть виручки. Ярема мовчить, а потім питає, чи справді мережі відмовляться від закупівель.","Цифри втрат контрактів показують ціну бездіяльності (крок 1): керівники бачать, що проблема стосується продажів фабрики, а не лише упаковки."],
["Збори про екологію","Скликати збори колективу, розповісти про важливість екології й сказати, що фабрика поступово переходитиме на нову упаковку.","Збори пройшли гарно, з оплесками. Ярема: «Екологія — це добре. А хто за це заплатить?» Терміни нікому не названо.","Люди почули про екологію, але не побачили небезпеки для продажів (крок 1 виконано наполовину): терміновості немає, тож поспішати ніхто не буде."],
["Наказ про упаковку","Видати наказ про заміну пластику на картон з початку наступного місяця, щоб не втрачати час на обговорення з цехами й постачальниками.","Наказ надійшов у п’ятницю. Ярема: «Лінія не розрахована на картон!» Начальники цехів підписують ознайомлення й чекають, поки про наказ забудуть.","Наказ запускає рух, але без пояснення, навіщо зміни (крок 1 пропущено): люди виконують формально, а опір лишається невидимим."]),
ST(D[1],T8[1],"Георгій підтримує перехід, і керівники визнали, що мережі — серйозна загроза. Але проєкт тримається лише на вас, а цехи не знають, кому з колег довіряти.",
["Група впливових","Зібрати групу з Мирослави (технолога, якій довіряють), скептика Яреми, Христини із закупівель і Павла з маркетингу, щоб разом вести перехід.","Мирослава: «Якщо Ярема в групі, то лінії ніхто не зламає». Ярема першим пропонує випробувати картон на одній лінії.","Група з поважаних людей різних ролей, включно зі скептиком (крок 2), ділить відповідальність і тягне за собою інших: проєкт не тримається на одній людині."],
["Екоменеджер","Призначити екологічного менеджера, який розроблятиме новий стандарт упаковки й щотижня звітуватиме власнику про хід переходу.","Менеджер сумлінно готує стандарт, але цехи називають його «людиною з ватманами». З питаннями до нього ніхто не звертається.","Фахівець є, але немає людей, яким довіряють цехи (крок 2 виконано наполовину): технічно проєкт рухається, а вплив на колег малий."],
["Вести самому","Вести перехід самостійно й радитися з начальниками цехів лише тоді, коли виникне конкретна потреба або потрібне буде рішення.","За два тижні ви не встигаєте відповідати на запитання цехів. Ярема: «Це він так вирішив?» і чекає на перший збій на лінії.","Один керівник без коаліції (крок 2 пропущено) не має ні сил, ні впливу: перший збій залишить проєкт без підтримки."]),
ST(D[2],T8[2],"Група працює. Але цехи уявляють перехід по-різному: одні чекають простої заміни матеріалу, інші — нової лінії, а Ярема боїться зупинки виробництва.",
["Картина фабрики","Разом із групою описати на одній сторінці, як виглядатиме фабрика через рік з новою упаковкою, і що це дасть клієнтам і цехам.","Група сперечається, але фраза «Мережі беруть нас без обмежень» зрозуміла всім. Ярема дописує, що лінії не зупиняються.","Коротке бачення, яке пояснює, що зміниться для цехів і клієнтів (крок 3), дає спільний орієнтир і знімає страхи, які люди домислювали самі."],
["Вимоги мереж","Взяти опис нової упаковки з вимог торгових мереж і використати його як бачення для фабрики без змін і доповнень.","Вимоги чіткі, але в них про матеріали, а не про фабрику. Мирослава: «Це список чужих вимог, а де наш план?»","Є зразок, але немає бачення для вашої фабрики (крок 3 виконано наполовину): воно не відповідає на питання «що це дає нам»."],
["Без бачення","Не писати бачення: спершу закупити матеріали й налаштувати лінії, а пояснити людям, навіщо це, коли виробництво вже перейде на нову упаковку.","Матеріали закуплено, а в чаті питають: «Це щоб скоротити людей на пакуванні?» Відповіді ніхто не дає, чутки множаться.","Без бачення (крок 3 пропущено) люди самі домислюють, що означає перехід: найчастіше — скорочення й зупинку ліній."]),
ST(D[3],T8[3],"Бачення готове, його підтримує група. Але про нього знають лише ті, хто його писав, а перші партії нової упаковки заплановано за кілька тижнів.",
["Розмови з цехами","Пройти бачення з кожним цехом, вислухати побоювання робітників і повторювати його на планерках простими прикладами.","Робітники питають про лінії й премії. Мирослава показує, як картонна упаковка працює на пробній лінії, і напруга спадає.","Бачення працює, коли його повторюють різними каналами й слухають запитання (крок 4): люди бачать, що зміни стосуються їх і що їм відповідають."],
["Лист зі стандартом","Розіслати цехам новий стандарт упаковки з технічними вимогами й датами переходу, не пояснюючи, що зміниться в роботі кожної зміни.","Стандарт відкрили, але без пояснень його не зрозуміли. Ярема: «Тут про вимоги, а що робити моїм змінам?» Відповіді немає.","Інформація поширена, але не пояснена (крок 4 виконано наполовину): люди отримали вимоги, а відповіді на питання «що це змінить для мене» — ні."],
["Плакати в цеху","Повісити в цехах плакати «Чиста упаковка — чисте майбутнє» й чекати, що працівники самі зрозуміють, що це означає для лінії.","Під плакатом хтось дописав: «Чисте майбутнє — без нашої премії?» Розмови про упаковку швидко стають розмовами про скорочення.","Гасло без пояснень не доносить бачення (крок 4 пропущено): порожнечу заповнюють чутки, і довіра до проєкту знижується."]),
ST(D[4],T8[4],"Запуск наближається. Але лінії налаштовані лише під пластик, премії цеху залежать від швидкості пакування, а навчання змін ніхто не проводив.",
["Прибрати перешкоди","Налаштувати лінію під нову упаковку, змінити премії так, щоб вони враховували якість упаковки, і провести навчання кожної зміни.","Ярема: «Лінія працює, а премія не падає, коли я зупиняю її для перевірки». Фінансист бурчить через витрати, але підписує.","Лінії, премії й навчання — головні перешкоди (крок 5): прибрані, вони перестають змушувати вибирати між новою упаковкою й власною вигодою."],
["Лише навчання","Провести для всіх змін дводенне навчання роботі з новою упаковкою, а налаштування ліній і премії залишити без змін до кінця року.","Після навчання працівники знають, як працювати з картоном, але лінії досі налаштовані на пластик. Ярема: «Теорія є, а лінія де?»","Навчання знімає частину перешкод, але лінії й премії лишаються (крок 5 виконано наполовину): працювати по-новому й далі невигідно."],
["Контроль наказом","Нічого не змінювати й обіцяти перевіряти, чи працівники використовують нову упаковку, а тих, хто повертається до пластику, змушувати писати пояснення.","Через тиждень Ярема пише: «На пластику швидше». Робітники пакують нову упаковку формально й дедалі частіше питають, навіщо цей контроль.","Вимога без усунення причин (крок 5 пропущено) нагадує тиск: нові правила лишаються додатковою роботою, а не полегшенням."]),
ST(D[5],T8[5],"Є пілот: одна лінія з десяти працівників уже кілька тижнів пакує печиво в нову упаковку. Результати змішані, але вже є реальні дані.",
["Мета й показ","Поставити пілоту мету на шість тижнів і показати іншим цехам реальні результати: скільки бракованих пачок і скільки замовлень від мереж.","Через три тижні браку на третину менше, а одна мережа підтвердила замовлення. Мирослава розповідає про це сама, і два цехи просяться в пілот.","Чітка мета й відкритий показ результатів дають видиму коротку перемогу (крок 6), яка переконує скептиків краще за слова."],
["Пілот без мети","Продовжити пілот без чіткої мети й вважати успіхом сам факт, що лінія Мирослави щодня працює з новою упаковкою без зупинок.","Звіт для Георгія складається з кількості випущених пачок. Він питає: «А що змінилося для мереж?» Чіткої відповіді немає.","Активність не дорівнює результату (крок 6 виконано наполовину): без вимірюваної мети показати нікому, що пілот дав користь."],
["Запуск для всіх","Пропустити пілот і за два тижні перевести всі лінії на нову упаковку, щоб скоротити терміни та витрати на підтримку роботи.","У понеділок усі лінії перейшли на нову упаковку. До обіду дві лінії зупинилися, а троє працівників звернулися до майстра з одним і тим самим питанням.","Без пілота немає перевіреної перемоги (крок 6 пропущено): швидкість економить терміни, але множить помилки на всіх лініях одночасно."]),
ST(D[6],T8[6],"Пілот довів користь: браку менше, мережа підтвердила замовлення. Георгій хоче оголосити перехід завершеним на святкуванні.",
["Рухатися далі","Подякувати групі, не оголошуючи завершення, і використати довіру, щоб змінити суміжні процеси: закупівлю матеріалів і логістику готової продукції.","Закупівлі домовляються з новим постачальником картону, а логісти змінюють пакування палет. Георгій: «Свято буде, коли це стане звичним».","Не зупинятися після успіху (крок 7): довіра від перемог використана для подальших змін, а не витрачена на святкування."],
["Вимога до всіх","Оголосити успіх пілоту й вимагати від решти цехів працювати за його зразком, не змінюючи закупівлі матеріалів і логістики.","Цехи копіюють правила, але матеріали надходять із запізненням. Скарги: «У Мирослави виходить, а в нас картон закінчився».","Успіх використано для тиску, але суміжні процеси не змінено (крок 7 виконано наполовину): пілотна лінія перемогла, решта не вписується."],
["Завершити проєкт","Оголосити перехід завершеним, закрити робочу групу й повернути її учасників до звичних обов’язків без передачі досвіду іншим цехам.","На святкуванні багато тостів. Через два тижні Мирослава повертається до своєї лінії, групи більше немає, а питання нових цехів ніхто не збирає.","Раннє оголошення перемоги (крок 7 пропущено) зупиняє рух: тих, хто ще не вписався в нову упаковку, ніхто не веде."]),
ST(D[7],T8[7],"Нова упаковка працює, але відкат ще можливий. Наближається перегляд технологічних карт, премій і програми навчання нових працівників цеху.",
["Вписати в правила","Вписати нову упаковку в технологічні карти та премії й показувати новачкам, як вона пов’язана із замовленнями торгових мереж.","Новачок у перший день бачить, як упаковка пов’язана із замовленням мережі. Ярема: «Дивно, але на пластику я вже не працював би».","Звичка закріплюється, коли нові дії стають частиною оцінювання, інструкцій і адаптації (крок 8), а не окремим проєктом."],
["Заборонити старе","Скасувати закупівлі пластику й нагадати в розсилці, що нова упаковка — єдиний допустимий варіант, вимагаючи дисципліни від усіх цехів.","Пластик зі складу зник, але деякі цехи купують його «про запас» і ховають у шафах. Вимога є, а причин триматися мало.","Заборона закриває старий шлях, але без змін в оцінюванні та адаптації (крок 8 виконано наполовину) нова поведінка тримається лише на контролі."],
["Подяка й далі","Обмежитися подякою за зусилля й перейти до наступних проєктів, вважаючи, що нова упаковка закріпиться без змін у документах.","Кілька місяців усе тримається. Навесні нова зміна повертається до пластику «бо швидше», а мережі скаржаться на змішані партії.","Без закріплення (крок 8 пропущено) старі способи повертаються, щойно закінчується увага керівництва."])
];

var END={A:["Зміна закріпилась","За сто днів зміна стала звичною частиною роботи: люди роблять по-новому не через наказ, а тому, що так зручніше. Наступну зміну такий колектив зустріне з більшою довірою."],
B:["Нове є, а змін немає","Формально нові правила працюють, але частина людей користується ними вибірково, а старі способи ще живі. Результат тримається на увазі керівництва й може розсипатися, щойно вона зникне."],
C:["Відкат до старого","Через сто днів зміна існує більше на папері: люди повернулися до звичних способів, довіра до змін підірвана, і наступна ініціатива стартуватиме з гіршої позиції."]};
var SAME={m:"Ви щоразу обирали середній шлях: робили щось, але не доводили до кінця. Подивіться в таблиці, на яких кроках це не спрацювало.",p:"Ви щоразу обирали найшвидший чи найпростіший шлях. Він дає швидкий старт, але коштує довіри людей і міцності змін."};
function ending(p){return p>=13?"A":(p>=8?"B":"C")}
function total(pts){return pts.reduce(function(a,b){return a+b},0)}

var ends=["A","B","C"].map(function(k){var c=t.filter(function(r){return r.end===END[k][0]}).length;return bar(END[k][0],c,n,k==="A"?"#2E7D6B":(k==="B"?"#C9962C":"#B3492F"))}).join("");
var steps=KS.map(function(k,i){var s=t.reduce(function(a,r){return a+(r.pts[i]||0)},0);return bar(k.n+". "+k.t+" (середній бал)",Math.round(s/n*10)/10,2,COL[i])}).join("");
b='<p class="sm"><b>Учасників:</b> '+n+' · середній результат: '+avg+' із '+MAXPTS+'</p><h2 style="margin-top:14px">Фінали</h2>'+ends+'<h2>Середній бал за кроками</h2>'+steps+'<div style="overflow-x:auto;margin-top:12px"><table><tr><th>Ім’я</th><th>Кейс</th><th>Дата</th><th>Фінал</th><th>Бали</th></tr>'+t.map(function(r){return'<tr><td>'+esc(r.name||"—")+'</td><td>'+esc(r.cs||"")+'</td><td>'+esc(r.date||"")+'</td><td>'+esc(r.end||"")+'</td><td>'+r.sc+'</td></tr>'}).join("")+'</table></div>'}
return'<div class="ov"><div class="card"><h1 class="serif" style="font-size:22px;margin-bottom:10px">Результати групи</h1>'+b+(st.csvText?'<div class="box"><p class="sm">Завантаження недоступне. Скопіюйте CSV:</p><textarea rows="6" readonly>'+esc(st.csvText)+'</textarea></div>':"")+'<div class="row"><button class="btn" data-a="tcsv"'+(st.teacher&&st.teacher!=="load"&&st.teacher.length?"":" disabled")+'>Експорт CSV</button><button class="btn" data-a="trefresh">Оновити</button><button class="btn" data-a="tclose">Закрити</button></div></div></div>'}
function render(){var m={intro:intro,stage:stage,react:react,results:results};app.innerHTML='<div class="st">'+m[st.screen]()+'</div>'+(st.teacherOpen?teacherHtml():"");if(!st.teacherOpen)window.scrollTo(0,0)}
function openTeacher(){st.teacherOpen=true;st.teacher="load";st.csvText="";render();loadAll(function(r){st.teacher=r;render()})}
function pick(di){if(st.screen!=="stage")return;var s=st.s,ci=st.orders[s][di],o=STAGES[s].o[ci];st.pts[s]=o.pts;st.picks[s]=ci;st.last={ci:ci};st.screen="react";render()}
function next(){if(st.screen!=="react")return;if(st.s>=STAGES.length-1){st.screen="results";save()}else{st.s++;st.screen="stage"}render()}
function copyReport(){var t=report();function fb(){st.manual=t;render();var x=document.getElementById("man");if(x&&x.select)x.select()}
try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){st.manual="";var b=app.querySelector('[data-a="copy"]');if(b)b.textContent="Скопійовано ✓"},fb)}else fb()}catch(e){fb()}}
function downloadCsv(){var csv=toCsv(st.teacher);try{var bl=new Blob([csv],{type:"text/csv;charset=utf-8"}),u=URL.createObjectURL(bl),a=document.createElement("a");a.href=u;a.download="Сто_днів_змін_результати.csv";document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(u)},1000)}catch(e){st.csvText=csv;render()}}
app.addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(!b)return;var a=b.dataset.a;
if(a==="start"){var n=document.getElementById("nm");st.name=n?n.value.trim():"";st.caseId=b.dataset.id||"crm";STAGES=caseById(st.caseId).stages;st.s=0;st.pts=[];st.picks=[];st.orders=mkOrders();st.saved=false;st.manual="";st.screen="stage";render()}
else if(a==="pick")pick(+b.dataset.i);
else if(a==="next")next();
else if(a==="retry"){st.screen="intro";st.manual="";render()}
else if(a==="copy")copyReport();
else if(a==="teacher"||a==="trefresh")openTeacher();
else if(a==="tcsv")downloadCsv();
else if(a==="tclose"){st.teacherOpen=false;st.csvText="";render()}});
document.addEventListener("keydown",function(e){if(st.teacherOpen||/INPUT|TEXTAREA/.test(e.target.tagName||""))return;
if(st.screen==="stage"&&/^[1-3]$/.test(e.key))pick(+e.key-1);else if(st.screen==="react"&&e.key==="Enter")next()});
window.__crm={CASES:CASES,setCase:function(id){STAGES=caseById(id).stages;st.caseId=id},get STAGES(){return STAGES},KS:KS,END:END,ending:ending,mkOrders:mkOrders,toCsv:toCsv,st:st,total:total,MAXPTS:MAXPTS,record:record};
render();

})();
