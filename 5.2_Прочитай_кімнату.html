<!DOCTYPE html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Прочитай кімнату</title>
<style>
:root{--ink:#1E2761;--ink2:#384080;--bg:#F3F6FC;--card:#fff;--gold:#C9962C;--mut:#5B6685;--line:#DDE4F5;--hero:#1E2761;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#E8ECFF;--ink2:#B9C2F0;--bg:#10142B;--card:#1A2040;--gold:#E0AE45;--mut:#A3ADD3;--line:#2E3664;--hero:#2B3575}}
:root[data-theme="dark"]{--ink:#E8ECFF;--ink2:#B9C2F0;--bg:#10142B;--card:#1A2040;--gold:#E0AE45;--mut:#A3ADD3;--line:#2E3664;--hero:#2B3575}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.serif{font-family:Cambria,Georgia,serif}#app{display:flex;justify-content:center;padding:28px 16px}.st{width:100%;max-width:680px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:34px 30px;box-shadow:0 18px 40px -26px rgba(30,39,97,.4)}
@media(max-width:480px){.card{padding:24px 18px}}
.k{font-size:13px;color:var(--mut);margin:0 0 8px}h1{font-size:27px;line-height:1.2;margin:0 0 12px}h2{font-size:18px;margin:28px 0 10px}p{margin:0 0 12px}.mut{color:var(--mut)}.sm{font-size:14px}
input,textarea{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);font:inherit;font-size:15px;color:var(--ink);background:var(--bg)}
.btn{display:inline-flex;justify-content:center;align-items:center;padding:13px 22px;border-radius:10px;border:1.5px solid var(--line);font:inherit;font-weight:600;font-size:15px;cursor:pointer;background:var(--bg);color:var(--ink)}
.pri{background:var(--ink);color:var(--bg);border-color:var(--ink);width:100%}.ghost{background:none;border:none;color:var(--mut);font-weight:500;padding:8px 4px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.row .btn{flex:1;min-width:140px}
.ex{background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:14px;margin:0 0 18px}
.pg{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:18px}.pg i{display:block;height:100%;background:var(--gold);transition:width .3s}
.stmt{font-size:21px;line-height:1.4;font-weight:600;min-height:112px;margin:8px 0 26px}
.opts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:22px}
.opt{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;cursor:pointer;font:inherit;font-size:12px;color:var(--mut);padding:0}
.opt b{width:100%;max-width:56px;aspect-ratio:1;border-radius:50%;border:2px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--ink2);transition:.15s}
.opt:hover b{border-color:var(--gold)}.opt.on b{background:var(--gold);border-color:var(--gold);color:#fff;transform:scale(1.08)}.opt:focus-visible b{outline:3px solid var(--ink2);outline-offset:2px}
.nav{display:flex;justify-content:space-between;align-items:center}
.bar{margin-bottom:12px}.bl{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:4px}.bt{height:12px;background:var(--bg);border:1px solid var(--line);border-radius:7px;overflow:hidden}.bt i{display:block;height:100%;border-radius:7px}
.hero{background:var(--hero);color:#fff;border-radius:14px;padding:20px 22px;margin-top:18px}.hero p{color:#DCE1F5;font-size:14.5px}.hero b{color:#fff}.hero .lb{font-size:12px;color:#F3E4C6;font-weight:700}.hero .nm{font-size:22px;font-weight:700;margin:2px 0 10px}
.box{margin-top:14px;padding:14px 16px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:14px}
details{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px}summary{cursor:pointer;font-weight:600}details p{font-size:14px;margin:8px 0 0}
.case{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}.case p{font-size:14.5px}
.ch{display:flex;flex-wrap:wrap;gap:6px}.ch button{flex:1;min-width:105px;padding:8px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.fb{margin-top:10px;font-size:14px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
svg text{fill:var(--mut);font-family:inherit}.link{display:block;margin:18px auto 0;background:none;border:none;color:var(--mut);font-size:13px;text-decoration:underline;cursor:pointer}
.ch button{display:flex;flex-direction:column;align-items:center;gap:3px}.ch button:disabled{opacity:.55;cursor:default}.ch button.sel{opacity:1;border-color:var(--gold);border-width:2px}.ov{position:fixed;inset:0;background:rgba(10,14,40,.62);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}.ov .card{max-height:90vh;overflow:auto}
.cb{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:13px 14px;margin-bottom:8px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px;cursor:pointer}.cb .em{font-size:24px}.cb:hover:not(:disabled){border-color:var(--gold)}.cb:disabled{cursor:default}.cb.ok{border-color:#2E7D6B;background:color-mix(in srgb,#2E7D6B 18%,var(--bg))}.cb.no{border-color:#B3492F;background:color-mix(in srgb,#B3492F 18%,var(--bg))}.why{display:block;margin-top:6px;font-size:13.5px;color:var(--mut)}
</style></head><body><div id="app"></div>
<script>
(function(){
var STATES=[
{key:"anxiety",emoji:"😰",label:"Тривога / невпевненість",nm:"Тривога",short:"Нервозність, потреба в підтвердженні, уникання погляду.",cue:"тілесні сигнали, перепитування й пошук підтвердження",c:"#C9962C"},
{key:"irritation",emoji:"😤",label:"Роздратування / фрустрація",nm:"Роздратування",short:"Різкість, нетерпіння, стислі відповіді.",cue:"різкість і нетерпіння, зміну тону порівняно зі звичайним",c:"#B3492F"},
{key:"demotivation",emoji:"😞",label:"Демотивація / вигорання",nm:"Демотивація",short:"Втрата ініціативи, рівний тон, відстороненість.",cue:"поступове зникнення ініціативи й рівний, байдужий тон",c:"#7A4FA0"},
{key:"resistance",emoji:"🎭",label:"Прихований опір",nm:"Прихований опір",short:"Словесна згода за відсутності реальних дій.",cue:"розрив між словами й діями",c:"#384080"},
{key:"neutral",emoji:"🙂",label:"Усе гаразд / замало даних",nm:"Усе гаразд",short:"Поведінка збігається зі звичною або має просте пояснення.",cue:"те, чи збігається поведінка зі звичною для людини, і чи є просте пояснення",c:"#2E7D6B"}];
function stOf(k){return STATES.filter(function(s){return s.key===k})[0]}
function lab(k){return stOf(k).emoji+" "+stOf(k).label}
var SCENARIOS = [
    { id: "s1", correct: "anxiety",
      text: "На нараді, коли ви запитуєте молодшого аналітика про статус звіту, він починає говорити швидше, кілька разів перепрошує за «ще не зовсім готово», хоча дедлайн ще не настав. Уникає прямого погляду, тримає руки під столом, і в кінці додає: «Вибачте, якщо це звучить незрозуміло, можу переробити, якщо треба»." ,
      explanation: "Пришвидшена мова, повторні вибачення ще до настання дедлайну, уникання зорового контакту й закрита поза — класичні вербальні й невербальні сигнали тривоги та невпевненості, а не роздратування чи опору." },
    { id: "s2", correct: "irritation",
      text: "Коли ви вкотре просите керівника відділу продажів уточнити цифри у звіті, він коротко відповідає: «Вже надсилав, подивіться пошту», закриває ноутбук трохи різкіше, ніж зазвичай, і не пропонує, як завжди, обговорити деталі далі.",
      explanation: "Короткі, різкі відповіді, різкіший, ніж зазвичай, фізичний жест і відмова від звичного продовження діалогу — ознаки роздратування, а не тривоги чи вигорання." },
    { id: "s3", correct: "demotivation",
      text: "Раніше ініціативний менеджер проєкту останнім часом виконує лише те, що прямо доручено, не пропонує власних ідей на нарадах, і на запитання «як просувається проєкт» відповідає рівним голосом: «Йде, як і мало йти».",
      explanation: "Звуження поведінки лише до прямих доручень, відсутність ініціативи і рівний, байдужий тон — типові ознаки демотивації, на відміну від тривоги (немає нервозності) чи опору (немає прихованого сарказму)." },
    { id: "s4", correct: "resistance",
      text: "На нараді, де ви презентуєте нову систему звітності, керівник відділу каже: «Звучить розумно, спробуємо», але наступного тижня його команда «ще не встигла» почати, а сам він у приватній розмові з колегою іронічно назвав це «черговою модною штукою згори».",
      explanation: "Словесна згода («спробуємо») разом із фактичною бездіяльністю команди і саркастичним коментарем у приватній розмові — класичний розрив між тим, що людина каже публічно, і тим, що робить чи говорить насправді. Це прихований опір, а не щире прийняття." },
    { id: "s5", correct: "anxiety",
      text: "Співробітниця, яка зазвичай впевнено презентує свої ідеї, цього разу говорить тихіше, часто зупиняється, щоб уточнити «чи це взагалі має сенс», і кілька разів озирається на вас у пошуках підтвердження, перш ніж продовжити речення.",
      explanation: "Тихіший голос, паузи для перевірки «чи це має сенс» і пошук підтвердження поглядом — ознаки невпевненості, яка проявляється саме як тривога, а не байдужість чи демотивація." },
    { id: "s6", correct: "irritation",
      text: "На спільному дзвінку колега кілька разів перебиває інших, барабанить пальцями по столу, коли хтось говорить довше хвилини, і зрештою каже: «Може, вже перейдемо до суті, у нас обмаль часу».",
      explanation: "Перебивання інших, нетерпляче постукування пальцями і пряма вимога «перейти до суті» — явні поведінкові маркери фрустрації через тиск часу." },
    { id: "s7", correct: "demotivation",
      text: "Співробітник, який три місяці тому із захопленням розповідав про нову ініціативу, тепер приходить на статус-зустрічі без ноутбука, коротко відповідає «зроблено» чи «не встиг», і жодного разу не поставив уточнювального запитання за останній місяць.",
      explanation: "Втрата колишнього ентузіазму, мінімальні односкладові відповіді і повна відсутність запитань протягом місяця — це виснаження чи вигорання, що розвивається поступово, а не гостра реакція на одну конкретну подію." },
    { id: "s8", correct: "resistance",
      text: "Співробітниця погоджується з новим графіком змін словами «добре, зрозуміла», але потім двічі «випадково» плутає нові часи в календарі, а на прямі запитання про причину каже, що «просто забула», хоча раніше такого не траплялося.",
      explanation: "Повторювані «випадкові» помилки саме в тому, з чим людина не згодна, при формальній словесній згоді — типовий пасивно-агресивний патерн прихованого опору, а не звичайна неуважність." },

    { id: "s9", correct: "anxiety",
      text: "Перед виступом на зустрічі з клієнтом молодший спеціаліст кілька разів перепитує в колег, чи правильно він підготував слайди, хоча вже отримав схвалення тричі. Руки злегка тремтять, коли він тримає ручку, і він відмовляється від кави, кажучи, що «і так нервую».",
      explanation: "Повторні прохання підтвердити те, що вже підтверджено, тремтіння рук і пряме визнання нервозності — прямі й непрямі сигнали тривоги." },
    { id: "s10", correct: "anxiety",
      text: "Коли керівник заходить у відкритий опенспейс, співробітниця швидко закриває вкладку з особистими нотатками, випрямляється на стільці і починає друкувати швидше, хоча до цього моменту працювала спокійно.",
      explanation: "Раптова зміна пози й темпу роботи у відповідь на появу керівника — реакція настороженості й тривоги, а не роздратування чи демотивації." },
    { id: "s11", correct: "anxiety",
      text: "На запитання «чи є питання щодо нового процесу» новачок довго мовчить, потім тихо каже «ні, все зрозуміло», хоча за хвилину до цього кілька разів гортав нотатки туди-сюди, шукаючи щось.",
      explanation: "Розрив між невпевненою поведінкою (гортання нотаток, пошук) і словесним запевненням «усе зрозуміло» — типовий прояв тривоги, коли людина боїться визнати нерозуміння." },
    { id: "s12", correct: "anxiety",
      text: "Співробітник, готуючи звіт для інвестора, надсилає його вам на перевірку тричі за один вечір з однаковим текстом, щоразу додаючи «вибачте, що турбую, просто хочу переконатися».",
      explanation: "Повторне звернення по підтвердження без реальних змін у документі та надмірні вибачення — класична поведінка тривожної людини, яка шукає заспокоєння, а не фрустрованої чи опірної." },
    { id: "s13", correct: "anxiety",
      text: "Під час зідзвону камера новачка кілька разів вмикається і вимикається, ніби він не може вирішити, чи готовий показати обличчя, а коли нарешті лишає камеру увімкненою, весь час поправляє волосся чи одяг.",
      explanation: "Нерішучість щодо власної видимості й постійне поправляння зовнішнього вигляду — невербальні сигнали тривожності й самосвідомості, притаманні саме цьому стану." },
    { id: "s14", correct: "anxiety",
      text: "Коли ви хвалите роботу співробітниці перед командою, вона одразу перебиває: «та там ще багато що можна покращити», і швидко переводить розмову на інше, ніби похвала викликає незручність.",
      explanation: "Дискомфорт від похвали й швидка спроба применшити власний результат — прояв невпевненості в собі, а не демотивації чи опору." },

    { id: "s15", correct: "irritation",
      text: "Коли зустріч переноситься втретє за тиждень, керівник відділу логістики пише в чаті одним реченням без розділових знаків: «ну добре перенесемо ще раз» і не додає жодного смайлика, хоча зазвичай завжди підтримує розмову жартами.",
      explanation: "Помітна зміна звичного комунікативного стилю на сухий і формальний — ознака стриманого роздратування через повторювані незручності." },
    { id: "s16", correct: "irritation",
      text: "Під час обговорення бюджету фінансовий директор різко відкладає ручку, коли хтось пропонує «ще раз розглянути цифри», і каже: «ми вже тричі це обговорювали, час рухатися далі».",
      explanation: "Різкий фізичний жест і пряма вербальна вказівка на втому від повторення — очевидні ознаки фрустрації, а не тривоги чи опору." },
    { id: "s17", correct: "irritation",
      text: "Коли IT-фахівець отримує п'ятий за день терміновий запит, він відповідає односкладово «зроблю», не уточнюючи деталей, хоча зазвичай завжди перепитує контекст перш ніж почати.",
      explanation: "Відмова від звичного уточнювального діалогу на користь короткої, формальної відповіді сигналізує про накопичене роздратування через перевантаження." },
    { id: "s18", correct: "irritation",
      text: "На зустрічі один із учасників гучно видихає й закочує очі, коли колега вкотре повторює той самий аргумент, і зрештою каже: «ми вже це чули, може щось нове?»",
      explanation: "Демонстративне видихання, закочування очей і пряме, дещо саркастичне зауваження — явні відкриті прояви роздратування." },
    { id: "s19", correct: "irritation",
      text: "Коли клієнт просить ще одну правку в дизайні за день до дедлайну, дизайнерка відповідає в переписці коротко: «Ок» без жодних емодзі чи пояснень, хоча зазвичай детально описує свій підхід.",
      explanation: "Різке скорочення звичного стилю спілкування до мінімуму слів — стримана, але явна ознака фрустрації через додатковий тиск перед дедлайном." },
    { id: "s20", correct: "irritation",
      text: "Помітивши, що колега знову спізнюється на щоденний статус-мітинг, тімлід демонстративно дивиться на годинник, коли той заходить, і починає нараду без привітання.",
      explanation: "Демонстративний жест (погляд на годинник) і пропуск звичного соціального ритуалу привітання — невербальні сигнали роздратування через повторювану поведінку колеги." },

    { id: "s21", correct: "demotivation",
      text: "Співробітниця, яка раніше завжди піднімала руку першою на брейнштормах, тепер мовчки слухає і, коли до неї звертаються напряму, каже: «мені нормально з будь-яким варіантом, вирішуйте самі».",

function react(){return st.answers.filter(function(a){return a.actOk}).length}
function tier(p){return p>=.875?["Сильне зчитування сигналів","Ви впевнено помічаєте вербальні й невербальні сигнали та відрізняєте їх від звичайної поведінки. Це основа емпатії та якісного лідерського зворотного зв'язку."]:p>=.625?["Непогано, є прогалини","Більшість станів ви визначили правильно, але деякі сигнали ще плутаються. Подивіться підказки до ваших помилок нижче."]:["Варто потренувати уважність до сигналів","Поки що складно розрізняти стани з першого прочитання. Дивіться не лише на слова, а й на розрив між словами й діями, різкість реакцій, рівень ініціативи, тілесні сигнали та на те, чи змінилась поведінка порівняно зі звичною."]}
function intro(){return'<div class="card"><p class="k">Практичне заняття 5 · Бізнес-лідерство</p><h1 class="serif">Прочитай кімнату</h1><p class="mut">8 робочих ситуацій. У кожній описано поведінку людини на нараді чи в розмові. Спершу визначте, що за цим стоїть (іноді нічого особливого), а потім оберіть, як би ви відреагували. Те, що ви «прочитали», — лише гіпотеза, яку варто перевірити.</p><label class="sm"><b>П\'ять варіантів відповіді</b></label><div style="margin:8px 0 18px">'+STATES.map(function(s){return'<div class="box" style="margin:0 0 8px;display:flex;gap:12px;align-items:flex-start"><span style="font-size:24px">'+s.emoji+'</span><div><b>'+s.label+'</b><div class="mut sm">'+s.short+'</div></div></div>'}).join("")+'</div><label class="sm" for="nm"><b>Ваше ім\'я</b> <span class="mut">(необов\'язково)</span></label><input id="nm" maxlength="40" placeholder="Наприклад, Олена К." value="'+esc(st.name)+'" style="margin:6px 0 18px"><button class="btn pri" data-a="start">Почати (8 ситуацій) →</button></div>'}
function quiz(){var s=sc(st.order[st.index]);
return'<div class="card"><div class="pg"><i style="width:'+Math.round(st.index/st.order.length*100)+'%"></i></div><p class="k">Ситуація '+(st.index+1)+' із '+st.order.length+' · крок 1 із 2</p><p style="font-weight:700;margin:0 0 10px">Що стоїть за поведінкою цієї людини?</p><div class="box" style="margin:0 0 16px;font-size:15.5px">'+s.text+'</div>'+STATES.map(function(x,i){return'<button class="cb" data-a="pick" data-k="'+x.key+'"><span class="em">'+x.emoji+'</span><span>'+x.label+'</span></button>'}).join("")+'</div>'}
function feedback(){var a=st.last,s=sc(a.scenarioId),done=a.act>=0,isLast=st.index>=st.order.length-1;
var head='<div class="box" style="margin:0 0 18px;border-left:4px solid '+(a.isCorrect?"#2E7D6B":"#B3492F")+'"><b>'+(a.isCorrect?"✓ Правильно!":"✕ Неправильно")+'</b><div class="mut sm" style="margin:4px 0 8px">Ваша відповідь: '+lab(a.chosen)+(a.isCorrect?"":" · Правильна: "+lab(a.correct))+'</div><div class="sm">'+esc(s.explanation)+'</div></div>';
var opts=a.opts.map(function(o,i){var cls="cb";if(done){if(o.ok)cls+=" ok";else if(i===a.act)cls+=" no"}return'<button class="'+cls+'" data-a="act" data-i="'+i+'"'+(done?" disabled":"")+'><span>'+o.t+(done&&(o.ok||i===a.act)?'<span class="why">'+(o.ok?"✓ ":"✕ ")+o.w+'</span>':"")+'</span></button>'}).join("");
var warn=done&&!a.isCorrect?'<div class="box" style="margin-top:10px"><b>Зверніть увагу:</b> ваш діагноз виявився хибним, тож ця реакція могла б не потрапити в ціль. Найнадійніше — спершу перевірити гіпотезу спокійним відкритим запитанням.</div>':"";
return'<div class="card"><div class="pg"><i style="width:'+Math.round((st.index+.5)/st.order.length*100)+'%"></i></div><p class="k">Ситуація '+(st.index+1)+' із '+st.order.length+' · крок 2 із 2</p>'+head+'<p style="font-weight:700;margin:0 0 4px">Що ви зробите?</p><p class="mut sm" style="margin:0 0 12px">Ви визначили стан як «'+stOf(a.chosen).label+'». Яка реакція найкраща?</p>'+opts+warn+(done?'<button class="btn pri" data-a="next" style="margin-top:14px">'+(isLast?"Дивитися підсумок →":"Наступна ситуація →")+'</button>':"")+'</div>'}
function results(){var N=st.order.length,rec=score(),rea=react(),t=tier(rec/N);
var miss=st.answers.map(function(a,i){return{a:a,i:i}}).filter(function(x){return!x.a.isCorrect});
var mh=miss.length?miss.map(function(x){return'<div class="box" style="margin-top:8px"><b>Ситуація '+(x.i+1)+'.</b> Ви обрали '+lab(x.a.chosen)+', а було '+lab(x.a.correct)+'. <span class="mut">Підказка: зверніть увагу на '+stOf(x.a.correct).cue+'.</span></div>'}).join(""):'<p class="mut sm">Помилок у розпізнаванні немає.</p>';
var rows=st.answers.map(function(a){return'<tr><td>'+lab(a.correct)+'</td><td>'+lab(a.chosen)+'</td><td>'+(a.isCorrect?"✓":"✕")+'</td><td>'+(a.actOk?"✓":"✕")+'</td></tr>'}).join("");
return'<div class="card">'+(st.name?'<p class="k">'+esc(st.name)+'</p>':"")+'<h1 class="serif">Ваш результат</h1><div style="display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 4px"><div class="box" style="flex:1;min-width:140px;margin:0;text-align:center"><div class="mut sm">Розпізнавання</div><div style="font-size:30px;font-weight:700">'+rec+' <span class="mut" style="font-size:16px">з '+N+'</span></div></div><div class="box" style="flex:1;min-width:140px;margin:0;text-align:center"><div class="mut sm">Вибір реакції</div><div style="font-size:30px;font-weight:700">'+rea+' <span class="mut" style="font-size:16px">з '+N+'</span></div></div></div><div class="hero"><div class="lb">ПІДСУМОК</div><div class="nm">'+t[0]+'</div><p>'+t[1]+'</p><p><b>Про реакцію:</b> найнадійніша — спокійна розмова наодинці з відкритим запитанням, а не публічне зауваження чи ігнорування.</p></div><h2>Розбір помилок</h2>'+mh+'<details style="margin-top:14px"><summary>Усі відповіді</summary><div style="overflow-x:auto;margin-top:8px"><table><tr><th>Правильний стан</th><th>Ваша відповідь</th><th>Стан</th><th>Реакція</th></tr>'+rows+'</table></div></details><div class="row"><button class="btn" data-a="retry">Спробувати ще раз</button></div></div>'}
function render(){app.innerHTML='<div class="st">'+({intro:intro,quiz:quiz,feedback:feedback,results:results}[st.screen])()+'</div>';window.scrollTo(0,0)}
function choose(k){var s=sc(st.order[st.index]),a={scenarioId:s.id,chosen:k,correct:s.correct,isCorrect:k===s.correct,act:-1,actOk:false,opts:buildOpts(k,st.pos[st.index])};st.answers.push(a);st.last=a;st.screen="feedback";render()}
app.addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(!b)return;var a=b.dataset.a;
if(a==="start"){st.name=document.getElementById("nm").value.trim();st.order=pickRound();st.pos=mkPos();st.index=0;st.answers=[];st.screen="quiz";render()}
else if(a==="pick")choose(b.dataset.k);
else if(a==="act"){var x=st.last;if(x.act>=0)return;x.act=+b.dataset.i;x.actOk=!!x.opts[x.act].ok;render()}
else if(a==="next"){if(st.index>=st.order.length-1)st.screen="results";else{st.index++;st.screen="quiz"}render()}
else if(a==="retry"){st.screen="intro";st.answers=[];st.index=0;render()}});
document.addEventListener("keydown",function(e){if(st.screen==="quiz"&&/^[1-5]$/.test(e.key)&&!/INPUT|TEXTAREA/.test(e.target.tagName))choose(STATES[+e.key-1].key)});
render();
})();
</script></body></html>
