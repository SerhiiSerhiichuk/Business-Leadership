<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Модератор конфлікту</title>
<style>
  :root {
    --ink: #1E2761; --ink-soft: #384080; --surface: #F3F6FC; --card: #FFFFFF;
    --gold: #C9962C; --gold-soft: #F3E4C6; --muted: #5B6685; --line: #DDE4F5;
    --red: #B3492F; --green: #2E7D6B;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%; background: var(--surface);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
  }
  .serif { font-family: Cambria, Georgia, "Times New Roman", serif; }
  #app { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 18px; }
  .stage-wrap { width: 100%; max-width: 660px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 36px 34px; box-shadow: 0 18px 40px -24px rgba(30,39,97,0.35); }
  @media (max-width: 480px) { .card { padding: 24px 18px; } }

  .kicker { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
  h1.title { font-size: 26px; line-height: 1.25; margin: 0 0 14px; font-weight: 700; }
  p.lead { font-size: 15px; line-height: 1.6; color: var(--muted); margin: 0 0 22px; }
  label.field-label { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; font-weight: 600; }
  input.text-input {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line);
    font-size: 15px; color: var(--ink); background: var(--surface); margin-bottom: 20px;
  }
  input.text-input:focus { outline: none; border-color: var(--gold); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 13px 24px; border-radius: 10px; border: none; font-size: 14.5px; font-weight: 600;
    cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn-primary { background: var(--ink); color: #fff; width: 100%; }
  .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 10px 20px -12px rgba(30,39,97,0.6); }
  .btn-secondary { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); }
  .note-box { margin: 0 0 20px; padding: 12px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: 12.5px; color: var(--muted); line-height: 1.5; }

  /* DISC primer */
  .primer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
  @media (max-width: 480px) { .primer-grid { grid-template-columns: 1fr; } }
  .primer-item { display: flex; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); align-items: flex-start; }
  .primer-letter { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; color: #fff; flex-shrink: 0; }
  .primer-letter.D { background: var(--red); } .primer-letter.I { background: var(--gold); } .primer-letter.S { background: var(--green); } .primer-letter.C { background: var(--ink); }
  .primer-text { font-size: 11.5px; line-height: 1.4; color: var(--muted); }
  .primer-text b { color: var(--ink); }

  /* Quiz */
  .progress-track { height: 5px; background: var(--line); border-radius: 4px; overflow: hidden; margin-bottom: 22px; }
  .progress-fill { height: 100%; background: var(--gold); border-radius: 4px; transition: width 0.4s ease; }
  .step-count { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .cand-name-big { font-size: 20px; font-weight: 700; margin-bottom: 14px; }
  .desc-box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 22px; }
  .desc-box p { font-size: 14px; line-height: 1.65; margin: 0; color: var(--ink-soft); }
  .disc-choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 480px) { .disc-choice-grid { grid-template-columns: 1fr; } }
  .disc-choice-btn {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px;
    border: 1.5px solid var(--line); background: #fff; cursor: pointer; transition: all 0.15s ease; text-align: left;
  }
  .disc-choice-btn:hover { border-color: var(--gold); background: var(--gold-soft); }
  .disc-choice-btn .dc-badge { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; color: #fff; flex-shrink: 0; }
  .disc-choice-btn .dc-badge.D { background: var(--red); } .disc-choice-btn .dc-badge.I { background: var(--gold); } .disc-choice-btn .dc-badge.S { background: var(--green); } .disc-choice-btn .dc-badge.C { background: var(--ink); }
  .disc-choice-btn .dc-title { font-weight: 700; font-size: 13.5px; }
  .disc-choice-btn .dc-sub { font-size: 11px; color: var(--muted); }

  /* Consequence */
  .consequence-box { border-radius: 14px; padding: 18px 20px; margin-bottom: 20px; color: #fff; }
  .consequence-box.correct { background: var(--green); }
  .consequence-box.incorrect { background: var(--red); }
  .consequence-box .cq-label { font-size: 11px; font-weight: 700; margin-bottom: 8px; letter-spacing: 0.3px; opacity: 0.85; }
  .consequence-box p { font-size: 13.5px; line-height: 1.55; margin: 0; }
  .consequence-box .cq-your { font-size: 12px; margin-bottom: 8px; opacity: 0.9; }

  /* Results */
  table.results-recap { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-bottom: 20px; }
  table.results-recap th { text-align: left; font-size: 11px; color: var(--muted); font-weight: 600; padding: 7px 6px; border-bottom: 2px solid var(--line); }
  table.results-recap td { padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .mini-badge { width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 11px; color: #fff; }
  .mini-badge.D { background: var(--red); } .mini-badge.I { background: var(--gold); } .mini-badge.S { background: var(--green); } .mini-badge.C { background: var(--ink); }
  .result-icon { font-weight: 800; }
  .result-icon.ok { color: var(--green); } .result-icon.no { color: var(--red); }

  .tier-card { margin-top: 4px; padding: 20px 22px; border-radius: 14px; background: var(--ink); color: #fff; margin-bottom: 20px; }
  .tier-card .t-label { font-size: 11px; color: var(--gold-soft); font-weight: 700; margin-bottom: 8px; letter-spacing: 0.3px; }
  .tier-card .t-title { font-size: 19px; font-weight: 700; margin-bottom: 8px; }
  .tier-card p { font-size: 13.5px; line-height: 1.55; color: #DCE1F5; margin: 0; }
  .score-big { text-align: center; margin-bottom: 4px; }
  .score-big .num { font-size: 40px; font-weight: 800; color: var(--ink); }
  .score-big .den { font-size: 16px; color: var(--muted); }

  .save-note { font-size: 12.5px; color: var(--muted); margin-top: 14px; text-align: center; }
  .result-actions { display: flex; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
  .result-actions .btn { flex: 1; min-width: 140px; }
  .teacher-link { display: block; text-align: center; margin-top: 20px; font-size: 12.5px; color: var(--muted); text-decoration: underline; cursor: pointer; background: none; border: none; }

  .teacher-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  table.results-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.results-table th { text-align: left; font-size: 10.5px; color: var(--muted); font-weight: 600; padding: 7px 6px; border-bottom: 2px solid var(--line); }
  table.results-table td { padding: 8px 6px; border-bottom: 1px solid var(--line); }
  .tag { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; background: var(--gold-soft); color: #7A5A16; }
  .empty-note { text-align: center; color: var(--muted); font-size: 13.5px; padding: 30px 0; }
  .icon-btn { background: none; border: 1.5px solid var(--line); border-radius: 8px; padding: 7px 13px; font-size: 12.5px; color: var(--ink); cursor: pointer; }
  .icon-btn:hover { border-color: var(--gold); }
  .table-scroll { overflow-x: auto; }



  .fb-hint { font-size: 12px; color: var(--muted); font-style: italic; margin: 4px 0 0; }
  .next-box { margin: 20px 0 14px; padding: 16px 18px; border-radius: 14px; background: var(--gold-soft); border: 1px solid #E5CE9B; }
  .next-box .nb-title { font-size: 15px; font-weight: 800; margin-bottom: 4px; }
  .next-box p { font-size: 13px; line-height: 1.55; color: var(--ink-soft); margin: 0 0 12px; }
  .next-box .result-actions { margin-top: 0; }
  .deep { margin: 6px 0 18px; border: 1.5px solid var(--line); border-radius: 14px; background: #fff; }
  .deep > summary { cursor: pointer; font-weight: 700; font-size: 14px; padding: 14px 18px; color: var(--ink); list-style: none; }
  .deep > summary::-webkit-details-marker { display: none; }
  .deep > summary::before { content: "▸ "; color: var(--gold); }
  .deep[open] > summary::before { content: "▾ "; }
  .deep-body { padding: 0 16px 16px; }
  .deep-lead { font-size: 12.5px; color: var(--muted); line-height: 1.55; margin: 0 0 14px; }

  /* ---------- Stepper & roadmap ---------- */
  .stepper { display: flex; align-items: center; margin-bottom: 14px; }
  .st-item { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 40px; }
  .st-ico { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; border: 2px solid var(--line); background: var(--surface); filter: grayscale(1); opacity: 0.55; }
  .st-lab { font-size: 10px; font-weight: 700; color: var(--muted); }
  .st-item.done .st-ico { filter: none; opacity: 1; background: #DCEFE9; border-color: #6FB8A2; }
  .st-item.cur .st-ico { filter: none; opacity: 1; background: var(--gold-soft); border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,150,44,0.25); }
  .st-item.cur .st-lab { color: var(--ink); }
  .st-line { flex: 1; height: 2px; background: var(--line); margin: 0 2px 14px; min-width: 6px; }
  .roadmap { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 18px; }
  @media (max-width: 560px) { .roadmap { grid-template-columns: 1fr; } }
  .rm-item { display: flex; gap: 10px; align-items: center; padding: 9px 11px; border-radius: 10px; border: 1.5px solid var(--line); background: #fff; }
  .rm-ico { width: 36px; height: 36px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
  .rm-name { font-weight: 700; font-size: 12.5px; } .rm-desc { font-size: 11.5px; color: var(--muted); line-height: 1.4; }

  /* ---------- SBI-I icons ---------- */
  .el-S { --ic-bg: #E6EAF8; --ic-bd: #7C8BC9; } .el-B { --ic-bg: #FBF1D6; --ic-bd: #D7B25A; } .el-I { --ic-bg: #DCEFE9; --ic-bd: #6FB8A2; }
  .el-N { --ic-bg: #EADFF5; --ic-bd: #A98BD1; } .el-frame { --ic-bg: #E3F0FA; --ic-bd: #78AEDB; } .el-E { --ic-bg: #FBE3EA; --ic-bd: #E08BA4; }
  .el-Q { --ic-bg: #E0F2F1; --ic-bd: #5FB5AE; } .el-A { --ic-bg: #E7F3D9; --ic-bd: #8DBB5A; } .el-F { --ic-bg: #EEE9DD; --ic-bd: #B6A472; }
  .lv-bad { --ic-bg: #F6DCD4; --ic-bd: #D9826A; } .lv-soft { --ic-bg: #FBEBD6; --ic-bd: #E2A867; }
  .el-list { display: grid; gap: 8px; margin-bottom: 18px; }
  .el-card { display: flex; gap: 14px; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; }
  .el-ico, .t-ico, .mp-ico, .r-ico, .fi-ico { background: var(--ic-bg); border: 2px solid var(--ic-bd); border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .el-ico { width: 46px; height: 46px; font-size: 22px; }
  .el-name { font-weight: 800; font-size: 13.5px; margin-bottom: 3px; }
  .el-def { font-size: 12.5px; line-height: 1.5; color: var(--ink-soft); }
  .el-ex { font-size: 12px; line-height: 1.5; color: var(--muted); font-style: italic; margin-top: 4px; }
  .flaw-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-bottom: 16px; }
  @media (max-width: 560px) { .flaw-grid { grid-template-columns: 1fr 1fr; } }
  .flaw-item { display: flex; align-items: center; gap: 8px; font-size: 11.5px; font-weight: 600; padding: 6px 9px; border-radius: 10px; border: 1.5px solid; }
  .flaw-item.bad { background: #FCF1EE; border-color: #E8B5A4; color: #7A2E1A; } .flaw-item.soft { background: #FEF6EA; border-color: #EBC995; color: #6B4A12; }
  .fi-ico { width: 26px; height: 26px; font-size: 14px; border-width: 1.5px; }
  .flaw-item.bad .fi-ico { --ic-bg: #F6DCD4; --ic-bd: #D9826A; } .flaw-item.soft .fi-ico { --ic-bg: #FBEBD6; --ic-bd: #E2A867; }

  .tiles-title { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 0.2px; margin: 12px 0 6px; }
  .tile { display: flex; gap: 10px; align-items: center; padding: 9px 11px; border-radius: 10px; border: 1.5px solid var(--line); background: #fff; margin-bottom: 6px; }
  .t-ico { width: 36px; height: 36px; font-size: 17px; }
  .t-body { flex: 1; min-width: 0; }
  .t-name { font-size: 12.5px; font-weight: 700; }
  .t-what { font-size: 11.5px; color: var(--muted); line-height: 1.4; }
  .t-mark { font-weight: 800; font-size: 16px; padding-left: 6px; }
  .tile.present { border-color: #8FC4B3; background: #F2FAF7; } .tile.present .t-mark { color: var(--green); }
  .tile.missing { border-style: dashed; background: #FAFAFB; } .tile.missing .t-ico { filter: grayscale(1); opacity: 0.5; } .tile.missing .t-name { color: var(--muted); } .tile.missing .t-mark { color: var(--red); }
  .tile.soft { border-color: #E2A867; background: #FEF6EA; } .tile.soft .t-mark { color: #A8741A; }
  .tile.flaw { border-color: #D9826A; background: #FCF1EE; } .tile.flaw .t-mark { color: var(--red); }

  .remind { margin-bottom: 14px; font-size: 12.5px; }
  .remind summary { cursor: pointer; font-weight: 700; color: var(--muted); }
  .remind-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .remind-item { display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px 4px 5px; border-radius: 20px; border: 1.5px solid var(--ic-bd); background: var(--ic-bg); font-weight: 700; font-size: 12px; }
  .r-ico { width: 24px; height: 24px; font-size: 13px; background: #fff; border-width: 1.5px; }

  .mp-row { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.12); }
  .mp-row:last-child { border-bottom: none; }
  .mp-ico { width: 34px; height: 34px; font-size: 16px; }
  .mp-text { font-size: 13.5px; line-height: 1.6; color: #DCE1F5; }
  .mp-tag { display: block; font-size: 10.5px; font-weight: 700; color: var(--gold-soft); letter-spacing: 0.3px; margin-bottom: 2px; }

  /* ---------- SBI game ---------- */
  .primer-letter.sbi-S { background: var(--ink); } .primer-letter.sbi-B { background: var(--gold); } .primer-letter.sbi-I { background: var(--green); }
  .sbi-grid { grid-template-columns: 1fr 1fr 1fr; }
  @media (max-width: 560px) { .sbi-grid { grid-template-columns: 1fr; } }

  .scenario-list { display: grid; gap: 10px; margin-bottom: 8px; }
  .scenario-card { display: flex; gap: 14px; align-items: center; text-align: left; padding: 14px 16px; border-radius: 14px; border: 1.5px solid var(--line); background: #fff; cursor: pointer; transition: all 0.15s ease; }
  .scenario-card:hover { border-color: var(--gold); background: var(--gold-soft); transform: translateY(-1px); }
  .sc-emoji { width: 46px; height: 46px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
  .sc-title { font-weight: 700; font-size: 14.5px; color: var(--ink); }
  .sc-sub { font-size: 12px; color: var(--muted); margin: 2px 0 6px; line-height: 1.4; }
  .sc-meta { font-size: 11.5px; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; }

  .person { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; color: #fff; flex-shrink: 0; }
  .avatar.D { background: var(--red); } .avatar.I { background: var(--gold); } .avatar.S { background: var(--green); } .avatar.C { background: var(--ink); }
  .p-info { flex: 1; min-width: 120px; }
  .p-name { font-weight: 700; font-size: 15px; }
  .p-sub { font-size: 11.5px; color: var(--muted); }
  .mood-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px 5px 8px; border-radius: 20px; font-size: 12px; font-weight: 700; border: 1.5px solid; }
  .mood-emoji { font-size: 15px; }
  .mood-chip.neutral { background: #EEF1FA; border-color: #C9D2EE; color: #3B4577; }
  .mood-chip.open { background: #DCEFE9; border-color: #8FC4B3; color: #1F5245; }
  .mood-chip.defensive { background: #F9E3C9; border-color: #E2A867; color: #7A4A0F; }
  .mood-chip.withdrawn { background: #F6DCD4; border-color: #D9826A; color: #7A2E1A; }
  .mood-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .mood-arrow { color: var(--muted); font-weight: 700; }

  .metrics { display: grid; gap: 9px; margin-bottom: 16px; }
  .m-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; margin-bottom: 4px; }
  .m-name { color: var(--ink-soft); font-weight: 600; }
  .m-val { font-weight: 800; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
  .m-delta { font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 10px; }
  .m-delta.up { background: #DCEFE9; color: #1F5245; } .m-delta.down { background: #F6DCD4; color: #7A2E1A; }
  .m-track { height: 8px; background: var(--line); border-radius: 6px; overflow: hidden; }
  .m-fill { height: 100%; border-radius: 6px; transition: width 0.5s ease; }

  .setup-box { margin-bottom: 14px; padding: 12px 14px; border-radius: 10px; background: var(--gold-soft); border: 1px solid #E5CE9B; font-size: 12.5px; line-height: 1.55; color: #5C4510; }
  .bubble { padding: 12px 15px; border-radius: 14px; font-size: 13.5px; line-height: 1.55; margin-bottom: 10px; max-width: 94%; }
  .bubble .b-who { font-size: 11px; font-weight: 700; margin-bottom: 3px; opacity: 0.75; }
  .bubble.emp { background: var(--surface); border: 1px solid var(--line); border-top-left-radius: 4px; color: var(--ink); }
  .bubble.emp.open { background: #E7F4EF; border-color: #8FC4B3; }
  .bubble.emp.defensive { background: #FBEBD6; border-color: #E2A867; }
  .bubble.emp.withdrawn { background: #F8E4DE; border-color: #D9826A; }
  .bubble.mgr { background: var(--ink); color: #fff; margin-left: auto; border-top-right-radius: 4px; }
  .mood-note { font-size: 12px; color: var(--muted); margin: -2px 0 12px; font-style: italic; }
  .retry-note { font-size: 12px; color: #7A4A0F; background: #F9E3C9; border-radius: 8px; padding: 7px 11px; margin-bottom: 10px; }
  .ctx-box { margin-bottom: 18px; padding: 10px 14px; border-left: 4px solid var(--gold); background: var(--surface); border-radius: 0 10px 10px 0; font-size: 13px; line-height: 1.5; color: var(--ink-soft); }

  .reply-list { display: grid; gap: 10px; }
  .reply-btn { display: flex; gap: 12px; align-items: flex-start; text-align: left; padding: 13px 15px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; cursor: pointer; transition: all 0.15s ease; font-size: 13.5px; line-height: 1.5; color: var(--ink); }
  .reply-btn:hover { border-color: var(--gold); background: var(--gold-soft); }
  .reply-num { width: 24px; height: 24px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--line); font-weight: 800; font-size: 11.5px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
  .reply-text { flex: 1; }

  .verdict-card { border-radius: 16px; padding: 20px 22px; color: #fff; margin-bottom: 18px; }
  .verdict-card.great { background: var(--green); } .verdict-card.partial { background: #A8741A; } .verdict-card.fail { background: var(--red); }
  .verdict-card .v-label { font-size: 11px; font-weight: 700; letter-spacing: 0.3px; opacity: 0.85; margin-bottom: 6px; }

  // Застосувати вибір. Повертає id наступного кроку, "repair" або "END"
  function applyChoice(sc, run, opt) {
    var node = nodeFor(sc, run);
    var isRepair = run.stepId === "repair";
    var before = { neutral: run.metrics.neutral, progress: run.metrics.progress, trustA: run.metrics.trustA, trustB: run.metrics.trustB };
    var after = {};
    Object.keys(before).forEach(function (k) { after[k] = clamp(before[k] + opt.fx[k]); });
    var moods = { A: opt.moods.A, B: opt.moods.B };
    if (moods.A === "open" && after.trustA < 35) moods.A = "neutral";
    if (moods.B === "open" && after.trustB < 35) moods.B = "neutral";
    var best = node.options.filter(function (x) { return x.best; })[0];
    var meta = isRepair ? { title: REPAIR_TITLE, icon: REPAIR_ICON } : node;
    var item = {
      stepId: run.stepId, stepTitle: meta.title, stepIcon: meta.icon,
      optionId: opt.id, style: opt.style, tactic: opt.tactic, kind: opt.kind, text: opt.text, replyA: opt.replyA, replyB: opt.replyB,
      why: opt.why, proto: opt.proto, tags: opt.tags.slice(), expected: best.tags.slice(), moods: moods, moodsBefore: { A: run.moods.A, B: run.moods.B },
      best: !!opt.best, bestStyle: best.style, bestTactic: best.tactic, bestText: best.text, bestWhy: best.why,
      delta: { neutral: after.neutral - before.neutral, progress: after.progress - before.progress, trustA: after.trustA - before.trustA, trustB: after.trustB - before.trustB }, after: after
    };
    run.history.push(item);
    run.metrics = after;
    run.series.push({ neutral: after.neutral, progress: after.progress, trustA: after.trustA, trustB: after.trustB });
    run.moods = moods;
    run.lastReply = { A: opt.replyA, B: opt.replyB };
    (opt.learnA || []).forEach(function (id) { run.learned.A[id] = true; });
    (opt.learnB || []).forEach(function (id) { run.learned.B[id] = true; });
    if (opt.deal) run.deal = opt.deal;
    var next;
    if (after.trustA <= 15) { run.exit = "A"; next = "END"; }
    else if (after.trustB <= 15) { run.exit = "B"; next = "END"; }
    else if (after.neutral <= 15) { run.exit = "neutral"; next = "END"; }
    else if (isRepair) {
      next = run.repairReturn;
    } else {
      var idx = stepIdx(sc, run.stepId);
      var failed = isTense(moods.A) || isTense(moods.B);
      var hasNext = idx + 1 < sc.steps.length;
      if (node.canRepair && !run.repairUsed && failed && hasNext) {
        run.repairUsed = true; run.repairReturn = sc.steps[idx + 1].id; next = "repair";
      } else {
        next = hasNext ? sc.steps[idx + 1].id : "END";
      }
    }
    if (next !== "END") run.stepId = next;
    return next;
  }

  function summarize(sc, run) {
    var counts = {}; STYLE_ORDER.forEach(function (k) { counts[k] = 0; });
    var kinds = { best: 0, neutral: 0, bad: 0 };
    var cx = 0, sides = [];
    run.history.forEach(function (h) {
      counts[h.style] += 1; kinds[h.kind] += 1;
      if (h.tags.indexOf("partisan") !== -1 || h.tags.indexOf("judge") !== -1) sides.push(h);
    });
    var n = run.history.length || 1;
    var dominant = STYLE_ORDER.slice().sort(function (a, b) { return counts[b] - counts[a]; })[0];
    var m = run.metrics;
    var gap = Math.abs(m.trustA - m.trustB);
    var neutralKept = m.neutral >= 60 && gap <= 25 && !run.exit;
    var dealFinal = run.exit ? "walkout" : (run.deal === "full" && m.progress < 55 ? "weak" : (run.deal || "none"));
    var score = Math.round((m.neutral + m.progress + m.trustA + m.trustB) / 4);
    var minTrust = Math.min(m.trustA, m.trustB);
    var level = dealFinal === "walkout" ? "walkout" : (dealFinal === "none" ? "fail" : ((dealFinal === "full" && neutralKept && minTrust >= 55) ? "great" : "partial"));

    var learnedB = sc.interests.B.filter(function (i) { return run.learned.B[i.id]; });
    var unknownA = sc.interests.A.filter(function (i) { return !run.learned.A[i.id]; });
    var unknownB = sc.interests.B.filter(function (i) { return !run.learned.B[i.id]; });
    return { counts: counts, kinds: kinds, dominant: dominant, total: run.history.length, score: score, deal: dealFinal, level: level,

      learnedA: learnedA, learnedB: learnedB, unknownA: unknownA, unknownB: unknownB };
  }

  function renderTalk() {
    var sc = currentScenario(), run = state.run, node = nodeFor(sc, run);
    var first = run.history.length === 0;
    var isRepair = run.stepId === "repair";
    var title = isRepair ? REPAIR_TITLE : node.title, icon = isRepair ? REPAIR_ICON : node.icon;
    var options = state.optionOrder.map(function (id) { return node.options.filter(function (x) { return x.id === id; })[0]; });
    var opts = options.map(function (op, i) {
      return '<button class="reply-btn" data-id="' + op.id + '"><span class="reply-num">' + String.fromCharCode(65 + i) + '</span><span class="reply-body"><span class="reply-tactic">' + escHtml(op.tactic) + '</span><span class="reply-text">' + escHtml(op.text) + '</span></span></button>';
    }).join("");
    var remind = '<details class="remind"><summary>Нагадування: шість кроків медіації</summary><div class="remind-row">' +
      sc.steps.map(function (st) { return '<div class="remind-item el-frame"><span class="r-ico">' + st.icon + '</span><span>' + st.title + '</span></div>'; }).join("") + '</div></details>';
    var notes = first ? "" : '<div class="mood-note">' + moodNote(sc, "A", run.moods.A) + ' ' + moodNote(sc, "B", run.moods.B) + '</div>';
    var card = el(
      '<div class="stage-wrap"><div class="card">' +
      stepperHtml(sc, run) +
      '<p class="step-count">' + sc.emoji + ' ' + sc.title + ' · Крок ' + (stepIndexForRun(sc, run) + 1) + ' із ' + sc.steps.length + ' · ' + icon + ' ' + title + '</p>' +
      personsRow(sc, run.moods) +
      metricsHtml(sc, run, null) +
      (first ? '<div class="setup-box"><b>Ситуація.</b> ' + sc.setup + '</div>' + briefHtml(sc) : "") +
      dualBubbles(sc, first ? { A: sc.openingA, B: sc.openingB } : run.lastReply, null) +
      notes +
      '<div class="ctx-box">' + node.ctx + '</div>' +
      remind +
      '<label class="field-label">Що ви зробите як посередник?</label>' +
      '<div class="reply-list">' + opts + '</div>' +
      '</div></div>'
    );
    card.querySelectorAll(".reply-btn").forEach(function (b) {
      b.addEventListener("click", function () {
        var opt = node.options.filter(function (x) { return x.id === b.getAttribute("data-id"); })[0];
        var prevMoods = { A: run.moods.A, B: run.moods.B };
        var next = applyChoice(sc, run, opt);
        state.lastItem = run.history[run.history.length - 1];
        state.lastItem.prevMoods = prevMoods; state.nextNode = next;
        state.screen = "reaction"; render();
      });
    });
    return card;
  }

  function liveFeedbackHtml(it) {
    return '<div class="fb-live ' + KIND_META[it.kind].cls + '">' +
      '<div class="fb-live-title">Розбір вашої дії</div>' +
      '<div class="kind-row"><span class="kind-badge ' + KIND_META[it.kind].cls + '">' + KIND_META[it.kind].label + '</span></div>' +
      feedbackTilesHtml(it) +
      '<p class="sc-why">' + escHtml(it.why) + '</p>' +
      (it.kind === "best" ? "" : '<p class="fb-hint">Яка дія й репліка були б відмінними, дізнаєтеся в детальному розборі в кінці.</p>') +
      '</div>';
  }

  function renderReaction() {
    var sc = currentScenario(), run = state.run, it = state.lastItem;
    var isEnd = state.nextNode === "END";
    var repairNext = state.nextNode === "repair";
    var cta = isEnd ? "Переглянути результат →" : "Продовжити медіацію →";
    var chips = '<div class="mood-row dual-moods">' + ["A", "B"].map(function (p) {
      var ch = it.prevMoods[p] !== it.moods[p] ? moodChip(sc, p, it.prevMoods[p]) + '<span class="mood-arrow">→</span>' + moodChip(sc, p, it.moods[p]) : moodChip(sc, p, it.moods[p]);
      return '<div class="mc-col"><span class="mc-name">' + sc.parties[p].name + '</span>' + ch + '</div>';
    }).join("") + '</div>';
    var card = el(
      '<div class="stage-wrap"><div class="card">' +
      '<p class="step-count">' + sc.emoji + ' ' + sc.title + ' · ' + it.stepIcon + ' ' + it.stepTitle + '</p>' +
      '<div class="bubble mgr"><div class="b-who">Ви · ' + escHtml(it.tactic) + '</div>' + escHtml(it.text) + '</div>' +
      dualBubbles(sc, { A: it.replyA, B: it.replyB }, it.moods) +

      '</div></div>'
    );
    card.querySelector("#next-btn").addEventListener("click", function () {
      if (isEnd) { state.screen = "verdict"; render(); saveResultToStorage(); }
      else { prepareNode(); state.screen = "talk"; render(); }
    });
    return card;
  }

  function chartSvg(sc, series) {
    var defs = metricDefs(sc);
    var W = 320, H = 130, padL = 26, padR = 10, padT = 10, padB = 20;
    var n = series.length, stepX = n > 1 ? (W - padL - padR) / (n - 1) : 0;
    function X(i) { return padL + i * stepX; }
    function Y(v) { return padT + (H - padT - padB) * (1 - v / 100); }
    var grid = [0, 50, 100].map(function (gv) {
      return '<line x1="' + padL + '" y1="' + Y(gv) + '" x2="' + (W - padR) + '" y2="' + Y(gv) + '" stroke="#DDE4F5" stroke-width="1"/><text x="' + (padL - 6) + '" y="' + (Y(gv) + 3) + '" font-size="9" fill="#5B6685" text-anchor="end">' + gv + '</text>';
    }).join("");
    var lines = defs.map(function (mt) {
      var pts = series.map(function (s, i) { return X(i) + "," + Y(s[mt.key]); }).join(" ");
      var dots = series.map(function (s, i) { return '<circle cx="' + X(i) + '" cy="' + Y(s[mt.key]) + '" r="2.4" fill="' + mt.color + '"/>'; }).join("");
      return '<polyline points="' + pts + '" fill="none" stroke="' + mt.color + '" stroke-width="2"/>' + dots;
    }).join("");
    var xl = series.map(function (s, i) { return '<text x="' + X(i) + '" y="' + (H - 6) + '" font-size="9" fill="#5B6685" text-anchor="middle">' + (i === 0 ? "старт" : i) + '</text>'; }).join("");
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Динаміка показників">' + grid + lines + xl + '</svg>' +
      '<div class="chart-legend">' + defs.map(function (mt) { return '<span><i style="background:' + mt.color + '"></i>' + mt.label + '</span>'; }).join("") + '</div>';
  }

  function checkCardsHtml(sc, run, sum) {
    var m = run.metrics;
    var nOk = sum.neutralKept;
    var dealTxt = sum.deal === "full" ? "Сторони дійшли згоди" : sum.deal === "weak" ? "Згода часткова або загальна" : sum.deal === "walkout" ? "Медіацію перервано, згоди немає" : "Згоди немає";
    var dealCls = sum.deal === "full" ? "ok" : sum.deal === "weak" ? "mid" : "no";
    var dealIco = sum.deal === "full" ? "✓" : sum.deal === "weak" ? "≈" : "✕";
    var why = nOk ? "Нейтральність " + m.neutral + " (потрібно від 60), різниця довіри " + sum.gap + " (не більш як 25)."
      : (run.exit ? "Нейтральність " + m.neutral + ", медіацію перервано." : (m.neutral < 60 ? "Нейтральність " + m.neutral + " нижча за 60. " : "") + (sum.gap > 25 ? "Довіра сторін розбіглась на " + sum.gap + " (дозволено 25)." : ""));
    return '<div class="check-cards">' +
      '<div class="check-card ' + (nOk ? "ok" : "no") + '"><div class="cc-ico">⚖️</div><div class="cc-body"><div class="cc-title">' + (nOk ? "✓ Нейтральність збережено" : "✕ Нейтральність втрачено") + '</div><div class="cc-text">' + why + '</div></div></div>' +
      '<div class="check-card ' + dealCls + '"><div class="cc-ico">🤝</div><div class="cc-body"><div class="cc-title">' + dealIco + ' ' + dealTxt + '</div><div class="cc-text">Прогрес до вирішення: ' + m.progress + ' зі 100.</div></div></div></div>';
  }

  function trustBalanceHtml(sc, run, sum) {
    var m = run.metrics;
    return '<label class="field-label">Баланс довіри сторін</label><div class="balance-box">' +
      '<div class="bal-row"><span class="bal-name">' + sc.parties.A.name + '</span><div class="bal-track"><div class="bal-fill a" style="width:' + m.trustA + '%"></div></div><span class="bal-num">' + m.trustA + '</span></div>' +
      '<div class="bal-row"><span class="bal-name">' + sc.parties.B.name + '</span><div class="bal-track"><div class="bal-fill b" style="width:' + m.trustB + '%"></div></div><span class="bal-num">' + m.trustB + '</span></div>' +
      '<div class="bal-note">Різниця довіри: <b>' + sum.gap + '</b> ' + (sum.gap <= 25 ? "(у межах норми)" : "(забагато: одна сторона відчула перекіс)") + '</div></div>';
  }

  function timelineHtml(run) {
    return '<label class="field-label">Нейтральність по кроках</label><div class="timeline">' + run.history.map(function (h, i) {
      var d = h.delta.neutral;
      var cls = d > 0 ? "up" : d < 0 ? "down" : "same";
      return '<div class="tl-item ' + cls + '"><div class="tl-ico">' + h.stepIcon + '</div><div class="tl-d">' + (d > 0 ? "+" + d : d < 0 ? "−" + Math.abs(d) : "0") + '</div><div class="tl-lab">' + (i + 1) + '</div></div>';
    }).join("") + '</div>';
  }

  function styleBarsHtml(sum) {
    var total = sum.total || 1;
    return '<div class="style-bars">' + STYLE_ORDER.map(function (k) {
      var st = STYLES[k], c = sum.counts[k], pct = Math.round(c / total * 100);
      return '<div class="sb-row ' + (k === sum.dominant && c > 0 ? "dom" : "") + '"><div class="sb-lab">' + st.icon + ' ' + st.name + '</div>' +
        '<div class="sb-track"><div class="sb-fill ' + st.cls + '" style="width:' + pct + '%"></div></div><div class="sb-num">' + c + ' · ' + pct + '%</div></div>';
    }).join("") + '</div>';
  }
  function profileHtml(sum) {
    var dom = STYLES[sum.dominant];
    return '<label class="field-label">Ваш профіль посередника</label><div class="tki-analysis">' + styleBarsHtml(sum) +
      '<div class="dom-box ' + dom.cls + '" style="margin-top:12px;"><div class="dom-title">' + dom.icon + ' Домінує: ' + dom.name + ' (' + sum.counts[sum.dominant] + ' із ' + sum.total + ' кроків)</div>' +
      '<p>' + dom.def + ' <b>Доречно:</b> ' + dom.when + ' <b>Ризик:</b> ' + dom.risk + '</p><p class="dom-advice">' + dom.advice + '</p></div>' +
      '<div class="fit-row">Відмінних дій: <b>' + sum.kinds.best + ' із ' + sum.total + '</b> (' + sum.bestPct + '%)</div></div>';
  }

  // ---------- Підсумок медіації (угода сторін) ----------
  function summaryData(sc, run, sum) {
    var d = new Date();
    var date = ("0" + d.getDate()).slice(-2) + "." + ("0" + (d.getMonth() + 1)).slice(-2) + "." + d.getFullYear();
    var A = sc.parties.A, B = sc.parties.B, deal = sum.deal, result, terms, next, kind;
    if (deal === "walkout") { result = walkoutText(sc, run) + " Згоди не досягнуто."; terms = sc.deals.none; next = sc.nextSteps.none; kind = "none"; }
    else if (deal === "none") { result = "Домовленості не досягнуто."; terms = sc.deals.none; next = sc.nextSteps.none; kind = "none"; }
    else if (deal === "weak") { result = "Досягнуто загальної домовленості без конкретних умов. Потрібне доопрацювання."; terms = sc.deals.weak; next = sc.nextSteps.weak; kind = "weak"; }
    else { result = "Сторони дійшли згоди, яку напрацювали самостійно."; terms = sc.deals.full; next = sc.nextSteps.full; kind = "full"; }
    var neutralText = sum.neutralKept ? "Нейтральність посередника збережено." : "Нейтральність посередника втрачено" + (sum.sides.length ? ": " + sum.sides.map(function (h) { return h.stepTitle; }).join(", ") + "." : ".");
    return { date: date, subject: sc.title + " — " + sc.topic,
      parties: [A.name + ", " + A.role, B.name + ", " + B.role],
      mediator: state.studentName || "керівник/ця команди",
      positions: [A.name + ": " + sc.positions.A, B.name + ": " + sc.positions.B],
      learnedA: sum.learnedA.map(function (i) { return i.text; }), learnedB: sum.learnedB.map(function (i) { return i.text; }),
      unknownA: sum.unknownA.map(function (i) { return i.text; }), unknownB: sum.unknownB.map(function (i) { return i.text; }),
      steps: run.history.map(function (h, i) { return { n: i + 1, title: h.stepTitle, style: STYLES[h.style].name, line: h.proto }; }),
      result: result, kind: kind, terms: terms, neutralText: neutralText, next: next };
  }
  function summaryText(sc, run, sum) {
    var p = summaryData(sc, run, sum), A = sc.parties.A, B = sc.parties.B, L = [];
    L.push("ПІДСУМОК МЕДІАЦІЇ"); L.push("Тема: " + p.subject); L.push("Дата: " + p.date);
    L.push("Сторони:"); p.parties.forEach(function (x) { L.push("  — " + x); });
    L.push("Посередник: " + p.mediator); L.push("");
    L.push("1. ПОЗИЦІЇ СТОРІН"); p.positions.forEach(function (x) { L.push("  — " + x); }); L.push("");
    L.push("2. ІНТЕРЕСИ СТОРІН");
    L.push("  " + A.name + ":"); if (p.learnedA.length) p.learnedA.forEach(function (x) { L.push("    · " + x); }); else L.push("    · не з'ясовано");
    if (p.unknownA.length) { L.push("    Не з'ясовано:"); p.unknownA.forEach(function (x) { L.push("    · " + x); }); }
    L.push("  " + B.name + ":"); if (p.learnedB.length) p.learnedB.forEach(function (x) { L.push("    · " + x); }); else L.push("    · не з'ясовано");
    if (p.unknownB.length) { L.push("    Не з'ясовано:"); p.unknownB.forEach(function (x) { L.push("    · " + x); }); }
    L.push("");
    L.push("3. ПРОЦЕС МЕДІАЦІЇ"); p.steps.forEach(function (s) { L.push("  " + s.n + ") " + s.title + " [" + s.style + "]: " + s.line); }); L.push("");
    L.push("4. РЕЗУЛЬТАТ"); L.push("  " + p.result); L.push("  Умови:"); p.terms.forEach(function (x) { L.push("    · " + x); }); L.push("");
    L.push("5. НЕЙТРАЛЬНІСТЬ ПОСЕРЕДНИКА"); L.push("  " + p.neutralText); L.push("");
    L.push("6. НАСТУПНІ КРОКИ"); p.next.forEach(function (x) { L.push("  — " + x); }); L.push("");
    L.push("7. ПІДПИСИ"); L.push("  " + A.name + ": ____________   " + B.name + ": ____________   Посередник: ____________");
    return L.join("\n");
  }
  function summaryHtml(sc, run, sum) {
    var p = summaryData(sc, run, sum), A = sc.parties.A, B = sc.parties.B;
    function ul(a) { return '<ul>' + a.map(function (x) { return '<li>' + escHtml(x) + '</li>'; }).join("") + '</ul>'; }
    return '<div class="proto-doc">' +
      '<div class="pd-head"><div class="pd-title">ПІДСУМОК МЕДІАЦІЇ</div><div class="pd-sub">' + escHtml(p.subject) + ' · ' + p.date + '</div></div>' +
      '<div class="pd-sec"><b>Сторони</b>' + ul(p.parties) + '<div>Посередник: ' + escHtml(p.mediator) + '</div></div>' +
      '<div class="pd-sec"><b>1. Позиції сторін</b>' + ul(p.positions) + '</div>' +
      '<div class="pd-sec"><b>2. Інтереси сторін</b>' +
        '<div class="pd-label">' + escHtml(A.name) + '</div>' + (p.learnedA.length ? ul(p.learnedA) : '<ul><li>не з’ясовано</li></ul>') + (p.unknownA.length ? '<div class="pd-label warn">Не з’ясовано</div>' + ul(p.unknownA) : '') +
        '<div class="pd-label">' + escHtml(B.name) + '</div>' + (p.learnedB.length ? ul(p.learnedB) : '<ul><li>не з’ясовано</li></ul>') + (p.unknownB.length ? '<div class="pd-label warn">Не з’ясовано</div>' + ul(p.unknownB) : '') + '</div>' +
      '<div class="pd-sec"><b>3. Процес медіації</b><ol>' + p.steps.map(function (s) { return '<li><b>' + escHtml(s.title) + '</b> <span class="pd-style">' + escHtml(s.style) + '</span>: ' + escHtml(s.line) + '</li>'; }).join("") + '</ol></div>' +
      '<div class="pd-sec"><b>4. Результат</b><p class="pd-res ' + p.kind + '">' + escHtml(p.result) + '</p><div class="pd-label">Умови</div>' + ul(p.terms) + '</div>' +
      '<div class="pd-sec"><b>5. Нейтральність посередника</b><div>' + escHtml(p.neutralText) + '</div></div>' +
      '<div class="pd-sec"><b>6. Наступні кроки</b>' + ul(p.next) + '</div>' +
      '<div class="pd-sec pd-sign"><b>7. Підписи</b><div>' + escHtml(A.name) + ': ____________ &nbsp; ' + escHtml(B.name) + ': ____________ &nbsp; Посередник: ____________</div></div></div>';
  }

  function historyHtml(run, sc) {
    return run.history.map(function (h, i) {
      return '<div class="step-card ' + KIND_META[h.kind].cls + '">' +
        '<div class="sc-head"><span class="sc-n">' + (i + 1) + '</span><b>' + h.stepIcon + ' ' + h.stepTitle + '</b><span class="sc-mood">⚖️ ' + (h.delta.neutral > 0 ? "+" : "") + (h.delta.neutral < 0 ? "−" + Math.abs(h.delta.neutral) : h.delta.neutral) + '</span></div>' +
        '<div class="kind-row"><span class="kind-badge ' + KIND_META[h.kind].cls + '">' + KIND_META[h.kind].label + '</span> ' + styleChip(h.style) + '</div>' +

        (h.kind === "best" ? "" : '<div class="sc-best"><b>Відмінною була б така дія: ' + STYLES[h.bestStyle].icon + ' ' + STYLES[h.bestStyle].name + ' — ' + escHtml(h.bestTactic) + '.</b> «' + escHtml(h.bestText) + '» ' + escHtml(h.bestWhy) + '</div>') +
        '</div>';
    }).join("");
  }
  function interestsHtml(sc, run) {
    return ["A", "B"].map(function (p) {
      return '<div class="pd-label" style="margin:8px 0 4px;">' + escHtml(sc.parties[p].name) + '</div><div class="int-list">' + sc.interests[p].map(function (i) {
        var ok = !!run.learned[p][i.id];

      }).join("") + '</div>';

  function renderVerdict() {
    var sc = currentScenario(), run = state.run, sum = summarize(sc, run);
    var v = VERDICTS[sum.level];
    var vText = sum.level === "walkout" ? walkoutText(sc, run) : v.text;
    var saveNote = "";
    if (state.saveStatus === "saving") saveNote = "Зберігаємо результат…";
    else if (state.saveStatus === "saved") saveNote = "Результат збережено.";
    else if (state.saveStatus === "failed") saveNote = "Результат сформовано, але не вдалося зберегти для викладача.";
    var card = el(
      '<div class="stage-wrap"><div class="card">' +
      '<p class="kicker" style="text-align:center;">' + (state.studentName ? escHtml(state.studentName) + " · " : "") + sc.emoji + ' ' + sc.title + '</p>' +
      '<div class="verdict-card ' + sum.level + '"><div class="v-label">Результат медіації</div><div class="v-title">' + v.label + '</div><p>' + vText + '</p>' +
        '<div class="v-score"><span>' + sum.score + '</span> / 100 · відмінних дій: ' + sum.kinds.best + ' · нейтральних: ' + sum.kinds.neutral + ' · непідходящих: ' + sum.kinds.bad + '</div></div>' +
      checkCardsHtml(sc, run, sum) +
      personsRow(sc, run.moods) +
      metricsHtml(sc, run, null) +
      '<label class="field-label">Динаміка показників</label><div class="chart-box">' + chartSvg(sc, run.series) + '</div>' +
      trustBalanceHtml(sc, run, sum) +
      timelineHtml(run) +
      profileHtml(sum) +
      '<div class="next-box"><div class="nb-title">Що далі?</div>' +
        '<p>Спробуйте ще раз: варіанти дій розташовані по-іншому, а сторони можуть відреагувати інакше. Або оберіть інший конфлікт. Підсумок медіації для звіту нижче.</p>' +
        '<div class="result-actions">' +
          '<button class="btn btn-primary" id="retry-btn">Пройти ще раз</button>' +
          '<button class="btn btn-secondary" id="other-btn">Інший конфлікт</button>' +
          '<button class="btn btn-secondary" id="copy-sum-btn">Скопіювати підсумок</button>' +
        '</div></div>' +
      '<details class="deep"><summary>Підсумок медіації (готовий для звіту)</summary><div class="deep-body">' +
        summaryHtml(sc, run, sum) +
        '<div class="result-actions"><button class="btn btn-secondary" id="copy-sum-btn2">Скопіювати підсумок</button><button class="btn btn-secondary" id="download-btn">Завантажити .txt</button></div>' +
      '</div></details>' +
      '<details class="deep"><summary>Показати детальний розбір ситуації</summary><div class="deep-body">' +
        '<p class="deep-lead">Тут ви побачите, які дії були б відмінними на кожному кроці, і приклади реплік. Якщо хочете пройти гру без підказок, пропустіть цей розділ і запустіть її ще раз.</p>' +
        '<label class="field-label">Розбір ваших дій по кроках</label>' + historyHtml(run, sc) +
        '<label class="field-label">Інтереси сторін</label>' + interestsHtml(sc, run) +
        '<div class="note-box"><b>Чому сторони реагували саме так.</b> ' + sc.partyNote + '</div>' +
      '</div></details>' +
      (saveNote ? '<p class="save-note">' + saveNote + '</p>' : "") +
      '<textarea id="copy-fallback-area" style="display:none;margin-top:12px;width:100%;min-height:140px;padding:10px;border-radius:10px;border:1.5px solid var(--line);font-size:11.5px;color:var(--muted);background:var(--surface);" readonly>' + escHtml(summaryText(sc, run, sum)) + '</textarea>' +
      '<button class="teacher-link" id="teacher-link">Перегляд результатів групи (для викладача)</button>' +
      '</div></div>'
    );
    card.querySelector("#retry-btn").addEventListener("click", function () { startScenario(state.scenarioId); });
    card.querySelector("#other-btn").addEventListener("click", function () { state.screen = "intro"; render(); });
    function copyS(e) { copyToClipboard(summaryText(sc, run, sum), e.currentTarget, "Скопіювати підсумок"); }
    card.querySelector("#copy-sum-btn").addEventListener("click", copyS);
    card.querySelector("#copy-sum-btn2").addEventListener("click", copyS);
    card.querySelector("#download-btn").addEventListener("click", function () { downloadText("mediation-" + sc.id + ".txt", summaryText(sc, run, sum)); });
    card.querySelector("#teacher-link").addEventListener("click", function () { state.screen = "teacher"; render(); loadTeacherRows(); });
    return card;
  }

  // ---------- Експорт, збереження, викладач ----------
  function downloadText(name, text) {
    var blob = new Blob(["\uFEFF" + text], { type: "text/plain;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a"); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  }
  function copyToClipboard(text, btn, label) {
    function ok() { btn.textContent = "Скопійовано ✓"; setTimeout(function () { btn.textContent = label; }, 1800); }
    function fail() { var ta = document.getElementById("copy-fallback-area"); if (ta) { ta.style.display = "block"; ta.focus(); ta.select(); } }
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(ok).catch(fail); }
    else {
      try {
        var temp = document.createElement("textarea"); temp.value = text; temp.style.position = "fixed"; temp.style.opacity = "0";
        document.body.appendChild(temp); temp.focus(); temp.select();
        var success = document.execCommand("copy"); document.body.removeChild(temp);
        if (success) ok(); else fail();
      } catch (e) { fail(); }
    }
  }

  function saveResultToStorage() {
    if (!window.storage) return;
    var sc = currentScenario(), run = state.run, sum = summarize(sc, run), v = VERDICTS[sum.level];
    state.saveStatus = "saving";
    var key = STORAGE_PREFIX + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
    var payload = {
      name: state.studentName || "Анонім", scenarioId: sc.id, scenarioTitle: sc.title,
      neutral: run.metrics.neutral, progress: run.metrics.progress, trustA: run.metrics.trustA, trustB: run.metrics.trustB,
      score: sum.score, level: sum.level, verdict: v.label, deal: sum.deal, neutralKept: sum.neutralKept, gap: sum.gap,
      styles: sum.counts, dominant: sum.dominant, kinds: sum.kinds, bestPct: sum.bestPct,
      path: run.history.map(function (h) { return { stepId: h.stepId, optionId: h.optionId, style: h.style, kind: h.kind }; }),
      timestamp: Date.now()
    };
    window.storage.set(key, JSON.stringify(payload), true).then(function (r) {
      state.saveStatus = r ? "saved" : "failed"; render();
    }).catch(function () { state.saveStatus = "failed"; render(); });
  }

  function loadTeacherRows() {
    state.teacherLoading = true; render();
    if (!window.storage) { state.teacherRows = []; state.teacherLoading = false; render(); return; }
    window.storage.list(STORAGE_PREFIX, true).then(function (listRes) {
      var keys = (listRes && listRes.keys) || [];
      if (keys.length === 0) { state.teacherRows = []; state.teacherLoading = false; render(); return; }
      var promises = keys.map(function (k) {
        return window.storage.get(k, true).then(function (r) { try { return JSON.parse(r.value); } catch (e) { return null; } }).catch(function () { return null; });
      });
      Promise.all(promises).then(function (rows) {
        rows = rows.filter(Boolean).sort(function (a, b) { return b.timestamp - a.timestamp; });
        state.teacherRows = rows; state.teacherLoading = false; render();
      });
    }).catch(function () { state.teacherRows = []; state.teacherLoading = false; render(); });
  }

  function csvEscape(t) { return '"' + String(t).replace(/"/g, '""') + '"'; }
  function downloadCsv() {
    var rows = state.teacherRows || [];
    var header = ["Ім'я", "Конфлікт", "Нейтральність", "Прогрес", "Довіра A", "Довіра B", "Різниця довіри", "Бал", "Результат", "Згода", "Нейтральність збережено"]
      .concat(STYLE_ORDER.map(function (k) { return STYLES[k].name; }))
      .concat(["Домінуючий стиль", "Відмінних", "Нейтральних", "Непідходящих", "Дата"]);
    var lines = [header.map(csvEscape).join(";")];
    rows.forEach(function (r) {
      var st = r.styles || {}, k = r.kinds || {};
      lines.push([csvEscape(r.name), csvEscape(r.scenarioTitle), r.neutral, r.progress, r.trustA, r.trustB, r.gap, r.score, csvEscape(r.verdict), csvEscape(r.deal), r.neutralKept ? "так" : "ні"]
        .concat(STYLE_ORDER.map(function (s) { return st[s] || 0; }))
        .concat([csvEscape(r.dominant && STYLES[r.dominant] ? STYLES[r.dominant].name : ""), k.best || 0, k.neutral || 0, k.bad || 0, csvEscape(new Date(r.timestamp).toLocaleString("uk-UA"))]).join(";"));
    });
    downloadText("conflict-mediator-results.csv", lines.join("\n"));
  }

  function teacherStatsHtml(rows) {
    var out = "";
    SCENARIOS.forEach(function (sc) {
      var rs = rows.filter(function (r) { return r.scenarioId === sc.id; });
      if (rs.length === 0) return;
      var n = rs.length;
      function avg(f) { return Math.round(rs.reduce(function (s, r) { return s + (r[f] || 0); }, 0) / n); }
      function pct(f) { return Math.round(rs.filter(f).length / n * 100) + "%"; }
      var levels = { great: 0, partial: 0, fail: 0, walkout: 0 };
      rs.forEach(function (r) { if (levels.hasOwnProperty(r.level)) levels[r.level] += 1; });
      var styleAvg = STYLE_ORDER.map(function (k) {
        var tot = 0, cnt = 0;
        rs.forEach(function (r) { var s = r.styles || {}; var all = STYLE_ORDER.reduce(function (a, x) { return a + (s[x] || 0); }, 0); if (all) { tot += (s[k] || 0) / all; cnt += 1; } });
        return '<td>' + (cnt ? Math.round(tot / cnt * 100) : 0) + '%</td>';
      }).join("");
      var stepStats = {};
      rs.forEach(function (r) { (r.path || []).forEach(function (p) {
        if (p.stepId === "repair") return;
        var s = stepStats[p.stepId] = stepStats[p.stepId] || { n: 0, best: 0, neutral: 0, bad: 0, styles: {} };
        s.n += 1; s[p.kind] += 1; s.styles[p.style] = (s.styles[p.style] || 0) + 1;
      }); });
      var stepRows = sc.steps.filter(function (st) { return stepStats[st.id]; }).map(function (st) {
        var s = stepStats[st.id], top = null;
        Object.keys(s.styles).forEach(function (k) { if (!top || s.styles[k] > s.styles[top]) top = k; });
        return '<tr><td>' + st.icon + ' ' + st.title + '</td><td>' + Math.round(s.best / s.n * 100) + '%</td><td>' + Math.round(s.neutral / s.n * 100) + '%</td><td>' + Math.round(s.bad / s.n * 100) + '%</td><td>' + (top ? STYLES[top].icon + ' ' + STYLES[top].name : "—") + '</td></tr>';
      }).join("");
      out += '<label class="field-label" style="margin-top:22px;">' + sc.emoji + ' ' + sc.title + ' · ' + n + ' проходжень</label>' +
        '<div class="table-scroll"><table class="results-table"><thead><tr><th>Нейтральність</th><th>Прогрес</th><th>Довіра ' + sc.parties.A.name + '</th><th>Довіра ' + sc.parties.B.name + '</th><th>Бал</th></tr></thead><tbody><tr><td>' + avg("neutral") + '</td><td>' + avg("progress") + '</td><td>' + avg("trustA") + '</td><td>' + avg("trustB") + '</td><td>' + avg("score") + '</td></tr></tbody></table></div>' +
        '<div class="note-box" style="margin-top:10px;">Нейтральність збережено: ' + pct(function (r) { return r.neutralKept; }) + '. Згода досягнута (повна чи часткова): ' + pct(function (r) { return r.deal === "full" || r.deal === "weak"; }) + '. Результати: згода й нейтральність — ' + levels.great + ', згода з застереженнями — ' + levels.partial + ', згоди немає — ' + levels.fail + ', медіацію перервано — ' + levels.walkout + '.</div>' +
        '<div class="table-scroll"><table class="results-table"><thead><tr>' + STYLE_ORDER.map(function (k) { return '<th>' + STYLES[k].icon + '</th>'; }).join("") + '</tr></thead><tbody><tr>' + styleAvg + '</tr></tbody></table></div>' +
        '<div class="table-scroll"><table class="results-table"><thead><tr><th>Крок</th><th>Відмінна</th><th>Нейтральна</th><th>Непідходяща</th><th>Найчастіша поведінка</th></tr></thead><tbody>' + stepRows + '</tbody></table></div>';
    });
    return out;
  }

  function renderTeacher() {
    var rows = state.teacherRows;
    var bodyHtml;
    if (state.teacherLoading) bodyHtml = '<p class="empty-note">Завантаження результатів…</p>';
    else if (!rows || rows.length === 0) bodyHtml = '<p class="empty-note">Поки що ніхто не пройшов гру за цим посиланням.</p>';
    else {
      var trs = rows.map(function (r) {
        return '<tr><td>' + escHtml(r.name) + '</td><td>' + escHtml(r.scenarioTitle || "") + '</td><td>' + r.score + '</td><td>' + escHtml(r.verdict || "") + '</td><td>' + (r.neutralKept ? "✓" : "✕") + '</td><td>' + new Date(r.timestamp).toLocaleString("uk-UA") + '</td></tr>';
      }).join("");
      bodyHtml = '<div class="table-scroll"><table class="results-table"><thead><tr><th>Студент</th><th>Конфлікт</th><th>Бал</th><th>Результат</th><th>Нейтральність</th><th>Дата</th></tr></thead><tbody>' + trs + '</tbody></table></div>' + teacherStatsHtml(rows);
    }
    var card = el(
      '<div class="stage-wrap"><div class="card">' +
      '<div class="teacher-header"><h1 class="title serif" style="margin:0;font-size:22px;">Результати групи</h1><button class="icon-btn" id="refresh-btn">Оновити</button></div>' +
      bodyHtml +
      '<div class="result-actions"><button class="btn btn-secondary" id="csv-btn"' + ((!rows || rows.length === 0) ? " disabled" : "") + '>Завантажити CSV</button><button class="btn btn-secondary" id="back-btn">← Назад</button></div>' +
      '</div></div>'
    );
    card.querySelector("#refresh-btn").addEventListener("click", loadTeacherRows);
    card.querySelector("#back-btn").addEventListener("click", function () { state.screen = state.run && state.run.history.length && state.nextNode === "END" ? "verdict" : "intro"; render(); });
    var csvBtn = card.querySelector("#csv-btn");
    if (csvBtn && rows && rows.length > 0) csvBtn.addEventListener("click", downloadCsv);
    return card;
  }

  function render() {
    app.innerHTML = "";
    var view;
    if (state.screen === "intro") view = renderIntro();
    else if (state.screen === "talk") view = renderTalk();
    else if (state.screen === "reaction") view = renderReaction();
    else if (state.screen === "verdict") view = renderVerdict();
    else view = renderTeacher();
    app.appendChild(view);
    window.scrollTo(0, 0);
  }

  render();

})();
</script>
</body>
</html>
