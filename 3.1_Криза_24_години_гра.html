<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Симулятор кризового лідера</title>
<style>
  :root {
    --ink: #1E2761; --ink-soft: #384080; --surface: #F3F6FC; --card: #FFFFFF;
    --gold: #C9962C; --gold-soft: #F3E4C6; --muted: #5B6685; --line: #DDE4F5;
    --red: #B3492F; --green: #2E7D6B;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%; background: var(--surface);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
  }
  .serif { font-family: Cambria, Georgia, "Times New Roman", serif; }
  #app { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 18px; }
  .stage-wrap { width: 100%; max-width: 680px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 36px 34px; box-shadow: 0 18px 40px -24px rgba(30,39,97,0.35); }
  @media (max-width: 480px) { .card { padding: 24px 18px; } }

  .kicker { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
  h1.title { font-size: 26px; line-height: 1.25; margin: 0 0 14px; font-weight: 700; }
  p.lead { font-size: 15px; line-height: 1.6; color: var(--muted); margin: 0 0 22px; }
  label.field-label { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; font-weight: 600; }
  input.text-input {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line);
    font-size: 15px; color: var(--ink); background: var(--surface); margin-bottom: 20px;
  }
  input.text-input:focus { outline: none; border-color: var(--gold); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 13px 24px; border-radius: 10px; border: none; font-size: 14.5px; font-weight: 600;
    cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn-primary { background: var(--ink); color: #fff; width: 100%; }
  .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 10px 20px -12px rgba(30,39,97,0.6); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-secondary { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); }

  /* Crisis picker */
  .crisis-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
  .crisis-card {
    display: flex; align-items: center; gap: 14px; border: 1.5px solid var(--line); border-radius: 12px;
    padding: 12px 14px; cursor: pointer; background: var(--surface); transition: all 0.15s ease;
  }
  .crisis-card:hover { border-color: var(--gold); }
  .crisis-card.selected { border-color: var(--gold); background: var(--gold-soft); }
  .crisis-card .c-icon { width: 46px; height: 46px; flex-shrink: 0; }
  .crisis-card .c-icon svg { width: 100%; height: 100%; }
  .crisis-card .c-name { font-weight: 700; font-size: 14px; margin-bottom: 2px; }
  .crisis-card .c-desc { font-size: 11.5px; color: var(--muted); line-height: 1.4; }

  /* Role picker */
  .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 22px; }
  @media (max-width: 480px) { .role-grid { grid-template-columns: 1fr; } }
  .role-card {
    border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 14px; cursor: pointer; background: var(--surface);
    transition: all 0.15s ease;
  }
  .role-card:hover { border-color: var(--gold); }
  .role-card.selected { border-color: var(--gold); background: var(--gold-soft); }
  .role-card .r-name { font-weight: 700; font-size: 13.5px; margin-bottom: 3px; }
  .role-card .r-desc { font-size: 11.5px; color: var(--muted); line-height: 1.4; margin-bottom: 8px; }
  .role-bonus-row { display: flex; flex-wrap: wrap; gap: 5px; }
  .role-bonus-chip {
    display: inline-block; font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 20px;
    background: var(--gold-soft); color: #7A5A16;
  }

  /* Stat dashboard */
  .stat-dash { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 22px; }
  @media (max-width: 480px) { .stat-dash { grid-template-columns: repeat(2, 1fr); } }
  .stat-box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .stat-box .s-label-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .stat-box .s-label { font-size: 9.5px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; }
  .stat-box .s-value { font-size: 12px; font-weight: 800; color: var(--ink); }
  .stat-box .s-value.low { color: var(--red); }
  .stat-box .s-value.high { color: var(--green); }
  .stat-track { height: 6px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .stat-fill { height: 100%; background: var(--gold); border-radius: 4px; transition: width 0.5s ease; }
  .stat-fill.low { background: var(--red); }
  .stat-fill.high { background: var(--green); }

  /* Scene */
  .scene-icon-wrap { display: flex; justify-content: center; margin-bottom: 18px; }
  .scene-icon-wrap svg { width: 96px; height: 96px; }
  .scene-time { text-align: center; font-size: 12px; color: var(--gold); font-weight: 700; margin-bottom: 6px; letter-spacing: 0.3px; }
  .scene-text { font-size: 16px; line-height: 1.55; margin: 0 0 24px; text-align: center; }
  .choice-list { display: flex; flex-direction: column; gap: 10px; }
  .choice-btn {
    text-align: left; padding: 14px 16px; border-radius: 12px; border: 1.5px solid var(--line);
    background: #fff; cursor: pointer; font-size: 13.5px; line-height: 1.45; color: var(--ink-soft);
    transition: all 0.15s ease;
  }
  .choice-btn:hover { border-color: var(--gold); background: var(--gold-soft); }

  /* Consequence */
  .consequence-box { background: var(--ink); color: #fff; border-radius: 14px; padding: 18px 20px; margin-bottom: 20px; }
  .consequence-box .cq-label { font-size: 11px; color: var(--gold-soft); font-weight: 700; margin-bottom: 8px; letter-spacing: 0.3px; }
  .consequence-box p { font-size: 13.5px; line-height: 1.55; color: #DCE1F5; margin: 0 0 10px; }
  .delta-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .delta-chip { font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 700; }
  .delta-chip.pos { background: rgba(46,125,107,0.25); color: #8FE3CB; }
  .delta-chip.neg { background: rgba(179,73,47,0.25); color: #F3B49E; }

  /* Ending */
  .ending-title { font-size: 22px; font-weight: 700; margin: 4px 0 10px; }
  .ending-tier { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 11.5px; font-weight: 700; margin-bottom: 14px; }
  .tier-good { background: #DCEFE9; color: #1F5245; }
  .tier-mixed { background: var(--gold-soft); color: #7A5A16; }
  .tier-bad { background: #F6DCD4; color: #7A2E1A; }
  .log-list { margin: 18px 0; padding: 0; list-style: none; }
  .log-list li { font-size: 12.5px; color: var(--muted); padding: 8px 0; border-bottom: 1px solid var(--line); }
  .log-list li b { color: var(--ink); }
  .reflect-note { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .save-note { font-size: 12.5px; color: var(--muted); margin-top: 14px; text-align: center; }
  .result-actions { display: flex; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
  .result-actions .btn { flex: 1; min-width: 140px; }
  .teacher-link { display: block; text-align: center; margin-top: 20px; font-size: 12.5px; color: var(--muted); text-decoration: underline; cursor: pointer; background: none; border: none; }

  .teacher-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  table.results-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.results-table th { text-align: left; font-size: 10.5px; color: var(--muted); font-weight: 600; padding: 7px 6px; border-bottom: 2px solid var(--line); }
  table.results-table td { padding: 8px 6px; border-bottom: 1px solid var(--line); }
  .tag { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; background: var(--gold-soft); color: #7A5A16; }
  .empty-note { text-align: center; color: var(--muted); font-size: 13.5px; padding: 30px 0; }
  .icon-btn { background: none; border: 1.5px solid var(--line); border-radius: 8px; padding: 7px 13px; font-size: 12.5px; color: var(--ink); cursor: pointer; }
  .icon-btn:hover { border-color: var(--gold); }
  .table-scroll { overflow-x: auto; }
</style>
</head>

  var STORAGE_PREFIX = "crisis-game:";

  // ---------------- State ----------------
  var state = {
    screen: "intro",       // intro -> crisisSelect -> roleSelect -> play -> consequence -> ending -> teacher
    studentName: "",
    crisisKey: null,
    roleKey: null,
    stats: { trust: 5, finance: 5, legal: 5, morale: 5 },
    stageIndex: 0,
    log: [],
    lastDelta: null,
    saveStatus: "idle",
    teacherRows: null,
    teacherLoading: false
  };

  var app = document.getElementById("app");
  function el(html) {
    var t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }
  function escHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function clamp(v) { return Math.max(0, Math.min(10, v)); }
  function currentStages() { return CRISES[state.crisisKey].stages; }

  function applyDelta(delta) {
    Object.keys(delta).forEach(function (k) {
      state.stats[k] = clamp(state.stats[k] + delta[k]);
    });
  }

  function statFillClass(v) {
    if (v <= 3) return "low";
    if (v >= 8) return "high";
    return "";
  }

  function renderStatDash() {
    var html = '<div class="stat-dash">';
    Object.keys(STAT_META).forEach(function (k) {
      var v = state.stats[k];
      html += (
        '<div class="stat-box">' +
          '<div class="s-label-row"><span class="s-label">' + STAT_META[k].label + '</span><span class="s-value ' + statFillClass(v) + '">' + v + '/10</span></div>' +
          '<div class="stat-track"><div class="stat-fill ' + statFillClass(v) + '" style="width:' + (v * 10) + '%"></div></div>' +
        '</div>'
      );
    });
    html += "</div>";
    return html;
  }

  // ---------------- Ending logic ----------------
  function computeEnding() {
    var total = state.stats.trust + state.stats.finance + state.stats.legal + state.stats.morale;
    if (total >= 22) return { tier: "good", title: "Зразкове антикризове лідерство", cls: "tier-good",
      text: "Ви провели компанію крізь кризу, зберігши довіру клієнтів, стабільність команди й юридичну безпеку. Саме така збалансованість — швидкі дії, чесна комунікація, відповідальність — і є суттю антикризового лідерства." };
    if (total >= 15) return { tier: "mixed", title: "Криза стабілізована, але з наслідками", cls: "tier-mixed",
      text: "Компанія пережила кризу, але не без втрат — десь довіру, десь фінанси, десь моральний стан команди. Це реалістичний результат: у кризі рідко вдається зберегти все одразу, важливо усвідомлювати компроміси." };
    return { tier: "bad", title: "Репутаційні втрати поглибились", cls: "tier-bad",
      text: "Низка рішень — затримки, ухильність або перекладання відповідальності — поглибили кризу, а не стабілізували її. Це показовий приклад того, як брак прозорості й швидкості посилює наслідки навіть невеликого початкового інциденту." };
  }

  // ---------------- Persistence ----------------
  function saveResultToStorage(ending) {
    if (!window.storage) return;
    state.saveStatus = "saving";
    var key = STORAGE_PREFIX + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
    var payload = {
      name: state.studentName || "Анонім",
      crisis: CRISES[state.crisisKey].title,
      role: ROLES[state.roleKey].label,
      stats: state.stats,
      tier: ending.tier,
      title: ending.title,
      choices: state.log.map(function (l) { return l.choiceLabel; }),
      timestamp: Date.now()
    };
    window.storage.set(key, JSON.stringify(payload), true).then(function (r) {
      state.saveStatus = r ? "saved" : "failed";
      render();
    }).catch(function () { state.saveStatus = "failed"; render(); });
  }

  function loadTeacherRows() {
    state.teacherLoading = true;
    render();
    if (!window.storage) { state.teacherRows = []; state.teacherLoading = false; render(); return; }
    window.storage.list(STORAGE_PREFIX, true).then(function (listRes) {
      var keys = (listRes && listRes.keys) || [];
      if (keys.length === 0) { state.teacherRows = []; state.teacherLoading = false; render(); return; }
      var promises = keys.map(function (k) {
        return window.storage.get(k, true).then(function (r) {
          try { return JSON.parse(r.value); } catch (e) { return null; }
        }).catch(function () { return null; });
      });
      Promise.all(promises).then(function (rows) {
        rows = rows.filter(Boolean).sort(function (a, b) { return b.timestamp - a.timestamp; });
        state.teacherRows = rows; state.teacherLoading = false; render();
      });
    }).catch(function () { state.teacherRows = []; state.teacherLoading = false; render(); });
  }

  function csvEscape(text) { return '"' + String(text).replace(/"/g, '""') + '"'; }
  function downloadCsv() {
    var rows = state.teacherRows || [];
    var header = ["Ім'я", "Криза", "Роль", "Довіра", "Фінанси", "Юридична безпека", "Командний дух", "Фінал", "Дата"];
    var lines = [header.map(csvEscape).join(";")];
    rows.forEach(function (r) {
      lines.push([
        csvEscape(r.name), csvEscape(r.crisis), csvEscape(r.role), r.stats.trust, r.stats.finance, r.stats.legal, r.stats.morale,
        csvEscape(r.title), csvEscape(new Date(r.timestamp).toLocaleString("uk-UA"))
      ].join(";"));
    });
    var blob = new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "crisis-game-results.csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

      );
    }).join("");

    var card = el(
      '<div class="stage-wrap"><div class="card">' +
      '<p class="kicker">Крок 2 з 3 · Криза: ' + CRISES[state.crisisKey].title + '</p>' +
      '<h1 class="title serif" style="font-size:22px;">Яку роль ви граєте в кризовій команді?</h1>' +

      if (!state.roleKey) return;
      state.stats = { trust: 5, finance: 5, legal: 5, morale: 5 };
      applyDelta(ROLES[state.roleKey].bonus);
      state.stageIndex = 0;
      state.log = [];
      state.screen = "play";
      render();

  function renderPlay() {
    var stages = currentStages();
    var stage = stages[state.stageIndex];
    var choicesHtml = stage.choices.map(function (c, idx) {
      return '<button class="choice-btn" data-idx="' + idx + '">' + escHtml(c.label) + '</button>';
    }).join("");

    var card = el(
      '<div class="stage-wrap"><div class="card">' +
      '<p class="kicker">' + CRISES[state.crisisKey].title + ' · Роль: ' + ROLES[state.roleKey].label + ' · Сцена ' + (state.stageIndex + 1) + ' із ' + stages.length + '</p>' +
      renderStatDash() +
      '<div class="scene-icon-wrap">' + ICONS[stage.icon] + '</div>' +
      '<div class="scene-time">' + stage.time + '</div>' +
      '<p class="scene-text serif">' + stage.text + '</p>' +
      '<div class="choice-list">' + choicesHtml + '</div>' +
      '</div></div>'
    );

    card.querySelectorAll(".choice-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var idx = parseInt(btn.getAttribute("data-idx"), 10);
        var choice = stage.choices[idx];
        applyDelta(choice.delta);
        state.log.push({ stageText: stage.text, choiceLabel: choice.label, consequence: choice.consequence });
        state.lastDelta = choice.delta;
        state.screen = "consequence";
        render();
      });
    });

    return card;
  }

  function renderConsequence() {
    var stages = currentStages();
    var lastLog = state.log[state.log.length - 1];
    var delta = state.lastDelta;
    var chipsHtml = Object.keys(delta).map(function (k) {
      var v = delta[k];
      var cls = v >= 0 ? "pos" : "neg";
      var sign = v >= 0 ? "+" : "";
      return '<span class="delta-chip ' + cls + '">' + STAT_META[k].label + " " + sign + v + '</span>';
    }).join("");

    var isLast = state.stageIndex >= stages.length - 1;

    var card = el(
      '<div class="stage-wrap"><div class="card">' +
      renderStatDash() +
      '<div class="consequence-box">' +
        '<div class="cq-label">Що змінилося</div>' +
        '<p>' + escHtml(lastLog.consequence) + '</p>' +
        '<div class="delta-row">' + chipsHtml + '</div>' +
      '</div>' +
      '<button class="btn btn-primary" id="continue-btn">' + (isLast ? "Дивитися підсумок →" : "Далі →") + '</button>' +
      '</div></div>'
    );

    card.querySelector("#continue-btn").addEventListener("click", function () {
      if (isLast) {
        var ending = computeEnding();
        state.screen = "ending";
        render();
        saveResultToStorage(ending);
      } else {
        state.stageIndex += 1;
        state.screen = "play";
        render();
      }
    });

    return card;
  }

  function renderEnding() {
    var ending = computeEnding();
    var logHtml = state.log.map(function (l, i) {
      return '<li><b>Сцена ' + (i + 1) + ':</b> ' + escHtml(l.choiceLabel) + '</li>';
    }).join("");

    var saveNote = "";
    if (state.saveStatus === "saving") saveNote = "Зберігаємо результат…";
    else if (state.saveStatus === "saved") saveNote = "Результат збережено.";
    else if (state.saveStatus === "failed") saveNote = "Результат сформовано, але не вдалося зберегти для викладача.";

    var card = el(
      '<div class="stage-wrap"><div class="card">' +
      '<div class="scene-icon-wrap">' + ICONS.trophy + '</div>' +
      '<p class="kicker" style="text-align:center;">' + CRISES[state.crisisKey].title + ' · Роль: ' + ROLES[state.roleKey].label + (state.studentName ? " · " + escHtml(state.studentName) : "") + '</p>' +
      '<div style="text-align:center;"><span class="ending-tier ' + (ending.tier === "good" ? "tier-good" : ending.tier === "mixed" ? "tier-mixed" : "tier-bad") + '">' + (ending.tier === "good" ? "Найкращий фінал" : ending.tier === "mixed" ? "Змішаний фінал" : "Найгірший фінал") + '</span></div>' +
      '<h1 class="ending-title serif" style="text-align:center;">' + ending.title + '</h1>' +
      renderStatDash() +
      '<p class="lead">' + ending.text + '</p>' +
      '<b style="font-size:13px;">Ваш шлях через кризу:</b>' +
      '<ul class="log-list">' + logHtml + '</ul>' +
      '<p class="reflect-note"><b>Для рефлексії:</b> що б ви зробили інакше на кожному етапі? Який ваш вибір найбільше вплинув на фінал? Які лідерські компетенції знадобилися саме вашій ролі (' + ROLES[state.roleKey].label + ')?</p>' +
      (saveNote ? '<p class="save-note">' + saveNote + '</p>' : "") +
      '<div class="result-actions">' +
        '<button class="btn btn-secondary" id="retry-btn">Інша криза / ще раз</button>' +
      '</div>' +
      '<button class="teacher-link" id="teacher-link">Перегляд результатів групи (для викладача)</button>' +
      '</div></div>'
    );

    card.querySelector("#retry-btn").addEventListener("click", function () {
      state.screen = "intro"; state.crisisKey = null; state.roleKey = null; state.log = [];
      state.stats = { trust: 5, finance: 5, legal: 5, morale: 5 }; state.stageIndex = 0;
      render();
    });
    card.querySelector("#teacher-link").addEventListener("click", function () {
      state.screen = "teacher"; render(); loadTeacherRows();
    });

    return card;
  }

  function renderTeacher() {
    var rows = state.teacherRows;
    var bodyHtml;
    if (state.teacherLoading) {
      bodyHtml = '<p class="empty-note">Завантаження результатів…</p>';
    } else if (!rows || rows.length === 0) {
      bodyHtml = '<p class="empty-note">Поки що ніхто не пройшов гру за цим посиланням.</p>';
    } else {
      var tierLabel = { good: "Найкращий", mixed: "Змішаний", bad: "Найгірший" };
      var trs = rows.map(function (r) {
        return (
          '<tr>' +
            '<td>' + escHtml(r.name) + '</td>' +
            '<td>' + escHtml(r.crisis || "—") + '</td>' +
            '<td>' + escHtml(r.role) + '</td>' +
            '<td>' + r.stats.trust + '</td><td>' + r.stats.finance + '</td><td>' + r.stats.legal + '</td><td>' + r.stats.morale + '</td>' +
            '<td><span class="tag">' + (tierLabel[r.tier] || r.tier) + '</span></td>' +
          '</tr>'
        );
      }).join("");
      bodyHtml =
        '<div class="table-scroll"><table class="results-table">' +
          '<thead><tr><th>Студент</th><th>Криза</th><th>Роль</th><th>Дов.</th><th>Фін.</th><th>Юрид.</th><th>Дух</th><th>Фінал</th></tr></thead>' +
          '<tbody>' + trs + '</tbody>' +
        '</table></div>';
    }

    var card = el(
      '<div class="stage-wrap"><div class="card">' +
      '<div class="teacher-header">' +
        '<h1 class="title serif" style="margin:0;font-size:22px;">Результати групи</h1>' +
        '<button class="icon-btn" id="refresh-btn">Оновити</button>' +
      '</div>' +
      bodyHtml +
      '<div class="result-actions">' +
        '<button class="btn btn-secondary" id="csv-btn"' + ((!rows || rows.length === 0) ? " disabled" : "") + '>Завантажити CSV</button>' +
        '<button class="btn btn-secondary" id="back-btn">← Назад</button>' +
      '</div>' +
      '</div></div>'
    );

    card.querySelector("#refresh-btn").addEventListener("click", loadTeacherRows);
    card.querySelector("#back-btn").addEventListener("click", function () {
      state.screen = state.log.length > 0 ? "ending" : "intro"; render();
    });
    var csvBtn = card.querySelector("#csv-btn");
    if (csvBtn && rows && rows.length > 0) csvBtn.addEventListener("click", downloadCsv);

    return card;
  }

  function render() {
    app.innerHTML = "";
    var view;
    if (state.screen === "intro") view = renderIntro();
    else if (state.screen === "crisisSelect") view = renderCrisisSelect();
    else if (state.screen === "roleSelect") view = renderRoleSelect();
    else if (state.screen === "play") view = renderPlay();
    else if (state.screen === "consequence") view = renderConsequence();
    else if (state.screen === "ending") view = renderEnding();
    else view = renderTeacher();
    app.appendChild(view);
    window.scrollTo(0, 0);
  }

  render();
})();
</script>
</body>
</html>
