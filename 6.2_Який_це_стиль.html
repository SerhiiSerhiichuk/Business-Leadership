<!DOCTYPE html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Який це стиль?</title>
<style>
:root{--ink:#1E2761;--ink2:#384080;--bg:#F3F6FC;--card:#fff;--gold:#C9962C;--goldsoft:#F3E4C6;--mut:#5B6685;--line:#DDE4F5;--hero:#1E2761;--red:#B3492F;--green:#2E7D6B;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#E8ECFF;--ink2:#B9C2F0;--bg:#10142B;--card:#1A2040;--gold:#E0AE45;--goldsoft:#3A3420;--mut:#A3ADD3;--line:#2E3664;--hero:#2B3575}}
:root[data-theme="dark"]{--ink:#E8ECFF;--ink2:#B9C2F0;--bg:#10142B;--card:#1A2040;--gold:#E0AE45;--goldsoft:#3A3420;--mut:#A3ADD3;--line:#2E3664;--hero:#2B3575}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.serif{font-family:Cambria,Georgia,serif}#app{display:flex;justify-content:center;padding:28px 16px}.st{width:100%;max-width:700px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:34px 30px;box-shadow:0 18px 40px -26px rgba(30,39,97,.4)}
@media(max-width:480px){.card{padding:24px 18px}}
.k{font-size:13px;color:var(--mut);margin:0 0 8px}h1{font-size:27px;line-height:1.2;margin:0 0 12px}h2{font-size:18px;margin:26px 0 10px}p{margin:0 0 12px}.mut{color:var(--mut)}.sm{font-size:14px}
input,textarea{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);font:inherit;font-size:15px;color:var(--ink);background:var(--bg)}
.btn{display:inline-flex;justify-content:center;align-items:center;padding:13px 22px;border-radius:10px;border:1.5px solid var(--line);font:inherit;font-weight:600;font-size:15px;cursor:pointer;background:var(--bg);color:var(--ink)}
.pri{background:var(--ink);color:var(--bg);border-color:var(--ink);width:100%}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.row .btn{flex:1;min-width:150px}
.pg{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:18px}.pg i{display:block;height:100%;background:var(--gold);transition:width .3s}
.bar{margin-bottom:12px}.bl{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:4px}.bt{height:12px;background:var(--bg);border:1px solid var(--line);border-radius:7px;overflow:hidden}.bt i{display:block;height:100%;border-radius:7px}
.hero{background:var(--hero);color:#fff;border-radius:14px;padding:20px 22px;margin-top:18px}.hero p{color:#DCE1F5;font-size:14.5px}.hero b{color:#fff}.hero .lb{font-size:12px;color:#F3E4C6;font-weight:700}.hero .nm{font-size:22px;font-weight:700;margin:2px 0 10px}
.box{margin-top:14px;padding:14px 16px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:14px}
.quote{display:flex;gap:14px;align-items:flex-start;margin:0 0 16px;padding:16px;border-radius:14px;background:var(--goldsoft);border:1px solid var(--line);font-size:16px;line-height:1.5;color:#1E2761}
:root[data-theme="dark"] .quote{color:var(--ink)}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .quote{color:var(--ink)}}
.quote svg{flex:none}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
.link{display:block;margin:18px auto 0;background:none;border:none;color:var(--mut);font-size:13px;text-decoration:underline;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(10,14,40,.62);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}.ov .card{max-height:90vh;overflow:auto;width:100%;max-width:760px}
.cb{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:13px 14px;margin-bottom:8px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px;cursor:pointer}.cb .em{font-size:24px}.cb:hover:not(:disabled){border-color:var(--gold)}.cb:disabled{cursor:default}
.cb.ok{border-color:var(--green);background:color-mix(in srgb,#2E7D6B 18%,var(--bg))}.cb.no{border-color:var(--red);background:color-mix(in srgb,#B3492F 18%,var(--bg))}.cb.dim{opacity:.62}
.el{margin:0 0 8px;display:flex;gap:12px;align-items:flex-start}.el .n{font-size:24px}
</style></head><body><div id="app"></div>
<script>
(function(){
var ST=[
{k:"co",e:"🏆",l:"Конкуренція",s:"Наполегливо відстоює власну позицію, не зважаючи на іншу сторону.",c:"наполегливість без готовності слухати: готові рішення, тиск, закриття обговорення",col:"#B3492F"},
{k:"cl",e:"🤝",l:"Співпраця",s:"З’ясовує інтереси обох сторін і шукає рішення, що влаштовує всіх.",c:"запитання про справжні потреби та рішення, яке задовольняє обох повністю",col:"#2E7D6B"},
{k:"cm",e:"⚖️",l:"Компроміс",s:"Обидві сторони поступаються, щоб швидко знайти прийнятну середину.",c:"поділ різниці навпіл і часткову поступку обох без з’ясування причин",col:"#C9962C"},
{k:"av",e:"🚪",l:"Уникнення",s:"Відходить від теми, відкладає розмову й не висловлює позиції.",c:"відхід від теми, відкладання без терміну та відсутність власної позиції",col:"#5B6685"},
{k:"ac",e:"🕊️",l:"Пристосування",s:"Поступається, щоб зберегти мир або догодити іншій стороні.",c:"поступку власними інтересами заради спокою чи схвалення іншого",col:"#384080"}];
function Q(id,st,t,x){return{id:id,st:st,t:t,x:x}}
var SC=[
Q("co1","co","Керівниця проєкту Інна спокійно, не підвищуючи голосу, каже: «Я відповідаю за дедлайн перед клієнтом, тому тестування скорочуємо до двох днів». Андрій пропонує обговорити ризики. Вона киває: «Я їх бачу, рішення не змінюється» — і веде нараду далі за власним порядком.","Тон спокійний, але позиція незмінна: ризики вислухано без наміру щось міняти, інтереси Андрія не з’ясовують. Шукайте високу наполегливість за відсутності готовності враховувати іншу сторону, навіть без підвищення голосу. Це не співпраця, бо рішення не шукають разом."),
Q("co2","co","Начальник цеху Віктор на зустрічі про новий графік змін: «Я двадцять років на цьому виробництві, тож краще знаю, що спрацює. Голосування не потрібне». Він кладе на стіл уже підготовлений наказ і додає, що незгодні можуть поговорити з ним після підпису.","Досвід тут слугує аргументом закритості: наказ підготовлено заздалегідь, а нарада лише оголошує рішення. Шукайте посилання на власний статус замість аргументів і готове рішення до початку розмови. Це не компроміс: інша сторона нічого не отримує."),
Q("co3","co","Коли керівник ІТ пропонує розподілити витрати на сервери між відділами, фінансова директорка Леся відповідає: «Ні, платить ваш відділ, бо ви це замовили». Лист із цим рішенням вона надіслала в бухгалтерію ще до наради й показує його всім: «Це вже в роботі».","Рішення поставлено перед фактом, а лист у бухгалтерії закриває пошук інших варіантів. Інтереси ІТ-відділу не з’ясовують і не враховують. Шукайте дії, що роблять рішення незворотним до обговорення. Це не уникнення: Леся діє активно й нав’язує результат."),
Q("co4","co","Юрист Олег на пропозицію змінити умови договору відповідає: «Політика компанії однозначна, пункт 4.2 не обговорюється». Він зачитує пункт, відхиляє два запитання про винятки словами «Це не стосується» і просить секретарку занести до протоколу, що рішення ухвалено.","Правило використано як інструмент, щоб закрити обговорення: запитання про винятки відхилено без з’ясування, а протокол фіксує перемогу позиції Олега. Шукайте формальні підстави, що закривають тему замість пошуку шляху з урахуванням потреб іншої сторони."),
Q("co5","co","Менеджер Артем, коли колега наполягає на своєму варіанті презентації для клієнта, заявляє: «Зустріч веду я, тож слайди мої. Свої ідеї покажеш на наступному проєкті». Він сам прибирає слайди колеги з файлу прямо під час наради й переходить до наступного питання.","Тут не лише слова, а й дія: слайди колеги видаляють без згоди, а його ідеї відсувають «на потім». Шукайте односторонні кроки, що змінюють ситуацію на користь однієї людини, та відмову враховувати інтерес іншої сторони."),
Q("co6","co","Аналітик Сергій у суперечці про методику оцінювання: «Ваш підхід хибний, ось три причини». Відповіді колеги він не дослухує, повертається до свого слайда, повторює першу тезу й завершує: «Отже, дискусію завершено, беремо мою методику», хоча рішення ухвалює не він.","Тиск на вибір позиції без повноважень: Сергій перебиває, повторює тезу й оголошує дискусію завершеною. Шукайте змагальну манеру, коли головне — «виграти» питання, а не зрозуміти аргументи. Відсутність влади не змінює суті поведінки."),
Q("cl1","cl","Дмитро з ІТ і Олена з продажів сперечаються про дату релізу: вона хоче швидше, він — безпечніше. Дмитро питає: «Що клієнт втратить, якщо ми вийдемо на тиждень пізніше?» Вона називає дедлайн контракту, він — ризиковані модулі. Разом випускають основну частину вчасно, а решту після тестування.","Замість торгу про дату люди з’ясовують, що стоїть за позиціями (контракт, ризик помилок), і знаходять варіант, у якому обидві потреби задоволено повністю. Шукайте запитання «чому це важливо» та рішення, якого спершу не було. Це не компроміс: ніхто не відмовляється від головного."),
Q("cl2","cl","Двоє керівників претендують на єдину переговорну в понеділок уранці. Замість суперечки про чергу Марта питає, що саме кожному потрібно. Одному потрібна тиша для дзвінка, іншому — екран для презентації. Дзвінок переносять у кімнату для розмов, презентація лишається в переговорній.","Питання про потребу замість питання «кому дістанеться» показує, що справжнього конфлікту за кімнату немає. Шукайте з’ясування інтересів і рішення, що влаштовує обох повністю. Поділ часу навпіл був би компромісом, а тут цього не потрібно."),
Q("cl3","cl","Інна з HR і керівник цеху сперечаються про додаткові зміни. Вона каже: «Мені важливо, щоб команда не вигоряла, вам — щоб замовлення вийшло. Подивімося, де губиться час». Разом розбирають графік, знаходять дві години простою й виконують замовлення без додаткових змін.","Обидві цілі проговорено вголос, а спільний аналіз фактів відкриває третій шлях. Шукайте сформульовані інтереси обох сторін і спільну роботу над даними замість відстоювання позицій. Ніхто не поступається власним інтересом."),
Q("cl4","cl","Дизайнерка і розробник сперечаються про макет. Вона каже: «Я не хочу перетягувати канат. Поясни, що саме технічно не вийде». Він розповідає про обмеження, і вони на дошці малюють третій варіант, що зберігає її навігацію та його вимогу до швидкості. Перевіряють його на прототипі.","Запитання про суть обмеження й спільне створення нового варіанта вказують на пошук рішення, що враховує обидві вимоги. Шукайте готовність слухати причини та творчий варіант, у якому нічого суттєвого не втрачено. Це не поступка й не торг."),
Q("cl5","cl","Бухгалтерка і керівник закупівель сперечаються про терміни оплати постачальникам. Він: «Мені потрібна репутація надійного платника». Вона: «Без підписаних актів платити не можу». Вони записують потреби у дві колонки й вирішують запровадити електронний акт, щоб платити за три дні.","Потреби називають прямо й записують, а не захищають позиції. Рішення (електронний акт) задовольняє і репутацію, і вимогу до документів. Шукайте проговорені потреби обох сторін та нове рішення, а не поділ різниці."),
Q("cl6","cl","Оксана не погоджується з Тарасом щодо переходу на чат-бот. Вона просить три дні, щоб вивчити його дані, а на другій зустрічі показує власні цифри й питає про його ризики. Разом визначають умови пілоту: тест на десятій частині звернень і відгуки клієнтів.","Пауза тут не відкладання, а підготовка до предметної розмови: Оксана повертається з даними й питає про ризики. Шукайте відкритий обмін інформацією та спільне формулювання умов, що враховують побоювання обох. Це не уникнення, бо тема не зникає."),
Q("cm1","cm","Замовник просить завершити проєкт за чотири тижні, команда називає вісім. Менеджер пропонує: «Давайте шість. Ви скоротите другорядні функції, а замовник трохи почекає». Обидві сторони кивають і підписують домовленість. Чому команді потрібно вісім тижнів, ніхто не питає.","Кожен поступається частиною (строк, обсяг), але причин початкових позицій не з’ясовують: ніхто не питає, чому вісім тижнів. Шукайте швидкий пошук середини та взаємні поступки без аналізу потреб. Це не співпраця: нового рішення не створено, позиції лише зближено."),
Q("cm2","cm","Логіст і начальник виробництва сперечаються, хто платить за термінову доставку. Логіст пропонує: «Давай навпіл». Виробничник після паузи відповідає: «Домовились, але наступного разу ти береш більшу частину». Вони тиснуть руки, а причини зриву термінів не обговорюють.","Рівний поділ витрат — класична взаємна поступка, а причини проблеми лишаються поза розмовою. Шукайте поділ навпіл і домовленість «на наступний раз» як розрахунок. Це не пристосування, бо поступаються обидві сторони."),
Q("cm3","cm","Тімлід хоче випустити продукт у п’ятницю, QA просить середу наступного тижня. Менеджер підсумовує: «Тоді в понеділок. Хтось трохи не встигне, але менше, ніж зараз». Обидва знизують плечима: «Ну, нехай» — і повертаються до задач, не торкаючись того, що саме не встигне.","Дату обрано посередині, і обидві сторони щось втрачають. Шукайте «посередині» як спосіб закрити питання та відсутність з’ясування змісту втрат. Задоволення часткове: «ну, нехай», а не «саме так, як треба»."),
Q("cm4","cm","Дві співробітниці хочуть відпустку в липні. Керівниця пропонує: «Одна бере першу половину місяця, інша — другу, а наступного року міняєтеся». Обидві погоджуються без захвату й швидко закривають питання, і жодна не питає, чому для другої саме цей місяць важливий.","Поділ часу порівну та обіцянка «наступного року» є взаємною поступкою, але мотиви обох не з’ясовано. Шукайте справедливий поділ і часткове задоволення обох замість пошуку варіанта, що влаштовує повністю."),
Q("cm5","cm","Профспілка просить надбавку десять відсотків, директор готовий на нуль. Після двох годин торгу сторони називають п’ять відсотків із вересня. Чому гроші не були закладені в бюджет раніше й чи є джерело, ніхто не обговорює, обидві сторони розходяться з неповною перемогою.","Сторони рухаються назустріч і зупиняються посередині, а питання про джерела й причини не розглядають. Шукайте торг із взаємним зменшенням вимог та згоду на частковий результат."),
Q("cm6","cm","Двоє менеджерів вважають одного клієнта своїм. Керівник пропонує: «Один веде його до кінця року, другий — після, а комісію ділите шістдесят на сорок». Менеджери торгуються за відсотки й домовляються на п’ятдесят п’ять і сорок п’ять, не з’ясовуючи, чого хоче сам клієнт.","Час і гроші ділять, а справжні потреби клієнта й менеджерів не досліджують. Шукайте торг про частки, швидку домовленість на середній цифрі й відсутність нового варіанта."),
Q("av1","av","Коли обговорення переходить до того, чия помилка спричинила збій, Максим раптом відкриває ноутбук: «Мені терміново треба перевірити лист клієнта». До теми він не повертається, а на пряме запитання «Що ви думаєте?» відповідає: «Це не моя зона, я не буду втручатися».","Людина виходить із розмови в момент напруги за нейтральним приводом і відмовляється висловити позицію. Шукайте відхід від теми, відсутність позиції та формулу «не моя зона». Це не пристосування: вона не погоджується, а просто не бере участі."),
Q("av2","av","Керівниця на нараді: «Бачу, що ми розходимося в поглядах. Давайте повернемося до цього пізніше, може, воно саме вирішиться». Вона одразу переходить до наступного пункту. Через два тижні тему так і не повернули до порядку денного.","Розбіжність названо, але питання відкладено без дати й відповідального, а надія «саме вирішиться» замінює дії. Шукайте відкладання без терміну й швидкий перехід до іншого. Це не компроміс: ні про що не домовилися."),
Q("av3","av","Богдан не відповідає на повторні листи колеги про розподіл завдань. Коли зустрічає його в коридорі, питає про вихідні й швидко йде. На пряме повідомлення в чаті відповідає «Побачимо» і більше не пише, а розподіл завдань лишається нечітким.","Людина обходить саму тему: ігнорує листи, переводить розмову на нейтральне, дає розпливчасту відповідь. Шукайте тактику «зникнення» без позиції. Конфлікт нікуди не дівається, а лише відкладається."),
Q("av4","av","Колега критикує звіт Тараса прямо на нараді. Тарас усміхається: «Цікаво», щось нотує й просить перейти до наступного слайда. Звіт він не змінює, після наради не пише колезі й не питає, що саме було не так.","Нейтральна реакція («цікаво»), нотатка без наслідків і мовчання після наради означають, що тему не опрацьовано. Шукайте відсутність і згоди, і заперечення: людина не поступається й не відстоює."),
Q("av5","av","Двоє колег гостро сперечаються про розподіл завдань, а Ірина, яка могла б ухвалити рішення, виходить «відповісти на дзвінок» і повертається, коли тема вже змінилася. Згодом пояснює: «Вони самі розберуться, я не хочу в це лізти».","Людина з впливом свідомо виходить із ситуації й перекладає її на інших. Шукайте демонстративний відхід із конфлікту та формулу «розберуться самі», а не участь у пошуку рішення."),
Q("av6","av","Коли команда питає прямо, чи зберігається старий бонус, Юлія відповідає: «Питання складне, не будемо поспішати». Вона пропонує створити робочу групу «для вивчення», а на запитання про терміни й відповідальних каже, що про це ще зарано говорити.","Робоча група без термінів і відповідальних слугує способом відсунути рішення, а на прямі запитання відповіді немає. Шукайте процедурне відкладання й ухилення від конкретики. Це не співпраця: пошуку рішення тут немає."),
Q("ac1","ac","Під час розмови про те, хто веде презентацію для клієнта, Олена каже: «Нічого страшного, ведіть ви. Мені головне, щоб вам було спокійно». Хоча вона готувалася тиждень і знає матеріал краще, віддає слайди, лишається помічницею й навіть бере на себе підготовку роздаткових матеріалів.","Людина свідомо відмовляється від власного результату заради комфорту іншої та пояснює це турботою про її спокій. Шукайте поступку на шкоду власним інтересам. Це не уникнення: Олена бере участь у розмові, але поступається."),
Q("ac2","ac","Коли керівник наполягає на нічному релізі, Андрій, який планував поїхати до родини, каже: «Звісно, зроблю, не хочу, щоб через мене були проблеми». Мовчки пише дружині, що не приїде, і без жодних уточнень бере на себе додаткові години.","Андрій відмовляється від власних планів, не озвучуючи їхньої ваги, і бере на себе додаткові зобов’язання. Шукайте швидку згоду без торгу й мовчазну відмову від особистих інтересів. Це не компроміс: йому ніхто не йде назустріч."),
Q("ac3","ac","У суперечці про вибір постачальника колега наполягає на дорожчому варіанті, хоча Сергій має цифри на користь іншого. Побачивши роздратування колеги, Сергій закриває файл: «Добре, мені не принципово, хай буде ваш». Свої дані він так і не показує.","Людина відмовляється від власного аргументу, щоб послабити напругу. Шукайте «мені не принципово» за наявності вагомих доводів і поступку без спроби їх озвучити. Це не уникнення: Сергій відповідає, але віддає перемогу."),
Q("ac4","ac","Колега невдоволений своїм графіком змін. Керівниця пропонує: «Візьми мої вихідні, мені зручніше, щоб ти був задоволений». Колега лише збирається подякувати, а вона вже переписує власний графік у спільній таблиці й пише чоловікові, що вихідних цього місяця не буде.","Задоволення іншого поставлено вище за власні потреби, а поступка йде швидше, ніж про неї встигли попросити. Шукайте ініціативну жертву власними інтересами та підлаштування під іншого."),
Q("ac5","ac","На зборах критикують процес, який вела Ірина. Вона одразу каже: «Ви маєте рацію, це моя недоробка, виправлю як вам зручно». Вона не питає про подробиці й не пояснює, чому обрала такий порядок, хоча частину рішень їй нав’язало керівництво.","Швидка згода без уточнень і готовність виправляти «як зручно» показують підпорядкування чужій оцінці, а не обговорення. Шукайте відмову від власної позиції та пояснень. Це не компроміс: інша сторона нічим не поступається."),
Q("ac6","ac","Двоє керівників не можуть вирішити, чий проєкт отримає розробників. Павло, якому вони теж потрібні, каже: «Беріть обох, я потім якось викручуся». Наступного дня він переносить свої зустрічі, щоб звільнити ресурс, хоча його власний термін від цього страждає.","Павло віддає ресурс, потрібний йому самому, щоб зняти чужу суперечку, а наслідки бере на себе. Шукайте жертву власними інтересами заради спокою інших, а не торг про взаємні умови.")
];
function stOf(k){return ST.filter(function(s){return s.k===k})[0]}
function lab(k){return stOf(k).e+" "+stOf(k).l}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function pickRound(){var list,tries=0;do{list=[];ST.forEach(function(s){shuffle(SC.filter(function(x){return x.st===s.k})).slice(0,2).forEach(function(x){list.push(x)})});list=shuffle(list);var ok=true;for(var i=1;i<list.length;i++)if(list[i].st===list[i-1].st)ok=false;tries++}while(!ok&&tries<500);
return list.map(function(s){return{s:s,order:shuffle(ST.map(function(x){return x.k}))}})}
var st={screen:"intro",name:"",round:[],index:0,ans:[],saved:false,manual:"",teacherOpen:false,teacher:null,csvText:""};
var app=document.getElementById("app");
function score(){return st.ans.filter(function(a){return a.ok}).length}
function styleStats(){return ST.map(function(s){var A=st.ans.filter(function(a){return a.correct===s.k});return{s:s,seen:A.length,right:A.filter(function(a){return a.ok}).length}})}
function verdict(n,ans){var same=ans.every(function(a){return a.chosen===ans[0].chosen});
if(same)return["Однакова відповідь на всі ситуації","Ви обирали «"+stOf(ans[0].chosen).l+"» у кожній ситуації, тож результат мало говорить про вміння розрізняти стилі. Спробуйте щоразу питати: чого людина домагається для себе, чого для іншого і чи є в неї власна позиція."];
if(n>=9)return[n===10?"Бездоганне розпізнавання":"Сильне розпізнавання стилів","Ви впевнено відрізняєте стилі за поведінкою, а не за тоном чи словами. Це допомагає зрозуміти колег і обрати доречну реакцію, пам’ятаючи, що стиль — це реакція на ситуацію, а не риса людини."];
if(n>=6)return["Непогано, є плутанина","Більшість стилів ви розпізнали, але деякі сусідні стилі ще плутаються. Подивіться підказки до помилок і зверніть увагу, чого людина прагне для себе й для іншої сторони."];
return["Варто потренувати розпізнавання","Поки що стилі легко підміняються один одним. Оцінюйте не гучність і не ввічливість, а дві речі: наскільки людина відстоює власний інтерес і наскільки враховує інтерес іншого."]}
function confusion(){var m={};st.ans.forEach(function(a){if(!a.ok){var k=a.correct+">"+a.chosen;m[k]=(m[k]||0)+1}});var ks=Object.keys(m);if(!ks.length)return"";var mx=Math.max.apply(null,ks.map(function(k){return m[k]}));
if(mx<2)return"Однакових плутанин немає: помилки розрізнені.";var top=ks.filter(function(k){return m[k]===mx});
return(top.length>1?"Найчастіші плутанини (порівну): ":"Найчастіша плутанина: ")+top.slice(0,2).map(function(k){var p=k.split(">");return stOf(p[0]).l+" сприйнято як «"+stOf(p[1]).l+"» ("+mx+")"}).join("; ")+(top.length>2?" та інші":"")+"."}
function bar(l,v,m,c){return'<div class="bar"><div class="bl"><span>'+l+'</span><span>'+v+'/'+m+'</span></div><div class="bt"><i style="width:'+(m?Math.round(v/m*100):0)+'%;background:'+c+'"></i></div></div>'}
var ICON='<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect x="4" y="22" width="32" height="8" rx="3" fill="#1E2761"/><circle cx="12" cy="13" r="5" fill="#1E2761"/><circle cx="28" cy="13" r="5" fill="#C9962C"/><path d="M17 8l2-3m2 3l-2-3" stroke="#C9962C" stroke-width="2" stroke-linecap="round" fill="none"/></svg>';
function intro(){return'<div class="card"><p class="k">Практичне заняття 6 · Бізнес-лідерство · Конфлікти</p><h1 class="serif">Який це стиль?</h1><p class="mut">10 ситуацій на нараді. У кожній описано, що людина сказала й зробила в конфліктній ситуації. Ваше завдання: визначити, який зі стилів Томаса-Кілманна це ілюструє. Дивіться на поведінку, а не на тон чи ввічливість.</p><div class="box" style="margin:0 0 16px"><b>Пам’ятайте.</b> Жоден стиль не «поганий»: кожен доречний у своїй ситуації. Ми розпізнаємо поведінку, а не оцінюємо людину.</div><div style="margin:8px 0 18px">'+ST.map(function(e){return'<div class="box el" style="margin-top:0;margin-bottom:8px"><span class="n">'+e.e+'</span><div><b>'+e.l+'</b><div class="mut sm">'+e.s+'</div></div></div>'}).join("")+'</div><label class="sm" for="nm"><b>Ваше ім’я</b> <span class="mut">(необов’язково)</span></label><input id="nm" maxlength="40" placeholder="Наприклад, Олена К." value="'+esc(st.name)+'" style="margin:6px 0 18px"><button class="btn pri" data-a="start">Почати (10 ситуацій) →</button><button class="link" data-a="teacher">Перегляд результатів групи (для викладача)</button></div>'}
function quiz(){var r=st.round[st.index];return'<div class="card"><div class="pg"><i style="width:'+Math.round(st.index/st.round.length*100)+'%"></i></div><p class="k">Ситуація '+(st.index+1)+' із '+st.round.length+'</p><p style="font-weight:700;margin:0 0 10px">Який стиль поведінки в конфлікті це ілюструє?</p><div class="quote">'+ICON+'<div>'+esc(r.s.t)+'</div></div>'+r.order.map(function(k){var e=stOf(k);return'<button class="cb" data-a="pick" data-k="'+k+'"><span class="em">'+e.e+'</span><span>'+e.l+'</span></button>'}).join("")+'</div>'}
function feedback(){var a=st.ans[st.index],r=st.round[st.index],last=st.index>=st.round.length-1;
return'<div class="card"><div class="pg"><i style="width:'+Math.round((st.index+1)/st.round.length*100)+'%"></i></div><p class="k">Ситуація '+(st.index+1)+' із '+st.round.length+'</p><div class="quote">'+ICON+'<div>'+esc(r.s.t)+'</div></div><div class="box" style="margin:0 0 18px;border-left:4px solid '+(a.ok?"#2E7D6B":"#B3492F")+'"><b>'+(a.ok?"✓ Правильно!":"✕ Неправильно")+'</b><div class="mut sm" style="margin:4px 0 8px">Ваша відповідь: '+lab(a.chosen)+(a.ok?"":" · Правильна: "+lab(a.correct))+'</div><div class="sm">'+esc(r.s.x)+'</div></div><button class="btn pri" data-a="next">'+(last?"Дивитися підсумок →":"Наступна ситуація →")+'</button></div>'}
function report(){var n=score(),N=st.ans.length,v=verdict(n,st.ans),L=["«Який це стиль?» (Заняття 6)","Студент: "+(st.name||"—"),"Правильно: "+n+" з "+N];
styleStats().forEach(function(x){L.push(x.s.l+": "+x.right+" з "+x.seen)});L.push("Підсумок: "+v[0]);var c=confusion();if(c)L.push(c);
var miss=st.ans.map(function(a,i){return{a:a,i:i}}).filter(function(x){return!x.a.ok});
if(miss.length){L.push("Помилки:");miss.forEach(function(x){L.push("№"+(x.i+1)+": обрано "+stOf(x.a.chosen).l+", правильно "+stOf(x.a.correct).l)})}
return L.join("\n")}
function results(){var N=st.ans.length,n=score(),v=verdict(n,st.ans);
var miss=st.ans.map(function(a,i){return{a:a,i:i}}).filter(function(x){return!x.a.ok});
var mh=miss.length?miss.map(function(x){return'<div class="box" style="margin-top:8px"><b>Ситуація '+(x.i+1)+'.</b> Ви обрали '+lab(x.a.chosen)+', а це було '+lab(x.a.correct)+'. <span class="mut">Підказка: зверніть увагу на '+stOf(x.a.correct).c+'.</span></div>'}).join(""):'<p class="mut sm">Помилок немає.</p>';
var c=confusion();
var rows=st.ans.map(function(a,i){return'<tr><td>'+(i+1)+'</td><td>'+lab(a.correct)+'</td><td>'+lab(a.chosen)+'</td><td>'+(a.ok?"✓":"✕")+'</td></tr>'}).join("");
return'<div class="card">'+(st.name?'<p class="k">'+esc(st.name)+'</p>':"")+'<h1 class="serif">Ваш результат</h1>'+bar("Правильно",n,N,"#C9962C")+'<div class="hero"><div class="lb">ПІДСУМОК</div><div class="nm">'+v[0]+'</div><p>'+v[1]+'</p></div><h2>Таблиця за ситуаціями</h2><div style="overflow-x:auto"><table><tr><th>№</th><th>Правильний стиль</th><th>Ваша відповідь</th><th></th></tr>'+rows+'</table></div><h2>Розбір помилок</h2>'+mh+(c?'<p class="mut sm" style="margin-top:12px">'+c+'</p>':"")+(st.manual?'<div class="box"><p class="sm">Автокопіювання недоступне. Виділіть текст і скопіюйте вручну:</p><textarea id="man" rows="9" readonly>'+esc(st.manual)+'</textarea></div>':"")+'<div class="row"><button class="btn" data-a="copy">Скопіювати результат</button><button class="btn" data-a="retry">Спробувати ще раз</button></div><button class="link" data-a="teacher">Перегляд результатів групи (для викладача)</button></div>'}
function csvEsc(s){return'"'+String(s==null?"":s).replace(/"/g,'""')+'"'}
function toCsv(rows){var h=["Ім’я","Дата","Правильно (з 10)"].concat(ST.map(function(e){return e.l})).concat(["Підсумок"]);
var L=[h.map(csvEsc).join(";")];rows.forEach(function(r){var m=r.sty||{};L.push([r.name||"",r.date||"",r.n].concat(ST.map(function(e){var x=m[e.k]||[0,0];return x[0]+" з "+x[1]})).concat([r.verdict||""]).map(csvEsc).join(";"))});return"\uFEFF"+L.join("\r\n")}
function record(){var m={};styleStats().forEach(function(x){m[x.s.k]=[x.right,x.seen]});return{name:st.name,ts:Date.now(),date:new Date().toLocaleString("uk-UA"),n:score(),sty:m,verdict:verdict(score(),st.ans)[0]}}
function save(){if(st.saved)return;st.saved=true;try{if(window.storage&&window.storage.set){window.storage.set("responses:"+Date.now()+"-"+Math.floor(Math.random()*1e6),JSON.stringify(record()),true).catch(function(){})}}catch(e){}}
function loadAll(cb){try{if(!window.storage||!window.storage.list){cb(null);return}
window.storage.list("responses:",true).then(function(r){var keys=(r&&r.keys)||[];return Promise.all(keys.map(function(k){return window.storage.get(k,true).then(function(x){return x?JSON.parse(x.value):null}).catch(function(){return null})}))}).then(function(arr){cb(arr.filter(Boolean).sort(function(a,b){return b.ts-a.ts}))}).catch(function(){cb(null)})}catch(e){cb(null)}}
function teacherHtml(){var t=st.teacher,b;
if(t==="load")b='<p class="mut">Завантаження…</p>';
else if(t===null||t===undefined)b='<p class="mut">Збереження результатів недоступне в цьому режимі (наприклад, файл відкрито без чату). Користуйтеся кнопкою «Скопіювати результат» на екрані підсумку.</p>';
else if(!t.length)b='<p class="mut">Результатів поки немає.</p>';
else{var n=t.length,avg=(t.reduce(function(s,r){return s+r.n},0)/n).toFixed(1);
var hard=ST.map(function(e){var R=0,S1=0;t.forEach(function(r){var x=(r.sty||{})[e.k];if(x){R+=x[0];S1+=x[1]}});return bar(e.e+" "+e.l,R,S1,e.col)}).join("");
b='<p class="sm"><b>Учасників:</b> '+n+' · середній результат: '+avg+' з 10</p><h2 style="margin-top:14px">Правильні відповіді за стилями (усі учасники)</h2>'+hard+'<div style="overflow-x:auto;margin-top:12px"><table><tr><th>Ім’я</th><th>Дата</th><th>Результат</th></tr>'+t.map(function(r){return'<tr><td>'+esc(r.name||"—")+'</td><td>'+esc(r.date||"")+'</td><td>'+r.n+'/10</td></tr>'}).join("")+'</table></div>'}
return'<div class="ov"><div class="card"><h1 class="serif" style="font-size:22px">Результати групи</h1>'+b+(st.csvText?'<div class="box"><p class="sm">Завантаження недоступне. Скопіюйте CSV:</p><textarea rows="6" readonly>'+esc(st.csvText)+'</textarea></div>':"")+'<div class="row"><button class="btn" data-a="tcsv"'+(st.teacher&&st.teacher!=="load"&&st.teacher.length?"":" disabled")+'>Експорт CSV</button><button class="btn" data-a="trefresh">Оновити</button><button class="btn" data-a="tclose">Закрити</button></div></div></div>'}
function render(){var m={intro:intro,quiz:quiz,feedback:feedback,results:results};app.innerHTML='<div class="st">'+m[st.screen]()+'</div>'+(st.teacherOpen?teacherHtml():"");if(!st.teacherOpen)window.scrollTo(0,0)}
function openTeacher(){st.teacherOpen=true;st.teacher="load";st.csvText="";render();loadAll(function(r){st.teacher=r;render()})}
function choose(k){var r=st.round[st.index];st.ans.push({id:r.s.id,correct:r.s.st,chosen:k,ok:k===r.s.st});st.screen="feedback";render()}
function copyReport(){var t=report();function fb(){st.manual=t;render();var x=document.getElementById("man");if(x&&x.select)x.select()}
try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){st.manual="";var b=app.querySelector('[data-a="copy"]');if(b)b.textContent="Скопійовано ✓"},fb)}else fb()}catch(e){fb()}}
function downloadCsv(){var csv=toCsv(st.teacher);try{var bl=new Blob([csv],{type:"text/csv;charset=utf-8"}),u=URL.createObjectURL(bl),a=document.createElement("a");a.href=u;a.download="Стиль_Томаса-Кілманна_результати.csv";document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(u)},1000)}catch(e){st.csvText=csv;render()}}
app.addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(!b)return;var a=b.dataset.a;
if(a==="start"){var n=document.getElementById("nm");st.name=n?n.value.trim():"";st.round=pickRound();st.index=0;st.ans=[];st.saved=false;st.manual="";st.screen="quiz";render()}
else if(a==="pick")choose(b.dataset.k);
else if(a==="next"){if(st.index>=st.round.length-1){st.screen="results";save()}else{st.index++;st.screen="quiz"}render()}
else if(a==="retry"){st.screen="intro";st.ans=[];st.index=0;st.manual="";render()}
else if(a==="copy")copyReport();
else if(a==="teacher"||a==="trefresh")openTeacher();
else if(a==="tcsv")downloadCsv();
else if(a==="tclose"){st.teacherOpen=false;st.csvText="";render()}});
document.addEventListener("keydown",function(e){if(st.teacherOpen||/INPUT|TEXTAREA/.test(e.target.tagName||""))return;
if(st.screen==="quiz"&&/^[1-5]$/.test(e.key))choose(st.round[st.index].order[+e.key-1])});
window.__tki={SC:SC,ST:ST,pickRound:pickRound,verdict:verdict,toCsv:toCsv,st:st};
render();
})();
</script></body></html>
