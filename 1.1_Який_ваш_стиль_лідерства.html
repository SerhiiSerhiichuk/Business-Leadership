function quiz(){var it=ITEMS[st.i],sel=st.a[it.id];
var o=L.map(function(l,j){return'<button class="opt'+(sel===j+1?" on":"")+'" data-a="v" data-v="'+(j+1)+'"><b>'+(j+1)+'</b>'+l+'</button>'}).join("");
return'<div class="card"><div class="pg"><i style="width:'+Math.round(st.i/21*100)+'%"></i></div><p class="k">Твердження '+(st.i+1)+' із 21 · залишилось '+(20-st.i)+'</p><p class="stmt serif">'+it.t+'</p><p class="mut sm" style="margin-bottom:10px">Як часто це про вас?</p><div class="opts">'+o+'</div><div class="nav"><button class="btn ghost" data-a="back"'+(st.i?"":' style="visibility:hidden"')+'>← Назад</button><span class="mut sm">Відповідайте чесно</span></div></div>'}
function casesHtml(){var R=st.rd[st.ri];
return'<p class="mut sm" style="margin:0 0 10px"><b>Раунд '+(st.ri+1)+' із 3</b> · який стиль найкращий у цій ситуації?</p>'+R.map(function(x,i){return'<div class="case"><p><b>Ситуація '+(i+1)+'.</b> '+x.t+'</p><div class="ch">'+ORD.map(function(k){return'<button data-a="cs" data-c="'+i+'" data-k="'+k+'"'+(x.a?" disabled":"")+(x.a===k?' class="sel"':"")+'><span style="font-size:22px;line-height:1.2">'+S[k].e+'</span><span>'+S[k].n+'</span></button>'}).join("")+'</div>'+(x.a?'<div class="fb">'+(x.a===x.b?"✓ <b>Добрий вибір.</b> ":"Можливо, але найкраще тут підійде <b>"+S[x.b].e+" "+S[x.b].n+"</b>. ")+x.w+'</div>':"")+'</div>'}).join("")+'<button class="btn pri" data-a="next" style="margin-top:6px">'+(st.ri<2?"🔄 Оновити: наступні 5 ситуацій":"Завершити 🎉")+'</button>'}
function showEnd(){var m=document.createElement("div");m.id="end";m.className="ov";m.innerHTML='<div class="card" style="max-width:460px;text-align:center"><div style="font-size:42px">🎉</div><h1 class="serif" style="font-size:24px">Дякуємо, що пройшли до кінця!</h1><p class="mut">Ви пройшли всі 3 раунди й побачили, що найкращий стиль залежить від ситуації.'+(st.an?' Найдоречніший стиль ви обрали в '+st.ok+' із '+st.an+' ситуацій.':'')+'</p><p>Бажаємо вам бути гнучким лідером: уміти і швидко вести за собою, і слухати команду, і вчасно довіряти. Нехай ваша команда росте разом із вами.</p><div class="row"><button class="btn" data-a="close">Закрити</button><button class="btn pri" data-a="retake" style="width:auto">Пройти ще раз</button></div></div>';app.appendChild(m)}
function results(){var r=st.r,s=r.s,o=r.o;
var bars=ORD.map(function(k){return'<div class="bar"><div class="bl"><span>'+S[k].e+" "+S[k].n+'</span><span>'+fmt(s[k])+' / 10 · '+lv(s[k])+'</span></div><div class="bt"><i style="width:'+s[k]*10+'%;background:'+S[k].c+';opacity:'+(r.flat||o[0]===k||(r.pair&&o[1]===k)?1:.55)+'"></i></div></div>'}).join("");
var hero;
if(r.flat)hero='<div class="lb">ПРОФІЛЬ</div><div class="nm">Рівномірний профіль</div><p>Ваші бали майже однакові: ви можете гнучко змінювати стиль залежно від ситуації, а можете давати «серединні» відповіді. Згадайте три реальні ситуації й подивіться, який стиль ви застосовували насправді.</p>';
else if(r.pair){var a=o[0],b=o[1];hero='<div class="lb">ЗМІШАНИЙ ПРОФІЛЬ</div><div class="nm">'+S[a].e+" "+S[a].n+" + "+S[b].e+" "+S[b].n+'</div><p>'+PAIR[[a,b].sort().join("")]+'</p><p><b>🎯 Дія тижня:</b> '+S[a].tip+'</p>'}
else{var k=o[0];hero='<div class="lb">ДОМІНУЮЧИЙ СТИЛЬ</div><div class="nm">'+S[k].e+" "+S[k].nm+" · "+S[k].n+'</div><p><b>Ваша фраза:</b> '+S[k].q+'</p><p><b>Коли доречний:</b> '+S[k].ok+'</p><p><b>Коли ризикований:</b> '+S[k].rk+'</p><p><b>🎯 Дія тижня:</b> '+S[k].tip+'</p>'}
var acc=ORD.map(function(k){return'<details><summary>'+S[k].e+" "+S[k].nm+" · "+S[k].n+" · "+lv(s[k])+'</summary><p><b>'+S[k].q+'</b></p><p>Доречний: '+S[k].ok+'</p><p>Ризик: '+S[k].rk+'</p></details>'}).join("");
return'<div class="card">'+(st.n?'<p class="k">'+esc(st.n)+'</p>':"")+'<h1 class="serif">Ваш профіль лідерства</h1><p class="mut sm">Кожна пелюстка показує, наскільки виражений стиль (від 0 до 10, пунктир — максимум). Рівна «квітка» означає гнучкий профіль. У центрі — середній бал. Рівні: нижче 3,75 — низький, від 3,75 до 6,25 — середній, від 6,25 — високий («Часто» і частіше).</p>'+petal(r)+'<h2>Ваші бали</h2>'+bars+'<div class="hero">'+hero+'</div><div class="box"><b>Пам\'ятайте:</b> це схильності, а не «тип людини». Дослідники лідерства показують, що найкращий лідер змінює стиль залежно від ситуації та готовності команди.</div><h2>Усі три стилі</h2>'+acc+'<h2>Застосуйте на практиці</h2><p class="mut sm">Для кожної ситуації оберіть найкращий стиль і прочитайте пояснення. Усього 3 раунди по 5 ситуацій: стилі й ситуації випадають випадково.</p><div id="cases">'+casesHtml()+'</div><div class="row"><button class="btn" data-a="retake">Пройти ще раз</button></div></div>'}
function render(){app.innerHTML='<div class="st">'+({intro:intro,quiz:quiz,results:results}[st.s])()+'</div>';window.scrollTo(0,0)}
function pick(v){if(st.lock)return;var it=ITEMS[st.i];st.a[it.id]=v;st.lock=1;save();document.querySelectorAll(".opt").forEach(function(o){o.classList.toggle("on",+o.dataset.v===v)});
setTimeout(function(){st.lock=0;if(st.s!=="quiz")return;if(st.i<20){st.i++;save();render()}else{var R={A:0,D:0,L:0};ITEMS.forEach(function(x){R[x.s]+=st.a[x.id]||0});st.r=calc(R);st.rd=makeRounds();st.ri=0;st.ok=0;st.an=0;st.s="results";try{localStorage.removeItem("ls1")}catch(e){}render()}},200)}
function back(){if(st.s==="quiz"&&st.i>0){st.i--;render()}}
app.addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(!b)return;var a=b.dataset.a;
if(a==="start"){st.n=document.getElementById("nm").value.trim();st.a={};st.i=0;st.saved=0;st.s="quiz";save();render()}
else if(a==="cont"){st.n=document.getElementById("nm").value.trim();st.s="quiz";render()}
else if(a==="v")pick(+b.dataset.v);else if(a==="back")back();
else if(a==="retake"){st.a={};st.i=0;st.r=null;st.saved=0;st.s="intro";render()}
else if(a==="cs"){var q=st.rd[st.ri][+b.dataset.c];if(q.a)return;q.a=b.dataset.k;st.an++;if(q.a===q.b)st.ok++;document.getElementById("cases").innerHTML=casesHtml()}
else if(a==="next"){if(st.ri<2){st.ri++;var cc=document.getElementById("cases");cc.innerHTML=casesHtml();cc.scrollIntoView({behavior:"smooth",block:"start"})}else showEnd()}
else if(a==="close"){var m=document.getElementById("end");if(m)m.remove()}});
document.addEventListener("keydown",function(e){if(st.s!=="quiz")return;if(/^[1-5]$/.test(e.key))pick(+e.key);else if(e.key==="Backspace"||e.key==="ArrowLeft")back()});
render();
})();
</script></body></html>
