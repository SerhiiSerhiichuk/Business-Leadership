function intro(){return'<div class="card"><p class="k">Практичне заняття 5 · Бізнес-лідерство</p><h1 class="serif">Самооцінка емоційного інтелекту</h1><p class="mut">20 коротких тверджень про те, як ви зазвичай поводитеся зі своїми емоціями й емоціями інших. Це навчальна самооцінка за мотивами п\'яти компонентів EQ за Деніелом Гоулманом, а не діагноз.</p><ul class="mut sm" style="padding-left:20px;margin:0 0 16px"><li>Правильних відповідей немає: відповідайте так, як є, а не як мало б бути.</li><li>Згадайте останні пів року: навчання, робота, друзі, сім\'я.</li><li>Перша думка зазвичай найточніша. Можна натискати клавіші 1–5.</li></ul><div class="ex"><b>Приклад.</b> «Я роблю паузу, перш ніж відповісти різко». Оберіть, як часто це про вас: від «Ніколи» до «Майже завжди».</div><label class="sm" for="nm"><b>Ім\'я або псевдонім</b> <span class="mut">(необов\'язково, потрапить у код для викладача)</span></label><input id="nm" maxlength="40" value="'+esc(st.n)+'" style="margin:6px 0 18px">'+(st.saved?'<button class="btn pri" data-a="cont" style="margin-bottom:10px">Продовжити з твердження '+(st.i+1)+'</button><button class="btn" data-a="start" style="width:100%">Почати спочатку</button>':'<button class="btn pri" data-a="start">Почати</button>')+'<p class="mut sm" style="margin:18px 0 0;text-align:center">20 тверджень · близько 5 хвилин</p><button class="link" data-a="teacher">Для викладача: зведення групи</button></div>'}

function showEnd(){var m=document.createElement("div");m.id="end";m.className="ov";m.innerHTML='<div class="card" style="max-width:460px;text-align:center"><div style="font-size:42px">🎉</div><h1 class="serif" style="font-size:24px">Дякуємо, що пройшли до кінця!</h1><p class="mut">Ви пройшли всі 5 раундів ситуацій і побачили, що кожна навичка EQ працює у своїх обставинах.'+(st.an?' Найдоречнішу навичку ви обрали в '+st.ok+' із '+st.an+' ситуацій.':'')+'</p><p>Бажаємо вам емоційної мудрості: чути себе, тримати себе в руках і бачити людей поруч. Нехай кожна складна розмова стане нагодою стати сильнішим лідером.</p><div class="row"><button class="btn" data-a="close">Закрити</button><button class="btn pri" data-a="retake" style="width:auto">Пройти ще раз</button></div></div>';app.appendChild(m)}

return'<div class="card">'+(st.n?'<p class="k">'+esc(st.n)+'</p>':"")+'<h1 class="serif">Ваш профіль EQ</h1><p class="mut sm">Кожна пелюстка показує, наскільки розвинений компонент за шкалою від 0 до 10 (пунктир — максимум). Чим рівніша зірка, тим збалансованіший ваш емоційний інтелект. У центрі — середній бал. Рівні: нижче 3,75 — низький, від 3,75 до 6,25 — середній (відповіді навколо «Іноді»), від 6,25 — високий («Часто» і частіше).</p>'+petal(r)+'<h2>Ваші бали</h2>'+bars+'<div class="hero">'+hero+'</div><h2>Дві групи навичок</h2><p class="mut sm">Особисті навички — це «внутрішня» частина EQ: самоусвідомлення, саморегуляція й мотивація. Соціальні — «зовнішня»: емпатія та соціальні навички. У першій групі три компоненти, а в другій два, тому порівнюємо середні бали.</p>'+ax("🧠","Особисті навички","Наскільки я розумію й веду себе",r.pe,["SA","SR","MO"],r,["Керувати власними емоціями та мотивацією вам зараз складно: допоможуть невеликі щоденні практики.","Ви непогано керуєте собою, але під стресом чи без підтримки цей баланс може хитатися.","Ви добре розумієте власні емоції, тримаєте себе в руках і вмієте себе мотивувати."])+ax("👥","Соціальні навички","Наскільки я працюю з іншими",r.so,["EM","SS"],r,["Взаємодія з людьми дається вам складніше: допоможуть практики уважного слухання.","Ви зазвичай добре ладнаєте з людьми, але не завжди помічаєте настрій чи вмієте донести складне.","Ви чуйні до людей і вмієте будувати стосунки та впливати."])+'<h2>Усі п\'ять компонентів</h2>'+acc+'<h2>Застосуйте на практиці</h2><p class="mut sm">Для кожної ситуації оберіть навичку EQ, яка потрібна насамперед, і прочитайте пояснення. Усього 5 раундів по 5 ситуацій, щоразу випадкові.</p><div id="cases">'+casesHtml()+'</div><div class="row"><button class="btn" data-a="retake">Пройти ще раз</button></div><button class="link" data-a="teacher">Для викладача: зведення групи</button></div>'}

out.innerHTML='<h2>Відповідей: '+rows.length+'</h2><p class="mut sm">Довжина смужки — середній бал групи (з 10). Число показує, скільком студентам цей компонент найсильніший.</p>'+bars+tb}
