<style>
:root{--ink:#1E2761;--ink2:#384080;--bg:#F3F6FC;--card:#fff;--gold:#C9962C;--goldsoft:#F3E4C6;--mut:#5B6685;--line:#DDE4F5;--hero:#1E2761;--red:#B3492F;--green:#2E7D6B;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--ink:#E8ECFF;--ink2:#B9C2F0;--bg:#10142B;--card:#1A2040;--gold:#E0AE45;--goldsoft:#3A3420;--mut:#A3ADD3;--line:#2E3664;--hero:#2B3575}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:34px 30px;box-shadow:0 18px 40px -26px rgba(30,39,97,.4)}

.k{font-size:13px;color:var(--mut);margin:0 0 8px}h1{font-size:27px;line-height:1.2;margin:0 0 12px}h2{font-size:18px;margin:26px 0 10px}p{margin:0 0 12px}.mut{color:var(--mut)}.sm{font-size:14px}
input,textarea{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);font:inherit;font-size:15px;color:var(--ink);background:var(--bg)}

.pri{background:var(--ink);color:var(--bg);border-color:var(--ink);width:100%}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.row .btn{flex:1;min-width:150px}

.box{margin-top:14px;padding:14px 16px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:14px}

:root[data-theme="dark"] .quote{color:var(--ink)}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .quote{color:var(--ink)}}
.quote svg{flex:none}
details{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px}summary{cursor:pointer;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
.link{display:block;margin:18px auto 0;background:none;border:none;color:var(--mut);font-size:13px;text-decoration:underline;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(10,14,40,.62);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}.ov .card{max-height:90vh;overflow:auto;width:100%;max-width:760px}
.cb{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:13px 14px;margin-bottom:8px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px;cursor:pointer}.cb .em{font-size:24px}.cb:hover:not(:disabled){border-color:var(--gold)}.cb:disabled{cursor:default}
.cb.ok{border-color:var(--green);background:color-mix(in srgb,#2E7D6B 18%,var(--bg))}.cb.no{border-color:var(--red);background:color-mix(in srgb,#B3492F 18%,var(--bg))}.cb.mid{border-color:var(--gold);background:color-mix(in srgb,#C9962C 18%,var(--bg))}
.cb.dim{opacity:.62}.why{display:block;margin-top:6px;font-size:13.5px;color:var(--mut)}.tag{display:block;font-weight:700;font-size:13px;margin-bottom:2px}
.el{margin:0 0 8px;display:flex;gap:12px;align-items:flex-start}.el .n{font-size:24px}
</style></head><body><div id="app"></div>

(function(){
var EL=[
{k:"aw",e:"💡",l:"Awareness — Усвідомлення",s:"Не розуміє, навіщо потрібні зміни і яку проблему вони розв’язують.",c:"розуміння причини: чи бачить людина проблему, яку розв’язує зміна",col:"#C9962C"},
{k:"de",e:"🔥",l:"Desire — Бажання",s:"Розуміє зміну, але не хоче в ній брати участь: має особисту причину.",c:"особисту ціну зміни (втрату, недовіру, страх за роль чи звички) при цілком зрозумілій причині",col:"#B3492F"},
{k:"kn",e:"📚",l:"Knowledge — Знання",s:"Хоче змінитися, але не знає, що саме й у якій послідовності робити.",c:"готовність діяти разом із прямими чи прихованими запитаннями «що, як, за якими правилами»",col:"#384080"},
{k:"ab",e:"🛠️",l:"Ability — Уміння",s:"Знає як, але на практиці бракує навички, часу чи ресурсів.",c:"розрив між «знаю, як це робиться» і реальною спроможністю: навичка, час, обладнання",col:"#2E7D6B"},
{k:"re",e:"🔁",l:"Reinforcement — Закріплення",s:"Нове вже робили, але повертаються до старого, бо ніщо не підтримує зміну.",c:"відкат після початкового періоду та відсутність визнання, наслідків чи контролю",col:"#7A4FA0"}];
function S(id,el,t,x,g,gw,m,mw,p,pw){return{id:id,el:el,t:t,x:x,o:[{q:2,t:g,w:gw},{q:1,t:m,w:mw},{q:0,t:p,w:pw}]}}
var SC=[
S("a1","aw","Менеджерка з продажу, дев’ять років у компанії: «Скарги клієнтів? Я їх не чую. Таблиця працює, цифри сходяться. Навіщо щось міняти?» Лист про нову CRM вона так і не відкрила.","Людина не бачить проблеми, яку зміна має розв’язати, і ставить питання «навіщо». Заперечень ні проти системи, ні проти навчання немає, бракує лише розуміння причини. Шукайте розрив між картиною змін у голові керівництва й у голові працівника.",
"Показати їй, скільки заявок губиться в таблиці й що пишуть клієнти у скаргах","Конкретні факти про наслідки старого способу створюють розуміння потреби, а не просто повідомляють про неї.",
"Розіслати всьому відділу лист із переліком можливостей нової системи та датами її запуску","Інформація є, але про можливості, а не про причину, і без розмови з тими, хто не бачить проблеми.",
"Записати її на навчання роботі із системою, щоб вона почала користуватися нею вчасно","Це втручання на рівні знань: навчати того, хто не розуміє, навіщо, означає не потрапити в причину."),
S("a2","aw","Бухгалтер після зборів: «Нам сказали, що компанія переходить на новий облік. А що не так зі старим? Ніхто нічого не пояснив, тож я просто чекаю, що воно саме минеться».","Це не відмова, а нерозуміння причини: працівник чекає, що ініціатива згасне, бо не знає, що її спричинило. Шукайте відсутність пояснення «чому саме зараз» і пасивне очікування замість запитань про те, як працювати.",
"Особисто пояснити, що змінилося на ринку й чому старий облік більше не справляється","Людина отримує причину й наслідки бездіяльності, тобто саме те, чого їй бракує для першого кроку.",
"Показати на планерці один слайд із причиною змін і одразу перейти до наступного пункту","Причину озвучено, але без діалогу ніхто не перевірив, чи вона зрозуміла й чи з’явилися запитання.",
"Нагадати про кінцевий термін переходу й пояснити, що відповідальність за терміни лежить на кожному","Тиск без пояснення причини лише посилює пасивність, а ключова прогалина лишається відкритою."),
S("a3","aw","Комірник: «Склад працює без збоїв уже десять років. Ваш сканер штрихкодів — іграшка для великих мереж, нам він не потрібен». Накладні заповнює вручну, як завжди, а на жодну презентацію проєкту не ходив.","Людина судить про потребу зі свого досвіду й не знає ні причин змін, ні планів компанії. Шукайте впевненість «ми й так добре працюємо» та відсутність інформації, з якої вона могла б зробити інший висновок.",
"Розповісти, які замовлення компанія втрачає через помилки ручного обліку на складі","Зв’язок між помилками й власною роботою перетворює абстрактну зміну на зрозумілу причину.",
"Запросити його на загальну презентацію проєкту, не прив’язуючи її до проблем самого складу","Він дізнається про зміни, але без зв’язку зі своєю роботою не побачить, чому вони його стосуються.",
"Видати сканер і провести тренування з ним, щоб комірнику було легше змінити звички","Тренування не зачіпає причини: людина навчиться, але сенсу змін усе одно не побачить."),
S("a4","aw","Керівник відділу: «Ми закрили квартал краще за всіх, тож яке відношення має до нас реорганізація? Причин мені ніхто не називав: прийшов лише календар зустрічей». Питає виключно про перенесення дат.","Людина не знає, чому реорганізація потрібна, і виводить висновок зі своїх успіхів. Комунікація звелася до логістики, а не до суті. Шукайте запитання лише про терміни й жодного про зміст.",
"Поговорити віч-на-віч: показати ринкові та фінансові причини реорганізації й чому зачіпають і успішні відділи","Він отримує причину, яка пояснює, чому зміни стосуються і його, попри хороші цифри.",
"Надіслати схему нової структури з ролями й датами, щоб він побачив, що саме змінюється","Структура зрозуміла, але без пояснення причин людина й далі не побачить, навіщо це їй.",
"Призначити його куратором однієї з груп проєкту, щоб він мав особистий інтерес до результату","Це спроба збудити бажання, але без розуміння причини зацікавленість не виникне."),
S("a5","aw","Інженерка підтримки: «Ми щойно запровадили нові тікети, а тепер ще й чат-бот? Чула, що клієнти скаржаться на довгі відповіді, але в нас такого не було». Звітів про час відповіді вона ніколи не бачила.","Заперечення спирається на брак інформації: вона не бачила даних про проблему й вважає її вигаданою. Шукайте фразу «в нас такого не було» і відсутність доступу до цифр, які могли б проблему підтвердити.",
"Відкрити їй звіти про час відповіді й розібрати три конкретні скарги клієнтів","Власні очі на дані й приклади роблять проблему справжньою, а не чужою історією.",
"Сказати на планерці, що клієнти скаржаться на швидкість, і запропонувати всім подумати про причини","Проблему названо, але без даних і прикладів вона лишається для неї чужою історією.",
"Призначити їй наставника з чат-бота, щоб вона швидко навчилася ним користуватися","Навчання не відповідає причині: вона не бачить проблеми, а не не вміє працювати з ботом."),
S("d1","de","Старша менеджерка: «Я розумію, чому потрібна нова CRM. Але мої клієнти — це моя база, а в системі її бачитимуть усі. Віддавати це за гарні звіти я не хочу». Систему відкриває, але контактів не вносить.","Причину змін людина розуміє й сама формулює, але бачить особисту втрату (контроль над базою). Шукайте поєднання «розумію» з «але» та конкретний особистий страх втратити.",
"Обговорити, що вона виграє й втрачає, та домовитися про доступ до її клієнтів","Розмова про особисту ціну зміни торкається справжньої причини, а права доступу знімають страх втрати.",
"Пояснити на зборах, що спільна база потрібна компанії та що правила однакові для всіх","Спільну вигоду названо, але особистих побоювань конкретної людини ніхто не торкнувся.",
"Запропонувати ще один тренінг із функцій CRM, щоб вона почувалася впевненіше в системі","Вона розуміє систему й може нею користуватися; тренінг не зніме побоювань щодо втрати контролю."),
S("d2","de","Аналітик: «Так, новий звіт нам потрібен, бачу чому. Але я роками налаштовував свій Excel, мене цінують саме за це. Після переходу я стану одним із багатьох». Нову форму звіту обіцяє зробити «колись».","Усвідомлення є, а гальмом стають статус і самоцінність. Людина чесно називає, що втрачає (унікальну експертність). Шукайте «так, але», особисту вигоду від старого способу й обіцянки «колись» без дій.",
"Обговорити з ним нову роль у проєкті: автор шаблонів звітів, якими користуватимуться всі","Нова роль повертає йому відчуття цінності, тобто компенсує те, що він боїться втратити.",
"Сказати, що компанія високо цінує його досвід, і подякувати за роки роботи з таблицями","Визнання приємне, але нової ролі й перспективи він не бачить, тож мотивація майже не змінюється.",
"Скласти графік переходу з жорсткими датами, щоб він міг заздалегідь спланувати навантаження","Графік не відповідає на його питання, що він втрачає, тож терміни тихо зсуватимуться."),
S("d3","de","Керівник зміни: «Півроку тому нас обіцяли розвантажити, а нова система додала лише полів для заповнення. Мені знову повірити? Не бачу, що моя команда виграє». Зустрічі проєкту відвідує, але мовчить.","Людина розуміє, що відбувається, проте не вірить у користь для команди, бо попередній досвід підвів. Шукайте недовіру, прив’язану до минулого, та відсутність особистого «що ми виграємо».",
"Показати на його процесах, які кроки зникнуть, і справді прибрати один зайвий звіт","Реальний, перевірюваний виграш відновлює довіру краще за будь-які слова.",
"Пообіцяти, що цього разу навантаження зменшиться, і повернутися до розмови після першого місяця","Обіцянка без доказів повторює минулу помилку; перевірка через місяць лише частково відновлює довіру.",
"Надіслати йому відеоінструкцію зі швидкого заповнення полів, щоб навантаження відчувалося меншим","Це знання про заповнення полів, а його проблема в тому, що він не вірить у користь для команди."),
S("d4","de","Продавчиня: «Новий графік змін — зрозуміло, магазин має працювати довше. Але я домовлялася про вечори з дітьми. Скажу «добре», а там побачимо». На словах погодилась, а нові зміни в календарі не позначає.","Причину вона розуміє, але зіткнулася з особистою цінністю (час із дітьми), тому погоджується словами й ухиляється діями. Шукайте розрив між «добре» й бездіяльністю та особисту ціну змін.",
"Поговорити про її обмеження й разом знайти варіант, де вечірні години розподілено чесно","Розмова про реальні обмеження знімає конфлікт цінностей, який стоїть за мовчазною відмовою.",
"Пояснити, що нові години ввели через потік покупців, і запросити її ставити запитання","Причину вона й так розуміє; запрошення до запитань трохи допомагає, але її інтерес не враховано.",
"Роздрукувати графік, повісити в підсобці й зібрати підписи про ознайомлення від усіх працівників","Формальне ознайомлення не торкається її причини; на папері з’явиться лише підпис."),
S("d5","de","Юрист: «Автоматизація договорів — слушна ідея, ризики мені зрозумілі. Але якщо шаблони писатиме система, навіщо тоді мій відділ? Допомагати з упровадженням я не збираюся». На листи проєкту відповідає формально.","Він розуміє потребу й міг би навчитися, але боїться за свою позицію. Відмова сформульована як позиція, а не як нерозуміння. Шукайте страх втратити роль і формальну участь без внутрішньої залученості.",
"Обговорити, як зміниться роль його відділу, і письмово закріпити нові функції","Конкретна й закріплена роль у новій моделі відповідає на страх за позицію, що стоїть за відмовою.",
"Поділитися прикладами інших компаній, де юристи після автоматизації отримали складніші завдання","Приклади знімають частину побоювань, але його власної ситуації вони не розв’язують.",
"Призначити до відділу консультанта, який навчить команду працювати з шаблонами нової системи","Це тренування замість розмови: ризик для його позиції лишається, а ініціатива сприймається як тиск."),
S("k1","kn","Менеджерка з продажу: «Мене переконали, я справді хочу працювати в новій CRM. Але з чого починати? Як оформити угоду, щоб вона потрапила у воронку? Дзвонити й питати соромно». Систему відкриває щодня й закриває.","Мотивація очевидна (вона щодня намагається), бракує знання послідовності кроків. Шукайте конкретні запитання «як» і «з чого» та спроби діяти, які впираються в невідомість.",
"Дати їй покрокову інструкцію першої угоди й колегу, до якого можна звертатися","Конкретні кроки й безпечний канал для запитань закривають саме ту прогалину, яка її зупиняє.",
"Надіслати їй посилання на довідкову базу системи й попросити звертатися, якщо виникнуть питання","Матеріали є, але не структуровані під її завдання, тож питання «з чого почати» лишається.",
"Нагадати про важливість нової системи для компанії й подякувати за готовність до змін","Вона вже вмотивована; ще одна розмова про важливість не додає потрібного знання."),
S("k2","kn","Адміністраторка готелю: «Я бачу, що нова система бронювання краща, і хочу перейти. Але коли гість змінює дату разом з оплатою, не знаю, який пункт обрати. Інструкція описує лише просту бронь». Такі випадки передає на ручну обробку.","Готовність і розуміння причини є, а прогалина стосується конкретної процедури нестандартного випадку. Шукайте фрази «не знаю, який пункт» і ситуацію, яку навчання не охоплювало.",
"Дописати до інструкції складні сценарії (зміна дати, оплата, повернення) і показати їх на прикладах","Інструкція охоплює реальні складні випадки, тому прогалина закривається саме там, де вона є.",
"Провести ще одне загальне навчання із системи бронювання для всіх адміністраторів готелю","Загальне навчання повторює відоме, а її прогалина конкретна: складні випадки так і не розібрано.",
"Підтримати її: сказати, що нова система з часом стане звичною і вона просто призвичаїться","Заспокоєння не додає знання; без розбору складних випадків вона й далі передаватиме їх вручну."),
S("k3","kn","Інженер-технолог: «Я готовий працювати за новим стандартом, ми це вирішили. Але в документі написано «згідно з вимогами», а які саме, не знаю. Питати при всіх не хочу, у нас так не заведено». Працює за старим протоколом.","Готовність є, але інформація неповна, а культура не заохочує питати. Шукайте розпливчасті формулювання в документі та небажання публічно визнати прогалину.",
"Написати чіткий перелік вимог стандарту й дати спосіб ставити запитання без розголосу","Чіткі вимоги дають потрібне знання, а приватний канал прибирає бар’єр, який заважав запитати.",
"Надіслати йому повний текст нового стандарту, щоб він сам знайшов потрібні вимоги","Текст є, але вимоги розпорошені; без переліку й консультації прогалина залишається.",
"Призначити термін переходу на новий стандарт і щотижня перевіряти це на нарадах","Контроль без роз’яснень посилює його невпевненість, а потрібних відомостей він не отримає."),
S("k4","kn","Керівниця відділу: «Я погодилась на гнучкий графік, але не знаю, як тепер оцінювати роботу людей, яких не бачу. За чим дивитися: за часом чи за результатом? Нас цього не вчили». Тимчасово просить усіх бути в офісі.","Бажання є, але бракує управлінського знання нової моделі (як вимірювати результат). Шукайте запитання про метод, а не про сенс, і повернення до старих правил через невизначеність.",
"Дати їй методику оцінювання за результатом із прикладами показників і шаблоном щотижневої розмови","Вона отримує конкретний інструмент замість порожнього місця, яке змушувало її повертатися до контролю часу.",
"Запропонувати прочитати статтю про віддалене управління й обговорити її на нараді керівників","Теорія корисна, але конкретних показників для її відділу вона не дає.",
"Погодитися, що вона може вимагати присутності в офісі, поки команда не звикне до змін","Це відтерміновує зміну, а не дає знання; нова модель так і не запрацює."),
S("k5","kn","Новий менеджер із закупівель: «Хочу, щоб заявки йшли через нову систему. Але яка форма для яких закупівель, я не зрозумів: три відділи пояснили по-різному». Надсилає заявки і поштою, і через систему.","Людина діє й готова, а проблема в суперечливих поясненнях. Шукайте подвійні дії (старий і новий шлях) та різні версії правил від різних джерел.",
"Узгодити єдину інструкцію для відділів і призначити людину для запитань щодо форм","Єдине джерело правил усуває суперечності, а відповідальна людина закриває поточні запитання.",
"Зібрати пояснення відділів в одному листі й надіслати всім учасникам процесу закупівель","Матеріал зібрано, але суперечності не усунуто, тож людина й далі не знатиме правильного варіанта.",
"Заборонити надсилати заявки поштою, щоб він користувався лише новою системою без винятків","Заборона не усуває плутанини; без зрозумілих форм виникнуть зриви закупівель."),
S("b1","ab","Менеджерка: «Як вести угоду в CRM, я знаю, на тренінгу все вийшло. Але під час дзвінка клієнту я не встигаю і слухати, і друкувати. Увечері переношу все з блокнота». Скаржиться на втому, а вдень даних у системі немає.","Теорію вона засвоїла, а в реальних умовах бракує швидкості й часу. Шукайте розрив «на тренінгу вийшло, а в роботі ні» й конкретну практичну перешкоду.",
"Дати їй тиждень практики з наставником і скоротити форму угоди до ключових полів","Практика в реальних умовах і спрощення форми усувають саме ту перешкоду, що її зупиняє.",
"Показати колегу, який швидко вносить дані під час розмови, щоб вона побачила, як це робиться","Приклад корисний, але без власної практики й спрощення форми швидкість не з’явиться.",
"Повторити тренінг із оформлення угод у системі й перевірити її знання тестом","Знання в неї вже є; проблема в навичці й часі, тому повтор теорії нічого не змінить."),
S("b2","ab","Бухгалтерка: «Логіку нового модуля я розумію й хочу в ньому працювати. Але він зависає на великих звітах, а мій комп’ютер старий. Закриваю модуль і складаю звіт в Excel».","Знання й бажання присутні, перешкода лежить у ресурсах (обладнання), які сама людина усунути не може. Шукайте технічну чи ресурсну причину поза її контролем.",
"Замінити їй комп’ютер або надати потужніше робоче місце на час формування великих звітів","Усувається реальна перешкода, яку вона сама подолати не може.",
"Попросити її записувати випадки зависання, щоб передати їх ІТ-відділу для розгляду","Фіксація корисна, але вона не усуває перешкоди, і поки що звіти робитимуться в Excel.",
"Нагадати, що перехід на модуль є рішенням керівництва, і попросити більше не користуватися Excel","Вона й так розуміє потребу; заборона не усуває технічного обмеження й лише створює напругу."),
S("b3","ab","Керівник цеху: «Нову систему планування я розумію й хочу. Але щоранку в нас сорок хвилин оперативки з ручним обліком, а вносити дані в систему нема коли». Зміни в системі робить лише по п’ятницях.","Перешкода організаційна (немає часу в графіку), а не в бажанні чи знанні. Шукайте скарги на брак часу, спричинений наявними процесами.",
"Переглянути ранкову оперативку й виділити в графіку п’ятнадцять хвилин для внесення даних","Час для нової поведінки створюється за рахунок старої, і перешкода зникає.",
"Запропонувати делегувати внесення даних помічнику, коли в того з’явиться трохи вільного часу","Делегування можливе, але без зміни графіка помічник теж не матиме часу.",
"Пояснити, що нова система допоможе компанії скоротити витрати й підвищити ефективність цехів","Він це вже розуміє; ще один аргумент не додає йому часу на внесення даних."),
S("b4","ab","Лікарка: «Електронну картку я хочу вести, на навчанні все показали. Але пацієнт сидить навпроти, а я шукаю потрібну вкладку. Іноді записую на папері й вношу ввечері».","Знання є, а швидкості й рутини в реальних умовах бракує, що типово для початку змін. Шукайте різницю між навчальними й робочими умовами та тимчасовий відкат на папір.",
"Спростити вкладки під її типові прийоми й тиждень посидіти поруч із консультантом у прийомній","Навичка формується в реальних умовах, а інтерфейс спрощується під її щоденні задачі.",
"Пообіцяти, що з часом вона звикне до картки й вноситиме дані швидше, ніж зараз","Це правда, але без підтримки в перші тижні вона закріпить звичку вносити записи ввечері.",
"Провести розмову про те, як електронна картка покращує безпеку пацієнтів у клініці","Вона це розуміє й підтримує; розмова не додає швидкості."),
S("b5","ab","Менеджерка проєктів: «Усі формати ретроспектив я знаю й можу розповісти. Але щойно сідаю вести обговорення, команда мовчить, а я гублюся». Ретроспективи в неї виходять схожими на звичайну нараду.","Теоретичні знання є, а навички застосування в живій ситуації немає. Шукайте «все знаю, а на практиці не виходить» і спроби, що закінчуються старим форматом.",
"Провести з нею першу ретроспективу, показати прийоми ведення й розібрати зустріч після неї","Практика з наставником і розбір дають навичку, якої не вистачає, а не знання, яке в неї вже є.",
"Надіслати їй добірку відео про ретроспективи, щоб вона бачила, як проходять вдалі зустрічі","Відео показують приклад, але без практики з розбором навичка не формується.",
"Нагадати, що гнучкі методології — вибір компанії, і попросити послідовніше їх упроваджувати","Це звернення до обов’язку, але проблема в навичці, а не в небажанні."),
S("r1","re","Менеджер: «Перші два місяці вносив усе в CRM. Потім помітив, що дані ніхто не дивиться, а премії залежать від старих показників. Тож повернувся до своєї таблиці, так швидше».","Нову поведінку людина вже освоїла, але її не закріплено: стимули й контроль лишилися старими. Шукайте відкат після періоду використання та слова «ніхто не дивиться», «нічого не змінилося».",
"Прив’язати оцінювання й премії до даних у CRM та розглядати їх на щотижневих зустрічах","Нова поведінка стає вигідною й помітною, тож немає причин повертатися до таблиці.",
"Подякувати за перші місяці роботи та нагадати, що дані нової системи важливі для компанії","Подяка приємна, але стимули й перевірки не змінилися, тож відкат до старого лишається вигіднішим.",
"Запланувати ще одне навчання з функцій CRM, щоб він знову відчув упевненість у роботі","Він уміє працювати із системою; йому бракує закріплення й причини далі нею користуватися."),
S("r2","re","Комірниця: «Спочатку було цікаво: сканер, нові накладні. Але працюємо так уже три місяці, і ніхто не сказав, чи стало краще. Тож інколи записую, як раніше».","Зміну впроваджено, але немає зворотного зв’язку про результат і визнання, без яких повертаються старі звички. Шукайте «ніхто не сказав» і поступове повернення старих прийомів.",
"Показати складу результати в цифрах і відзначити тих, хто працює по-новому","Видимий результат і визнання підтверджують, що зусилля були недаремні, і закріплюють звичку.",
"Наприкінці кварталу зібрати склад на подячну розмову й обговорити враження від змін","Розмова корисна, але без конкретних результатів і відзначення людей вона слабко закріплює поведінку.",
"Розповісти про вигоду сканерів для компанії, щоб комірниці зрозуміли, навіщо їх запровадили","Причину вона вже знає; бракує підтвердження, що її зусилля дали результат."),
S("r3","re","Керівник відділу: «Коли систему щойно ввели, ми всі в ній працювали. Тепер половина колег знову шле звіти на пошту, а старі доступи нікому не закрили. Що ж, нехай обирають».","Нову практику не закріплено: старий шлях лишився доступним і рівноправним. Шукайте відкат колег до старих каналів і відсутність наслідків для тих, хто ними користується.",
"Закрити старий канал звітів і домовитися, що аналіз іде лише з нової системи","Повернення стає неможливим, а нова практика — єдиною нормою.",
"Нагадати на нараді, що звіти подають у системі, а поштою користуються якомога рідше","Нагадування дає короткий ефект, але поки старий шлях відкритий, повернення неминучі.",
"Організувати для відділу додаткове навчання з подання звітів, щоб усі колеги це вміли","Колеги вже вміють подавати звіти; їм бракує закріплення, а не навички."),
S("r4","re","Продавчиня: «На нову касу я перейшла й навіть полюбила її. Але керівник жодного разу не сказав «молодець», а колега, що працює по-старому, отримала ту саму премію. То навіщо старатися?» Останнім часом пропускає кроки процедури.","Поведінку було прийнято, але її не підкріплюють: немає визнання й різниці в наслідках між тими, хто дотримується процедури, і тими, хто ні. Шукайте відчуття несправедливості та поступове послаблення дотримання.",
"Відзначати тих, хто дотримується процедури, і змінити премію так, щоб різницю було видно","Видима різниця між виконанням і ухиленням повертає сенс дотримуватися нової процедури.",
"Поговорити з нею про важливість нової процедури й подякувати за її внесок у впровадження","Слова підтримки корисні, але без видимої різниці в наслідках вони швидко втрачають силу.",
"Роздати всім касирам нову інструкцію з процедурою, щоб кроки більше не пропускалися","Вона й так знає процедуру; їй бракує підкріплення, а не інструкції."),
