<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Трансформаційне vs транзакційне лідерство</title>
<style>
  :root {
    --ink: #1E2761;
    --ink-soft: #384080;
    --surface: #F3F6FC;
    --card: #FFFFFF;
    --gold: #C9962C;
    --gold-soft: #F3E4C6;
    --teal: #2E7D6B;
    --teal-soft: #DCEFE9;
    --muted: #5B6685;
    --line: #DDE4F5;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--surface);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
  }
  .serif { font-family: Cambria, Georgia, "Times New Roman", serif; }
  #app { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 18px; }
  .stage { width: 100%; max-width: 640px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 40px 36px; box-shadow: 0 18px 40px -24px rgba(30, 39, 97, 0.35);
  }
  @media (max-width: 480px) { .card { padding: 26px 20px; } }

  .kicker { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
  h1.title { font-size: 28px; line-height: 1.2; margin: 0 0 14px; font-weight: 700; }
  p.lead { font-size: 15px; line-height: 1.6; color: var(--muted); margin: 0 0 22px; }
  label.field-label { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; font-weight: 600; }
  input.text-input {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line);
    font-size: 15px; color: var(--ink); background: var(--surface); margin-bottom: 22px;
  }
  input.text-input:focus { outline: none; border-color: var(--gold); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 13px 26px; border-radius: 10px; border: none; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn-primary { background: var(--ink); color: #fff; width: 100%; }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 20px -12px rgba(30,39,97,0.6); }
  .btn-ghost { background: transparent; color: var(--muted); font-weight: 500; padding: 8px 4px; }
  .btn-ghost:hover { color: var(--ink); }
  .btn-secondary { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); }
  .meta-row { display: flex; gap: 22px; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); }
  .meta-item .num { font-weight: 700; font-size: 16px; }
  .meta-item .lbl { font-size: 12px; color: var(--muted); }
  .legend-row { display: flex; gap: 18px; margin-top: 4px; margin-bottom: 22px; }
  .legend-item { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

  /* Quiz */
  .progress-track { height: 5px; background: var(--line); border-radius: 4px; overflow: hidden; margin-bottom: 26px; }
  .progress-fill { height: 100%; background: var(--gold); border-radius: 4px; transition: width 0.35s ease; }
  .step-count { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
  .statement { font-size: 21px; line-height: 1.45; font-weight: 600; margin: 0 0 34px; min-height: 96px; }
  .scale-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; margin-bottom: 10px; }
  .dot-btn {
    flex: 1; aspect-ratio: 1; border-radius: 50%; border: 2px solid var(--line); background: #fff;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px; color: var(--ink-soft); transition: all 0.15s ease;
    max-width: 58px; margin: 0 auto;
  }
  .dot-btn:hover { border-color: var(--gold); }
  .dot-btn.selected { background: var(--gold); border-color: var(--gold); color: #fff; transform: scale(1.08); }
  .scale-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 30px; }
  .quiz-nav { display: flex; justify-content: space-between; align-items: center; }

  /* Results */
  .result-name { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .macro-block { margin-bottom: 18px; }
  .macro-label { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .macro-name { font-size: 15px; font-weight: 700; }
  .macro-score { font-size: 13px; color: var(--muted); }
  .macro-track { height: 16px; background: var(--surface); border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
  .macro-fill { height: 100%; border-radius: 8px; transition: width 0.8s ease; }
  .macro-fill.t { background: var(--gold); }
  .macro-fill.tr { background: var(--teal); }

  .sub-grid { display: flex; gap: 10px; margin-top: 22px; }
  @media (max-width: 480px) { .sub-grid { flex-wrap: wrap; } }
  .sub-card { flex: 1; min-width: 130px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .sub-card .sub-name { font-size: 11.5px; color: var(--muted); font-weight: 600; margin-bottom: 4px; line-height: 1.3; }
  .sub-card .sub-value { font-size: 18px; font-weight: 700; color: var(--ink); }

  .profile-card { margin-top: 26px; padding: 20px 22px; border-radius: 14px; background: var(--ink); color: #fff; }
  .profile-card .pc-label { font-size: 12px; color: var(--gold-soft); margin-bottom: 4px; }
  .profile-card .pc-style { font-size: 19px; font-weight: 700; margin-bottom: 10px; }
  .profile-card p { font-size: 13.5px; line-height: 1.55; color: #DCE1F5; margin: 0; }

  .save-note { font-size: 12.5px; color: var(--muted); margin-top: 18px; text-align: center; }
  .result-actions { display: flex; gap: 12px; margin-top: 26px; }
  .result-actions .btn { flex: 1; }
  .teacher-link {
    display: block; text-align: center; margin-top: 22px; font-size: 12.5px; color: var(--muted);
    text-decoration: underline; cursor: pointer; background: none; border: none;
  }

  /* Teacher view */
  .teacher-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  table.results-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.results-table th { text-align: left; font-size: 11px; color: var(--muted); font-weight: 600; padding: 7px 6px; border-bottom: 2px solid var(--line); }
  table.results-table td { padding: 8px 6px; border-bottom: 1px solid var(--line); }
  .tag { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; background: var(--gold-soft); color: #7A5A16; }
  .empty-note { text-align: center; color: var(--muted); font-size: 13.5px; padding: 30px 0; }
  .icon-btn { background: none; border: 1.5px solid var(--line); border-radius: 8px; padding: 7px 13px; font-size: 12.5px; color: var(--ink); cursor: pointer; }
  .icon-btn:hover { border-color: var(--gold); }
  .table-scroll { overflow-x: auto; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
  // ---------------- Model ----------------
  // T1 = Натхнення та бачення, T2 = Індивідуальний підхід і розвиток (обидва -> Трансформаційне)
  // R1 = Умовна винагорода, R2 = Управління за відхиленнями (обидва -> Транзакційне)
  var SUB_NAMES = {
    T1: "Натхнення та бачення",
    T2: "Індивідуальний підхід і розвиток",
    R1: "Умовна винагорода",
    R2: "Управління за відхиленнями"
  };
  var MACRO_OF = { T1: "T", T2: "T", R1: "Tr", R2: "Tr" };
  var MACRO_NAMES = { T: "Трансформаційне лідерство", Tr: "Транзакційне лідерство" };

  var ITEMS_BY_ID = {
    T1_1: { sub: "T1", text: "Я формулюю чітке й надихаюче бачення майбутнього для команди." },
    T1_2: { sub: "T1", text: "Люди в моїй команді пишаються тим, що працюють зі мною." },
    T1_3: { sub: "T1", text: "Я говорю з ентузіазмом про те, чого можна досягти разом." },
    T1_4: { sub: "T1", text: "Моя команда довіряє мені навіть у складних і невизначених ситуаціях." },
    T1_5: { sub: "T1", text: "Я особистим прикладом демонструю цінності, які проповідую." },

    T2_1: { sub: "T2", text: "Я приділяю увагу індивідуальним потребам і сильним сторонам кожного члена команди." },
    T2_2: { sub: "T2", text: "Я заохочую людей ставити під сумнів звичні підходи й пропонувати нові ідеї." },
    T2_3: { sub: "T2", text: "Я допомагаю членам команди розвивати їхні сильні сторони, а не лише виправляти слабкі." },
    T2_4: { sub: "T2", text: "Я сприймаю помилки команди як можливість для навчання, а не привід для покарання." },
    T2_5: { sub: "T2", text: "Я витрачаю час на менторство і розвиток окремих людей, а не лише команди загалом." },

    R1_1: { sub: "R1", text: "Я чітко пояснюю, що саме людина отримає за виконання конкретного завдання." },
    R1_2: { sub: "R1", text: "Я домовляюся з командою про конкретні критерії успіху ще до початку роботи." },
    R1_3: { sub: "R1", text: "Я визнаю і винагороджую тих, хто виконав завдання відповідно до домовленостей." },
    R1_4: { sub: "R1", text: "У моїй команді чітко зрозуміло, яка винагорода прив'язана до якого результату." },
    R1_5: { sub: "R1", text: "Я вважаю, що чіткі угоди про очікування й винагороду — основа ефективної роботи." },

    R2_1: { sub: "R2", text: "Я уважно стежу за відхиленнями від стандартів і втручаюся, щойно їх помічаю." },
    R2_2: { sub: "R2", text: "Я зосереджуюся на виявленні помилок і невідповідностей у роботі команди." },
    R2_3: { sub: "R2", text: "Я втручаюся в процес лише тоді, коли щось іде не за планом." },
    R2_4: { sub: "R2", text: "Я регулярно перевіряю, чи команда дотримується встановлених процедур." },
    R2_5: { sub: "R2", text: "Моя основна увага як лідера — контроль дотримання стандартів і термінів." }
  };

  // Порядок показу — перемішаний за чотирма підшкалами
  var DISPLAY_ORDER = [
    "T2_1", "R1_1", "T1_1", "R2_1", "T1_2",
    "R2_2", "T2_2", "R1_2", "R2_3", "T1_3",
    "T2_3", "R1_3", "T1_4", "R2_4", "T2_4",
    "R1_4", "T1_5", "T2_5", "R2_5", "R1_5"
  ];
  var ITEMS = DISPLAY_ORDER.map(function (id) {
    var base = ITEMS_BY_ID[id];
    return { id: id, sub: base.sub, text: base.text };
  });

  var SUB_DESC = {
    T1: "Ви формулюєте надихаюче бачення і викликаєте довіру особистим прикладом — класична складова харизматичного лідерства.",
    T2: "Ви приділяєте увагу розвитку кожної людини окремо і заохочуєте нестандартне мислення в команді.",
    R1: "Ви чітко пов'язуєте винагороду з конкретним результатом — команда завжди знає, чого від неї очікують.",
    R2: "Ви активно відстежуєте відхилення від стандартів і втручаєтесь, щойно щось іде не за планом."
  };

  var PROFILE_TEXT = {
    both_high: "Обидва показники високі — це augmentation-ефект, який описав Бернард Басс: трансформаційні якості підсилюють транзакційну основу. За дослідженнями, саме таке поєднання дає найвищу ефективність — чіткі угоди про винагороду плюс натхнення й розвиток команди.",
    mostly_t: "Переважає трансформаційний компонент: ви більше надихаєте, ніж домовляєтесь про конкретні умови. Це сильна сторона в періоди змін, але команді може бракувати чіткості щодо очікувань і винагороди.",
    mostly_tr: "Переважає транзакційний компонент: ви більше домовляєтесь про чіткі умови й контролюєте виконання, ніж надихаєте баченням. Це ефективно в стабільних, рутинних процесах, але може обмежувати ініціативу й залученість команди.",
    balanced_moderate: "Обидва показники помірні, без яскраво вираженого домінування жодного підходу — гнучкий, ситуативний профіль, який можна свідомо розвивати в будь-якому напрямку.",
    both_low: "Обидва показники відносно невисокі. За моделлю Басса це ближче до пасивного стилю (management-by-exception passive / laissez-faire) — мінімальне втручання і мінімум надихання. Варто свідомо підсилити хоча б один із двох підходів."
  };

  var STORAGE_PREFIX = "transform-transact-quiz:";

  // ---------------- State ----------------
  var state = {
    screen: "intro",
    studentName: "",
    index: 0,
    answers: {},
    result: null,
    saveStatus: "idle",
    teacherRows: null,
    teacherLoading: false
  };

  var app = document.getElementById("app");

  function el(html) {
    var t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }

  // ---------------- Scoring ----------------
  function computeResult() {
    var subs = { T1: 0, T2: 0, R1: 0, R2: 0 };
    ITEMS.forEach(function (item) {
      subs[item.sub] += state.answers[item.id] || 0;
    });
    var T = subs.T1 + subs.T2;
    var Tr = subs.R1 + subs.R2;
    var tPct = T / 50, trPct = Tr / 50;

    var profileKey;
    var highT = tPct >= 0.7, highTr = trPct >= 0.7;
    var lowT = tPct <= 0.5, lowTr = trPct <= 0.5;
    if (highT && highTr) profileKey = "both_high";
    else if (lowT && lowTr) profileKey = "both_low";
    else if (highT && !highTr) profileKey = "mostly_t";
    else if (highTr && !highT) profileKey = "mostly_tr";
    else profileKey = "balanced_moderate";

    return { subs: subs, T: T, Tr: Tr, profileKey: profileKey };
  }

  // ---------------- Persistence ----------------
  function saveResultToStorage(result) {
    if (!window.storage) return;
    state.saveStatus = "saving";
    var key = STORAGE_PREFIX + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
    var payload = {
      name: state.studentName || "Анонім",
      subs: result.subs, T: result.T, Tr: result.Tr,
      profileKey: result.profileKey, timestamp: Date.now()
    };
    window.storage.set(key, JSON.stringify(payload), true).then(function (r) {
      state.saveStatus = r ? "saved" : "failed";
      render();
    }).catch(function () {
      state.saveStatus = "failed";
      render();
    });
  }

  function loadTeacherRows() {
    state.teacherLoading = true;
    render();
    if (!window.storage) {
      state.teacherRows = [];
      state.teacherLoading = false;
      render();
      return;
    }
    window.storage.list(STORAGE_PREFIX, true).then(function (listRes) {
      var keys = (listRes && listRes.keys) || [];
      if (keys.length === 0) {
        state.teacherRows = [];
        state.teacherLoading = false;
        render();
        return;
      }
      var promises = keys.map(function (k) {
        return window.storage.get(k, true).then(function (r) {
          try { return JSON.parse(r.value); } catch (e) { return null; }
        }).catch(function () { return null; });
      });
      Promise.all(promises).then(function (rows) {
        rows = rows.filter(Boolean).sort(function (a, b) { return b.timestamp - a.timestamp; });
        state.teacherRows = rows;
        state.teacherLoading = false;
        render();
      });
    }).catch(function () {
      state.teacherRows = [];
      state.teacherLoading = false;
      render();
    });
  }

  function downloadCsv() {
    var rows = state.teacherRows || [];
    var header = ["Ім'я", "T1", "T2", "R1", "R2", "Трансформаційне (T)", "Транзакційне (Tr)", "Профіль", "Дата"];
    var lines = [header.join(";")];
    var profileShort = {
      both_high: "Аугментований (обидва високі)",
      mostly_t: "Переважно трансформаційний",
      mostly_tr: "Переважно транзакційний",
      balanced_moderate: "Збалансований помірний",
      both_low: "Обидва низькі (пасивний)"
    };
    rows.forEach(function (r) {
      lines.push([
        r.name, r.subs.T1, r.subs.T2, r.subs.R1, r.subs.R2, r.T, r.Tr,
        profileShort[r.profileKey] || r.profileKey,
        new Date(r.timestamp).toLocaleString("uk-UA")
      ].join(";"));
    });
    var blob = new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "transform-transact-results.csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ---------------- Screens ----------------
  function renderIntro() {
    var card = el(
      '<div class="stage"><div class="card">' +
      '<p class="kicker">Практичне заняття 1 · Бізнес-лідерство</p>' +
      '<h1 class="title serif">Трансформаційне чи транзакційне лідерство?</h1>' +
      '<p class="lead">20 тверджень. Оцініть, наскільки кожне з них описує вашу типову поведінку в ролі лідера, за шкалою від 1 до 5.</p>' +
      '<div class="legend-row">' +
        '<div class="legend-item"><span class="legend-dot" style="background:#C9962C;"></span>Трансформаційне</div>' +
        '<div class="legend-item"><span class="legend-dot" style="background:#2E7D6B;"></span>Транзакційне</div>' +
      '</div>' +
      '<label class="field-label">Ваше ім\'я (необов\'язково)</label>' +
      '<input type="text" class="text-input" id="name-input" placeholder="Наприклад, Олена К." value="' + state.studentName.replace(/"/g,'&quot;') + '" />' +
      '<button class="btn btn-primary" id="start-btn">Почати опитування</button>' +
      '<div class="meta-row">' +
        '<div class="meta-item"><div class="num">20</div><div class="lbl">тверджень</div></div>' +
        '<div class="meta-item"><div class="num">~6 хв</div><div class="lbl">орієнтовно</div></div>' +
        '<div class="meta-item"><div class="num">2</div><div class="lbl">стилі лідерства</div></div>' +
      '</div>' +
      '</div></div>'
    );
    card.querySelector("#start-btn").addEventListener("click", function () {
      state.studentName = card.querySelector("#name-input").value.trim();
      state.screen = "quiz";
      state.index = 0;
      render();
    });
    return card;
  }

  function renderQuiz() {
    var item = ITEMS[state.index];
    var progressPct = Math.round((state.index / ITEMS.length) * 100);
    var selected = state.answers[item.id];

    var dotsHtml = "";
    for (var v = 1; v <= 5; v++) {
      dotsHtml += '<button class="dot-btn' + (selected === v ? " selected" : "") + '" data-value="' + v + '">' + v + "</button>";
    }

    var card = el(
      '<div class="stage"><div class="card">' +
      '<div class="progress-track"><div class="progress-fill" style="width:' + progressPct + '%"></div></div>' +
      '<p class="step-count">Твердження ' + (state.index + 1) + ' із ' + ITEMS.length + '</p>' +
      '<p class="statement serif">' + item.text + '</p>' +
      '<div class="scale-row">' + dotsHtml + '</div>' +
      '<div class="scale-labels"><span>Зовсім не про мене</span><span>Повністю про мене</span></div>' +
      '<div class="quiz-nav">' +
        '<button class="btn btn-ghost" id="back-btn" ' + (state.index === 0 ? "disabled style=\"visibility:hidden\"" : "") + '>← Назад</button>' +
        '<span></span>' +
      '</div>' +
      '</div></div>'
    );

    card.querySelectorAll(".dot-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var val = parseInt(btn.getAttribute("data-value"), 10);
        state.answers[item.id] = val;
        setTimeout(function () {
          if (state.index < ITEMS.length - 1) {
            state.index += 1;
            render();
          } else {
            state.result = computeResult();
            state.screen = "results";
            state.saveStatus = "idle";
            render();
            saveResultToStorage(state.result);
          }
        }, 180);
        render();
      });
    });

    var backBtn = card.querySelector("#back-btn");
    if (backBtn) {
      backBtn.addEventListener("click", function () {
        if (state.index > 0) { state.index -= 1; render(); }
      });
    }

    return card;
  }

  function renderResults() {
    var result = state.result;
    var tPct = Math.round((result.T / 50) * 100);
    var trPct = Math.round((result.Tr / 50) * 100);

    var profileTitle = {
      both_high: "Аугментований профіль",
      mostly_t: "Переважно трансформаційний",
      mostly_tr: "Переважно транзакційний",
      balanced_moderate: "Збалансований помірний профіль",
      both_low: "Пасивний профіль"
    }[result.profileKey];

    var subOrder = ["T1", "T2", "R1", "R2"];
    var subCardsHtml = subOrder.map(function (key) {
      return (
        '<div class="sub-card">' +
          '<div class="sub-name">' + SUB_NAMES[key] + '</div>' +
          '<div class="sub-value">' + result.subs[key] + ' / 25</div>' +
        '</div>'
      );
    }).join("");

    var saveNote = "";
    if (state.saveStatus === "saving") saveNote = "Зберігаємо результат…";
    else if (state.saveStatus === "saved") saveNote = "Результат збережено.";
    else if (state.saveStatus === "failed") saveNote = "Результат порахований, але не вдалося зберегти для викладача.";

    var card = el(
      '<div class="stage"><div class="card">' +
      (state.studentName ? '<p class="result-name">' + state.studentName + '</p>' : "") +
      '<h1 class="title serif">Ваш профіль лідерства</h1>' +
      '<div style="margin-top:20px;">' +
        '<div class="macro-block">' +
          '<div class="macro-label"><span class="macro-name">' + MACRO_NAMES.T + '</span><span class="macro-score">' + result.T + ' / 50</span></div>' +
          '<div class="macro-track"><div class="macro-fill t" style="width:' + tPct + '%"></div></div>' +
        '</div>' +
        '<div class="macro-block">' +
          '<div class="macro-label"><span class="macro-name">' + MACRO_NAMES.Tr + '</span><span class="macro-score">' + result.Tr + ' / 50</span></div>' +
          '<div class="macro-track"><div class="macro-fill tr" style="width:' + trPct + '%"></div></div>' +
        '</div>' +
      '</div>' +
      '<div class="sub-grid">' + subCardsHtml + '</div>' +
      '<div class="profile-card">' +
        '<div class="pc-label">Ваш профіль</div>' +
        '<div class="pc-style">' + profileTitle + '</div>' +
        '<p>' + PROFILE_TEXT[result.profileKey] + '</p>' +
      '</div>' +
      (saveNote ? '<p class="save-note">' + saveNote + '</p>' : "") +
      '<div class="result-actions">' +
        '<button class="btn btn-secondary" id="retake-btn">Пройти ще раз</button>' +
      '</div>' +
      '<button class="teacher-link" id="teacher-link">Перегляд результатів групи (для викладача)</button>' +
      '</div></div>'
    );

    card.querySelector("#retake-btn").addEventListener("click", function () {
      state.screen = "intro"; state.index = 0; state.answers = {}; state.result = null;
      render();
    });
    card.querySelector("#teacher-link").addEventListener("click", function () {
      state.screen = "teacher"; render(); loadTeacherRows();
    });

    return card;
  }

  function renderTeacher() {
    var rows = state.teacherRows;
    var bodyHtml;
    if (state.teacherLoading) {
      bodyHtml = '<p class="empty-note">Завантаження результатів…</p>';
    } else if (!rows || rows.length === 0) {
      bodyHtml = '<p class="empty-note">Поки що ніхто не пройшов опитування за цим посиланням.</p>';
    } else {
      var profileShort = {
        both_high: "Аугментований", mostly_t: "Трансформ.", mostly_tr: "Транзакц.",
        balanced_moderate: "Збалансов.", both_low: "Пасивний"
      };
      var trs = rows.map(function (r) {
        return (
          '<tr>' +
            '<td>' + r.name + '</td>' +
            '<td>' + r.T + '</td>' +
            '<td>' + r.Tr + '</td>' +
            '<td><span class="tag">' + (profileShort[r.profileKey] || r.profileKey) + '</span></td>' +
          '</tr>'
        );
      }).join("");
      bodyHtml =
        '<div class="table-scroll"><table class="results-table">' +
          '<thead><tr><th>Студент</th><th>T /50</th><th>Tr /50</th><th>Профіль</th></tr></thead>' +
          '<tbody>' + trs + '</tbody>' +
        '</table></div>';
    }

    var card = el(
      '<div class="stage"><div class="card">' +
      '<div class="teacher-header">' +
        '<h1 class="title serif" style="margin:0;font-size:22px;">Результати групи</h1>' +
        '<button class="icon-btn" id="refresh-btn">Оновити</button>' +
      '</div>' +
      bodyHtml +
      '<div class="result-actions">' +
        '<button class="btn btn-secondary" id="csv-btn"' + ((!rows || rows.length === 0) ? " disabled" : "") + '>Завантажити CSV</button>' +
        '<button class="btn btn-secondary" id="back-to-quiz-btn">← Назад</button>' +
      '</div>' +
      '</div></div>'
    );

    card.querySelector("#refresh-btn").addEventListener("click", loadTeacherRows);
    card.querySelector("#back-to-quiz-btn").addEventListener("click", function () {
      state.screen = state.result ? "results" : "intro"; render();
    });
    var csvBtn = card.querySelector("#csv-btn");
    if (csvBtn && rows && rows.length > 0) csvBtn.addEventListener("click", downloadCsv);

    return card;
  }

  function render() {
    app.innerHTML = "";
    var view;
    if (state.screen === "intro") view = renderIntro();
    else if (state.screen === "quiz") view = renderQuiz();
    else if (state.screen === "results") view = renderResults();
    else view = renderTeacher();
    app.appendChild(view);
  }

  render();
})();
</script>
</body>
</html>
