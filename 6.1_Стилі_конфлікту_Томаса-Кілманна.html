function lv(v){return v>=14?"високий":v>=10?"середній":"низький"}
function save(){try{localStorage.setItem("tk6",JSON.stringify({a:st.a,i:st.i,n:st.n}))}catch(e){}}
function calc(s){var v=ORD.map(function(k){return s[k]}),mx=Math.max.apply(0,v),mn=Math.min.apply(0,v);
var top=ORD.filter(function(k){return s[k]===mx}),quiet=ORD.filter(function(k){return s[k]===mn&&top.indexOf(k)<0}),
rest=ORD.filter(function(k){return top.indexOf(k)<0}).sort(function(a,b){return s[b]-s[a]}),t=0,px=0,py=0;
ORD.forEach(function(k){t+=s[k];px+=s[k]*S[k].x;py+=s[k]*S[k].y});
var f=function(q){return Math.min(.96,Math.max(.04,.5+(q/t-.5)*2.4))};
return{s:s,top:top,quiet:quiet,sec:rest[0],flat:mx-mn<=4||top.length>=4,px:f(px),py:f(py)}}
function petal(r){var s=r.s,A={CP:-45,CL:45,AC:135,AV:225},P={CP:[62,26],CL:[278,26],AV:[62,282],AC:[278,282]},K=["CP","CL","AC","AV"];
var g='<svg viewBox="0 0 340 330" role="img" aria-label="Пелюсткова діаграма стилів" style="width:100%;max-width:440px;display:block;margin:0 auto">';
var shape=function(l){var w=l*.28;return"M0 0C"+w+" "+(-l*.3)+" "+w*.7+" "+(-l*.8)+" 0 "+(-l)+"C"+(-w*.7)+" "+(-l*.8)+" "+(-w)+" "+(-l*.3)+" 0 0Z"};
K.forEach(function(k){g+='<g transform="translate(170 165) rotate('+A[k]+')"><path d="'+shape(120)+'" fill="none" stroke="var(--line)" stroke-dasharray="4 4"/></g>'});
K.forEach(function(k){var l=22+98*(s[k]-4)/16,on=r.flat||r.top.indexOf(k)>=0;
g+='<g transform="translate(170 165) rotate('+A[k]+')"><path d="'+shape(l)+'" fill="'+S[k].c+'" fill-opacity="'+(on?.8:.45)+'" stroke="'+S[k].c+'" stroke-width="'+(on&&!r.flat?3:1.5)+'"/></g>'});
g+='<circle cx="170" cy="165" r="'+(14+16*(s.CM-4)/16)+'" fill="#C9962C" stroke="#fff" stroke-width="2.5"/><text x="170" y="171" font-size="16" text-anchor="middle">🦊</text>';
K.forEach(function(k){var p=P[k];g+='<text x="'+p[0]+'" y="'+p[1]+'" font-size="22" text-anchor="middle">'+S[k].e+'</text><text x="'+p[0]+'" y="'+(p[1]+18)+'" font-size="12.5" font-weight="700" text-anchor="middle" style="fill:var(--ink)">'+S[k].n+'</text><text x="'+p[0]+'" y="'+(p[1]+33)+'" font-size="11.5" text-anchor="middle">'+s[k]+'/20 · '+lv(s[k])+'</text>'});
g+='</svg>';
var LN=["Низька","Середня","Висока"],Z=function(v){return v>=28?2:v>=20?1:0};
var ax=function(ic,n,q,v,a,b,txt){var z=Z(v),P=function(x){return Math.min(97,Math.max(3,(x-8)/32*100))},sp=Math.abs(s[a]-s[b]),hi=s[a]>=s[b]?a:b,lo=hi===a?b:a,
dots=[a,b].map(function(k){return'<i title="'+S[k].n+'" style="position:absolute;top:-1px;left:calc('+P(2*s[k])+'% - 7px);width:14px;height:14px;border-radius:50%;background:'+S[k].c+';border:2px solid var(--card)"></i>'}).join("");
return'<div class="box" style="margin-top:12px"><div style="font-weight:700;font-size:15px">'+ic+' '+n+'</div><div class="mut sm" style="margin-bottom:12px">'+q+'</div><div style="position:relative;height:12px;border-radius:7px;background:linear-gradient(90deg,var(--line) 0 37.5%,color-mix(in srgb,var(--ink2) 28%,var(--line)) 37.5% 62.5%,color-mix(in srgb,var(--ink2) 55%,var(--line)) 62.5%)">'+dots+'<i style="position:absolute;top:-4px;left:calc('+P(v)+'% - 10px);width:20px;height:20px;border-radius:50%;background:var(--gold);border:3px solid var(--card)"></i></div><div class="mut" style="display:flex;font-size:11.5px;margin:7px 0 12px;text-align:center"><span style="flex:37.5">Низька</span><span style="flex:25">Середня</span><span style="flex:37.5">Висока</span></div><div><b>'+LN[z]+' · '+v+' із 40.</b> '+txt[z]+'</div>'+(sp>=6?'<div class="box" style="margin-top:10px"><b>Зверніть увагу:</b> стилі в цій парі дуже різні: '+S[hi].e+' '+S[hi].n+' ('+s[hi]+'/20) і '+S[lo].e+' '+S[lo].n+' ('+s[lo]+'/20). Сума приховує цю різницю, тому дивіться на кольорові точки.</div>':'')+'<div class="mut sm" style="margin-top:8px">Золота точка — підсумок осі, кольорові — окремі стилі.</div><div class="mut sm" style="margin-top:6px">Складається з: '+pt(a,b)+'</div></div>'};
var asT=["Ви рідко наполягаєте на своєму. Інколи варто чіткіше заявити про власні потреби.","Ви відстоюєте своє, коли питання справді важливе.","Ви чітко заявляєте про свої інтереси й готові за них боротися."],
coT=["Ви рідше орієнтуєтеся на потреби співрозмовника. Корисно частіше питати, чого хоче інша сторона.","Ви зважаєте на іншого, але не завжди ставите це на перше місце.","Ви уважні до потреб інших і прагнете зберегти стосунки."];
var pt=function(a,b){return S[a].e+' '+S[a].n+' '+s[a]+' + '+S[b].e+' '+S[b].n+' '+s[b]};
return g+'<p class="sm" style="text-align:center;margin:6px 0 4px">🦊 <b>Компроміс</b> (коло в центрі): '+s.CM+'/20 · '+lv(s.CM)+'</p><h2>Дві осі вашого профілю</h2><p class="mut sm">Будь-який конфлікт можна оцінити за двома запитаннями: «наскільки мені важливо досягти свого?» і «наскільки мені важливі стосунки та інтереси іншої людини?». Від поєднання відповідей залежить стиль.</p>'+ax("🎯","Наполегливість","Наскільки я відстоюю свої інтереси",s.CP+s.CL,"CP","CL",asT)+ax("🤝","Кооперативність","Наскільки я зважаю на інтереси іншого",s.CL+s.AC,"CL","AC",coT)+'<details style="margin-top:12px"><summary>Як осі пов\'язані зі стилями</summary><p>🦈 <b>Суперництво:</b> наполегливість висока, кооперативність низька.</p><p>🦉 <b>Співпраця:</b> обидві високі, тому цей стиль входить в обидві осі.</p><p>🧸 <b>Пристосування:</b> кооперативність висока, наполегливість низька.</p><p>🐢 <b>Уникнення:</b> обидві низькі.</p><p>🦊 <b>Компроміс:</b> посередині за обома.</p></details>'}
function intro(){return'<div class="card"><p class="k">Практичне заняття 6 · Бізнес-лідерство</p><h1 class="serif">Ваш стиль у конфлікті</h1><p class="mut">20 коротких тверджень про те, як ви зазвичай поводитеся, коли ваші інтереси стикаються з чужими. Це навчальна самооцінка за мотивами моделі Томаса-Кілманна, а не діагноз і не офіційний тест TKI.</p><ul class="mut sm" style="padding-left:20px;margin:0 0 16px"><li>Правильних відповідей немає: відповідайте так, як є, а не як мало б бути.</li><li>Згадайте останні пів року: навчання, робота, друзі, сім\'я.</li><li>Перша думка зазвичай найточніша. Можна натискати клавіші 1–5.</li></ul><div class="ex"><b>Приклад.</b> «Я відкладаю неприємну розмову». Оберіть, як часто це про вас: від «Ніколи» до «Майже завжди».</div><label class="sm" for="nm"><b>Ім\'я або псевдонім</b> <span class="mut">(необов\'язково, потрапить у код для викладача)</span></label><input id="nm" maxlength="40" value="'+esc(st.n)+'" style="margin:6px 0 18px">'+(st.saved?'<button class="btn pri" data-a="cont" style="margin-bottom:10px">Продовжити з твердження '+(st.i+1)+'</button><button class="btn" data-a="start" style="width:100%">Почати спочатку</button>':'<button class="btn pri" data-a="start">Почати</button>')+'<p class="mut sm" style="margin:18px 0 0;text-align:center">20 тверджень · близько 5 хвилин</p><button class="link" data-a="teacher">Для викладача: зведення групи</button></div>'}
function quiz(){var it=ITEMS[st.i],sel=st.a[it.id];
var o=L.map(function(l,j){return'<button class="opt'+(sel===j+1?" on":"")+'" data-a="v" data-v="'+(j+1)+'"><b>'+(j+1)+'</b>'+l+'</button>'}).join("");
return'<div class="card"><div class="pg"><i style="width:'+Math.round(st.i/20*100)+'%"></i></div><p class="k">Твердження '+(st.i+1)+' із 20 · залишилось '+(19-st.i)+'</p><p class="stmt serif">'+it.t+'</p><p class="mut sm" style="margin-bottom:10px">Як часто це про вас?</p><div class="opts">'+o+'</div><div class="nav"><button class="btn ghost" data-a="back"'+(st.i?"":' style="visibility:hidden"')+'>← Назад</button><span class="mut sm">Відповідайте чесно</span></div></div>'}
function results(){var r=st.r,top=r.top,s=r.s;
var bars=ORD.map(function(k){return'<div class="bar"><div class="bl"><span>'+S[k].e+" "+S[k].n+'</span><span>'+s[k]+"/20 · "+lv(s[k])+'</span></div><div class="bt"><i style="width:'+s[k]*5+'%;background:'+S[k].c+';opacity:'+(top.indexOf(k)>=0&&!r.flat?1:.55)+'"></i></div></div>'}).join("");
var hero;
if(r.flat)hero='<div class="lb">ПРОФІЛЬ</div><div class="nm">Рівномірний профіль</div><p>Ваші бали майже однакові. Це може означати гнучкість, а може — що ви обирали «середні» відповіді. Згадайте три реальні конфлікти й чесно подивіться, який стиль ви застосовували насправді.</p>';
else hero='<div class="lb">ДОМІНУЮЧИЙ СТИЛЬ</div><div class="nm">'+top.map(function(k){return S[k].e+" "+S[k].n}).join(" і ")+'</div>'+top.map(function(k){return'<p><b>Ваша фраза:</b> '+S[k].q+'</p><p><b>Коли доречний:</b> '+S[k].ok+'</p><p><b>Коли ризикований:</b> '+S[k].rk+'</p>'}).join("")+(top.length==1?'<p><b>Далі за вираженістю:</b> '+S[r.sec].e+" "+S[r.sec].n+'.</p>':"")+'<p><b>🎯 Виклик тижня:</b> '+S[top[0]].ch+'</p>';
var q=r.quiet[0],blind=(q&&!r.flat)?'<div class="box"><b>Ваш невикористаний інструмент: '+S[q].e+" "+S[q].n+'.</b> Жоден стиль не є «поганим». Цей стиль доречний, коли: '+S[q].ok.charAt(0).toLowerCase()+S[q].ok.slice(1)+'</div>':"";
var acc=ORD.map(function(k){return'<details><summary>'+S[k].e+" "+S[k].n+" · "+lv(s[k])+'</summary><p><b>'+S[k].q+'</b></p><p>Доречний: '+S[k].ok+'</p><p>Ризик: '+S[k].rk+'</p></details>'}).join("");
var cs=casesHtml();
var code="TK1|"+(st.n||"Анонім").replace(/[|\n]/g," ")+"|"+CODE.map(function(k){return s[k]}).join(",");
return'<div class="card">'+(st.n?'<p class="k">'+esc(st.n)+'</p>':"")+'<h1 class="serif">Ваш профіль у конфлікті</h1><p class="mut sm">Кожна пелюстка показує, наскільки виражений стиль (пунктир — максимум, 20 балів). Найдовша пелюстка — ваш домінуючий стиль, а рівна зірка означає, що ви гнучко змінюєте підхід залежно від ситуації. Рівні для кожного стилю: до 9 — низький, 10–13 — середній, від 14 — високий («Часто» і частіше).</p>'+petal(r)+'<h2>Ваші бали</h2>'+bars+'<div class="hero">'+hero+'</div>'+blind+'<h2>Усі п\'ять стилів</h2>'+acc+'<h2>Застосуйте на практиці</h2><p class="mut sm">Для кожної ситуації оберіть стиль, який підійде найкраще, і прочитайте пояснення. Усього 5 раундів по 5 ситуацій, щоразу випадкові.</p><div id="cases">'+cs+'</div><div class="row"><button class="btn" data-a="retake">Пройти ще раз</button></div><button class="link" data-a="teacher">Для викладача: зведення групи</button></div>'}
function teacher(){return'<div class="card"><h1 class="serif" style="font-size:22px">Зведення групи</h1><p class="mut sm">Студенти надсилають вам свої коди (рядки, що починаються з TK1). Вставте їх сюди, по одному в рядок.</p><textarea id="codes" rows="6" placeholder="TK1|Олена К.|12,9,14,11,17"></textarea><label class="sm" style="display:flex;gap:8px;margin-top:10px;align-items:center"><input type="checkbox" id="anon" style="width:auto"> Сховати імена (для показу на екрані)</label><div class="row"><button class="btn pri" data-a="agg" style="width:auto">Показати зведення</button><button class="btn" data-a="exit">← Назад</button></div><div id="out"></div></div>'}
function agg(){var rows=[];document.getElementById("codes").value.split("\n").forEach(function(l){var m=l.trim().match(/^TK1\|([^|]*)\|(\d+(?:,\d+){4})$/);if(!m)return;var v=m[2].split(",").map(Number);if(v.some(function(x){return x<4||x>20}))return;var s={};CODE.forEach(function(k,i){s[k]=v[i]});rows.push({n:m[1],s:s,r:calc(s)})});
var out=document.getElementById("out"),an=document.getElementById("anon").checked;
if(!rows.length){out.innerHTML='<p class="mut sm" style="margin-top:16px">Не знайдено жодного коректного коду.</p>';return}
var cnt={},avg={};ORD.forEach(function(k){cnt[k]=0;avg[k]=0});
rows.forEach(function(x){x.r.top.forEach(function(k){cnt[k]++});ORD.forEach(function(k){avg[k]+=x.s[k]})});
var bars=ORD.map(function(k){return'<div class="bar"><div class="bl"><span>'+S[k].e+" "+S[k].n+'</span><span>'+cnt[k]+' студ. · середній бал '+(avg[k]/rows.length).toFixed(1)+'</span></div><div class="bt"><i style="width:'+cnt[k]/rows.length*100+'%;background:'+S[k].c+'"></i></div></div>'}).join("");
var tb=an?"":'<div style="overflow-x:auto;margin-top:14px"><table><tr><th>Студент</th><th>Домінуючий</th></tr>'+rows.map(function(x){return'<tr><td>'+esc(x.n)+'</td><td>'+(x.r.flat?"Рівномірний":x.r.top.map(function(k){return S[k].n}).join(" / "))+'</td></tr>'}).join("")+'</table></div>';
out.innerHTML='<h2>Відповідей: '+rows.length+'</h2><p class="mut sm">Скільки студентів мають кожен стиль домінуючим.</p>'+bars+tb}
function render(){app.innerHTML='<div class="st">'+({intro:intro,quiz:quiz,results:results,teacher:teacher}[st.s])()+'</div>';window.scrollTo(0,0)}
function pick(v){if(st.lock)return;var it=ITEMS[st.i];st.a[it.id]=v;st.lock=1;save();document.querySelectorAll(".opt").forEach(function(o){o.classList.toggle("on",+o.dataset.v===v)});
setTimeout(function(){st.lock=0;if(st.s!=="quiz")return;if(st.i<19){st.i++;save();render()}else{var s={};ORD.forEach(function(k){s[k]=0});ITEMS.forEach(function(x){s[x.s]+=st.a[x.id]||0});st.r=calc(s);st.rd=makeRounds();st.ri=0;st.ok=0;st.an=0;st.s="results";try{localStorage.removeItem("tk6")}catch(e){}render()}},200)}
function back(){if(st.s==="quiz"&&st.i>0){st.i--;render()}}
app.addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(!b)return;var a=b.dataset.a;
if(a==="start"){st.n=document.getElementById("nm").value.trim();st.a={};st.i=0;st.saved=0;st.s="quiz";save();render()}
else if(a==="cont"){st.n=document.getElementById("nm").value.trim();st.s="quiz";render()}
else if(a==="v")pick(+b.dataset.v);else if(a==="back")back();
else if(a==="retake"){st.a={};st.i=0;st.r=null;st.saved=0;st.s="intro";render()}
else if(a==="teacher"){st.s="teacher";render()}
else if(a==="exit"){st.s=st.r?"results":"intro";render()}
else if(a==="agg")agg();
else if(a==="copy"){var t=document.getElementById("code");t.select();try{navigator.clipboard.writeText(t.value)}catch(x){}try{document.execCommand("copy")}catch(x){}b.textContent="Скопійовано ✓"}
else if(a==="cs"){var c=st.rd[st.ri][+b.dataset.c];if(c.a)return;c.a=b.dataset.k;st.an++;if(c.a===c.b)st.ok++;document.getElementById("cases").innerHTML=casesHtml()}
else if(a==="next"){if(st.ri<4){st.ri++;var cc=document.getElementById("cases");cc.innerHTML=casesHtml();cc.scrollIntoView({behavior:"smooth",block:"start"})}else showEnd()}
else if(a==="close"){var m=document.getElementById("end");if(m)m.remove()}});
document.addEventListener("keydown",function(e){if(st.s!=="quiz"||/INPUT|TEXTAREA/.test(e.target.tagName))return;if(/^[1-5]$/.test(e.key))pick(+e.key);else if(e.key==="Backspace"||e.key==="ArrowLeft")back()});
render();
})();
</script></body></html>
