<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Розпізнай DISC-стиль</title>
<style>
  :root {
    --ink: #1E2761; --ink-soft: #384080; --surface: #F3F6FC; --card: #FFFFFF;
    --gold: #C9962C; --gold-soft: #F3E4C6; --muted: #5B6685; --line: #DDE4F5;
    --red: #B3492F; --green: #2E7D6B;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%; background: var(--surface);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
  }
  .serif { font-family: Cambria, Georgia, "Times New Roman", serif; }
  #app { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 18px; }
  .stage-wrap { width: 100%; max-width: 660px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 36px 34px; box-shadow: 0 18px 40px -24px rgba(30,39,97,0.35); }
  @media (max-width: 480px) { .card { padding: 24px 18px; } }

  .kicker { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
  h1.title { font-size: 26px; line-height: 1.25; margin: 0 0 14px; font-weight: 700; }
  p.lead { font-size: 15px; line-height: 1.6; color: var(--muted); margin: 0 0 22px; }
  label.field-label { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; font-weight: 600; }
  input.text-input {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line);
    font-size: 15px; color: var(--ink); background: var(--surface); margin-bottom: 20px;
  }
  input.text-input:focus { outline: none; border-color: var(--gold); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 13px 24px; border-radius: 10px; border: none; font-size: 14.5px; font-weight: 600;
    cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn-primary { background: var(--ink); color: #fff; width: 100%; }
  .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 10px 20px -12px rgba(30,39,97,0.6); }
  .btn-secondary { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); }
  .note-box { margin: 0 0 20px; padding: 12px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: 12.5px; color: var(--muted); line-height: 1.5; }

  /* DISC primer */
  .primer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
  @media (max-width: 480px) { .primer-grid { grid-template-columns: 1fr; } }
  .primer-item { display: flex; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); align-items: flex-start; }
  .primer-letter { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; color: #fff; flex-shrink: 0; }
  .primer-letter.D { background: var(--red); } .primer-letter.I { background: var(--gold); } .primer-letter.S { background: var(--green); } .primer-letter.C { background: var(--ink); }
  .primer-text { font-size: 11.5px; line-height: 1.4; color: var(--muted); }
  .primer-text b { color: var(--ink); }

  /* Quiz */
  .progress-track { height: 5px; background: var(--line); border-radius: 4px; overflow: hidden; margin-bottom: 22px; }
  .progress-fill { height: 100%; background: var(--gold); border-radius: 4px; transition: width 0.4s ease; }
  .step-count { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .cand-name-big { font-size: 20px; font-weight: 700; margin-bottom: 14px; }
  .desc-box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 22px; }
  .desc-box p { font-size: 14px; line-height: 1.65; margin: 0; color: var(--ink-soft); }
  .disc-choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 480px) { .disc-choice-grid { grid-template-columns: 1fr; } }
  .disc-choice-btn {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px;
    border: 1.5px solid var(--line); background: #fff; cursor: pointer; transition: all 0.15s ease; text-align: left;
  }
  .disc-choice-btn:hover { border-color: var(--gold); background: var(--gold-soft); }
  .disc-choice-btn .dc-badge { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; color: #fff; flex-shrink: 0; }
  .disc-choice-btn .dc-badge.D { background: var(--red); } .disc-choice-btn .dc-badge.I { background: var(--gold); } .disc-choice-btn .dc-badge.S { background: var(--green); } .disc-choice-btn .dc-badge.C { background: var(--ink); }
  .disc-choice-btn .dc-title { font-weight: 700; font-size: 13.5px; }
  .disc-choice-btn .dc-sub { font-size: 11px; color: var(--muted); }

  /* Consequence */
  .consequence-box { border-radius: 14px; padding: 18px 20px; margin-bottom: 20px; color: #fff; }
  .consequence-box.correct { background: var(--green); }
  .consequence-box.incorrect { background: var(--red); }
  .consequence-box .cq-label { font-size: 11px; font-weight: 700; margin-bottom: 8px; letter-spacing: 0.3px; opacity: 0.85; }
  .consequence-box p { font-size: 13.5px; line-height: 1.55; margin: 0; }
  .consequence-box .cq-your { font-size: 12px; margin-bottom: 8px; opacity: 0.9; }

  /* Results */
  table.results-recap { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-bottom: 20px; }
  table.results-recap th { text-align: left; font-size: 11px; color: var(--muted); font-weight: 600; padding: 7px 6px; border-bottom: 2px solid var(--line); }
  table.results-recap td { padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .mini-badge { width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 11px; color: #fff; }
  .mini-badge.D { background: var(--red); } .mini-badge.I { background: var(--gold); } .mini-badge.S { background: var(--green); } .mini-badge.C { background: var(--ink); }
  .result-icon { font-weight: 800; }
  .result-icon.ok { color: var(--green); } .result-icon.no { color: var(--red); }

  .tier-card { margin-top: 4px; padding: 20px 22px; border-radius: 14px; background: var(--ink); color: #fff; margin-bottom: 20px; }
  .tier-card .t-label { font-size: 11px; color: var(--gold-soft); font-weight: 700; margin-bottom: 8px; letter-spacing: 0.3px; }
  .tier-card .t-title { font-size: 19px; font-weight: 700; margin-bottom: 8px; }
  .tier-card p { font-size: 13.5px; line-height: 1.55; color: #DCE1F5; margin: 0; }
  .score-big { text-align: center; margin-bottom: 4px; }
  .score-big .num { font-size: 40px; font-weight: 800; color: var(--ink); }
  .score-big .den { font-size: 16px; color: var(--muted); }

  .save-note { font-size: 12.5px; color: var(--muted); margin-top: 14px; text-align: center; }
  .result-actions { display: flex; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
  .result-actions .btn { flex: 1; min-width: 140px; }
  .teacher-link { display: block; text-align: center; margin-top: 20px; font-size: 12.5px; color: var(--muted); text-decoration: underline; cursor: pointer; background: none; border: none; }

  .teacher-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  table.results-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.results-table th { text-align: left; font-size: 10.5px; color: var(--muted); font-weight: 600; padding: 7px 6px; border-bottom: 2px solid var(--line); }
  table.results-table td { padding: 8px 6px; border-bottom: 1px solid var(--line); }
  .tag { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; background: var(--gold-soft); color: #7A5A16; }
  .empty-note { text-align: center; color: var(--muted); font-size: 13.5px; padding: 30px 0; }
  .icon-btn { background: none; border: 1.5px solid var(--line); border-radius: 8px; padding: 7px 13px; font-size: 12.5px; color: var(--ink); cursor: pointer; }
  .icon-btn:hover { border-color: var(--gold); }
  .table-scroll { overflow-x: auto; }

  /* Phase 2: Belbin roles */
  .disc-tag { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-soft); background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 5px 12px 5px 6px; margin: -6px 0 14px; }
  .role-icon { width: 38px; height: 38px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 19px; line-height: 1; flex-shrink: 0; border: 2px solid; }
  .role-icon.action { background: #F6DCD4; border-color: #D9826A; }
  .role-icon.people { background: #FBF1D6; border-color: #D7B25A; }
  .role-icon.thought { background: #DCEFE9; border-color: #6FB8A2; }
  .role-icon.sm { width: 24px; height: 24px; font-size: 13px; border-width: 1.5px; vertical-align: middle; margin: 0 5px 0 0; }
  .role-line { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .role-line .role-icon.sm { margin: 0; }
  .role-line-sm { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 2px; }
  .role-line-sm .role-icon.sm { margin: 0 2px 0 0; }
  .role-cell { display: inline-flex; align-items: center; white-space: nowrap; }
  .role-primer-item { display: flex; gap: 12px; align-items: center; }
  .role-choice-btn { display: flex; gap: 12px; align-items: center; }
  .role-en { font-size: 11px; font-weight: 500; color: var(--muted); }
  .role-cluster-title { font-size: 11.5px; font-weight: 700; letter-spacing: 0.2px; margin: 14px 0 8px; padding: 5px 10px; border-radius: 8px; display: inline-block; }
  .role-cluster-title.action { background: #F6DCD4; color: #7A2E1A; }
  .role-cluster-title.people { background: var(--gold-soft); color: #6B5314; }
  .role-cluster-title.thought { background: #DCEFE9; color: #1F5245; }
  .role-primer-item { font-size: 12px; line-height: 1.45; color: var(--muted); padding: 6px 2px; border-bottom: 1px solid var(--line); }
  .role-primer-item b { color: var(--ink); }
  .role-primer { margin-bottom: 20px; }
  .role-choice-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .role-choice-btn { text-align: left; padding: 11px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; cursor: pointer; transition: all 0.15s ease; }
  .role-choice-btn:hover { border-color: var(--gold); background: var(--gold-soft); }
  .role-choice-btn .rc-title { font-weight: 700; font-size: 13.5px; color: var(--ink); }
  .role-choice-btn .rc-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .consequence-box.partial { background: #A8741A; }
  .review-item.partial { border-left-color: var(--gold); }
  .result-icon.mid { color: #A8741A; }
  .score-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .score-pair .score-box { text-align: center; padding: 14px 8px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
  .score-pair .sb-value { font-size: 26px; font-weight: 800; color: var(--ink); }
  .score-pair .sb-label { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

  /* Markers, review, insights */
  .marker-row { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .marker-label { font-size: 11px; font-weight: 700; opacity: 0.9; margin-right: 2px; }
  .marker-chip { font-size: 11.5px; padding: 3px 10px; border-radius: 20px; background: rgba(255,255,255,0.2); color: #fff; }
  .marker-row.dark .marker-label { color: var(--muted); opacity: 1; }
  .marker-row.dark .marker-chip { background: var(--gold-soft); color: #7A5A16; }
  .review-item { border: 1px solid var(--line); border-left: 4px solid var(--red); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; background: #fff; }
  .review-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; margin-bottom: 6px; }
  .review-head span { font-size: 11.5px; color: var(--muted); }
  .review-item p { font-size: 12.5px; line-height: 1.55; color: var(--ink-soft); margin: 0; }
  .review-ok { margin-bottom: 18px; padding: 12px 14px; border-radius: 10px; background: #DCEFE9; color: #1F5245; font-size: 13px; }
  .insight-box { margin-bottom: 18px; padding: 14px 16px; border-radius: 12px; background: var(--gold-soft); border: 1px solid #E5CE9B; }
  .insight-box.good { background: #DCEFE9; border-color: #B5D9CE; }
  .insight-box .ib-title { font-size: 11px; font-weight: 700; letter-spacing: 0.3px; color: #7A5A16; margin-bottom: 6px; }
  .insight-box.good .ib-title { color: #1F5245; }
  .insight-box p { font-size: 13px; line-height: 1.55; color: var(--ink); margin: 0 0 6px; }
  .insight-box p:last-child { margin-bottom: 0; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
  var DISC_META = {
    D: { name: "Домінування", sub: "Напір, швидкість, контроль", short: "Прямий, рішучий, орієнтований на результат і швидкі дії." },
    I: { name: "Вплив", sub: "Комунікація, ентузіазм", short: "Товариський, енергійний, надихає інших, любить увагу." },
    S: { name: "Стабільність", sub: "Терпіння, підтримка", short: "Спокійний, лояльний, уникає конфліктів, цінує стабільність." },
    C: { name: "Сумлінність", sub: "Точність, аналіз", short: "Уважний до деталей, орієнтований на факти й якість." }
  };
  var DISC_ORDER = ["D", "I", "S", "C"];

  var CANDIDATES = [
    { id: "olena", name: "Олена", correct: "D",
      role: "Генератор ідей (Plant)", cluster: "thought",
      strengths: "Рішуча й сміливо мислить: швидко пропонує радикальні, нестандартні ходи й не боїться ризикувати.",
      weaknesses: "Нетерпляча, може ігнорувати думку повільніших колег і відкидати практичні обмеження.",
      description: "На нарадах Олена одразу висуває сміливі, нестандартні ходи й наполягає, щоб їх впровадили негайно: рідко чекає, поки всі висловляться, а коли обговорення затягується, відкрито каже: «Досить говорити, час діяти». Вона не боїться ризикувати, але нетерпляча до повільніших колег — їхні сумніви та практичні обмеження часто відкидає й легко вступає в суперечку, обстоюючи свою позицію. У кризових ситуаціях бере відповідальність на себе, навіть якщо це означає діяти без повного погодження команди.",
      markers: ["«Досить говорити, час діяти»", "сміливі, радикальні ідеї", "відкидає заперечення й обмеження", "бере відповідальність без погодження"],
      explanation: "Прямі формулювання, нетерпіння до довгих обговорень, готовність сперечатися й діяти без повного консенсусу — маркери типу D: орієнтація на результат і контроль, а не на процес чи згоду групи. Сміливі ідеї тут слугують швидкому результату, а не самому натхненню, як у типу I." },
    { id: "maksym", name: "Максим", correct: "I",
      role: "Дослідник ресурсів (Resource Investigator)", cluster: "people",
      strengths: "Комунікабельний, легко заводить зовнішні контакти й партнерства.",
      weaknesses: "Швидко втрачає інтерес до рутинної роботи, погано доводить справи до кінця.",
      description: "Максим — душа компанії: на будь-якому заході за кілька хвилин знайомиться з половиною присутніх, обмінюється контактами й легко домовляється про співпрацю чи майбутню зустріч. Обожнює презентувати ідеї перед аудиторією та отримувати схвальні відгуки. Водночас швидко втрачає інтерес до рутинної роботи: часто забуває заповнити звіт вчасно чи довести до кінця нудне завдання, бо його увагу вже захопила нова можливість. Погано переносить одноманітну, самотню роботу за комп'ютером без спілкування.",
      markers: ["легко знайомиться й домовляється про співпрацю", "любить презентувати й отримувати схвалення", "втрачає інтерес до рутини", "не доводить справи до кінця"],
      explanation: "Легкість у знайомствах, любов до публічних виступів і визнання, поряд із слабкою дисципліною в рутинних завданнях — типовий профіль I: енергія й товариськість важливіші за системність." },
    { id: "iryna", name: "Ірина", correct: "S",
      role: "Командний гравець (Teamworker)", cluster: "people",
      strengths: "Дипломатична, згладжує конфлікти, підтримує командний дух.",
      weaknesses: "Уникає складних, непопулярних рішень, може стримувати відверту критику.",
      description: "Ірина рідко першою висловлює свою думку на нарадах, але уважно слухає кожного й часто саме вона помічає, що хтось із колег засмучений чи перевантажений. Дипломатично згладжує напругу й підтримує добрий настрій у команді, шукаючи компроміс, який влаштує всіх. Уникає прямих конфліктів і складних, непопулярних рішень навіть тоді, коли не згодна, тому відверту критику часто стримує. Дуже цінує стабільність і важко переживає раптові зміни планів чи складу проєкту.",
      markers: ["помічає настрій колег", "згладжує конфлікти й підтримує дух команди", "уникає непопулярних рішень", "важко переживає зміни"],
      explanation: "Уважність до емоцій колег, уникнення конфлікту навіть ціною власної думки, важке переживання змін — це стрижневі риси типу S: цінність гармонії та стабільності понад усе." },
    { id: "dmytro", name: "Дмитро", correct: "C",
      role: "Завершувач (Completer Finisher)", cluster: "action",
      strengths: "Уважний до деталей, ніколи не зриває дедлайни, перевіряє все двічі.",
      weaknesses: "Повільно ухвалює рішення, тривожиться через дрібні помилки.",
      description: "Дмитро завжди готує детальний план перед початком будь-якої роботи й кілька разів перевіряє розрахунки, перш ніж показати їх іншим, тому майже ніколи не зриває дедлайни. Вважає за краще спиратися на дані й факти, а не на інтуїцію чи припущення, і може годинами шукати першоджерело статистики, яку хтось згадав побіжно. Рішення ухвалює повільно, а через дрібні помилки сильно тривожиться. Некомфортно почувається, коли рішення приймають поспіхом, без достатнього аналізу.",
      markers: ["детальний план і подвійна перевірка", "не зриває дедлайни", "спирається на дані й факти", "повільно вирішує, тривожиться через помилки"],
      explanation: "Схильність до ретельної перевірки, опора на факти й дані замість інтуїції, дискомфорт від поспішних рішень без аналізу — чіткі ознаки типу C: точність і якість важливіші за швидкість." },
    { id: "sofia", name: "Софія", correct: "I",
      role: "Генератор ідей (Plant)", cluster: "thought",

      roleScore: roleScoreCount(),
      roleTotal: ROLE_MAX,

      timestamp: Date.now()

    window.storage.set(key, JSON.stringify(payload), true).then(function (r) {
      state.saveStatus = r ? "saved" : "failed"; render();

  }

    window.storage.list(STORAGE_PREFIX, true).then(function (listRes) {
      var keys = (listRes && listRes.keys) || [];
      if (keys.length === 0) { state.teacherRows = []; state.teacherLoading = false; render(); return; }
      var promises = keys.map(function (k) {
        return window.storage.get(k, true).then(function (r) { try { return JSON.parse(r.value); } catch (e) { return null; } }).catch(function () { return null; });

      Promise.all(promises).then(function (rows) {
        rows = rows.filter(Boolean).sort(function (a, b) { return b.timestamp - a.timestamp; });

      });
    }).catch(function () { state.teacherRows = []; state.teacherLoading = false; render(); });
  }

        return csvEscape(a.isCorrect ? "✓" : "✕ (обрано " + a.chosen + ")");

      var roleCells = CANDIDATES.map(function (c) {
        var a = (r.roleAnswers || []).filter(function (x) { return x.candidateId === c.id; })[0];
        if (!a) return csvEscape("");
        return csvEscape(a.points === 2 ? "✓" : (a.points === 1 ? "≈ (обрано " : "✕ (обрано ") + (a.points === 2 ? "" : roleMain(a.chosen) + ")"));
      });
      lines.push([csvEscape(r.name), r.score, r.total, r.roleScore != null ? r.roleScore : "", r.roleTotal != null ? r.roleTotal : "", csvEscape(new Date(r.timestamp).toLocaleString("uk-UA"))].concat(cells).concat(roleCells).join(";"));
    });
    var blob = new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a"); a.href = url; a.download = "disc-recognition-results.csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  }

  function copyToClipboard(text, btn) {
    function ok() { btn.textContent = "Скопійовано ✓"; setTimeout(function () { btn.textContent = "Скопіювати результат"; }, 1800); }
    function fail() { var ta = document.getElementById("copy-fallback-area"); if (ta) { ta.style.display = "block"; ta.focus(); ta.select(); } }
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(ok).catch(fail); }
    else {
      try {
        var temp = document.createElement("textarea"); temp.value = text; temp.style.position = "fixed"; temp.style.opacity = "0";
        document.body.appendChild(temp); temp.focus(); temp.select();
        var success = document.execCommand("copy"); document.body.removeChild(temp);
        if (success) ok(); else fail();
      } catch (e) { fail(); }
    }
  }

  var PAIR_TIPS = {
    "D|I": "Обидва типи активні й упевнені, але спрямовані на різне: D — на результат і контроль, I — на людей, визнання та натхнення. Питання-перевірка: людині важливіше досягти мети чи справити враження й налагодити контакти?",
    "D|S": "Це контраст темпу й стилю: D діє швидко й прямо, не боїться суперечки, а S діє спокійно й шукає компроміс. Питання-перевірка: людина йде на конфлікт заради результату чи уникає його заради гармонії?",
    "D|C": "Обидва типи орієнтовані на результат, але D ухвалює рішення швидко, спираючись на впевненість, а C — після ретельного аналізу й перевірки. Питання-перевірка: людина поспішає діяти чи прагне спершу все перевірити?",
    "I|S": "Обидва типи тепло ставляться до людей, але I енергійний і шукає уваги, нових контактів і змін, а S спокійний, уважний слухач, який цінує стабільність. Питання-перевірка: людина любить публічність і новизну чи передбачуваність і підтримку?",
    "I|C": "I орієнтований на людей та ідеї й швидко втрачає інтерес до деталей, а C зосереджений на фактах, точності й якості. Питання-перевірка: людина надихається ідеєю чи перевіряє її на слабкі місця?",
    "S|C": "Обидва типи обережні й методичні, але S керується стосунками й гармонією в команді, а C — даними й якістю рішення. Питання-перевірка: людину більше турбує настрій колег чи точність фактів?"
  };

  function pairKey(a, b) { return [a, b].sort(function (x, y) { return DISC_ORDER.indexOf(x) - DISC_ORDER.indexOf(y); }).join("|"); }

  // Підрахунок плутанини: ключ "правильний>обраний"
  function confusionOf(answerLists) {
    var counts = {}, wrong = 0;
    answerLists.forEach(function (list) {
      (list || []).forEach(function (a) {
        if (a.isCorrect) return;
        var k = a.correct + ">" + a.chosen;
        counts[k] = (counts[k] || 0) + 1; wrong += 1;
      });
    });
    var top = null;
    Object.keys(counts).forEach(function (k) { if (!top || counts[k] > counts[top]) top = k; });
    return { counts: counts, wrong: wrong, top: top };
  }

  function candById(id) { return CANDIDATES.filter(function (c) { return c.id === id; })[0]; }

  function mistakesReviewHtml() {
    var wrong = state.answers.filter(function (a) { return !a.isCorrect; });
    if (wrong.length === 0) return '<div class="review-ok">Помилок немає: усі профілі розпізнано правильно.</div>';
    return '<label class="field-label">Розбір помилок</label>' + wrong.map(function (a) {
      var c = candById(a.candidateId);
      return '<div class="review-item">' +
        '<div class="review-head"><b>' + c.name + '</b><span>ваша відповідь <span class="mini-badge ' + a.chosen + '">' + a.chosen + '</span> → правильно <span class="mini-badge ' + a.correct + '">' + a.correct + '</span></span></div>' +
        '<p>' + escHtml(c.explanation) + '</p>' +
        '<div class="marker-row dark"><span class="marker-label">Маркери в описі:</span>' + c.markers.map(function (m) { return '<span class="marker-chip">' + escHtml(m) + '</span>'; }).join("") + '</div>' +
      '</div>';
    }).join("");
  }

  function personalConclusionHtml() {
    var conf = confusionOf([state.answers]);
    if (conf.wrong === 0) {
      return '<div class="insight-box good"><div class="ib-title">Персональний висновок</div><p>Ви не переплутали жодну пару стилів. Наступний крок — спробувати розпізнавати змішані профілі, де поруч із домінантним проявляється другий стиль.</p></div>';
    }
    var parts = conf.top.split(">");
    var tip = PAIR_TIPS[pairKey(parts[0], parts[1])];
    return '<div class="insight-box"><div class="ib-title">Персональний висновок</div>' +
      '<p>Найчастіше ви приймали <b>' + DISC_META[parts[0]].name + ' (' + parts[0] + ')</b> за <b>' + DISC_META[parts[1]].name + ' (' + parts[1] + ')</b>: ' + conf.counts[conf.top] + ' із ' + conf.wrong + ' помилок.</p>' +
      '<p>' + tip + '</p></div>';
  }

  function teacherStatsHtml(rows) {
    var withAnswers = rows.filter(function (r) { return r.answers && r.answers.length; });
    if (withAnswers.length === 0) return "";
    var stats = CANDIDATES.map(function (c) {
      var n = 0, ok = 0, wrongChoices = {};
      withAnswers.forEach(function (r) {
        r.answers.forEach(function (a) {
          if (a.candidateId !== c.id) return;
          n += 1; if (a.isCorrect) ok += 1; else wrongChoices[a.chosen] = (wrongChoices[a.chosen] || 0) + 1;
        });
      });
      var topWrong = null;
      Object.keys(wrongChoices).forEach(function (k) { if (!topWrong || wrongChoices[k] > wrongChoices[topWrong]) topWrong = k; });
      return { cand: c, n: n, ok: ok, pct: n ? Math.round(ok / n * 100) : 0, topWrong: topWrong };
    }).sort(function (a, b) { return a.pct - b.pct; });
    var trs = stats.map(function (st) {
      return '<tr><td>' + st.cand.name + '</td><td><span class="mini-badge ' + st.cand.correct + '">' + st.cand.correct + '</span></td><td>' + st.pct + '% (' + st.ok + '/' + st.n + ')</td><td>' +
        (st.topWrong ? '<span class="mini-badge ' + st.topWrong + '">' + st.topWrong + '</span>' : "—") + '</td></tr>';
    }).join("");
    var conf = confusionOf(withAnswers.map(function (r) { return r.answers; }));
    var confText = conf.top ? "Найчастіша плутанина групи: " + DISC_META[conf.top.split(">")[0]].name + " (" + conf.top.split(">")[0] + ") сприймають як " + DISC_META[conf.top.split(">")[1]].name + " (" + conf.top.split(">")[1] + ") — " + conf.counts[conf.top] + " разів." : "Помилок у групі немає.";
    return '<label class="field-label" style="margin-top:22px;">Де група помиляється (від найскладнішого)</label>' +
      '<div class="table-scroll"><table class="results-table"><thead><tr><th>Кандидат</th><th>Правильно</th><th>Вірних</th><th>Часта помилка</th></tr></thead><tbody>' + trs + '</tbody></table></div>' +
      '<div class="note-box" style="margin-top:12px;">' + confText + '</div>';
  }

      return (
        '<button class="disc-choice-btn" data-disc="' + d + '">' +

      );
    }).join("");

    var card = el(

    return '<label class="field-label">Розбір помилок у ролях</label>' + wrong.map(function (a) {
      var c = candById(a.candidateId);
      return '<div class="review-item ' + (a.points === 1 ? "partial" : "") + '">' +
        '<div class="review-head"><b>' + c.name + '</b><span class="role-line-sm">' + roleIconHtml(a.chosen, true) + roleMain(a.chosen) + ' → ' + roleIconHtml(a.correct, true) + '<b>' + roleMain(a.correct) + '</b> · ' + a.points + ' б.</span></div>' +
        '<p>' + escHtml(ROLE_INFO[c.id].explanation) + '</p>' + roleMarkersHtml(c, true) + '</div>';
    }).join("");
  }

  function roleConclusionHtml() {
    var exact = state.roleAnswers.filter(function (a) { return a.points === 2; }).length;
    var near = state.roleAnswers.filter(function (a) { return a.points === 1; }).length;
    var far = state.roleAnswers.filter(function (a) { return a.points === 0; });
    var n = CANDIDATES.length;
    if (exact === n) return '<div class="insight-box good"><div class="ib-title">Персональний висновок (ролі)</div><p>Ви точно визначили всі ролі. У наступній грі використовуйте кластер ролі, щоб вирішувати, скільки автономії давати виконавцю.</p></div>';
    var text = '<p>Точно визначено ролей: <b>' + exact + ' із ' + n + '</b>; у правильному кластері, але з іншою роллю: <b>' + near + '</b>; кластер визначено хибно: <b>' + far.length + '</b>.</p>';
    if (far.length > 0) {
      text += '<p>Хибний кластер у кандидатів: ' + far.map(function (a) { return candById(a.candidateId).name; }).join(", ") + '. Саме кластер найважливіший для наступної гри.</p>';
    } else {
      text += '<p>Кластери ви визначаєте правильно, залишилося уточнити нюанси між ролями всередині кластера.</p>';
    }
    return '<div class="insight-box"><div class="ib-title">Персональний висновок (ролі)</div>' + text + '<p>' + CLUSTER_TIP + '</p></div>';
  }

  function renderFinalResults() {
    var dScore = scoreCount(), dTotal = CANDIDATES.length;
    var rScore = roleScoreCount();
    var tier = tierForRoles(rScore, ROLE_MAX);
    var rowsHtml = state.roleAnswers.map(function (a) {
      var c = candById(a.candidateId);
      return '<tr><td>' + c.name + '</td><td><span class="mini-badge ' + c.correct + '">' + c.correct + '</span></td><td><span class="role-cell">' + roleIconHtml(a.chosen, true) + roleMain(a.chosen) + '</span></td><td><span class="role-cell">' + roleIconHtml(a.correct, true) + roleMain(a.correct) + '</span></td><td><span class="result-icon ' + (a.points === 2 ? "ok" : a.points === 1 ? "mid" : "no") + '">' + a.points + '</span></td></tr>';
    }).join("");
    var plain = plainTextExport();
    var saveNote = "";
    if (state.saveStatus === "saving") saveNote = "Зберігаємо результат…";
    else if (state.saveStatus === "saved") saveNote = "Результат збережено.";
    else if (state.saveStatus === "failed") saveNote = "Результат сформовано, але не вдалося зберегти для викладача.";
    var card = el(
      '<div class="stage-wrap"><div class="card">' +
      (state.studentName ? '<p class="kicker" style="text-align:center;">' + escHtml(state.studentName) + '</p>' : "") +
      '<div class="score-pair">' +
        '<div class="score-box"><div class="sb-value">' + dScore + ' / ' + dTotal + '</div><div class="sb-label">Фаза 1 · DISC</div></div>' +
        '<div class="score-box"><div class="sb-value">' + rScore + ' / ' + ROLE_MAX + '</div><div class="sb-label">Фаза 2 · Ролі за Белбіним</div></div>' +
      '</div>' +
      '<table class="results-recap"><thead><tr><th>Кандидат</th><th>DISC</th><th>Ваша роль</th><th>Правильна роль</th><th>Бали</th></tr></thead><tbody>' + rowsHtml + '</tbody></table>' +
      roleMistakesHtml() +
      roleConclusionHtml() +
      '<div class="tier-card"><div class="t-label">Підсумок фази 2</div><div class="t-title">' + tier.label + '</div><p>' + tier.text + '</p></div>' +
      '<div class="note-box">Наступний крок: гра «Проєкт: від команди до запуску». Там ці ж 8 кандидатів із готовими DISC-бейджами та ролями. Тип DISC підказує, кому доручити завдання, а кластер ролі — скільки автономії дати виконавцю: дієвий кластер — точно за інструкцією, соціальний — середня автономія, мисленнєвий — повна автономія. Це навчальне спрощення моделі.</div>' +
      (saveNote ? '<p class="save-note">' + saveNote + '</p>' : "") +
      '<div class="result-actions">' +
        '<button class="btn btn-secondary" id="copy-btn">Скопіювати результат</button>' +
        '<button class="btn btn-secondary" id="retry-btn">Спробувати ще раз</button>' +
      '</div>' +
      '<textarea id="copy-fallback-area" style="display:none;margin-top:12px;width:100%;min-height:110px;padding:10px;border-radius:10px;border:1.5px solid var(--line);font-size:11.5px;color:var(--muted);background:var(--surface);" readonly>' + escHtml(plain) + '</textarea>' +
      '<button class="teacher-link" id="teacher-link">Перегляд результатів групи (для викладача)</button>' +
      '</div></div>'
    );
    card.querySelector("#copy-btn").addEventListener("click", function (e) { copyToClipboard(plainTextExport(), e.currentTarget); });
    card.querySelector("#retry-btn").addEventListener("click", function () {
      state.screen = "intro"; state.answers = []; state.index = 0; state.roleAnswers = []; state.roleIndex = 0; state.saveStatus = "idle"; render();
    });
    card.querySelector("#teacher-link").addEventListener("click", function () { state.screen = "teacher"; render(); loadTeacherRows(); });
    return card;
  }

  function teacherRoleStatsHtml(rows) {
    var withRoles = rows.filter(function (r) { return r.roleAnswers && r.roleAnswers.length; });
    if (withRoles.length === 0) return "";
    var stats = CANDIDATES.map(function (c) {
      var n = 0, sum = 0, exact = 0, wrongChoices = {};
      withRoles.forEach(function (r) {
        r.roleAnswers.forEach(function (a) {
          if (a.candidateId !== c.id) return;
          n += 1; sum += a.points; if (a.points === 2) exact += 1; else wrongChoices[a.chosen] = (wrongChoices[a.chosen] || 0) + 1;
        });
      });
      var topWrong = null;
      Object.keys(wrongChoices).forEach(function (k) { if (!topWrong || wrongChoices[k] > wrongChoices[topWrong]) topWrong = k; });
      return { cand: c, n: n, exactPct: n ? Math.round(exact / n * 100) : 0, avg: n ? (sum / n).toFixed(1) : "0.0", topWrong: topWrong };
    }).sort(function (a, b) { return a.exactPct - b.exactPct; });
    var trs = stats.map(function (st) {
      return '<tr><td>' + st.cand.name + '</td><td><span class="role-cell">' + roleIconHtml(st.cand.role, true) + roleMain(st.cand.role) + '</span></td><td>' + st.exactPct + '%</td><td>' + st.avg + ' / 2</td><td>' + (st.topWrong ? '<span class="role-cell">' + roleIconHtml(st.topWrong, true) + roleMain(st.topWrong) + '</span>' : "—") + '</td></tr>';
    }).join("");
    return '<label class="field-label" style="margin-top:22px;">Фаза 2: де група помиляється в ролях (від найскладнішого)</label>' +
      '<div class="table-scroll"><table class="results-table"><thead><tr><th>Кандидат</th><th>Правильна роль</th><th>Точно</th><th>Середній бал</th><th>Часта помилка</th></tr></thead><tbody>' + trs + '</tbody></table></div>';
  }

  function renderTeacher() {
    var rows = state.teacherRows;
    var bodyHtml;
    if (state.teacherLoading) bodyHtml = '<p class="empty-note">Завантаження результатів…</p>';
    else if (!rows || rows.length === 0) bodyHtml = '<p class="empty-note">Поки що ніхто не пройшов тренажер за цим посиланням.</p>';
    else {
      var trs = rows.map(function (r) {
        return '<tr><td>' + escHtml(r.name) + '</td><td>' + r.score + ' / ' + r.total + '</td><td>' + (r.roleScore != null ? r.roleScore + ' / ' + r.roleTotal : '—') + '</td><td>' + new Date(r.timestamp).toLocaleString("uk-UA") + '</td></tr>';
      }).join("");
      bodyHtml = '<div class="table-scroll"><table class="results-table"><thead><tr><th>Студент</th><th>DISC</th><th>Ролі</th><th>Дата</th></tr></thead><tbody>' + trs + '</tbody></table></div>' + teacherStatsHtml(rows) + teacherRoleStatsHtml(rows);
    }
    var card = el(
      '<div class="stage-wrap"><div class="card">' +
      '<div class="teacher-header"><h1 class="title serif" style="margin:0;font-size:22px;">Результати групи</h1><button class="icon-btn" id="refresh-btn">Оновити</button></div>' +
      bodyHtml +
      '<div class="result-actions"><button class="btn btn-secondary" id="csv-btn"' + ((!rows || rows.length === 0) ? " disabled" : "") + '>Завантажити CSV</button><button class="btn btn-secondary" id="back-btn">← Назад</button></div>' +
      '</div></div>'
    );
    card.querySelector("#refresh-btn").addEventListener("click", loadTeacherRows);
    card.querySelector("#back-btn").addEventListener("click", function () { state.screen = state.roleAnswers.length >= CANDIDATES.length ? "final" : "intro"; render(); });
    var csvBtn = card.querySelector("#csv-btn");
    if (csvBtn && rows && rows.length > 0) csvBtn.addEventListener("click", downloadCsv);
    return card;
  }

  function render() {
    app.innerHTML = "";
    var view;
    if (state.screen === "intro") view = renderIntro();
    else if (state.screen === "quiz") view = renderQuiz();
    else if (state.screen === "feedback") view = renderFeedback();
    else if (state.screen === "results") view = renderResults();
    else if (state.screen === "roleIntro") view = renderRoleIntro();
    else if (state.screen === "roleQuiz") view = renderRoleQuiz();
    else if (state.screen === "roleFeedback") view = renderRoleFeedback();
    else if (state.screen === "final") view = renderFinalResults();
    else view = renderTeacher();
    app.appendChild(view);
    window.scrollTo(0, 0);
  }

  render();
})();
</script>
</body>
</html>
