  };

  var app = document.getElementById("app");
  function el(html) { var t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }
  function escHtml(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  var TOTAL_STAGES = 6;
  function stageBanner(n) {
    return '<div class="stage-head"><div class="stage-banner"><span class="stage-num">Етап ' + n + ' з ' + TOTAL_STAGES + '</span><span class="stage-title">' + SV_STAGES[n] + '</span></div>' + topScoreHtml() + '</div>';
  }
  // постійний показник досягнення вгорі кожної сторінки етапу (оновлюється після кожної відповіді)
  function topScoreHtml() {
    var pct = totalPoints() / maxPoints() * 100;
    return '<div class="top-score"><span class="top-score-text">' + totalPoints() + ' із ' + maxPoints() + ' балів</span><div class="seg-track"><div class="seg-rest" style="width:' + (100 - pct).toFixed(1) + '%"></div></div></div>';
  }
  function updateTopScore(card) {
    var t = card.querySelector(".top-score"); if (t) t.outerHTML = topScoreHtml();
  }

  // ---------- Відповідь і розбір на тій самій сторінці (без переходу на новий екран) ----------
  function lockMatrix(card, chosen, correct) {
    card.querySelectorAll(".disc-choice-btn").forEach(function (b) {
      var d = b.getAttribute("data-disc");
      b.disabled = true;
      if (d === chosen) b.classList.add(chosen === correct ? "picked-ok" : "picked-bad");
      else if (d === correct) b.classList.add("right");
      else b.classList.add("dimmed");
    });
  }
  // переносимо вміст екрана розбору (без банера) під матрицю; обробники кнопок зберігаються
  function mountFeedback(card, fbCard) {
    var zone = card.querySelector("#fb-zone");
    var inner = fbCard.querySelector(".card");
    var head = inner.querySelector(".stage-head"); if (head) head.remove();
    zone.innerHTML = "";
    while (inner.firstChild) zone.appendChild(inner.firstChild);
    zone.classList.add("fb-in");
    updateTopScore(card);
    zone.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function surveyById(id) { return ALL_SV.filter(function (q) { return q.id === id; })[0]; }
  // ---------- Оцінювання: 2 бали — правильний стиль, 1 бал — сусідній (близький), 0 — протилежний ----------
  // Матриця: D зверху ліворуч, I зверху праворуч, S знизу праворуч, C знизу ліворуч. Протилежні (по діагоналі): D–S та I–C.
  var OPPOSITE = { D: "S", S: "D", I: "C", C: "I" };
  function discPoints(chosen, correct) {
    if (chosen === correct) return 2;
    return OPPOSITE[correct] === chosen ? 0 : 1;
  }
  function ptsOf(a) { return a.points != null ? a.points : (a.isCorrect ? 2 : 0); }
  // Чому саме стільки балів: спільна вісь матриці
  function closenessNote(chosen, correct) {
    if (chosen === correct) return "";
    if (OPPOSITE[correct] === chosen) return "Ці стилі протилежні: вони різняться і за поведінкою, і за середовищем.";
    var row = { D: 0, I: 0, C: 1, S: 1 }, col = { D: 0, C: 0, I: 1, S: 1 };
    if (row[chosen] === row[correct]) return "Стилі близькі: обидва " + (row[chosen] === 0 ? "активні" : "реагуючі") + " у поведінці, але різняться середовищем.";
    return "Стилі близькі: обидва діють у " + (col[chosen] === 0 ? "ворожому" : "дружньому") + " середовищі, але різняться поведінкою.";
  }
  function verdictOf(pts) {
    return pts === 2 ? { cls: "correct", label: "Правильно! +2 бали" }
      : pts === 1 ? { cls: "partial", label: "Наполовину правильно: близький стиль, +1 бал" }
      : { cls: "incorrect", label: "Неправильно: протилежний стиль, 0 балів" };
  }
  function surveyScore(stage) {
    return state.surveyAnswers.reduce(function (sum, a) { return sum + ((!stage || surveyById(a.id).stage === stage) ? ptsOf(a) : 0); }, 0);
  }
  function surveyMax(stage) { return (stage ? svItems(stage).length : ALL_SV.length) * 2; }
  function scoreCount() { return state.answers.reduce(function (sum, a) { return sum + ptsOf(a); }, 0); }
  function casesMax() { return CANDIDATES.length * 2; }
  function totalPoints() { return surveyScore() + scoreCount(); }
  function maxPoints() { return surveyMax() + casesMax(); }
  function totalPercent() { return Math.round(totalPoints() / maxPoints() * 100); }
  // Шкала з балами: поточна сума із загального максимуму
  function scoreBarHtml() {
    var pct = totalPoints() / maxPoints() * 100;
    // суцільна шкала: градієнт червоний → жовтий → зелений на всю ширину; незаповнена частина закрита сірим
    return '<div class="score-bar"><p class="score-bar-text">' + totalPoints() + ' із ' + maxPoints() + ' балів</p>' +
      '<div class="seg-track"><div class="seg-rest" style="width:' + (100 - pct).toFixed(1) + '%"></div></div></div>';
  }

  function tierFor(score, total) {
    var pct = score / total;   // частка від максимуму балів
    if (pct >= 0.875) return { label: "Відмінне розпізнавання DISC", cls: "good",
      text: "Ви впевнено зчитуєте поведінкові маркери кожного стилю. Це саме той навик, який знадобиться під час формування команди — розпізнавати DISC не з готової позначки, а з реальної поведінки колег." };
    if (pct >= 0.625) return { label: "Непогане розуміння, є прогалини", cls: "mixed",
      text: "Більшість профілів ви визначили правильно, але кілька стилів усе ще плутаються. Варто ще раз звернути увагу на різницю між типами, які найчастіше плутають (наприклад, D і C — обидва рішучі, але по-різному; I і S — обидва товариські, але по-різному)." };
    return { label: "Варто повторити теорію DISC", cls: "bad",
      text: "Поки що складно з першого прочитання визначити стиль за поведінкою. Це нормально на старті — поверніться до опису чотирьох стилів і зверніть увагу на конкретні слова-маркери в описах (наприклад, «уникає конфлікту», «любить деталі», «бере ініціативу», «надихається новою ідеєю»)." };
  }

  function plainTextExport() {
    var lines = [];
    lines.push("Тренажер розпізнавання DISC-стилів — результати");
    if (state.studentName) lines.push("Студент: " + state.studentName);
    lines.push("Загальний результат: " + totalPercent() + "% (" + totalPoints() + " із " + maxPoints() + " балів; правильний стиль — 2, близький — 1, протилежний — 0)");
    lines.push("");
    [1, 2, 3, 4, 5, 6].forEach(function (n) {
      if (n === 4) {
        lines.push("Етап 4 · " + SV_STAGES[4] + ": " + scoreCount() + " з " + casesMax());
        state.answers.forEach(function (a) {
          var cand = candById(a.candidateId);
          lines.push("[" + ptsOf(a) + " б.] " + cand.name + " — ваша відповідь: " + a.chosen + ", правильна: " + a.correct);
        });
        lines.push("");
        return;
      }
      var st = state.surveyAnswers.filter(function (a) { return surveyById(a.id).stage === n; });
      if (!st.length) return;
      lines.push("Етап " + n + " · " + SV_STAGES[n] + ": " + surveyScore(n) + " з " + surveyMax(n));
      st.forEach(function (a) {
        lines.push("[" + ptsOf(a) + " б.] " + surveyById(a.id).title + " — ваша відповідь: " + a.chosen + ", правильна: " + a.correct);
      });
      lines.push("");
    });
    return lines.join("\n");
  }

  function saveResultToStorage() {
    if (!window.storage) return;
    state.saveStatus = "saving";
    var key = STORAGE_PREFIX + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
    var payload = {
      name: state.studentName || "Анонім",
      score: scoreCount(),
      total: casesMax(),
      totalPoints: totalPoints(),
      totalMax: maxPoints(),
      percent: totalPercent(),
      answers: state.answers,
      surveyScore: surveyScore(),
      surveyTotal: surveyMax(),
      stageScores: { 1: surveyScore(1), 2: surveyScore(2), 3: surveyScore(3), 5: surveyScore(5), 6: surveyScore(6) },
      surveyAnswers: state.surveyAnswers,
      timestamp: Date.now()
    };
    window.storage.set(key, JSON.stringify(payload), true).then(function (r) {
      state.saveStatus = r ? "saved" : "failed"; render();
    }).catch(function () { state.saveStatus = "failed"; render(); });
  }

  function loadTeacherRows() {
    state.teacherLoading = true; render();
    if (!window.storage) { state.teacherRows = []; state.teacherLoading = false; render(); return; }
    window.storage.list(STORAGE_PREFIX, true).then(function (listRes) {
      var keys = (listRes && listRes.keys) || [];
      if (keys.length === 0) { state.teacherRows = []; state.teacherLoading = false; render(); return; }
      var promises = keys.map(function (k) {
        return window.storage.get(k, true).then(function (r) { try { return JSON.parse(r.value); } catch (e) { return null; } }).catch(function () { return null; });
      });
      Promise.all(promises).then(function (rows) {
        rows = rows.filter(Boolean).sort(function (a, b) { return b.timestamp - a.timestamp; });
        state.teacherRows = rows; state.teacherLoading = false; render();
      });
    }).catch(function () { state.teacherRows = []; state.teacherLoading = false; render(); });
  }

  function csvEscape(t) { return '"' + String(t).replace(/"/g, '""') + '"'; }
  function downloadCsv() {
    var rows = state.teacherRows || [];
    var header = ["Ім'я", "Загальний %", "Кейси бал", "Кейси з", "Опитування бал", "Опитування з", "Дата"]
      .concat(CANDIDATES.map(function (c) { return c.name + " (" + c.correct + ")"; }))
      .concat(ALL_SV.map(function (q) { return "Етап " + q.stage + ": фактор " + q.correct; }));
    var lines = [header.map(csvEscape).join(";")];
    rows.forEach(function (r) {
      var cells = CANDIDATES.map(function (c) {
        var a = (r.answers || []).filter(function (x) { return x.candidateId === c.id; })[0];
        if (!a) return csvEscape("");
        return csvEscape(ptsOf(a) + " б." + (a.isCorrect ? "" : " (обрано " + a.chosen + ")"));
      });
      var svCells = ALL_SV.map(function (q) {
        var a = (r.surveyAnswers || []).filter(function (x) { return x.id === q.id; })[0];
        if (!a) return csvEscape("");
        return csvEscape(ptsOf(a) + " б." + (a.isCorrect ? "" : " (обрано " + a.chosen + ")"));
      });
      lines.push([csvEscape(r.name), r.percent != null ? r.percent : "", r.score, r.total, r.surveyScore != null ? r.surveyScore : "", r.surveyTotal != null ? r.surveyTotal : "", csvEscape(new Date(r.timestamp).toLocaleString("uk-UA"))].concat(cells).concat(svCells).join(";"));
    });
    var blob = new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a"); a.href = url; a.download = "disc-recognition-results.csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  }

  function copyToClipboard(text, btn) {
    function ok() { btn.textContent = "Скопійовано ✓"; setTimeout(function () { btn.textContent = "Скопіювати результат"; }, 1800); }
    function fail() { var ta = document.getElementById("copy-fallback-area"); if (ta) { ta.style.display = "block"; ta.focus(); ta.select(); } }
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(ok).catch(fail); }
    else {
      try {
        var temp = document.createElement("textarea"); temp.value = text; temp.style.position = "fixed"; temp.style.opacity = "0";
        document.body.appendChild(temp); temp.focus(); temp.select();
        var success = document.execCommand("copy"); document.body.removeChild(temp);
        if (success) ok(); else fail();
      } catch (e) { fail(); }
    }
  }

  var PAIR_TIPS = {
    "D|I": "Обидва типи активні й упевнені, але спрямовані на різне: D — на результат і контроль, I — на людей, визнання та натхнення. Питання-перевірка: людині важливіше досягти мети чи справити враження й налагодити контакти?",
    "D|S": "Це контраст темпу й стилю: D діє швидко й прямо, не боїться суперечки, а S діє спокійно й шукає компроміс. Питання-перевірка: людина йде на конфлікт заради результату чи уникає його заради гармонії?",
    "D|C": "Обидва типи орієнтовані на результат, але D ухвалює рішення швидко, спираючись на впевненість, а C — після ретельного аналізу й перевірки. Питання-перевірка: людина поспішає діяти чи прагне спершу все перевірити?",
    "I|S": "Обидва типи тепло ставляться до людей, але I енергійний і шукає уваги, нових контактів і змін, а S спокійний, уважний слухач, який цінує стабільність. Питання-перевірка: людина любить публічність і новизну чи передбачуваність і підтримку?",
    "I|C": "I орієнтований на людей та ідеї й швидко втрачає інтерес до деталей, а C зосереджений на фактах, точності й якості. Питання-перевірка: людина надихається ідеєю чи перевіряє її на слабкі місця?",
    "S|C": "Обидва типи обережні й методичні, але S керується стосунками й гармонією в команді, а C — даними й якістю рішення. Питання-перевірка: людину більше турбує настрій колег чи точність фактів?"
  };

  function pairKey(a, b) { return [a, b].sort(function (x, y) { return DISC_ORDER.indexOf(x) - DISC_ORDER.indexOf(y); }).join("|"); }

  // Підрахунок плутанини: ключ "правильний>обраний"
  function confusionOf(answerLists) {
    var counts = {}, wrong = 0;
    answerLists.forEach(function (list) {
      (list || []).forEach(function (a) {
        if (a.isCorrect) return;
        var k = a.correct + ">" + a.chosen;
        counts[k] = (counts[k] || 0) + 1; wrong += 1;
      });
    });
    var top = null;
    Object.keys(counts).forEach(function (k) { if (!top || counts[k] > counts[top]) top = k; });
    return { counts: counts, wrong: wrong, top: top };
  }

  function candById(id) { return CANDIDATES.filter(function (c) { return c.id === id; })[0]; }

  function mistakesReviewHtml() {
    var wrong = state.answers.filter(function (a) { return !a.isCorrect; });
    if (wrong.length === 0) return '<div class="review-ok">Помилок немає: усі профілі розпізнано правильно.</div>';
    return '<label class="field-label">Розбір помилок</label>' + wrong.map(function (a) {
      var c = candById(a.candidateId);
      return '<div class="review-item">' +
        '<div class="review-head"><b>' + c.name + '</b><span>ваша відповідь <span class="mini-badge ' + a.chosen + '">' + a.chosen + '</span> → правильно <span class="mini-badge ' + a.correct + '">' + a.correct + '</span></span></div>' +
        '<p>' + escHtml(c.explanation) + '</p>' +
        '<div class="marker-row dark"><span class="marker-label">Маркери в описі:</span>' + c.markers.map(function (m) { return '<span class="marker-chip">' + escHtml(m) + '</span>'; }).join("") + '</div>' +
      '</div>';
    }).join("");
  }

  function personalConclusionHtml() {
    var conf = confusionOf([state.answers]);
    if (conf.wrong === 0) {
      return '<div class="insight-box good"><div class="ib-title">Персональний висновок</div><p>Ви не переплутали жодну пару стилів. Наступний крок — спробувати розпізнавати змішані профілі, де поруч із домінантним проявляється другий стиль.</p></div>';
    }
    var parts = conf.top.split(">");
    var tip = PAIR_TIPS[pairKey(parts[0], parts[1])];
    return '<div class="insight-box"><div class="ib-title">Персональний висновок</div>' +
      '<p>Найчастіше ви приймали <b>' + DISC_META[parts[0]].name + ' (' + parts[0] + ')</b> за <b>' + DISC_META[parts[1]].name + ' (' + parts[1] + ')</b>: ' + conf.counts[conf.top] + ' із ' + conf.wrong + ' помилок.</p>' +
      '<p>' + tip + '</p></div>';
  }

  function teacherStatsHtml(rows) {
    var withAnswers = rows.filter(function (r) { return r.answers && r.answers.length; });
    if (withAnswers.length === 0) return "";
    var stats = CANDIDATES.map(function (c) {
      var n = 0, ok = 0, wrongChoices = {};
      withAnswers.forEach(function (r) {
        r.answers.forEach(function (a) {
          if (a.candidateId !== c.id) return;
          n += 1; if (a.isCorrect) ok += 1; else wrongChoices[a.chosen] = (wrongChoices[a.chosen] || 0) + 1;
        });
      });
      var topWrong = null;
      Object.keys(wrongChoices).forEach(function (k) { if (!topWrong || wrongChoices[k] > wrongChoices[topWrong]) topWrong = k; });
      return { cand: c, n: n, ok: ok, pct: n ? Math.round(ok / n * 100) : 0, topWrong: topWrong };
    }).sort(function (a, b) { return a.pct - b.pct; });
    var trs = stats.map(function (st) {
      return '<tr><td>' + st.cand.name + '</td><td><span class="mini-badge ' + st.cand.correct + '">' + st.cand.correct + '</span></td><td>' + st.pct + '% (' + st.ok + '/' + st.n + ')</td><td>' +
        (st.topWrong ? '<span class="mini-badge ' + st.topWrong + '">' + st.topWrong + '</span>' : "—") + '</td></tr>';
    }).join("");
    var conf = confusionOf(withAnswers.map(function (r) { return r.answers; }));
    var confText = conf.top ? "Найчастіша плутанина групи: " + DISC_META[conf.top.split(">")[0]].name + " (" + conf.top.split(">")[0] + ") сприймають як " + DISC_META[conf.top.split(">")[1]].name + " (" + conf.top.split(">")[1] + ") — " + conf.counts[conf.top] + " разів." : "Помилок у групі немає.";
    return '<label class="field-label" style="margin-top:22px;">Де група помиляється (від найскладнішого)</label>' +
      '<div class="table-scroll"><table class="results-table"><thead><tr><th>Кандидат</th><th>Правильно</th><th>Вірних</th><th>Часта помилка</th></tr></thead><tbody>' + trs + '</tbody></table></div>' +
      '<div class="note-box" style="margin-top:12px;">' + confText + '</div>';
  }

  // Положення за годинниковою стрілкою: D, I вгорі; C, S внизу. Вертикаль — поведінка (активна/реагуюча), горизонталь — середовище (ворожа/дружня)
  function discMatrix(interactive) {
    function cell(d) {
      var m = DISC_META[d];
      var inner = '<img class="dm-bird" src="' + BIRDS[d] + '" alt="' + d + '"><div class="dm-name">' + m.name + '</div><div class="dm-text">' + (interactive ? m.sub : m.short) + '</div>';
      return interactive
        ? '<button class="disc-choice-btn dm-cell dm-' + d + '" data-disc="' + d + '">' + inner + '</button>'
        : '<div class="dm-cell dm-' + d + '">' + inner + '</div>';
    }
    return '<div class="dm">' +
      '<div class="dm-ax dm-top">Активна поведінка</div>' +
      '<div class="dm-ax dm-left"><span class="dm-txt">Ворожа, недружня, антагоністична середа</span></div>' +
      '<div class="dm-grid">' + cell("D") + cell("I") + cell("C") + cell("S") + '<i class="dm-ah t"></i><i class="dm-ah b"></i><i class="dm-ah l"></i><i class="dm-ah r"></i></div>' +
      '<div class="dm-ax dm-right"><span class="dm-txt">Дружня, сприятлива середа</span></div>' +
      '<div class="dm-ax dm-bottom">Реагуюча поведінка</div>' +
      '</div>';
  }

  function renderIntro() {
    var primerHtml = DISC_ORDER.map(function (d) {
      var m = DISC_META[d];
      return '<div class="primer-item"><div class="primer-letter ' + d + '">' + d + '</div><div class="primer-text"><b>' + m.name + '.</b> ' + m.short + '</div></div>';
    }).join("");

    var card = el(
      '<div class="stage-wrap"><div class="card">' +
      '<p class="kicker">Практичне заняття 4 · Бізнес-лідерство</p>' +
      '<h1 class="title serif">Розпізнай DISC-стиль</h1>' +
      '<p class="lead">Перш ніж формувати команду за готовими бейджами DISC, спробуйте визначити стиль самостійно — за детальним описом поведінки кандидата, без підказок. Гра складається з шести етапів. Етапи 1–3 — опитування за статтею: 1) зовнішні ознаки, 2) основні характеристики (зіставлення), 3) можливі слабкі сторони. Етап 4 — 8 кейсів: за описом поведінки кандидата оберіть стиль DISC. Етап 5 — поради зі статті: оберіть двох учасників із цим стилем. Етап 6 — «Кому доручити?»: під завдання оберіть учасника з відповідною цінністю.</p>' +
      '<label class="field-label">Нагадування моделі DISC</label>' +
      discMatrix(false) +
      '<div class="note-box"><b>Оцінювання.</b> Правильний стиль — 2 бали; наполовину правильний (сусідній на матриці, з однією спільною віссю) — 1 бал; протилежний — 0 балів. Наприкінці ви побачите загальний результат у відсотках від усіх балів.</div>' +
      '<div class="note-box">Важливо: лише в 1% людей чистий фактор DISC, у решти 99% це суміш 2–3 факторів. В опитуванні описано «чисті» типи, щоб ви навчилися бачити ключові маркери. Жоден фактор не є «поганим» чи «хорошим».</div>' +
      '<label class="field-label">Ваше ім\'я (необов\'язково)</label>' +
      '<input type="text" class="text-input" id="name-input" placeholder="Наприклад, Олена К." value="' + state.studentName.replace(/"/g,'&quot;') + '" />' +
      '<button class="btn btn-primary" id="start-btn">Почати: 6 етапів →</button>' +
      '</div></div>'
    );
    card.querySelector("#start-btn").addEventListener("click", function () {
      state.studentName = card.querySelector("#name-input").value.trim();
      state.order = shuffle(CANDIDATES.map(function (c) { return c.id; }));
      state.index = 0;
      state.answers = [];
      state.saveStatus = "idle";
      state.surveyAnswers = [];
      startStage(1);
    });
    return card;
  }

  function renderQuiz() {
    var candId = state.order[state.index];
    var cand = CANDIDATES.filter(function (c) { return c.id === candId; })[0];
    var progressPct = Math.round((state.index / state.order.length) * 100);

    var choicesHtml = DISC_ORDER.map(function (d) {
      var m = DISC_META[d];
      return (
        '<button class="disc-choice-btn" data-disc="' + d + '">' +
          '<div class="dc-badge ' + d + '">' + d + '</div>' +
          '<div><div class="dc-title">' + m.name + '</div><div class="dc-sub">' + m.sub + '</div></div>' +
        '</button>'
      );
    }).join("");

    var card = el(
      '<div class="stage-wrap"><div class="card">' +
      stageBanner(4) +
      '<div class="progress-track"><div class="progress-fill" style="width:' + progressPct + '%"></div></div>' +
      '<p class="step-count">Кандидат ' + (state.index + 1) + ' із ' + state.order.length + '</p>' +
      '<div class="cand-name-big serif">' + cand.name + '</div>' +
      '<div class="case-split"><div class="desc-box"><p>' + cand.description + '</p></div>' +
      '<div class="fig-box" title="' + escHtml(cand.name) + '">' + figureOf(cand.id) + '</div></div>' +
      '<label class="field-label">Який стиль DISC переважає в цій поведінці?</label>' +
      discMatrix(true) +
      '<div id="fb-zone"></div>' +
      '</div></div>'
    );

    card.querySelectorAll(".disc-choice-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var chosen = btn.getAttribute("data-disc");
        var isCorrect = chosen === cand.correct;
        var answer = { candidateId: cand.id, chosen: chosen, correct: cand.correct, isCorrect: isCorrect, points: discPoints(chosen, cand.correct) };
        state.answers.push(answer);
        state.lastAnswer = answer;
        lockMatrix(card, chosen, cand.correct);
        mountFeedback(card, renderFeedback());
      });
    });

    return card;
  }

  function renderFeedback() {
    var a = state.lastAnswer;
    var cand = CANDIDATES.filter(function (c) { return c.id === a.candidateId; })[0];
    var isLast = state.index >= state.order.length - 1;

    var card = el(
      '<div class="stage-wrap"><div class="card">' +
      stageBanner(4) +
      '<div class="consequence-box ' + verdictOf(ptsOf(a)).cls + '">' +
        '<div class="cq-label">' + verdictOf(ptsOf(a)).label + '</div>' +
        '<div class="cq-your">Ваша відповідь: ' + DISC_META[a.chosen].name + ' (' + a.chosen + ')' + (a.isCorrect ? "" : " · Правильна відповідь: " + DISC_META[a.correct].name + " (" + a.correct + ")") + '</div>' +
        (a.isCorrect ? '' : '<div class="cq-your"><b>' + closenessNote(a.chosen, a.correct) + '</b></div>') +
        '<p>' + escHtml(cand.explanation) + '</p>' +
        '<div class="marker-row"><span class="marker-label">Маркери в описі:</span>' + cand.markers.map(function (m) { return '<span class="marker-chip">' + escHtml(m) + '</span>'; }).join("") + '</div>' +
      '</div>' +
      '<button class="btn btn-primary" id="continue-btn">' + (isLast ? "Перейти до етапу 5 →" : "Наступний кандидат →") + '</button>' +
      '</div></div>'
    );

    card.querySelector("#continue-btn").addEventListener("click", function () {
      if (isLast) {
        startStage(5);
      } else {
        state.index += 1;
        state.screen = "quiz";
        render();
      }
    });

    return card;
  }

  // ---------- Етап 1: опитування за ознаками (за статтею HURMA) ----------
  function surveyCardHtml(q) {
    if (q.kind === "how") {
      return '<div class="sv-card"><p class="sv-sub">Як вести себе з цим фактором:</p><ul class="sv-list">' +
        q.list.map(function (t) { return '<li>' + t + '</li>'; }).join("") + '</ul>' +
        '<div class="sv-key"><span class="sv-key-label">Щоб вплинути на їхнє рішення</span>' + q.highlight.replace(/^Щоб вплинути на їхнє рішення,\s*/, "").replace(/^./, function (c) { return c.toUpperCase(); }) + '</div></div>';
    }
    if (q.kind === "list") {
      return '<div class="sv-card"><p class="sv-sub">' + q.label + ':</p><ul class="sv-list">' +
        q.list.map(function (t) { return '<li>' + t + '</li>'; }).join("") + '</ul></div>';
    }
    return '<div class="sv-card">' +
      '<p class="sv-intro">' + q.intro + '</p>' +
      '<p class="sv-sub">Зовнішні характеристики:</p>' +
      q.traits.map(function (t) { return '<p class="sv-trait"><b>' + t[0] + '.</b> ' + t[1] + '</p>'; }).join("") +
      '</div>';
  }

  function startStage(n) {
    state.stage = n;
    if (n === 2) { startGridStage(); return; }
    if (n === 3) { startShadowStage(); return; }
    state.surveyOrder = shuffle(svItems(n).map(function (q) { return q.id; }));   // описи — у випадковому порядку
    state.surveyIndex = 0;
    state.screen = "surveyQuiz";
    render();
  }

  // ---------- Етап 3: «Тінь сильної сторони» — поєднати сильну сторону з її слабкістю ----------
  // Ліворуч сильні сторони, праворуч слабкості (в різному випадковому порядку). Правильна пара: птах фактора; помилка: червоне підсвічування.
  // Бали за пару: з першої спроби 2, з другої 1, пізніше 0.
  function startShadowStage() {
    var ids = svItems(3).map(function (q) { return q.id; });
    state.shadow = { left: shuffle(ids), right: shuffle(ids), selL: null, selR: null, solved: {}, tries: {}, firstWrong: {}, bad: null, done: false };
    state.screen = "shadowQuiz"; render();
  }

  function renderShadowQuiz() {
    var g = state.shadow;
    var card = el(
      '<div class="stage-wrap"><div class="card">' +
      stageBanner(3) +
      '<p class="lead" style="margin-bottom:12px">Слабкість часто є «тінню» сильної сторони, яку застосовують надто сильно. Оберіть сильну сторону ліворуч і слабкість праворуч, яка їй відповідає. Правильна пара покаже птаха, неправильна підсвітиться червоним.</p>' +
      '<div class="sh-cols"><div><div class="g-title">Сильна сторона</div><div id="sh-left" class="sh-col"></div></div>' +
      '<div><div class="g-title">Слабкість («тінь»)</div><div id="sh-right" class="sh-col"></div></div></div>' +
      '<p class="pcard-hint" id="sh-hint"></p>' +
      '<div id="fb-zone"></div>' +
      '</div></div>'
    );
    var L = card.querySelector("#sh-left"), R = card.querySelector("#sh-right"), hint = card.querySelector("#sh-hint");

    function cardHtml(id, side) {
      var q = surveyById(id), solved = g.solved[id];
      var sel = (side === "L" ? g.selL : g.selR) === id;
      var bad = g.bad && g.bad[side] === id;
      var cls = "shcard" + (solved ? " ok dm-" + solved : "") + (sel ? " sel" : "") + (bad ? " bad shake" : "");
      return '<button class="' + cls + '" data-id="' + id + '" data-side="' + side + '"' + (solved ? " disabled" : "") + '>' +
        '<span>' + (side === "L" ? q.strength : q.weakness) + '</span>' +
        (solved ? '<img class="sh-bird" src="' + BIRDS[solved] + '" alt="' + solved + '">' : '') + '</button>';
    }
    function draw() {
      L.innerHTML = g.left.map(function (id) { return cardHtml(id, "L"); }).join("");
      R.innerHTML = g.right.map(function (id) { return cardHtml(id, "R"); }).join("");
      card.querySelectorAll(".shcard").forEach(function (b) {
        b.addEventListener("click", function () { choose(b.getAttribute("data-side"), b.getAttribute("data-id")); });
      });
      var left = g.left.length - Object.keys(g.solved).length;
      hint.textContent = left ? "Залишилось пар: " + left : "";
    }
    function choose(side, id) {
      g.bad = null;
      if (side === "L") g.selL = (g.selL === id) ? null : id; else g.selR = (g.selR === id) ? null : id;
      if (g.selL && g.selR) { check(); return; }
      draw();
    }
    function check() {
      var l = g.selL, r = g.selR, ql = surveyById(l), qr = surveyById(r);
      g.tries[l] = (g.tries[l] || 0) + 1;
      if (ql.correct === qr.correct) {
        g.solved[l] = ql.correct; g.solved[r] = ql.correct; g.selL = null; g.selR = null; draw();
        if (Object.keys(g.solved).length === g.left.length) setTimeout(finish, 900);
      } else {
        if (!g.firstWrong[l]) g.firstWrong[l] = qr.correct;
        g.bad = { L: l, R: r }; g.selL = null; g.selR = null; draw();
        setTimeout(function () { if (g.bad) { g.bad = null; draw(); } }, 1100);
      }
    }
    function finish() {
      if (g.done) return; g.done = true;
      g.left.forEach(function (id) {
        var q = surveyById(id), tries = g.tries[id] || 1, pts = tries === 1 ? 2 : (tries === 2 ? 1 : 0);
        state.surveyAnswers.push({ id: id, chosen: g.firstWrong[id] || q.correct, correct: q.correct, isCorrect: tries === 1, points: pts, tries: tries });
      });
      mountFeedback(card, renderShadowFeedback());
    }
    draw();
    return card;
  }

  function renderShadowFeedback() {
    var pts = 0;
    var rows = DISC_ORDER.map(function (d) {
      var q = svItems(3).filter(function (x) { return x.correct === d; })[0];
      var a = state.surveyAnswers.filter(function (x) { return x.id === q.id; })[0];
      pts += ptsOf(a);
      var note = a.tries === 1 ? "з першої спроби, +2 бали" : a.tries === 2 ? "з другої спроби, +1 бал" : "після кількох спроб, 0 балів";
      return '<div class="gf-row"><span class="mini-badge ' + d + '"></span><div><b>' + q.title + '</b> · ' + note +
        '<div class="gf-text"><b>Сила:</b> ' + escHtml(q.strength) + '<br><b>Тінь:</b> ' + escHtml(q.weakness) + '</div>' +
        '<div class="gf-text">' + escHtml(q.explanation) + '</div></div></div>';
    }).join("");
    var cls = pts >= 7 ? "correct" : pts >= 4 ? "partial" : "incorrect";
    var card = el(
      '<div class="stage-wrap"><div class="card">' +
      stageBanner(3) +
      '<div class="consequence-box ' + cls + '"><div class="cq-label">Етап 3 завершено: ' + pts + ' із ' + surveyMax(3) + ' балів</div>' +
        '<p style="margin:0">Усі пари знайдено. Нижче — сильна сторона кожного фактора та її «тінь».</p></div>' +
      '<div class="gf-list">' + rows + '</div>' +
      '<button class="btn btn-primary" id="continue-btn">Перейти до етапу 4: кейси →</button>' +
      '</div></div>'
    );
    card.querySelector("#continue-btn").addEventListener("click", function () {
      state.order = shuffle(CANDIDATES.map(function (c) { return c.id; }));
      state.index = 0; state.answers = []; state.screen = "quiz"; render();
    });
    return card;
  }

  // ---------- Етап 2: матриця 2×2 з описами «Основні характеристики» ----------
  // Студент обирає комірку, потім знизу — стиль DISC. Правильно: в комірці з'являється птах; неправильно: комірка червона.
  // Бали за комірку: з першої спроби 2, з другої 1, пізніше 0.
  function startGridStage() {
    var items = svItems(2);
    state.grid = {
      order: shuffle(items.map(function (q) { return q.id; })),   // описи у випадковому порядку
      sel: null, solved: {}, wrong: {}, tries: {}, done: false
    };
    state.screen = "gridQuiz";
    render();
  }

  function renderGridQuiz() {
    var g = state.grid;
    var card = el(
      '<div class="stage-wrap"><div class="card">' +
      stageBanner(2) +
      '<p class="lead" style="margin-bottom:12px">Оберіть комірку з описом, а потім натисніть унизу стиль DISC, який вона описує. Правильна відповідь покаже птаха в комірці, неправильна підсвітить її червоним.</p>' +
      '<div class="g-title">Основні характеристики</div>' +
      '<div class="gcell-grid" id="gcell-grid"></div>' +
      '<label class="field-label">Який це стиль DISC?</label>' +
      '<div class="gchoice-row" id="gchoice-row"></div>' +
      '<p class="pcard-hint" id="g-hint"></p>' +
      '<div id="fb-zone"></div>' +
      '</div></div>'
    );
    var gridEl = card.querySelector("#gcell-grid"), rowEl = card.querySelector("#gchoice-row"), hint = card.querySelector("#g-hint");

    function draw() {
      gridEl.innerHTML = g.order.map(function (id) {
        var q = surveyById(id), solved = g.solved[id], bad = (g.wrong[id] || []).length > 0 && !solved;
        var cls = "gcell" + (solved ? " ok" : "") + (g.sel === id ? " sel" : "") + (bad && g.sel !== id ? " bad" : "");
        return '<button class="' + cls + (solved ? ' dm-' + solved : '') + '" data-id="' + id + '"' + (solved ? " disabled" : "") + '>' +
          '<ul class="gc-list">' + q.list.map(function (t) { return '<li>' + t + '</li>'; }).join("") + '</ul>' +
          (solved ? '<div class="gc-bird"><img src="' + BIRDS[solved] + '" alt="' + solved + '"><span>' + DISC_META[solved].name + '</span></div>' : '') +
          '</button>';
      }).join("");
      gridEl.querySelectorAll(".gcell").forEach(function (b) {
        b.addEventListener("click", function () { var id = b.getAttribute("data-id"); g.sel = (g.sel === id) ? null : id; draw(); });
      });
      rowEl.innerHTML = DISC_ORDER.map(function (d) {
        var disabled = !g.sel;   // без підказок: усі чотири стилі доступні, коли комірку обрано
        return '<button class="gchoice dm-' + d + '" data-disc="' + d + '"' + (disabled ? " disabled" : "") + '><img src="' + BIRDS[d] + '" alt="' + d + '"><span>' + DISC_META[d].name + '</span></button>';
      }).join("");
      rowEl.querySelectorAll(".gchoice").forEach(function (b) {
        b.addEventListener("click", function () { pick(b.getAttribute("data-disc")); });
      });
      var left = g.order.length - Object.keys(g.solved).length;
      hint.textContent = g.sel ? "Оберіть стиль для вибраної комірки." : (left ? "Спершу оберіть комірку. Залишилось: " + left : "");
    }

    function pick(d) {
      var id = g.sel, q = surveyById(id);
      g.tries[id] = (g.tries[id] || 0) + 1;
      if (d === q.correct) {
        g.solved[id] = d; g.sel = null;
        draw();
        if (Object.keys(g.solved).length === g.order.length) setTimeout(finishGrid, 900);
      } else {
        (g.wrong[id] = g.wrong[id] || []).push(d); g.sel = null;
        draw();
        var cell = gridEl.querySelector('[data-id="' + id + '"]'); if (cell) { cell.classList.add("shake"); }
      }
    }

    function finishGrid() {
      if (g.done) return; g.done = true;
      // відповіді етапу: бали залежать від кількості спроб
      g.order.forEach(function (id) {
        var q = surveyById(id), tries = g.tries[id] || 1, w = g.wrong[id] || [];
        var pts = tries === 1 ? 2 : (tries === 2 ? 1 : 0);
        var ans = { id: id, chosen: w.length ? w[0] : q.correct, correct: q.correct, isCorrect: tries === 1, points: pts, tries: tries };
        state.surveyAnswers.push(ans);
      });
      // підсумок етапу з'являється під матрицею на цій самій сторінці
      rowEl.style.display = "none"; hint.style.display = "none";
      var lbl = card.querySelector(".field-label"); if (lbl) lbl.style.display = "none";
      mountFeedback(card, renderGridFeedback());
    }
    draw();
    return card;
  }

  function renderGridFeedback() {
    var g = state.grid, pts = 0;
    var rows = DISC_ORDER.map(function (d) {
      var q = svItems(2).filter(function (x) { return x.correct === d; })[0];
      var a = state.surveyAnswers.filter(function (x) { return x.id === q.id; })[0];
      pts += ptsOf(a);
      var note = a.tries === 1 ? "з першої спроби, +2 бали" : a.tries === 2 ? "з другої спроби, +1 бал" : "після кількох спроб, 0 балів";
      return '<div class="gf-row"><span class="mini-badge ' + d + '"></span><div><b>' + q.title + '</b> · ' + note +
        '<div class="gf-text">' + escHtml(q.explanation) + '</div></div></div>';
    }).join("");
    var cls = pts >= 7 ? "correct" : pts >= 4 ? "partial" : "incorrect";
    var card = el(
      '<div class="stage-wrap"><div class="card">' +
      stageBanner(2) +
      '<div class="consequence-box ' + cls + '"><div class="cq-label">Етап 2 завершено: ' + pts + ' із ' + surveyMax(2) + ' балів</div>' +
        '<p style="margin:0">Усі чотири описи з\'єднано зі стилями DISC. Нижче — коротко, чим кожен характеризується.</p></div>' +
      '<div class="gf-list">' + rows + '</div>' +
      '<button class="btn btn-primary" id="continue-btn">Перейти до етапу 3 →</button>' +
      '</div></div>'
    );
    card.querySelector("#continue-btn").addEventListener("click", function () { startStage(3); });
    return card;
  }

  function renderSurveyQuiz() {
    var q = surveyById(state.surveyOrder[state.surveyIndex]);
    if (q.kind === "how") return renderHowQuiz(q);
    if (q.kind === "task") return renderTaskQuiz(q);
    var progressPct = Math.round((state.surveyIndex / state.surveyOrder.length) * 100);
    var card = el(
      '<div class="stage-wrap"><div class="card">' +
      stageBanner(state.stage) +
      '<div class="progress-track"><div class="progress-fill" style="width:' + progressPct + '%"></div></div>' +
      '<p class="step-count">Запитання ' + (state.surveyIndex + 1) + ' із ' + state.surveyOrder.length + '</p>' +
      '<div class="cand-name-big serif">Опис №' + (state.surveyIndex + 1) + '</div>' +
      surveyCardHtml(q) +
      '<label class="field-label">Який фактор DISC описано?</label>' +
      discMatrix(true) +
      '<div id="fb-zone"></div>' +
      '</div></div>'
    );
    card.querySelectorAll(".disc-choice-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var chosen = btn.getAttribute("data-disc");
        var ans = { id: q.id, chosen: chosen, correct: q.correct, isCorrect: chosen === q.correct, points: discPoints(chosen, q.correct) };
        state.surveyAnswers.push(ans); state.lastSurvey = ans;
        lockMatrix(card, chosen, q.correct);
        mountFeedback(card, renderSurveyFeedback());
      });
    });
    return card;
  }

  function renderSurveyFeedback() {
    var a = state.lastSurvey;
    var q = surveyById(a.id);
    var isLast = state.surveyIndex >= state.surveyOrder.length - 1;
    if (q.kind === "how") return renderHowFeedback(a, q, isLast);
    if (q.kind === "task") return renderTaskFeedback(a, q, isLast);
    var tipSrc = SURVEY.filter(function (c) { return c.correct === q.correct; })[0];
    var nextLabel = !isLast ? "Наступне запитання →" : (state.stage < 3 ? "Перейти до етапу " + (state.stage + 1) + " →" : "Перейти до етапу 4: кейси →");
    var card = el(
      '<div class="stage-wrap"><div class="card">' +
      stageBanner(state.stage) +
      '<div class="consequence-box ' + verdictOf(ptsOf(a)).cls + '">' +
        '<div class="cq-label">' + verdictOf(ptsOf(a)).label + '</div>' +
        '<div class="cq-your">Ваша відповідь: ' + DISC_META[a.chosen].name + ' (' + a.chosen + ')' + (a.isCorrect ? "" : " · Правильна відповідь: " + DISC_META[a.correct].name + " (" + a.correct + ")") + '</div>' +
        (a.isCorrect ? '' : '<div class="cq-your"><b>' + closenessNote(a.chosen, a.correct) + '</b></div>') +
        '<p>' + escHtml(q.explanation) + '</p>' +
        '<div class="marker-row"><span class="marker-label">Маркери в описі:</span>' + q.markers.map(function (m) { return '<span class="marker-chip">' + escHtml(m) + '</span>'; }).join("") + '</div>' +
      '</div>' +
      '<div class="sv-card"><h3>' + q.title + '</h3><div class="sv-tip"><b>Як на нього впливати.</b> ' + tipSrc.tip + '</div></div>' +
      '<button class="btn btn-primary" id="continue-btn">' + nextLabel + '</button>' +
      '</div></div>'
    );
    card.querySelector("#continue-btn").addEventListener("click", function () {
      if (!isLast) { state.surveyIndex += 1; state.screen = "surveyQuiz"; render(); }
      else if (state.stage < 3) { startStage(state.stage + 1); }
      else {
        state.order = shuffle(CANDIDATES.map(function (c) { return c.id; }));
        state.index = 0; state.answers = []; state.screen = "quiz"; render();
      }
    });
    return card;
  }

  // ---------- Етап 5: поради для фактора → оберіть двох учасників з відповідним стилем ----------
  function renderHowQuiz(q) {
    var progressPct = Math.round((state.surveyIndex / state.surveyOrder.length) * 100);
    var cards = shuffle(CANDIDATES.map(function (c) { return c; })).map(function (c) {
      return '<button class="pcard" data-cand="' + c.id + '"><span class="pfig">' + figureOf(c.id) + '</span><span class="pname">' + escHtml(c.name) + '</span><span class="pcheck">✓</span></button>';
    }).join("");
    var card = el(
      '<div class="stage-wrap"><div class="card">' +
      stageBanner(state.stage) +
      '<div class="progress-track"><div class="progress-fill" style="width:' + progressPct + '%"></div></div>' +
      '<p class="step-count">Запитання ' + (state.surveyIndex + 1) + ' із ' + state.surveyOrder.length + '</p>' +
      '<div class="cand-name-big serif">Поради №' + (state.surveyIndex + 1) + '</div>' +
      surveyCardHtml(q) +
      '<label class="field-label">Для якого стилю DISC ці поради? Оберіть двох учасників із кейсів, які мають цей стиль.</label>' +
      '<div class="pcard-grid">' + cards + '</div>' +
      '<p class="pcard-hint" id="pcard-hint">Обрано 0 з 2</p>' +
      '<button class="btn btn-primary" id="how-confirm" disabled>Підтвердити вибір →</button>' +
      '<div id="fb-zone"></div>' +
      '</div></div>'
    );
    var sel = [];
    var btns = card.querySelectorAll(".pcard");
    var confirmBtn = card.querySelector("#how-confirm");
    function refresh() {
      btns.forEach(function (b) {
        var on = sel.indexOf(b.getAttribute("data-cand")) !== -1;
        b.classList.toggle("sel", on);
        b.disabled = !on && sel.length >= 2;
      });
      card.querySelector("#pcard-hint").textContent = "Обрано " + sel.length + " з 2";
      confirmBtn.disabled = sel.length !== 2;
    }
    btns.forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-cand"), i = sel.indexOf(id);
        if (i !== -1) sel.splice(i, 1); else if (sel.length < 2) sel.push(id);
        refresh();
      });
    });
    confirmBtn.addEventListener("click", function () {
      var correctIds = CANDIDATES.filter(function (c) { return c.correct === q.correct; }).map(function (c) { return c.id; });
      var hits = sel.filter(function (id) { return correctIds.indexOf(id) !== -1; }).length;
      var names = function (ids) { return ids.map(function (id) { return candById(id).name; }).join(", "); };
      var ans = { id: q.id, how: true, chosenIds: sel.slice(), correctIds: correctIds, chosen: names(sel), correct: names(correctIds), isCorrect: hits === 2, points: hits };
      state.surveyAnswers.push(ans); state.lastSurvey = ans;
      btns.forEach(function (bt) {
        var id = bt.getAttribute("data-cand");
        bt.disabled = true; bt.classList.remove("sel");
        if (correctIds.indexOf(id) !== -1) bt.classList.add("right-card");
        else if (sel.indexOf(id) !== -1) bt.classList.add("wrong-card");
        else bt.classList.add("dimmed");
      });
      confirmBtn.style.display = "none"; card.querySelector("#pcard-hint").style.display = "none";
      mountFeedback(card, renderSurveyFeedback());
    });
    return card;
  }

  // ---------- Етап 6: «Кому доручити?» — завдання, потрібно обрати учасника (фото) ----------
  function renderTaskQuiz(q) {
    var progressPct = Math.round((state.surveyIndex / state.surveyOrder.length) * 100);
    var cards = shuffle(CANDIDATES.map(function (c) { return c; })).map(function (c) {
      return '<button class="pcard" data-cand="' + c.id + '"><span class="pfig">' + figureOf(c.id) + '</span><span class="pname">' + escHtml(c.name) + '</span><span class="pcheck">✓</span></button>';
    }).join("");
    var card = el(
      '<div class="stage-wrap"><div class="card">' +
      stageBanner(state.stage) +
      '<div class="progress-track"><div class="progress-fill" style="width:' + progressPct + '%"></div></div>' +
      '<p class="step-count">Завдання ' + (state.surveyIndex + 1) + ' із ' + state.surveyOrder.length + '</p>' +
      '<div class="cand-name-big serif">Кому доручити?</div>' +
      '<div class="desc-box"><p>' + escHtml(q.text) + '</p></div>' +
      '<label class="field-label">Оберіть учасника, якому ви доручите це завдання.</label>' +
      '<div class="pcard-grid">' + cards + '</div>' +
      '<div id="fb-zone"></div>' +
      '</div></div>'
    );
    var btns = card.querySelectorAll(".pcard");
    btns.forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-cand"), c = candById(id);
        var pts = discPoints(c.correct, q.correct);
        var correctIds = CANDIDATES.filter(function (x) { return x.correct === q.correct; }).map(function (x) { return x.id; });
        var names = function (ids) { return ids.map(function (i) { return candById(i).name; }).join(", "); };
        var ans = { id: q.id, how: true, chosenIds: [id], correctIds: correctIds, chosen: c.name + " (" + c.correct + ")", correct: names(correctIds), chosenStyle: c.correct, isCorrect: pts === 2, points: pts };
        state.surveyAnswers.push(ans); state.lastSurvey = ans;
        btns.forEach(function (bt) {
          var cid = bt.getAttribute("data-cand");
          bt.disabled = true;
          if (cid === id) bt.classList.add(pts === 2 ? "right-card" : (pts === 1 ? "mid-card" : "wrong-card"));
          else if (correctIds.indexOf(cid) !== -1) bt.classList.add("right-card");
          else bt.classList.add("dimmed");
        });
        mountFeedback(card, renderSurveyFeedback());
      });
    });
    return card;
  }

  function renderTaskFeedback(a, q, isLast) {
    var pts = ptsOf(a), v = verdictOf(pts);
    var chosenName = a.chosen;
    var fit = a.correctIds.map(function (id) { return '<span class="pchip ok">' + escHtml(candById(id).name) + '</span>'; }).join(" ");
    var nextLabel = !isLast ? "Наступне завдання →" : "Дивитися підсумок →";
    var card = el(
      '<div class="stage-wrap"><div class="card">' +
      stageBanner(state.stage) +
      '<div class="consequence-box ' + v.cls + '">' +
        '<div class="cq-label">' + v.label + '</div>' +
        '<div class="cq-your">Ви обрали: <b>' + escHtml(chosenName) + '</b></div>' +
        (pts === 2 ? '' : '<div class="cq-your"><b>' + closenessNote(a.chosenStyle, q.correct) + '</b></div>') +
        '<div class="cq-your">Найкраще підходять (стиль <b>' + DISC_META[q.correct].name + ' (' + q.correct + ')</b>): ' + fit + '</div>' +
        '<p>' + escHtml(q.explanation) + '</p>' +
        '<div class="marker-row"><span class="marker-label">Що важливо:</span>' + q.markers.map(function (m) { return '<span class="marker-chip">' + escHtml(m) + '</span>'; }).join("") + '</div>' +
      '</div>' +
      '<div class="sv-card"><h3>' + q.title + ': цінність особистості</h3><ul class="sv-list">' + q.values.map(function (t) { return '<li>' + t + '</li>'; }).join("") + '</ul></div>' +
      '<button class="btn btn-primary" id="continue-btn">' + nextLabel + '</button>' +
      '</div></div>'
    );
    card.querySelector("#continue-btn").addEventListener("click", function () {
      if (!isLast) { state.surveyIndex += 1; state.screen = "surveyQuiz"; render(); }
      else { state.screen = "results"; render(); saveResultToStorage(); }
    });
    return card;
  }

  function renderHowFeedback(a, q, isLast) {
    var pts = ptsOf(a);
    var v = pts === 2 ? { cls: "correct", label: "Правильно! +2 бали" }
      : pts === 1 ? { cls: "partial", label: "Наполовину правильно: один із двох, +1 бал" }
      : { cls: "incorrect", label: "Неправильно: жодного правильного учасника, 0 балів" };
    var chosenHtml = a.chosenIds.map(function (id) {
      var ok = a.correctIds.indexOf(id) !== -1;
      return '<span class="pchip ' + (ok ? "ok" : "no") + '">' + (ok ? "✓ " : "✕ ") + escHtml(candById(id).name) + '</span>';
    }).join(" ");
    var correctHtml = a.correctIds.map(function (id) { return '<span class="pchip ok">' + escHtml(candById(id).name) + '</span>'; }).join(" ");
    var card = el(
      '<div class="stage-wrap"><div class="card">' +
      stageBanner(state.stage) +
      '<div class="consequence-box ' + v.cls + '">' +
        '<div class="cq-label">' + v.label + '</div>' +
        '<div class="cq-your">Ви обрали: ' + chosenHtml + '</div>' +
        '<div class="cq-your">Ці поради стосуються стилю <b>' + DISC_META[q.correct].name + ' (' + q.correct + ')</b>. Його мають: ' + correctHtml + '</div>' +
        '<p>' + escHtml(q.explanation) + '</p>' +
        '<div class="marker-row"><span class="marker-label">Маркери в порадах:</span>' + q.markers.map(function (m) { return '<span class="marker-chip">' + escHtml(m) + '</span>'; }).join("") + '</div>' +
      '</div>' +
      '<div class="sv-card"><h3>' + q.title + '</h3></div>' +
      '<button class="btn btn-primary" id="continue-btn">' + (isLast ? "Перейти до етапу 6 →" : "Наступне запитання →") + '</button>' +
      '</div></div>'
    );
    card.querySelector("#continue-btn").addEventListener("click", function () {
      if (!isLast) { state.surveyIndex += 1; state.screen = "surveyQuiz"; render(); }
      else { startStage(6); }
    });
    return card;
  }
  function surveyReviewHtml() {
    var wrong = state.surveyAnswers.filter(function (a) { return !a.isCorrect; });
    if (wrong.length === 0) return '<div class="review-ok">Опитування: усі відповіді правильні.</div>';
    return '<label class="field-label">Опитування: розбір помилок</label>' + wrong.map(function (a) {
      var q = surveyById(a.id);
      var tag = a.how ? '<span class="role-line-sm">' + escHtml(a.chosen) + ' → ' + escHtml(a.correct) + '</span>'
        : '<span class="role-line-sm"><span class="mini-badge ' + a.chosen + '">' + a.chosen + '</span> → <span class="mini-badge ' + a.correct + '">' + a.correct + '</span></span>';
      return '<div class="review-item"><div class="review-head"><b>Етап ' + q.stage + ' · ' + q.title + ' (' + ptsOf(a) + ' б.)</b>' + tag + '</div><p>' + escHtml(q.explanation) + '</p></div>';
    }).join("");
  }

  function renderResults() {
    var score = scoreCount();
    var total = casesMax();
    var tier = tierFor(totalPoints(), maxPoints());

    var rowsHtml = state.answers.map(function (a) {
      var cand = candById(a.candidateId);
      return (
        '<tr>' +
          '<td>' + cand.name + '</td>' +
          '<td><span class="mini-badge ' + a.chosen + '">' + a.chosen + '</span></td>' +
          '<td><span class="mini-badge ' + a.correct + '">' + a.correct + '</span></td>' +
          '<td><span class="result-icon ' + (ptsOf(a) === 2 ? "ok" : ptsOf(a) === 1 ? "mid" : "no") + '">' + (ptsOf(a) === 2 ? "✓" : ptsOf(a) === 1 ? "≈" : "✕") + ' ' + ptsOf(a) + '</span></td>' +
        '</tr>'
      );
    }).join("");

    var saveNote = "";
    if (state.saveStatus === "saving") saveNote = "Зберігаємо результат…";
    else if (state.saveStatus === "saved") saveNote = "Результат збережено.";
    else if (state.saveStatus === "failed") saveNote = "Результат сформовано, але не вдалося зберегти для викладача.";
    var card = el(
      '<div class="stage-wrap"><div class="card">' +
      '<p class="kicker" style="text-align:center;">' + (state.studentName ? escHtml(state.studentName) + " · " : "") + 'Результат</p>' +
      '<div class="score-big"><span class="num">' + totalPercent() + '%</span></div>' +
      scoreBarHtml() +
      '<div class="score-grid">' +
        [1, 2, 3].map(function (n) { return '<div class="score-box"><div class="sb-value">' + surveyScore(n) + ' / ' + surveyMax(n) + '</div><div class="sb-label">Етап ' + n + '</div></div>'; }).join("") +
        '<div class="score-box"><div class="sb-value">' + score + ' / ' + total + '</div><div class="sb-label">Етап 4 · Кейси</div></div>' +
        '<div class="score-box"><div class="sb-value">' + surveyScore(5) + ' / ' + surveyMax(5) + '</div><div class="sb-label">Етап 5</div></div>' +
        '<div class="score-box"><div class="sb-value">' + surveyScore(6) + ' / ' + surveyMax(6) + '</div><div class="sb-label">Етап 6</div></div>' +
      '</div>' +
      '<table class="results-recap"><thead><tr><th>Кандидат</th><th>Ваша відповідь</th><th>Правильно</th><th>Бали</th></tr></thead><tbody>' + rowsHtml + '</tbody></table>' +
      surveyReviewHtml() +
      mistakesReviewHtml() +
      personalConclusionHtml() +
      '<div class="tier-card"><div class="t-label">Загальний підсумок</div><div class="t-title">' + tier.label + '</div><p>' + tier.text + '</p></div>' +
      '<div class="note-box">Наступна гра: «Ролі за Белбіним». Там ті самі 8 кандидатів, а вам потрібно визначити командну роль кожного.</div>' +
      (saveNote ? '<p class="save-note">' + saveNote + '</p>' : "") +
      '<div class="result-actions">' +
        '<button class="btn btn-secondary" id="copy-btn">Скопіювати результат</button>' +
        '<button class="btn btn-secondary" id="retry-btn">Спробувати ще раз</button>' +
      '</div>' +
      '<textarea id="copy-fallback-area" style="display:none;margin-top:12px;width:100%;min-height:110px;padding:10px;border-radius:10px;border:1.5px solid var(--line);font-size:11.5px;color:var(--muted);background:var(--surface);" readonly>' + escHtml(plainTextExport()) + '</textarea>' +
      '<button class="teacher-link" id="teacher-link">Перегляд результатів групи (для викладача)</button>' +
      '</div></div>'
    );
    card.querySelector("#copy-btn").addEventListener("click", function (e) { copyToClipboard(plainTextExport(), e.currentTarget); });
    card.querySelector("#retry-btn").addEventListener("click", function () {
      state.screen = "intro"; state.answers = []; state.index = 0; state.surveyAnswers = []; state.surveyIndex = 0; state.stage = 1; state.saveStatus = "idle"; render();
    });
    card.querySelector("#teacher-link").addEventListener("click", function () { state.screen = "teacher"; render(); loadTeacherRows(); });
    return card;
  }

  function teacherSurveyStatsHtml(rows) {
    var withSv = rows.filter(function (r) { return r.surveyAnswers && r.surveyAnswers.length; });
    if (withSv.length === 0) return "";
    var trs = DISC_ORDER.map(function (f) {
      var tds = [1, 2, 3, 5, 6].map(function (n) {
        var qs = svItems(n).filter(function (q) { return q.correct === f; })[0];
        var tot = 0, ok = 0;
        withSv.forEach(function (r) {
          r.surveyAnswers.forEach(function (a) { if (qs && a.id === qs.id) { tot += 1; if (a.isCorrect) ok += 1; } });
        });
        return '<td>' + (tot ? Math.round(ok / tot * 100) + '%' : '—') + '</td>';
      }).join("");
      return '<tr><td><span class="mini-badge ' + f + '">' + f + '</span> ' + DISC_META[f].name + '</td>' + tds + '</tr>';
    }).join("");
    return '<label class="field-label" style="margin-top:22px;">Опитування (етапи 1–3, 5, 6): частка правильних відповідей за факторами</label>' +
      '<div class="table-scroll"><table class="results-table"><thead><tr><th>Фактор</th><th>Етап 1</th><th>Етап 2</th><th>Етап 3</th><th>Етап 5</th><th>Етап 6</th></tr></thead><tbody>' + trs + '</tbody></table></div>';
  }

  function renderTeacher() {
    var rows = state.teacherRows;
    var bodyHtml;
    if (state.teacherLoading) bodyHtml = '<p class="empty-note">Завантаження результатів…</p>';
    else if (!rows || rows.length === 0) bodyHtml = '<p class="empty-note">Поки що ніхто не пройшов тренажер за цим посиланням.</p>';
    else {
      var trs = rows.map(function (r) {
        var pc = r.percent != null ? r.percent : Math.round(((r.score || 0) + (r.surveyScore || 0)) / ((r.total || 0) + (r.surveyTotal || 0)) * 100);
        return '<tr><td>' + escHtml(r.name) + '</td><td><b>' + pc + '%</b></td><td>' + r.score + ' / ' + r.total + '</td><td>' + (r.surveyScore != null ? r.surveyScore + ' / ' + r.surveyTotal : '—') + '</td><td>' + new Date(r.timestamp).toLocaleString("uk-UA") + '</td></tr>';
      }).join("");
      bodyHtml = '<div class="table-scroll"><table class="results-table"><thead><tr><th>Студент</th><th>Загалом</th><th>Кейси</th><th>Опитування</th><th>Дата</th></tr></thead><tbody>' + trs + '</tbody></table></div>' + teacherStatsHtml(rows) + teacherSurveyStatsHtml(rows);
    }
    var card = el(
      '<div class="stage-wrap"><div class="card">' +
      '<div class="teacher-header"><h1 class="title serif" style="margin:0;font-size:22px;">Результати групи</h1><button class="icon-btn" id="refresh-btn">Оновити</button></div>' +
      bodyHtml +
      '<div class="result-actions"><button class="btn btn-secondary" id="csv-btn"' + ((!rows || rows.length === 0) ? " disabled" : "") + '>Завантажити CSV</button><button class="btn btn-secondary" id="back-btn">← Назад</button></div>' +
      '</div></div>'
    );
    card.querySelector("#refresh-btn").addEventListener("click", loadTeacherRows);
    card.querySelector("#back-btn").addEventListener("click", function () { state.screen = state.answers.length >= CANDIDATES.length ? "results" : "intro"; render(); });
    var csvBtn = card.querySelector("#csv-btn");
    if (csvBtn && rows && rows.length > 0) csvBtn.addEventListener("click", downloadCsv);
    return card;
  }

  function render() {
    app.innerHTML = "";
    var view;
    if (state.screen === "intro") view = renderIntro();
    else if (state.screen === "quiz") view = renderQuiz();
    else if (state.screen === "feedback") view = renderFeedback();
    else if (state.screen === "shadowQuiz") view = renderShadowQuiz();
    else if (state.screen === "gridQuiz") view = renderGridQuiz();
    else if (state.screen === "gridFeedback") view = renderGridFeedback();
    else if (state.screen === "surveyQuiz") view = renderSurveyQuiz();
    else if (state.screen === "surveyFeedback") view = renderSurveyFeedback();
    else if (state.screen === "results") view = renderResults();
    else view = renderTeacher();
    app.appendChild(view);
    window.scrollTo(0, 0);
  }

  render();
})();
</script>
</body>
</html>
