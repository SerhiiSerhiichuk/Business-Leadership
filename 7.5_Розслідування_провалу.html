<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Розслідування провалу змін</title>
<style>
:root{--ink:#1E2761;--ink-soft:#384080;--surface:#F3F6FC;--card:#fff;--gold:#C9962C;--gold-soft:#F3E4C6;--muted:#5B6685;--line:#DDE4F5;--red:#B3492F;--green:#2E7D6B}
*{box-sizing:border-box}body{margin:0;background:var(--surface);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px 12px}
.card{max-width:720px;margin:0 auto;background:var(--card);border-radius:18px;box-shadow:0 8px 28px rgba(30,39,97,.12);padding:26px 26px 30px}
h1,h2,h3{font-family:Cambria,Georgia,serif;margin:.2em 0 .4em}h1{font-size:27px}h2{font-size:21px}h3{font-size:17px;margin-top:1.1em}
.pb{height:5px;background:var(--line);border-radius:3px;margin-bottom:18px;overflow:hidden}.pb i{display:block;height:100%;background:var(--gold);transition:width .3s}
.muted{color:var(--muted);font-size:14px}.tag{display:inline-block;background:var(--gold-soft);color:var(--ink);border-radius:20px;padding:2px 12px;font-size:13px;font-weight:600}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 14px;text-align:left}
button:hover:not(:disabled){border-color:var(--gold)}
button.main{width:100%;text-align:center;background:var(--ink);color:#fff;border:0;padding:13px;font-weight:600;margin-top:16px}button.main:disabled{background:#9aa3c7;cursor:not-allowed}
button.alt{margin:8px 8px 0 0;text-align:center}input[type=text]{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;margin:6px 0 4px}
.opt{display:block;width:100%;margin:8px 0}.opt small{display:block;color:var(--muted);font-size:13px}.opt.sel{border:2px solid var(--gold);background:var(--gold-soft)}
.person{display:grid;grid-template-columns:36px 1fr;gap:10px;width:100%;margin:8px 0;align-items:start}.person.done{background:var(--surface);cursor:default}.person.lock{opacity:.45;cursor:not-allowed}
.q{font-style:italic;margin-top:6px;border-left:3px solid var(--gold);padding-left:10px;color:var(--ink-soft)}
.quote{background:var(--surface);border-radius:12px;padding:12px 14px;margin:10px 0}.quote b{font-style:normal}
.bar{display:grid;grid-template-columns:150px 1fr 48px;gap:8px;align-items:center;margin:5px 0;font-size:14px}.bar .t{height:12px;background:var(--line);border-radius:6px;overflow:hidden}.bar .t i{display:block;height:100%}.bar b{text-align:right}
.res{border-radius:12px;padding:12px 14px;margin:10px 0;font-size:15px}.res.ok{background:#d7efe8}.res.no{background:#f6dcd4}.res.mid{background:var(--gold-soft)}
.note{background:var(--surface);border-left:4px solid var(--gold);border-radius:8px;padding:9px 13px;margin:10px 0;font-size:14px}
ul{padding-left:20px}li{margin:6px 0}table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}th,td{border-bottom:1px solid var(--line);padding:5px 4px;text-align:left}.sc{overflow-x:auto}textarea{width:100%;height:150px;margin-top:8px;font:13px monospace}
@media(max-width:520px){.bar{grid-template-columns:110px 1fr 44px}.card{padding:18px}}
</style></head><body><div class="card"><div class="pb"><i id="pg" style="width:0"></i></div><div id="app"></div></div>
<script>
var AD=[['Усвідомлення','людина не розуміє, навіщо потрібні зміни'],['Бажання','розуміє, але не хоче брати в них участь'],['Знання','хоче, але не знає, як саме діяти'],['Здатність','знає як, але не може зробити це на практиці'],['Закріплення','діяла по-новому, але повернулась до старого']];
var KS='1 Терміновість · 2 Коаліція · 3 Бачення · 4 Комунікація · 5 Усунення перешкод · 6 Короткі перемоги · 7 Не зупинятись · 8 Укорінення в культурі';
var LK=['Хибний слід','Близько, але не причина','Головна причина'],LA=['Слабка дія','Часткова дія','Сильна дія'];
var TH={hi:7,mid:4};
var VT=[{e:'🔎',t:'Потрібен ще раунд розслідування'},{e:'🧭',t:'Діагноз є, план потребує доопрацювання'},{e:'🏆',t:'Консультант, якого хочуть найняти'}];
var CASES=[
{t:'Нова система обліку',co:'«ПродТрейд»',e:'📦',tl:'Менеджери й комірники досі ведуть таблиці паралельно',
 intro:'Оптова компанія «ПродТрейд» (120 працівників) вісім місяців тому запровадила нову систему обліку. Офіційно нею користуються всі, але менеджери й комірники досі ведуть паралельні таблиці. Директор просить вас з’ясувати причини.',
 sum:'Головна причина — у «ПродТрейд» не створили відчуття терміновості. Тому одні не знають, навіщо змінюватись, інші не бачать вигоди, а ті, хто почав, без підкріплення повернулись до таблиць.',
 ppl:[
 {n:'Оксана',r:'менеджерка з продажу',b:0,q:'Мені просто прислали наказ. Навіщо міняти систему, якщо ми щокварталу виконуємо план? Ніхто не пояснив, що не так зі старою. Здається, це не горить.',w:'Вона не бачить проблеми, яку розв’язує зміна: питає «навіщо» й не отримала відповіді.'},
 {n:'Віталій',r:'старший комірник',b:1,q:'Причину я розумію: звіти розсипаються. Але ввід даних забирає в мене дві години щодня, а премію рахують за відвантаження. Мені це невигідно, тому роблю мінімум.',w:'Причину він знає, тож усвідомлення є. Блокує особиста невигідність: це бажання, а не брак інформації чи вмінь.'},
 {n:'Марина',r:'бухгалтерка',b:2,q:'Я хочу працювати в новій системі, навіть сиджу вечорами. Але навчання було одне, на сорок хвилин, і як оформити повернення від клієнта, я не знаю. Казали, колись розберемось.',w:'Причину розуміє й хоче діяти. Застрягла, бо їй не показали конкретні дії: бракує знань, а не мотивації.'},
 {n:'Іван',r:'регіональний менеджер',b:3,q:'Мене навчили, і я хочу. Але на нашому каналі зв’язку система зависає, а налаштування змінює лише ІТ у столиці. Заявку подав тричі, відповідають, що не горить.',w:'Знання й бажання є, але на практиці він не може працювати: заважають технічні умови й чужі повноваження.'},
 {n:'Тетяна',r:'керівниця логістики',b:4,q:'Два місяці ми працювали в новій системі. Потім настав гарячий сезон, директор сказав: «Робіть як швидше». Усі повернулись до таблиць, і про систему ніхто більше не питав.',w:'Вона вже працювала по-новому, а після відмашки керівника повернулась до старого: нову практику не підкріпили.'},
 {n:'Світлана',r:'продавчиня',b:0,q:'Чула, що нова система «краща». Чим саме — не знаю. Нам повідомили, що відтепер усе в ній. Якщо чесно, не розумію, що ми виграємо.',w:'Так само не знає, що змінилось і чому. Спершу бракує розуміння причини, тому наступні щаблі ще не стосуються.'}],
 kt:[{t:'Створити відчуття терміновості',l:2,w:'У розмовах повторюються «не горить», «колись розберемось» і «навіщо». Людям не показали, чому лишатись зі старим небезпечно, а без цього наступні кроки не мають ґрунту.'},
 {t:'Донести бачення до всіх',l:1,w:'Комунікації справді бракувало, але повідомляти нічого, доки люди не відчули, що проблема існує. Це наслідок першого кроку, а не його заміна.'},
 {t:'Забезпечити короткі перемоги',l:0,w:'Перемоги з’являються, коли хтось уже рухається. Тут більшість ще не бачить причини рухатись.'},
 {t:'Укорінити зміни в культурі',l:0,w:'Укорінення — останній крок. Закріплювати поки що нічого, бо змін багато хто не прийняв.'}],
 ac:[{t:'Провести зустрічі з кожним відділом і показати цифри: скільки коштує ручний облік щомісяця та що буде, якщо не змінитись.',l:2,w:'Дає людям причину змін у цифрах: знімає «не горить» і готує ґрунт для всіх інших кроків.'},
 {t:'Переглянути бонуси комірників, щоб ввід даних входив у показники, а правильна робота в новій системі була вигідною.',l:2,w:'Робить нову поведінку вигідною й підкріпленою: без цього люди, як Віталій і Тетяна, повертаються до старого.'},
 {t:'Додати ще одне навчання з оформлення повернень для бухгалтерії та складу, щоб закрити прогалини в знаннях працівників.',l:1,w:'Закриє прогалину в знаннях частини людей, але більшість зупинилась раніше: на розумінні й бажанні.'},
 {t:'Видати наказ, що з наступного місяця таблиці заборонені, а всіх порушників буде оштрафовано за кожен випадок окремо на вимогу директора.',l:0,w:'Тиск без пояснень породжує формальне виконання й обхід: люди ще не розуміють, навіщо їм це.'},
 {t:'Обрати іншу систему, яку обіцяють налаштувати за тиждень, і почати впровадження наново з усіма відділами та регіонами компанії.',l:0,w:'Нова система не розв’яже проблему, яка не в системі: причини опору лишаться, а довіра впаде ще більше.'}]},
{t:'Перехід на гнучкі методи',co:'«Лінія Нова»',e:'💻',tl:'Команди «працюють по скрамі», але нічого не змінилось',
 intro:'ІТ-компанія «Лінія Нова» (80 людей) пів року тому оголосила перехід на гнучку (agile) роботу. Ініціаторка — директорка з розвитку Олена. Команди номінально працюють за скрамом, але терміни й якість не змінились. Вам треба знайти причину.',
 sum:'Головна причина — у «Лінії Нова» немає керівної коаліції: ініціатива належить одній людині, а впливові керівники напрямів мовчать або кепкують. Тому одні не бачать сенсу, інші не вірять, а перші ж труднощі повернули старі звички.',
 ppl:[
 {n:'Ярослав',r:'тім-лід',b:0,q:'Нам оголосили: «Переходимо на гнучкі методи». Для чого — не знаю, клієнти й так задоволені. Питав, чому зараз, — відповіли, що це ініціатива Олени. Більше ніхто з керівництва про це не говорив.',w:'Він не знає причини змін і не отримав пояснень: це усвідомлення. Мовчання керівництва підказує, чому.'},
 {n:'Дарина',r:'тестувальниця',b:1,q:'Я знаю, що таке скрам і навіщо він потрібен. Але мій керівник напряму сказав: «Це забаганка Олени, перечекаємо». Тож роблю вигляд, що вчуся.',w:'Розуміє суть, тож усвідомлення й знання є. Не хоче діяти, бо її керівник не підтримує зміни: це бажання.'},
 {n:'Богдан',r:'розробник',b:2,q:'Я готовий спробувати. Але ніхто не пояснив ролі, ритуали й що робити на ретроспективі. Олена провела один вебінар, мій керівник на нього навіть не зайшов.',w:'Хоче змін, але не знає практичних кроків: ролей, ритуалів, меж відповідальності. Це знання.'},
 {n:'Леся',r:'проєктна менеджерка',b:3,q:'Я розумію, хочу й навчилась. Але клієнт за договором платить за фіксований обсяг, а скрам цього не передбачає. Змінити умови договору я не можу, а юристи кажуть, що так склалось.',w:'Знання й бажання є, але на практиці її зупиняють договірні умови й відсутність повноважень: це здатність.'},
 {n:'Максим',r:'архітектор',b:4,q:'Півроку працювали по скрамі. Потім стався збій у великому проєкті, топи сказали: «Давайте по-старому, так швидше». Ми повернулись до щотижневих звітів, і про скрам ніхто не питає.',w:'Він працював по-новому, але після відмашки керівників повернувся до старого: нову поведінку не закріпили.'},
 {n:'Ірина',r:'розробниця',b:1,q:'Я бачила презентацію Олени. Усі менеджери напрямів мовчали й не ставили питань. А я довіряю саме їм. Якщо вони не вірять у це, то навіщо мені напружуватись?',w:'Розуміє, що відбувається, але орієнтується на керівників, яким довіряє, а вони не підтримують. Це бажання.'}],
 kt:[{t:'Створити керівну коаліцію',l:2,w:'Розмови зводяться до того, що ініціатива лише Олени, а впливові керівники напрямів мовчать або кепкують. Зміні бракує групи сильних людей, які її ведуть разом.'},
 {t:'Донести бачення до всіх',l:1,w:'Олена комунікувала (презентація, вебінар), але без підтримки тих, кому довіряють, її слова не переконують. Комунікація тут наслідок, а не першопричина.'},
 {t:'Усунути перешкоди на шляху',l:0,w:'Перешкоди (як у договорах) справді є, але їх називає одна людина. Головний блок ширший: навколо ініціативи немає опори.'},
 {t:'Забезпечити короткі перемоги',l:0,w:'Перемоги потребують команд, що вже діють по-новому, а більшість чекає, поки зміни «минуть».'}],
 ac:[{t:'Зібрати 4–5 впливових керівників напрямів і разом із ними переписати план переходу, щоб вони самі його представляли командам.',l:2,w:'Створює опору: коли керівники, яким довіряють, самі ведуть зміну, у людей з’являється причина їй вірити.'},
 {t:'Разом із юристами підготувати типові договори, що дозволяють гнучку роботу з клієнтами, і передати їх проєктним менеджерам.',l:2,w:'Знімає конкретну перешкоду, яка робить гнучку роботу неможливою на практиці для проєктних менеджерів.'},
 {t:'Провести для всіх команд тренінг про ролі й ритуали скраму з практичними вправами та розбором реальних проєктів.',l:1,w:'Закриває прогалину в знаннях, але більшість зупинилась на довірі до керівників, а тренінг цього не змінить.'},
 {t:'Зробити перехід на скрам обов’язковим і включити його використання в особисті KPI кожного працівника компанії та щомісяця публікувати рейтинг команд.',l:0,w:'Тиск через KPI без підтримки керівників дасть формальне виконання, а скептики отримають привід ховатись.'},
 {t:'Запросити зовнішнього коуча, щоб він на щотижневих зустрічах переконував скептично налаштованих працівників компанії протягом наступних трьох місяців підряд.',l:0,w:'Зовнішній голос не замінює авторитет своїх керівників: люди слухають тих, кому довіряють щодня.'}]},
{t:'Електронні картки пацієнтів',co:'«Медлайн»',e:'🏥',tl:'Лікарі працюють без ентузіазму, частина записує на папері',
 intro:'Мережа клінік «Медлайн» (200 працівників) пів року тому запровадила електронні картки пацієнтів. Адміністрація очікувала, що черги зменшаться, але лікарі й реєстратори працюють без ентузіазму, а частина веде записи на папері. Знайдіть причину.',
 sum:'Головна причина — не було короткострокових перемог. За пів року ніхто не показав і не відзначив жодного результату, тому одні не бачать користі, інші не мають бажання, а без підтримки частина повернулась до паперу.',
 ppl:[
 {n:'Лариса',r:'старша медсестра',b:1,q:'Ідею розумію: менше паперів, швидший прийом. Але пів року минуло, а мені так ніхто й не показав, що стало краще: черги такі самі. Навіщо мені вчитись далі, якщо результату не видно?',w:'Розуміє мету, але не бачить доказів, що це працює, тому не хоче вкладатись: це бажання.'},
 {n:'Олег',r:'лікар-терапевт',b:2,q:'Я хочу користуватись карткою. Але не знаю, як виписувати направлення через систему: навчання було лише про вхід. А ніхто не каже, чи вже щось покращилось, тож і питати нема кого.',w:'Хоче працювати по-новому, але не знає конкретної дії (направлення): це знання.'},
 {n:'Наталя',r:'реєстраторка',b:3,q:'Усе знаю й хочу. Але на реєстратурі один комп’ютер на трьох, пацієнти стоять і сердяться. Придбати другий я не можу, а на мої прохання відповідають «потім».',w:'Знання й бажання є, не вистачає обладнання й повноважень: це здатність.'},
 {n:'Сергій',r:'завідувач відділення',b:4,q:'Перші тижні нас хвалили й перевіряли, як ведемо картки. Потім надійшла нова вимога від міністерства, про картки перестали згадувати, і мої люди повернулись до паперу.',w:'Працювали по-новому, але підкріплення зникло, і повернулась стара практика: це закріплення.'},
 {n:'Галина',r:'лікарка-кардіологиня',b:0,q:'Я навіть не знаю, що нам обіцяли від цієї системи. Казали «буде зручніше», але без цифр. Здається, вона потрібна лише для звітності. За пів року жодної новини про успіх.',w:'Не знає, навіщо система й що вона дає лікарям: це усвідомлення. Відсутність цифр пояснює, чому.'},
 {n:'Віра',r:'лаборантка',b:1,q:'Пів року працюємо, а навантаження зросло. Колеги з іншої клініки розповідали, що в них час прийому скоротився, а в нас навіть дрібні успіхи ніхто не відзначає. Чого мені старатись?',w:'Знає мету, але бачить лише додаткове навантаження без віддачі: це бажання.'}],
 kt:[{t:'Забезпечити короткі перемоги',l:2,w:'Люди повторюють: «пів року, а результату не видно». Без помітних і відзначених ранніх успіхів мотивація згасає раніше, ніж зміна встигає закріпитись.'},
 {t:'Донести бачення до всіх',l:1,w:'Бачення звучало («буде зручніше»), але без цифр. Однак проблема не лише в словах: людям бракує доказів, що рух приносить результат.'},
 {t:'Створити відчуття терміновості',l:0,w:'Люди розуміють, навіщо система потрібна. Їм бракує видимого результату, а не причини.'},
 {t:'Створити керівну коаліцію',l:0,w:'Керівники відділень підтримують зміну: скарги стосуються відсутності результатів, а не підтримки зверху.'}],
 ac:[{t:'Обрати одне відділення, виміряти час прийому до і після, а результат показати всім разом з іменами тих, хто його забезпечив.',l:2,w:'Дає видимий і відзначений результат: показує, що зусилля працюють, і повертає бажання тим, хто сумнівається.'},
 {t:'Поставити другий комп’ютер на реєстратурі й закласти в графік оплачувані години на відпрацювання роботи з картками.',l:2,w:'Знімає конкретну перешкоду й дає час на навчання: допомагає тим, хто хоче, але не може.'},
 {t:'Розіслати всім працівникам презентацію з планами проєкту на наступні п’ять років і запросити до обговорення на спільній зустрічі.',l:1,w:'Додає інформації про майбутнє, але людям зараз потрібні докази сьогоднішніх успіхів, а не нові плани.'},
 {t:'Оголосити догану відділенням, де понад десять відсотків записів і далі ведуться на папері, і перевіряти щомісяця без жодних винятків для керівників.',l:0,w:'Догана посилює відчуття, що система працює проти людей, і породжує приховування замість зміни поведінки.'},
 {t:'Перенести всі системи клініки в хмарне сховище, щоб обладнання працювало швидше й рідше зависало під навантаженням у години пікових відвідувань.',l:0,w:'Це технічне рішення, що не торкається причин: люди не бачать результату й не мають часу на практику.'}]},
{t:'Індивідуальні замовлення замість серій',co:'«Дубрава»',e:'🪑',tl:'Відділи розуміють нову стратегію по-різному',
 intro:'Меблева фабрика «Дубрава» (150 працівників) пів року тому оголосила перехід від серійного виробництва до індивідуальних замовлень. Директор заявив: «Ми стаємо гнучкішими». Але цех, продажі й дизайн працюють кожен по-своєму, а замовлень не побільшало. Знайдіть причину.',
 sum:'Головна причина — у «Дубраві» не сформульовано бачення. Кожен відділ розуміє «індивідуальні замовлення» по-своєму: одні не знають, навіщо це, інші — яким має бути результат, а перше ж велике серійне замовлення повернуло стару практику.',
 ppl:[
 {n:'Ольга',r:'менеджерка з продажу',b:0,q:'Нам сказали, що тепер працюємо «під замовлення». Мій керівник каже, що це про нижчі ціни, а колега з цеху — що про менші партії. Навіщо це компанії насправді, я не знаю.',w:'Не знає, чого саме досягає компанія: пояснення суперечать одне одному. Це усвідомлення.'},
 {n:'Петро',r:'майстер цеху',b:0,q:'Мені оголосили: «Переходимо на індивідуальні замовлення». Куди ми йдемо, за кількістю чи за якістю, не знаю. На схемі в директора щось було, але до нас дійшло лише гасло.',w:'Чує гасло без пояснення напрямку: бракує розуміння, навіщо й куди рухається компанія. Це усвідомлення.'},
 {n:'Інна',r:'дизайнерка',b:1,q:'Ідею розумію: клієнт сам обирає розміри й матеріали. Але мені платять за кількість типових проєктів, а індивідуальні забирають утричі більше часу. Директор каже «будьте гнучкими», а що це в цифрах, ніхто не знає.',w:'Розуміє суть, але нова робота їй невигідна. Тому не хоче вкладатись: це бажання.'},
 {n:'Роман',r:'технолог',b:2,q:'Я готовий змінювати технологію. Але яким має бути результат, менша партія чи швидший випуск, мені ніхто не пояснив. Тому не знаю, які налаштування й норми ставити на верстатах.',w:'Хоче діяти, але не знає, які конкретні кроки й норми потрібні. Це знання.'},
 {n:'Світлана',r:'менеджерка закупівель',b:3,q:'Я знаю, що від мене треба, і хочу це робити. Але постачальники дають матеріали лише великими партіями на півроку, а перегляд умов затверджує тільки фінансовий директор, який у відпустці.',w:'Знання й бажання є, але бракує повноважень на практиці: це здатність.'},
 {n:'Марко',r:'керівник збірки',b:4,q:'Перший квартал ми справді збирали за індивідуальними замовленнями. Потім надійшло велике серійне замовлення, і директор сказав: «Робіть як звикли, на це ж гроші». Відтоді індивідуальні робимо за залишковим принципом.',w:'Працював по-новому, але після вказівки керівника повернувся до старого: нову практику не закріпили.'}],
 kt:[{t:'Сформулювати бачення і стратегію',l:2,w:'Люди дають різні пояснення того, куди рухається фабрика: «нижчі ціни», «менші партії», «гасло». Без чіткої спільної мети кожен відділ тлумачить зміну по-своєму.'},
 {t:'Донести бачення до всіх',l:1,w:'Слова директора справді дійшли лише як гасло, але проблема глибша: сама мета не конкретна й тлумачиться по-різному. Доносити поки що нічого.'},
 {t:'Створити відчуття терміновості',l:0,w:'Люди розуміють, що зміна відбувається. Їм невідомо, чого вона має досягти, тож терміновість тут не головне.'},
 {t:'Усунути перешкоди на шляху',l:0,w:'Перешкоди (як у закупівлях) справді є, але їх називає одна людина. Загальна проблема в тому, що спільної мети немає.'}],
 ac:[{t:'Зібрати керівників відділів і за два тижні сформулювати одну спільну мету зі змінами в цифрах, зрозумілу працівнику цеху.',l:2,w:'Створює спільну мету: люди нарешті розуміють, куди йде компанія, і можуть звіряти з нею свої рішення.'},
 {t:'Змінити оплату дизайнерів і майстрів так, щоб індивідуальне замовлення давало не менший заробіток, ніж типове серійне.',l:2,w:'Робить правильну поведінку вигідною й підкріпленою: без цього люди, як Інна й Марко, повертаються до типового.'},
 {t:'Провести для технологів і майстрів навчання з налаштування верстатів під малі партії та нестандартні розміри виробів на замовлення.',l:1,w:'Дає знання частині працівників, але без спільної мети технологи й надалі не знатимуть, під який результат налаштовувати.'},
 {t:'Зобов’язати всі відділи до кінця року збільшити частку індивідуальних замовлень до половини всіх продажів і щотижня перевіряти виконання кожним керівником.',l:0,w:'Число без пояснення мети породжує формальне виконання: відділи по-різному «набиратимуть» показник.'},
 {t:'Найняти зовнішню агенцію, яка розробить для компанії нове гасло й логотип, що підкреслюють індивідуальний підхід до кожного клієнта та рекламну кампанію.',l:0,w:'Гасло — не бачення: воно не пояснює, що саме змінюється в роботі кожного, тож заплутає ще більше.'}]},
{t:'Безпаперове обслуговування',co:'«Дніпро-Фінанс»',e:'🏦',tl:'Пілот вдався, але в решті відділень усе по-старому',
 intro:'Банк «Дніпро-Фінанс» (20 відділень, 400 працівників) торік запровадив безпаперове обслуговування клієнтів. У двох пілотних відділеннях усе пройшло добре, після чого керівництво оголосило проєкт завершеним. Нині в більшості відділень досі користуються паперовими формами. Знайдіть причину.',
 sum:'Головна причина — зміну оголосили завершеною надто рано. Пілот у двох відділеннях став приводом розпустити команду, і решта відділень лишилась без пояснень, навчання й ресурсів, а перші успіхи згасли.',
 ppl:[
 {n:'Дмитро',r:'керівник відділення',b:0,q:'Торік оголосили, що проєкт безпаперового обслуговування «успішно завершено». Для нас це були слова зі звіту. Нам не пояснювали, чому це стосується нас. Я навіть не знаю, що в нашому відділенні мало змінитись.',w:'Не знає, що й навіщо мало змінитись у його відділенні: пояснення до нього не дійшло. Це усвідомлення.'},
 {n:'Анна',r:'касирка',b:1,q:'Мету розумію: менше паперу, швидше обслуговування. Але в нас ніхто не допомагає, а керівництво казало, що проєкт уже завершено. Тож чому я маю напружуватись сама? Колеги теж чекають.',w:'Мету знає, але не бачить сенсу вкладатись, коли керівництво вважає справу завершеною: це бажання.'},
 {n:'Василь',r:'кредитний менеджер',b:2,q:'Хочу працювати без паперів. У двох перших відділеннях людей навчали, а в нас проєктна команда вже розійшлась. До кого йти питати, як підписувати договір у застосунку, я не знаю.',w:'Хоче працювати по-новому, але не знає, як виконати конкретну дію. Це знання.'},
 {n:'Юлія',r:'операціоністка',b:3,q:'Знаю, як це робити, і хочу. Але сканери у нас застарілі, а заявку на заміну ніхто не розглядає: бюджет проєкту закрили після «успішного завершення».',w:'Знання й бажання є, але не вистачає обладнання й рішень на практиці: це здатність.'},
 {n:'Артем',r:'старший менеджер',b:4,q:'У нас був пілот, і пів року все працювало. Потім проєктну команду розпустили, про результати більше не згадували, і ми помалу повернулись до паперових форм.',w:'Півроку працював по-новому, але після зникнення підтримки повернувся до старого: нову практику не закріпили.'},
 {n:'Олена',r:'заступниця керівника відділення',b:4,q:'Ми справді запровадили нову схему й були в мережі першими. Після заяви про завершення проєкту перестали збирати статистику й проводити зустрічі. За місяць-два колеги перейшли на звичні способи.',w:'Нова схема справді працювала, але без контролю й зустрічей люди повернулись до звичного: це закріплення.'}],
 kt:[{t:'Не зупинятись після успіхів',l:2,w:'У кожній розмові звучить: проєкт «завершено», команду розпущено, підтримку припинено, а зміна дійшла лише до частини відділень. Перемогу оголосили надто рано.'},
 {t:'Забезпечити короткі перемоги',l:1,w:'Перемоги в пілотних відділеннях були, але проблема не в їх відсутності: їх використали, щоб зупинитись, а не щоб рухатись далі.'},
 {t:'Створити відчуття терміновості',l:0,w:'Ті, хто пробував нову схему, розуміють, навіщо вона потрібна. Бракує продовження проєкту, а не причини.'},
 {t:'Укорінити зміни в корпоративній культурі',l:0,w:'Укорінення починається, коли зміна вже охопила всю організацію. Тут вона дійшла лише до частини відділень.'}],
 ac:[{t:'Відновити проєктну команду, скласти графік поширення на решту відділень і щомісяця звітувати правлінню про прогрес кожного відділення.',l:2,w:'Не дає зміні згаснути: команда, терміни й звітність повертають проєкту рух і зобов’язують дійти до решти відділень.'},
 {t:'Відкрити бюджет на заміну застарілого обладнання й закріпити за кожним відділенням наставника з пілотних відділень на три місяці.',l:2,w:'Усуває практичні перешкоди й дає підтримку тим, хто знає як, але не може: сильна доповнювальна дія.'},
 {t:'Провести для всіх відділень вебінар про переваги безпаперового обслуговування за результатами пілоту й відповісти на запитання працівників.',l:1,w:'Додає інформації й мотивації, але без команди й бюджету відділення не зможуть перетворити її на дії.'},
 {t:'Заборонити друк паперових бланків у всіх відділеннях з наступного місяця й оголошувати догани керівникам, які порушать цю вимогу на нараді правління.',l:0,w:'Заборона й догани без підтримки створять відповідність на папері та опір на практиці.'},
 {t:'Оголосити новий масштабний проєкт цифровізації з іншою назвою, щоб працівники сприйняли його як нову справу, а не продовження старої.',l:0,w:'Перейменування не вирішує причин: люди побачать той самий проєкт, який уже раз покинули.'}]}];

function bar(l,v,max,c){return '<div class="bar"><span>'+l+'</span><div class="t"><i style="width:'+v/max*100+'%;background:'+c+'"></i></div><b>'+v+'/'+max+'</b></div>'}
function home(){pg(0);var h='<h1>🔎 Розслідування провалу змін</h1><p class="muted">Заняття 7 · Управління змінами · моделі Коттера й ADKAR</p><p>Ви — консультант. Компанія запровадила зміну, але вона не прижилась. Знайдіть причину й запропонуйте, що робити.</p><h3>Як грати (4 кроки)</h3><ul><li><b>Розмови.</b> Поговоріть із трьома з шести працівників.</li><li><b>Діагноз ADKAR.</b> Для кожного співрозмовника знайдіть щабель, на якому він застряг.</li><li><b>Крок Коттера.</b> Визначте, який крок змін у компанії пропущено.</li><li><b>План.</b> Оберіть 2 дії з 5. Максимум за кейс — 9 балів.</li></ul><h3>Оберіть кейс</h3>';
 CASES.forEach(function(c,i){h+='<button class="opt" onclick="startCase('+i+')"><b>'+c.e+' '+c.co+' · '+c.t+'</b><small>'+c.tl+'</small></button>'});
 app.innerHTML=h+'<label class="muted">Ім’я (необов’язково)</label><input type="text" id="nm" placeholder="Ваше ім’я"><button class="alt" onclick="teacher()">Перегляд результатів групи (для викладача)</button>'}
function startCase(i){var n=$('nm');if(n)name=(n.value||'').trim();g={ci:i,po:sh([0,1,2,3,4,5]),talk:[],di:0,ans:[],fb:false,ko:sh([0,1,2,3]),kp:-1,ao:sh([0,1,2,3,4]),ap:[],step:'talk'};saved=false;draw()}
function draw(){var s=g.step;if(s=='talk')vTalk();else if(s=='ad')vAd();else if(s=='kt')vKt();else if(s=='ac')vAc();else fin()}
function vTalk(){pg(5);var C=CASES[g.ci],full=g.talk.length>=3,h='<span class="tag">Крок 1 з 4 · Розмови</span><h2>'+C.e+' '+C.co+'</h2><p>'+C.intro+'</p><p><b>Торкніться працівника, щоб вислухати його.</b> Часу вистачить лише на три розмови: <b>'+g.talk.length+' з 3</b>.</p>';
 g.po.forEach(function(i){var p=C.ppl[i],d=g.talk.indexOf(i)>=0;h+='<button class="person'+(d?' done':(full?' lock':''))+'" onclick="talk('+i+')">'+av(i)+'<div><b>'+p.n+'</b> · '+p.r+(d?'<div class="q">«'+p.q+'»</div>':'')+'</div></button>'});
 app.innerHTML=h+'<button class="main" onclick="g.step=\'ad\';draw()"'+(full?'':' disabled')+'>Перейти до діагностики</button>'}
function talk(i){if(g.talk.indexOf(i)<0&&g.talk.length<3){g.talk.push(i);vTalk()}}
function vAd(){var C=CASES[g.ci],p=C.ppl[g.talk[g.di]],k=g.di;pg(25+k*8);
 var h='<span class="tag">Крок 2 з 4 · Діагноз ADKAR · людина '+(k+1)+' з 3</span><h2>'+p.n+', '+p.r+'</h2><div class="quote">«'+p.q+'»</div>';
 if(!g.fb){h+='<p><b>На якому щаблі застрягла ця людина?</b> <span class="muted">Щаблі йдуть по порядку: шукайте перший, який ще не пройдено.</span></p>';AD.forEach(function(a,i){h+='<button class="opt" onclick="pickAd('+i+')"><b>'+(i+1)+' · '+a[0]+'</b><small>'+a[1]+'</small></button>'})}
 else{var c=p.b,a=g.ans[k],ok=a==c;h+='<div class="res '+(ok?'ok':'no')+'"><b>'+(ok?'✅ Правильно':'❌ Неправильно')+'</b><br>'+(ok?'':'Ви обрали «'+AD[a][0]+'». '+(a<c?'Цей щабель людина вже пройшла.':'Цей щабель настає пізніше, а перед ним є непройдений.')+' Правильна відповідь: «'+AD[c][0]+'». ')+p.w+'</div><button class="main" onclick="nextAd()">'+(k<2?'Наступна людина':'Далі: крок Коттера')+'</button>'}
 app.innerHTML=h}
function pickAd(i){g.ans.push(i);g.fb=true;vAd()}
function nextAd(){g.fb=false;if(g.di<2){g.di++}else g.step='kt';draw()}
function quotes(){var C=CASES[g.ci],h='';g.talk.forEach(function(i){var p=C.ppl[i];h+='<div class="quote"><b>'+p.n+', '+p.r+':</b> «'+p.q+'»</div>'});return h}
function vKt(){pg(55);var C=CASES[g.ci],h='<span class="tag">Крок 3 з 4 · Модель Коттера</span><h2>Який крок змін пропущено або виконано погано?</h2><p class="muted">'+KS+'</p><h3>Що ви почули</h3>'+quotes();
 if(g.kp<0){h+='<p><b>Оберіть одну відповідь:</b></p>';g.ko.forEach(function(j){h+='<button class="opt" onclick="pickKt('+j+')"><b>'+C.kt[j].t+'</b></button>'});}
 else{var l=C.kt[g.kp].l;h+='<div class="res '+(l==2?'ok':l==1?'mid':'no')+'"><b>'+(l==2?'✅ Головна причина':l==1?'🟡 Близько, але не причина':'❌ Хибний слід')+'</b><br>Ви обрали «'+C.kt[g.kp].t+'». '+C.kt[g.kp].w+'</div>';
  if(l<2){var b=C.kt.filter(function(x){return x.l==2})[0];h+='<div class="res ok"><b>Головна причина:</b> «'+b.t+'». '+b.w+'</div>'}
  h+='<button class="main" onclick="g.step=\'ac\';draw()">Далі: план дій</button>'}
 app.innerHTML=h}
function pickKt(j){g.kp=j;vKt()}
function vAc(){pg(80);var C=CASES[g.ci],h='<span class="tag">Крок 4 з 4 · План дій</span><h2>Що порадите компанії?</h2><p>Оберіть <b>рівно дві дії</b> з п’яти.</p>';
 if(!g.fb){g.ao.forEach(function(j){var s=g.ap.indexOf(j)>=0;h+='<button class="opt'+(s?' sel':'')+'" onclick="togAc('+j+')">'+(s?'✔ ':'')+C.ac[j].t+'</button>'});h+='<button class="main" onclick="g.fb=true;vAc()"'+(g.ap.length==2?'':' disabled')+'>Підтвердити ('+g.ap.length+' з 2)</button>'}
 else{g.ao.forEach(function(j){var a=C.ac[j],s=g.ap.indexOf(j)>=0;h+='<div class="res '+(a.l==2?'ok':a.l==1?'mid':'no')+'"><b>'+(s?'✔ Ваш вибір · ':'')+LA[a.l]+'</b><br>'+a.t+'<br><span class="muted">'+a.w+'</span></div>'});h+='<button class="main" onclick="g.step=\'end\';g.fb=false;draw()">Показати підсумок</button>'}
 app.innerHTML=h}
function togAc(j){var i=g.ap.indexOf(j);if(i>=0)g.ap.splice(i,1);else if(g.ap.length<2)g.ap.push(j);vAc()}
function score(){var C=CASES[g.ci],a=0,k=0,t=0;g.ans.forEach(function(x,i){if(x==C.ppl[g.talk[i]].b)a++});k=C.kt[g.kp].l;g.ap.forEach(function(j){t+=C.ac[j].l});return{a:a,k:k,t:t,s:a+k+t}}
function verdict(s){return s>=TH.hi?2:(s>=TH.mid?1:0)}
function notes(sc){var C=CASES[g.ci],n=[],d={};g.talk.forEach(function(i){d[C.ppl[i].b]=1});var nd=Object.keys(d).length;
 if(nd<=2)n.push('Ви поспілкувались із людьми лише з '+nd+' різними щаблями ADKAR. Решта щаблів лишилась неперевіреною: інші розмови показали б іншу картину.');
 if(sc.a<3&&g.ans[0]==g.ans[1]&&g.ans[1]==g.ans[2])n.push('Для всіх трьох людей ви обрали один щабель. Кожна людина застрягає на своєму місці драбини, тож звіряйте діагноз із її словами.');
 if(sc.s==9)n.push('Бездоганно: усі діагнози точні, головну причину знайдено, план поєднує дві сильні дії.');
 var low=g.ap.every(function(j){return C.ac[j].l==0});if(low)n.push('Обидві обрані дії виявились слабкими. Перечитайте, на якому щаблі й кроці застрягла більшість людей, і шукайте дії саме там.');return n}
function report(){var C=CASES[g.ci],sc=score(),v=VT[verdict(sc.s)],t='Розслідування провалу змін — '+(name||'без імені')+'\nКейс: '+C.co+' · '+C.t+'\nПідсумок: '+v.t+' ('+sc.s+'/9)\nДіагностика ADKAR: '+sc.a+'/3, крок Коттера: '+sc.k+'/2, план дій: '+sc.t+'/4\n';
 g.talk.forEach(function(i,k){var p=C.ppl[i];t+=p.n+': ваш діагноз «'+AD[g.ans[k]][0]+'», правильно «'+AD[p.b][0]+'»\n'});t+='Крок Коттера: «'+C.kt[g.kp].t+'»\nДії: '+g.ap.map(function(j){return C.ac[j].t.slice(0,50)+'… ('+LA[C.ac[j].l]+')'}).join('; ')+'\n';return t}
function fin(){pg(100);var C=CASES[g.ci],sc=score(),v=verdict(sc.s),h='<h1>'+VT[v].e+' '+VT[v].t+'</h1><p><b>'+sc.s+' з 9 балів</b> · '+C.co+'</p>'+bar('Діагностика ADKAR',sc.a,3,'#2E7D6B')+bar('Крок Коттера',sc.k,2,'#C9962C')+bar('План дій',sc.t,4,'#1E2761')+bar('Разом',sc.s,9,'#384080');
 h+='<h3>Ваші діагнози</h3><div class="sc"><table><tr><th>Людина</th><th>Ваш діагноз</th><th>Правильно</th></tr>';g.talk.forEach(function(i,k){var p=C.ppl[i],ok=g.ans[k]==p.b;h+='<tr><td>'+p.n+'</td><td>'+(ok?'✅ ':'❌ ')+AD[g.ans[k]][0]+'</td><td>'+AD[p.b][0]+'</td></tr>'});
 h+='</table></div><div class="res mid"><b>Що було справжньою причиною.</b> '+C.sum+'</div>';notes(sc).forEach(function(n){h+='<div class="note">'+n+'</div>'});
 h+='<h3>Запитання для рефлексії</h3><ul><li>Чому діагноз за ADKAR для двох людей з однієї компанії може бути різним, і що це означає для плану змін?</li><li>Як пропущений крок Коттера пояснює те, що ви почули в розмовах?</li></ul><button class="main" onclick="copyRes()">Скопіювати результат</button><div id="cp"></div><button class="alt" onclick="teacher()">Перегляд результатів групи (для викладача)</button><button class="alt" onclick="startCase('+g.ci+')">Зіграти цей кейс ще раз</button><button class="alt" onclick="home()">Обрати інший кейс</button>';
 app.innerHTML=h;if(!saved){saved=true;save(sc,v)}}
function copyRes(){var t=report(),box=$('cp');function fb(){box.innerHTML='<textarea id="ta" readonly></textarea>';$('ta').value=t;if($('ta').select)$('ta').select()}
 try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){box.innerHTML='<div class="note">Скопійовано ✓</div>'},fb)}else fb()}catch(e){fb()}}
function save(sc,v){try{if(window.storage){var C=CASES[g.ci],r={ts:new Date().toISOString(),name:name,c:C.co,v:VT[v].t,a:sc.a,k:sc.k,t:sc.t,s:sc.s};window.storage.set('inv:'+Date.now()+Math.floor(Math.random()*1000),JSON.stringify(r),true).catch(function(){})}}catch(e){}}
var rows=[];
function teacher(){app.innerHTML='<h2>Результати групи</h2><div id="tl" class="muted">Завантаження…</div><button class="alt" onclick="'+(g.step=='end'?'fin()':'home()')+'">Назад</button>';
 if(!window.storage){$('tl').innerHTML='Збереження недоступне в цьому режимі (файл відкрито поза чатом). Просіть студентів надсилати текст кнопки «Скопіювати результат».';return}
 window.storage.list('inv:',true).then(function(l){var ks=(l&&l.keys)||[];return Promise.all(ks.map(function(k){return window.storage.get(k,true).then(function(r){try{return JSON.parse(r.value)}catch(e){return null}}).catch(function(){return null})}))}).then(function(a){
  rows=a.filter(Boolean).sort(function(x,y){return x.ts<y.ts?1:-1});if(!rows.length){$('tl').innerHTML='Поки немає збережених результатів.';return}
  var h='<div class="sc"><table><tr><th>Ім’я</th><th>Кейс</th><th>ADKAR</th><th>Коттер</th><th>План</th><th>Разом</th></tr>';rows.forEach(function(r){h+='<tr><td>'+esc(r.name||'—')+'</td><td>'+esc(r.c)+'</td><td>'+r.a+'/3</td><td>'+r.k+'/2</td><td>'+r.t+'/4</td><td>'+r.s+'/9</td></tr>'});
  $('tl').innerHTML=h+'</table></div><button class="main" onclick="csv()">Експорт CSV</button>'}).catch(function(){$('tl').innerHTML='Не вдалося завантажити результати.'})}
function q(x){return '"'+String(x).replace(/"/g,'""')+'"'}
function csvText(){var L=[['Дата','Ім’я','Кейс','Підсумок','ADKAR (0-3)','Коттер (0-2)','План (0-4)','Разом (0-9)'].map(q).join(';')];rows.forEach(function(r){L.push([r.ts,r.name,r.c,r.v,r.a,r.k,r.t,r.s].map(q).join(';'))});return '\uFEFF'+L.join('\r\n')}
function csv(){var b=new Blob([csvText()],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='rozsliduvannya.csv';document.body.appendChild(a);a.click();a.remove()}
home();
</script></body></html>
