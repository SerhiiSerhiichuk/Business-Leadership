<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Стиль лідерства — самодіагностика</title>
<style>
  :root {
    --ink: #1E2761;
    --ink-soft: #384080;
    --surface: #F3F6FC;
    --card: #FFFFFF;
    --gold: #C9962C;
    --gold-soft: #F3E4C6;
    --muted: #5B6685;
    --line: #DDE4F5;
    --danger: #B3492F;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--surface);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
  }
  .serif { font-family: Cambria, Georgia, "Times New Roman", serif; }
  #app {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 18px;
  }
  .stage {
    width: 100%;
    max-width: 620px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 40px 36px;
    box-shadow: 0 18px 40px -24px rgba(30, 39, 97, 0.35);
  }
  @media (max-width: 480px) {
    .card { padding: 28px 22px; }
  }

  /* ---------- Intro ---------- */
  .kicker {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 10px;
    letter-spacing: 0.2px;
  }
  h1.title {
    font-size: 30px;
    line-height: 1.2;
    margin: 0 0 14px;
    font-weight: 700;
  }
  p.lead {
    font-size: 15px;
    line-height: 1.6;
    color: var(--muted);
    margin: 0 0 26px;
  }
  label.field-label {
    display: block;
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 6px;
    font-weight: 600;
  }
  input.text-input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    font-size: 15px;
    color: var(--ink);
    background: var(--surface);
    margin-bottom: 22px;
  }
  input.text-input:focus {
    outline: none;
    border-color: var(--gold);
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 26px;
    border-radius: 10px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn-primary {
    background: var(--ink);
    color: #fff;
    width: 100%;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 20px -12px rgba(30,39,97,0.6); }
  .btn-ghost {
    background: transparent;
    color: var(--muted);
    font-weight: 500;
    padding: 8px 4px;
  }
  .btn-ghost:hover { color: var(--ink); }
  .meta-row {
    display: flex;
    gap: 22px;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }
  .meta-item .num { font-weight: 700; font-size: 16px; }
  .meta-item .lbl { font-size: 12px; color: var(--muted); }

  /* ---------- Quiz ---------- */
  .progress-track {
    height: 5px;
    background: var(--line);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 26px;
  }
  .progress-fill {
    height: 100%;
    background: var(--gold);
    border-radius: 4px;
    transition: width 0.35s ease;
  }
  .step-count {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 18px;
  }
  .statement {
    font-size: 22px;
    line-height: 1.45;
    font-weight: 600;
    margin: 0 0 34px;
    min-height: 100px;
  }
  .scale-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 8px;
    margin-bottom: 10px;
  }
  .dot-btn {
    flex: 1;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 2px solid var(--line);
    background: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 15px;
    color: var(--ink-soft);
    transition: all 0.15s ease;
    max-width: 58px;
    margin: 0 auto;
  }
  .dot-btn:hover { border-color: var(--gold); }
  .dot-btn.selected {
    background: var(--gold);
    border-color: var(--gold);
    color: #fff;
    transform: scale(1.08);
  }
  .scale-labels {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 30px;
  }
  .quiz-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* ---------- Results ---------- */
  .result-name {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .bar-row {
    margin-bottom: 20px;
  }
  .bar-row.dominant .bar-label { color: var(--ink); }
  .bar-label {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .bar-track {
    height: 14px;
    background: var(--surface);
    border-radius: 7px;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .bar-fill {
    height: 100%;
    border-radius: 7px;
    background: var(--line);
    transition: width 0.8s ease;
  }
  .bar-row.dominant .bar-fill { background: var(--gold); }
  .dominant-card {
    margin-top: 28px;
    padding: 20px 22px;
    border-radius: 14px;
    background: var(--ink);
    color: #fff;
  }
  .dominant-card .dc-label {
    font-size: 12px;
    color: var(--gold-soft);
    margin-bottom: 4px;
  }
  .dominant-card .dc-style {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .dominant-card p {
    font-size: 13.5px;
    line-height: 1.55;
    color: #DCE1F5;
    margin: 0;
  }
  .save-note {
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 18px;
    text-align: center;
  }
  .result-actions {
    display: flex;
    gap: 12px;
    margin-top: 26px;
  }
  .result-actions .btn { flex: 1; }
  .btn-secondary {
    background: var(--surface);
    color: var(--ink);
    border: 1.5px solid var(--line);
  }
  .teacher-link {
    display: block;
    text-align: center;
    margin-top: 22px;
    font-size: 12.5px;
    color: var(--muted);
    text-decoration: underline;
    cursor: pointer;
    background: none;
    border: none;
  }

  /* ---------- Teacher view ---------- */
  .teacher-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }
  table.results-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  table.results-table th {
    text-align: left;
    font-size: 11.5px;
    color: var(--muted);
    font-weight: 600;
    padding: 8px 8px;
    border-bottom: 2px solid var(--line);
  }
  table.results-table td {
    padding: 9px 8px;
    border-bottom: 1px solid var(--line);
  }
  .tag {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 20px;
    font-size: 11.5px;
    font-weight: 600;
    background: var(--gold-soft);
    color: #7A5A16;
  }
  .empty-note {
    text-align: center;
    color: var(--muted);
    font-size: 13.5px;
    padding: 30px 0;
  }
  .icon-btn {
    background: none;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    padding: 7px 13px;
    font-size: 12.5px;
    color: var(--ink);
    cursor: pointer;
  }
  .icon-btn:hover { border-color: var(--gold); }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
  // ---------------- Data ----------------
  var STYLE_NAMES = { A: "Авторитарний", D: "Демократичний", L: "Ліберальний" };

  var ITEMS = [
    { id: "D2", scale: "D", text: "Я вважаю, що найкращі ідеї народжуються в результаті спільного обговорення." },
    { id: "A1", scale: "A", text: "Коли потрібно ухвалити рішення швидко, я віддаю перевагу зробити це самостійно, не витрачаючи час на обговорення." },
    { id: "L3", scale: "L", text: "Мені комфортно, коли команда сама визначає, як виконувати завдання." },
    { id: "D5", scale: "D", text: "Я делегую частину повноважень щодо ухвалення рішень команді." },
    { id: "A6", scale: "A", text: "Я вважаю, що ефективна команда — та, де є один визнаний лідер, чиї рішення не оскаржуються." },
    { id: "L1", scale: "L", text: "Я надаю команді значну свободу дій і втручаюся лише за потреби." },
    { id: "D1", scale: "D", text: "Перш ніж ухвалити важливе рішення, я завжди раджуся з командою." },
    { id: "A4", scale: "A", text: "Я контролюю виконання завдань на кожному етапі, а не лише за результатом." },
    { id: "L5", scale: "L", text: "Я вважаю своєю роллю створення умов, а не безпосереднє керівництво процесом." },
    { id: "D6", scale: "D", text: "Я відкрито обговорюю з командою помилки та шукаю рішення разом." },
    { id: "A2", scale: "A", text: "Я вважаю, що чіткі інструкції важливіші за обговорення думок команди." },
    { id: "L7", scale: "L", text: "Я довіряю команді ухвалювати рішення навіть у нестандартних ситуаціях без мого схвалення." },
    { id: "D3", scale: "D", text: "Я регулярно запитую думку членів команди, навіть якщо це подовжує процес." },
    { id: "A7", scale: "A", text: "Мені простіше сказати команді, що робити, ніж запитати, що вони пропонують." },
    { id: "L2", scale: "L", text: "Я вважаю, що досвідчені фахівці працюють ефективніше без постійного контролю." },
    { id: "D4", scale: "D", text: "Мені важливо, щоб кожен член команди відчував, що його голос враховано." },
    { id: "A3", scale: "A", text: "Мені некомфортно, коли підлеглі ставлять під сумнів мої рішення." },
    { id: "L6", scale: "L", text: "Я віддаю перевагу мінімальному втручанню в робочий процес команди." },
    { id: "D7", scale: "D", text: "Я вважаю, що мотивація зростає, коли люди самі беруть участь у виробленні рішень." },
    { id: "A5", scale: "A", text: "У кризовій ситуації я беру відповідальність на себе і даю команді чіткі вказівки." },
    { id: "L4", scale: "L", text: "Я рідко встановлюю жорсткі дедлайни, довіряючи команді самоорганізовуватися." }
  ];

  var INTERPRETATION = {
    A: "Ви схильні ухвалювати рішення швидко й самостійно, брати відповідальність на себе та тримати чіткий контроль над виконанням. Це ефективно в кризових ситуаціях, але варто стежити, щоб не придушувати ініціативу команди.",
    D: "Ви орієнтовані на залучення команди до вироблення рішень і цінуєте, щоб кожен голос був почутий. Це сильна сторона в проєктах з високою невизначеністю — головний ризик такого стилю це уповільнення в ситуаціях, де потрібне швидке рішення.",
    L: "Ви надаєте команді високий рівень автономії і втручаєтесь по мінімуму. Такий підхід добре працює з досвідченими, самомотивованими фахівцями, але може бути ризикованим із новачками або в ситуаціях, що потребують чіткого напрямку.",
    MIXED: "Ваші результати не показують яскраво вираженого домінуючого стилю — ви гнучко поєднуєте риси двох підходів залежно від ситуації. Це саме по собі є ознакою ситуативного лідерства."
  };

  var STORAGE_PREFIX = "leadership-style-quiz:";

  // ---------------- State ----------------
  var state = {
    screen: "intro",       // intro | quiz | results | teacher
    studentName: "",
    index: 0,
    answers: {},           // itemId -> 1..5
    result: null,
    saveStatus: "idle",    // idle | saving | saved | failed
    teacherRows: null,
    teacherLoading: false
  };

  var app = document.getElementById("app");

  function el(html) {
    var t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }

  // ---------------- Scoring ----------------
  function computeResult() {
    var sums = { A: 0, D: 0, L: 0 };
    ITEMS.forEach(function (item) {
      sums[item.scale] += state.answers[item.id] || 0;
    });
    var entries = Object.keys(sums).map(function (k) { return { key: k, score: sums[k] }; });
    entries.sort(function (a, b) { return b.score - a.score; });
    var top = entries[0], second = entries[1];
    var mixed = (top.score - second.score) < 3;
    return {
      sums: sums,
      ranking: entries,
      dominant: mixed ? null : top.key,
      mixedPair: mixed ? [top.key, second.key] : null
    };
  }

  // ---------------- Persistence ----------------
  function saveResultToStorage(result) {
    if (!window.storage) return;
    state.saveStatus = "saving";
    var key = STORAGE_PREFIX + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
    var payload = {
      name: state.studentName || "Анонім",
      sums: result.sums,
      dominant: result.dominant,
      mixedPair: result.mixedPair,
      timestamp: Date.now()
    };
    window.storage.set(key, JSON.stringify(payload), true).then(function (r) {
      state.saveStatus = r ? "saved" : "failed";
      render();
    }).catch(function () {
      state.saveStatus = "failed";
      render();
    });
  }

  function loadTeacherRows() {
    state.teacherLoading = true;
    render();
    if (!window.storage) {
      state.teacherRows = [];
      state.teacherLoading = false;
      render();
      return;
    }
    window.storage.list(STORAGE_PREFIX, true).then(function (listRes) {
      var keys = (listRes && listRes.keys) || [];
      if (keys.length === 0) {
        state.teacherRows = [];
        state.teacherLoading = false;
        render();
        return;
      }
      var promises = keys.map(function (k) {
        return window.storage.get(k, true).then(function (r) {
          try { return JSON.parse(r.value); } catch (e) { return null; }
        }).catch(function () { return null; });
      });
      Promise.all(promises).then(function (rows) {
        rows = rows.filter(Boolean).sort(function (a, b) { return b.timestamp - a.timestamp; });
        state.teacherRows = rows;
        state.teacherLoading = false;
        render();
      });
    }).catch(function () {
      state.teacherRows = [];
      state.teacherLoading = false;
      render();
    });
  }

  function downloadCsv() {
    var rows = state.teacherRows || [];
    var header = ["Ім'я", "Авторитарний", "Демократичний", "Ліберальний", "Домінуючий стиль", "Дата"];
    var lines = [header.join(";")];
    rows.forEach(function (r) {
      var dom = r.dominant ? STYLE_NAMES[r.dominant] : "Змішаний (" + r.mixedPair.map(function(k){return STYLE_NAMES[k];}).join(" / ") + ")";
      lines.push([
        r.name,
        r.sums.A,
        r.sums.D,
        r.sums.L,
        dom,
        new Date(r.timestamp).toLocaleString("uk-UA")
      ].join(";"));
    });
    var blob = new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "leadership-style-results.csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ---------------- Screens ----------------
  function renderIntro() {
    var card = el(
      '<div class="stage"><div class="card">' +
      '<p class="kicker">Практичне заняття 1 · Бізнес-лідерство</p>' +
      '<h1 class="title serif">Який ваш стиль лідерства?</h1>' +
      '<p class="lead">21 твердження, приблизно 5 хвилин. Оцініть кожне за шкалою від 1 до 5 — наскільки точно воно описує вашу типову поведінку в ролі лідера. Результат і його розбір ви побачите одразу після останнього питання.</p>' +
      '<label class="field-label">Ваше ім\'я (необов\'язково)</label>' +
      '<input type="text" class="text-input" id="name-input" placeholder="Наприклад, Олена К." value="' + state.studentName.replace(/"/g,'&quot;') + '" />' +
      '<button class="btn btn-primary" id="start-btn">Почати опитування</button>' +
      '<div class="meta-row">' +
        '<div class="meta-item"><div class="num">21</div><div class="lbl">твердження</div></div>' +
        '<div class="meta-item"><div class="num">5 хв</div><div class="lbl">орієнтовно</div></div>' +
        '<div class="meta-item"><div class="num">3</div><div class="lbl">шкали стилю</div></div>' +
      '</div>' +
      '</div></div>'
    );
    card.querySelector("#start-btn").addEventListener("click", function () {
      state.studentName = card.querySelector("#name-input").value.trim();
      state.screen = "quiz";
      state.index = 0;
      render();
    });
    return card;
  }

  function renderQuiz() {
    var item = ITEMS[state.index];
    var progressPct = Math.round((state.index / ITEMS.length) * 100);
    var selected = state.answers[item.id];

    var dotsHtml = "";
    for (var v = 1; v <= 5; v++) {
      dotsHtml += '<button class="dot-btn' + (selected === v ? " selected" : "") + '" data-value="' + v + '">' + v + "</button>";
    }

    var card = el(
      '<div class="stage"><div class="card">' +
      '<div class="progress-track"><div class="progress-fill" style="width:' + progressPct + '%"></div></div>' +
      '<p class="step-count">Твердження ' + (state.index + 1) + ' із ' + ITEMS.length + '</p>' +
      '<p class="statement serif">' + item.text + '</p>' +
      '<div class="scale-row">' + dotsHtml + '</div>' +
      '<div class="scale-labels"><span>Зовсім не про мене</span><span>Повністю про мене</span></div>' +
      '<div class="quiz-nav">' +
        '<button class="btn btn-ghost" id="back-btn" ' + (state.index === 0 ? "disabled style=\"visibility:hidden\"" : "") + '>← Назад</button>' +
        '<span></span>' +
      '</div>' +
      '</div></div>'
    );

    card.querySelectorAll(".dot-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var val = parseInt(btn.getAttribute("data-value"), 10);
        state.answers[item.id] = val;
        setTimeout(function () {
          if (state.index < ITEMS.length - 1) {
            state.index += 1;
            render();
          } else {
            state.result = computeResult();
            state.screen = "results";
            state.saveStatus = "idle";
            render();
            saveResultToStorage(state.result);
          }
        }, 180);
        render();
      });
    });

    var backBtn = card.querySelector("#back-btn");
    if (backBtn) {
      backBtn.addEventListener("click", function () {
        if (state.index > 0) { state.index -= 1; render(); }
      });
    }

    return card;
  }

  function renderResults() {
    var result = state.result;
    var order = ["A", "D", "L"];
    var barsHtml = order.map(function (key) {
      var isDominant = result.dominant === key || (result.mixedPair && result.mixedPair.indexOf(key) !== -1);
      var pct = Math.round((result.sums[key] / 35) * 100);
      return (
        '<div class="bar-row' + (isDominant ? " dominant" : "") + '">' +
          '<div class="bar-label"><span>' + STYLE_NAMES[key] + '</span><span>' + result.sums[key] + ' / 35</span></div>' +
          '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
        '</div>'
      );
    }).join("");

    var dominantLabel, dominantText;
    if (result.dominant) {
      dominantLabel = STYLE_NAMES[result.dominant];
      dominantText = INTERPRETATION[result.dominant];
    } else {
      dominantLabel = result.mixedPair.map(function (k) { return STYLE_NAMES[k]; }).join(" + ");
      dominantText = INTERPRETATION.MIXED;
    }

    var saveNote = "";
    if (state.saveStatus === "saving") saveNote = "Зберігаємо результат…";
    else if (state.saveStatus === "saved") saveNote = "Результат збережено.";
    else if (state.saveStatus === "failed") saveNote = "Результат порахований, але не вдалося зберегти для викладача.";

    var card = el(
      '<div class="stage"><div class="card">' +
      (state.studentName ? '<p class="result-name">' + state.studentName + '</p>' : "") +
      '<h1 class="title serif">Ваш профіль лідерства</h1>' +
      '<div style="margin-top:22px;">' + barsHtml + '</div>' +
      '<div class="dominant-card">' +
        '<div class="dc-label">Домінуючий стиль</div>' +
        '<div class="dc-style">' + dominantLabel + '</div>' +
        '<p>' + dominantText + '</p>' +
      '</div>' +
      (saveNote ? '<p class="save-note">' + saveNote + '</p>' : "") +
      '<div class="result-actions">' +
        '<button class="btn btn-secondary" id="retake-btn">Пройти ще раз</button>' +
      '</div>' +
      '<button class="teacher-link" id="teacher-link">Перегляд результатів групи (для викладача)</button>' +
      '</div></div>'
    );

    card.querySelector("#retake-btn").addEventListener("click", function () {
      state.screen = "intro";
      state.index = 0;
      state.answers = {};
      state.result = null;
      render();
    });
    card.querySelector("#teacher-link").addEventListener("click", function () {
      state.screen = "teacher";
      render();
      loadTeacherRows();
    });

    return card;
  }

  function renderTeacher() {
    var rows = state.teacherRows;
    var bodyHtml;
    if (state.teacherLoading) {
      bodyHtml = '<p class="empty-note">Завантаження результатів…</p>';
    } else if (!rows || rows.length === 0) {
      bodyHtml = '<p class="empty-note">Поки що ніхто не пройшов опитування за цим посиланням.</p>';
    } else {
      var trs = rows.map(function (r) {
        var dom = r.dominant
          ? '<span class="tag">' + STYLE_NAMES[r.dominant] + '</span>'
          : '<span class="tag">Змішаний</span>';
        return (
          '<tr>' +
            '<td>' + r.name + '</td>' +
            '<td>' + r.sums.A + '</td>' +
            '<td>' + r.sums.D + '</td>' +
            '<td>' + r.sums.L + '</td>' +
            '<td>' + dom + '</td>' +
          '</tr>'
        );
      }).join("");
      bodyHtml =
        '<table class="results-table">' +
          '<thead><tr><th>Студент</th><th>Автор.</th><th>Демокр.</th><th>Ліберал.</th><th>Стиль</th></tr></thead>' +
          '<tbody>' + trs + '</tbody>' +
        '</table>';
    }

    var card = el(
      '<div class="stage"><div class="card">' +
      '<div class="teacher-header">' +
        '<h1 class="title serif" style="margin:0;font-size:22px;">Результати групи</h1>' +
        '<button class="icon-btn" id="refresh-btn">Оновити</button>' +
      '</div>' +
      bodyHtml +
      '<div class="result-actions">' +
        '<button class="btn btn-secondary" id="csv-btn"' + ((!rows || rows.length === 0) ? " disabled" : "") + '>Завантажити CSV</button>' +
        '<button class="btn btn-secondary" id="back-to-quiz-btn">← Назад</button>' +
      '</div>' +
      '</div></div>'
    );

    card.querySelector("#refresh-btn").addEventListener("click", loadTeacherRows);
    card.querySelector("#back-to-quiz-btn").addEventListener("click", function () {
      state.screen = state.result ? "results" : "intro";
      render();
    });
    var csvBtn = card.querySelector("#csv-btn");
    if (csvBtn && rows && rows.length > 0) {
      csvBtn.addEventListener("click", downloadCsv);
    }

    return card;
  }

  function render() {
    app.innerHTML = "";
    var view;
    if (state.screen === "intro") view = renderIntro();
    else if (state.screen === "quiz") view = renderQuiz();
    else if (state.screen === "results") view = renderResults();
    else view = renderTeacher();
    app.appendChild(view);
  }

  render();
})();
</script>
</body>
</html>
