{e:0,k:"Крок 6 · Короткі перемоги",q:"Покажіть хоч один цех, де вже спрацювало. Хочу побачити сам.",o:["Можемо. У п'ятницю екскурсія на пілотну лінію: побачите картки, дошку простоїв і поговорите з операторами.","Результати є, і про них ще багато можна розповісти. Показати зможемо, коли знайдеться відповідний час і можливість.","Дивитися нема на що, у цехах працюють. Довіряйте дирекції, а не ходіть на екскурсії замість роботи."],w:"Короткі перемоги переконують, коли їх можна побачити на місці: екскурсія й розмова з операторами. «Знайдеться час» чи «довіряйте дирекції» докази замінюють."},
{e:0,k:"Крок 2 · Коаліція",q:"Профспілка про це знає? Нас ніхто не питав, що ми думаємо.",o:["Профспілка в робочій групі з початку, а ваші пропозиції збираємо щотижня на планерках і відповідаємо.","Усі зацікавлені сторони так чи інакше долучені, і це нормально для такого проєкту. Інформація буде доступна всім.","Профспілка підтримала рішення, а ваша думка нічого не змінить. Не варто створювати зайвих проблем керівництву."],w:"Участь працівників і їхніх представників створює причетність: названа група, канал пропозицій і відповідь. «Усі долучені» чи «ваша думка не змінить» участі не дають."},
{e:1,k:"Крок 3 · Бачення",q:"Мені потрібно бачити, що буде з моєю зарплатою після змін. Без цього нічого не підтримаю.",o:["Розумію. Зарплати не знижуються, а бригадний бонус за порядок і брак додається з наступного кварталу, ось розрахунок.","Зарплата важлива для всіх. Ми зробимо все можливе, щоб вона не постраждала, і в разі потреби все переглянемо.","Зарплата залежить від плану, а не від змін. Не ставте умов, які керівництво виконувати не збирається."],w:"Образ змін для працівника має торкатися його доходу чесно й конкретно: що не змінюється і що додається. «Зробимо все можливе» чи «не ставте умов» довіри не будують."},
{e:1,k:"Крок 8 · Закріпити в культурі",q:"Колеги з другої зміни в 5S не вірять. Мені що, одному старатися?",o:["Ні. Другій зміні призначаємо свого наставника з пілоту, а результати двох змін порівнюємо відкрито щотижня.","Колеги з часом теж підтягнуться, коли побачать результат. Не варто звертати увагу на скептиків і робіть своє.","Інші зміни не ваша справа. Працюйте за стандартом, і якщо колеги не вірять, це їхня проблема."],w:"Інтерес захищає видима підтримка перших: наставник другої зміни й порівняння результатів. «Підтягнуться з часом» чи «не ваша справа» самотності не знімають."},
{e:2,k:"Крок 7 · Закріпити здобутки",q:"Норми змінюються щокварталу. Тільки вивчили одне, вже інше.",o:["Ви праві. Тому стандарти фіксуємо на півроку, а зміни вносимо лише раз на півроку з попередженням за місяць.","Норми змінюються, бо підприємство розвивається, і ми намагаємося зменшити кількість змін. Скоро все стабілізується.","Норми змінюються, бо цього вимагає виробництво. Вчіться швидше й не скаржтеся, інші встигають за змінами."],w:"Тут потрібен стабільний темп: фіксований цикл змін і попередження. «Скоро стабілізується» чи «вчіться швидше» перевантаження не знімають."},
{e:2,k:"Крок 8 · Закріпити в культурі",q:"Нові майстри не знають стандартів і роблять по-своєму. Хто їх навчатиме?",o:["Нові майстри проходять двотижневе введення з наставником і складають коротку перевірку за стандартом.","Нові люди навчаться поступово, як і всі до них. Головне дати їм час і підтримку колег.","Майстер має знати стандарти з першого дня. Це не питання навчання, а питання відповідальності кожного."],w:"Нових людей навчає процес введення: наставник і перевірка. «Дати час» чи «відповідальність кожного» без процесу їх не навчають."},
{e:3,k:"Крок 2 · Коаліція",q:"Мені на лінії потрібна допомога інженера, а їх на всі цехи двоє.",o:["Це вузьке місце. Додаємо ще двох інженерів і створюємо чергу консультацій, ось графік на тиждень уперед.","Інженерів справді небагато, але вони роблять усе можливе. З часом команду розширять, коли з'являться можливості.","Інженери зайняті, і це нормально. Вирішуйте питання на лінії самостійно, на те ви й досвідчений працівник."],w:"Бар'єр кадрів знімають додатковими людьми й видимим графіком. «Розширять з часом» чи «вирішуйте самі» бар'єр не прибирають."},
{e:3,k:"Крок 6 · Короткі перемоги",q:"Я боюся зупинити лінію, якщо зроблю щось за новим стандартом не так.",o:["Побоювання зрозуміле. Перші два тижні кнопку зупинки тисне майстер, а помилки не караємо, а разом розбираємо.","Зупинки трапляються, це частина виробництва. Головне не панікувати й діяти спокійно, тоді все буде добре.","Не зупиняйте лінію без потреби, і проблем не буде. Оператор повинен бути уважним, а не боятися."],w:"Страх помилки зменшують безпечні умови: майстер на кнопці, розбір без покарання. Заклик до спокою чи уважності умінь не додає."},
{e:4,k:"Крок 4 · Донесення бачення",q:"Ми вже вчили правила чотири рази. Чому знову нагадуєте?",o:["Слушно, нагадування набридає. Тепер правила на одній сторінці біля лінії, а зміни додаємо лише раз на квартал.","Нагадування допомагають закріпити матеріал, і ми це розуміємо. Постараємося робити їх менш частими й зручнішими.","Нагадуємо, бо ви забуваєте. Якби все виконувалося, нагадувати б не довелося, тож запам'ятайте нарешті."],w:"Норму не повторюють курсом, а вбудовують у робоче місце: одна сторінка біля лінії. Обіцянка «рідше й зручніше» чи докір за забудькуватість її не утримують."},
{e:4,k:"Крок 1 · Терміновість",q:"Усе працює, ми вже навчилися. Навіщо знову говорити про зміни?",o:["Працює, і це заслуга цехів. Але цільові показники цього року вищі, без нових кроків їх не досягти.","Говорити про зміни треба постійно, бо світ не стоїть на місці. Це частина розвитку кожного підприємства.","Бо керівництво так вирішило. Вам не обов'язково розуміти причини, достатньо виконувати нові вказівки."],w:"Не дати заспокоїтись після успіху допомагає нова ціль із цифрою (вищі показники). «Світ не стоїть» чи «не обов'язково розуміти» терміновості не відновлюють."}
];
var RET=[
{e:0,k:"Крок 1 · Терміновість",q:"Покупці роками ходять до наших кас. Навіщо їм каси самообслуговування?",o:["Каси сподобалися багатьом. Але у вихідні черги сягають двадцяти хвилин, і кожен десятий покупець іде, не купивши.","Каси самообслуговування це сучасний підхід, який зручний покупцям. Світова торгівля давно йде цим шляхом, тож і нам варто.","Покупці звикнуть, як звикали до всього. Рішення про каси вже прийняте, і обговорювати його в магазині не треба."],w:"Визнання звички плюс конкретна ціна нинішнього стану (черги, втрачені покупці). Потребу показують дані магазину, а не «світовий підхід» чи заборона обговорювати."},
{e:1,k:"Крок 2 · Коаліція",q:"Директор магазину в це не вірить. Чому ми маємо вірити вам?",o:["Його сумніви варті уваги. Завтра зустрічаємося з ним у залі, а підтримку керівника мережі отримає листом.","Різні керівники мають різні погляди, і це природно. З часом усі переконаються, що ми рухаємося в правильному напрямку.","Директор виконає наказ, як і всі. Не обговорюйте його позицію, краще займайтеся вашими обов'язками на касі."],w:"Видима єдність керівників створює довіру: розмова з директором і публічна підтримка керівника мережі. «З часом переконаються» чи «не обговорюйте» її не дають."},
{e:2,k:"Крок 4 · Донесення бачення",q:"Я не знаю, що робити, коли покупець не може відсканувати товар. Мене не навчили.",o:["Слушно. На касі висить пам'ятка з трьох кроків, а черговий консультант у залі допомагає з першого натискання.","Таке трапляється, але з практикою це стає простішим. Усі колись вчилися, тож не хвилюйтеся й дійте за обставинами.","Покупці самі вміють сканувати. Якщо не виходить, нехай користуються звичайною касою, вам не потрібно втручатися."],w:"Знання передають на місці дії: пам'ятка з кроків і названий консультант. «Дійте за обставинами» чи «не втручайтеся» прогалини в діях не закривають."},
{e:3,k:"Крок 5 · Прибрати бар'єри",q:"Каса зависає, коли скануєш кілька товарів підряд. Покупці нервують.",o:["Це реальна проблема. Постачальник оновить програму до п'ятниці, а до того дозволено проводити товари поодинці.","Технічні питання поступово вирішуються, і з часом зависань стане менше. Потрібно трохи терпіння від усіх нас.","Каса зависає через те, що її перевантажують. Скануйте повільніше й не скаржтеся на техніку, будь ласка."],w:"Технічний бар'єр знімають конкретним рішенням зі строком і обхідним способом. «Стане менше» чи звинувачення користувача його не прибирають."},
{e:4,k:"Крок 8 · Закріпити в культурі",q:"Нові касири знову самі пробивають усе, а не показують покупцям, як користуватися.",o:["Це підриває ідею. Нових касирів вводимо за стандартом: першого тижня наставник показує, як залучати покупців до каси.","Нові люди приходять із різними звичками. Поступово вони навчаться, коли зрозуміють мету й побачать, як це працює.","Касир працює так, як зручно йому. Не вчіть інших, робіть свою справу й не втручайтеся в чужі дії."],w:"Нову норму закріплює введення касирів за стандартом: наставник і конкретна поведінка. «Навчаться з часом» чи «робіть свою справу» її не вбудовують."},
{e:0,k:"Крок 4 · Донесення бачення",q:"Нам сказали, що каси самообслуговування зменшать навантаження, але не пояснили як.",o:["Пояснюю: покупці самі пробивають до п'яти позицій, а касир стежить за двома касами замість однієї.","Навантаження зміниться на краще, хоч не відразу. Про деталі ми розкажемо пізніше, коли побачимо, як усе працює.","Це очевидно: менше роботи для вас. Не потрібно вимагати пояснень там, де все й так зрозуміло."],w:"Донесення змін потребує конкретної схеми: що саме робить покупець, а що касир. «Розкажемо пізніше» чи «все очевидно» пояснення не дають."},
{e:0,k:"Крок 6 · Короткі перемоги",q:"Чи є хоч один магазин мережі, де це вже працює без проблем?",o:["Є. У двох магазинах пілоту черги скоротилися з двадцяти хвилин до восьми, приїжджайте в середу.","У деяких магазинах уже є позитивні результати, і про них ми розповімо докладніше, коли зберемо всі дані.","Інші магазини вас не стосуються. Працюйте у своєму й не порівнюйте з тим, чого самі не бачили."],w:"Докази працюють, коли названі магазини, цифри й можливість перевірити. «Позитивні результати» без цифр чи «не порівнюйте» довіри не будують."},
{e:0,k:"Крок 3 · Бачення",q:"Я не розумію, чим мій день зміниться, коли каси самообслуговування запрацюють.",o:["Менше стояння на касі, більше роботи в залі: допомога покупцям, викладка й консультація. Графік показуємо на зборах.","День зміниться в бік більшої зручності. Деталі залежатимуть від конкретного магазину, тому поки що важко казати точно.","День буде таким, яким його визначить директор. Ваша справа виконувати розклад, а не розпитувати про майбутнє."],w:"Тут потрібен конкретний «новий день»: менше каси, більше залу. «Залежатиме від магазину» чи «визначить директор» образу не дають."},
{e:1,k:"Крок 3 · Бачення",q:"Мені подобається бути на касі. Чому мене переводять у зал?",o:["Ви цінний касир. Головну касу лишаємо тим, хто хоче, а роботу в залі беруть за бажанням з доплатою.","Каса теж залишиться, просто робота зміниться. Кожен знайде своє місце, і всі будуть задоволені результатом.","Місце роботи визначає керівник магазину. Не питайте, чому вас переводять, а переходьте туди, куди скажуть."],w:"Інтерес зростає, коли є вибір і видима винагорода (головна каса, доплата за зал). «Кожен знайде місце» чи «куди скажуть» вибору не дають."},
{e:1,k:"Крок 7 · Закріпити здобутки",q:"Спочатку обіцяли бонуси за користування системою, а вже три місяці тиша.",o:["Ви праві, це затримка. Бонуси за систему нараховуємо з наступного місяця разом із виплатою за минулі.","Бонуси обов'язково будуть, просто потрібен час на оформлення всіх документів. Дякуємо за розуміння й терпіння.","Бонуси залежать від бюджету, а не від обіцянок. Якщо їх немає, значить, часу ще не настав, і це нормально."],w:"Довіру відновлює виконання обіцянки: нова дата й виплата за минулий період. «Потрібен час» чи «залежать від бюджету» без дати не відновлюють."},
{e:1,k:"Крок 6 · Короткі перемоги",q:"Минулого разу з новою програмою стало гірше. Чому тепер буде інакше?",o:["Було гірше, і це наша помилка. Тому цього разу спочатку працюємо в двох магазинах і публікуємо показники щотижня.","Минулий досвід враховано, і цього разу все продумано краще. Ми намагатимемося уникнути колишніх помилок і складнощів.","Минуле позаду. Хто постійно згадує невдачі, той заважає мережі рухатися далі, тож забудьте про це."],w:"Довіру повертає визнана помилка й перевірна гарантія (пілот у двох магазинах, показники щотижня). «Враховано» чи «забудьте» нічого не дають перевірити."},
{e:2,k:"Крок 6 · Короткі перемоги",q:"Я навчилася працювати з касою, але не впевнена у звіті кінця зміни.",o:["Перші два тижні старший касир звіряє ваш звіт із системою наприкінці зміни та показує, що виправити.","Звіти зрозумілішими стануть із часом, коли ви набудете досвіду. Не варто засмучуватися, усе поступово налагодиться.","Звіт простий, якщо уважно його складати. Дорослий працівник сам відповідає за свої цифри й нікому не дорікає."],w:"Навичку закріплює зворотний зв'язок: хто, коли, з чим звіряє. «Налагодиться з досвідом» чи «самі відповідаєте» без людини й строку нічого не дають."},
{e:2,k:"Крок 2 · Коаліція",q:"Хто в магазині знає цю систему краще за інших? Я нікого не бачу.",o:["Слушно. У кожному магазині є суперкористувач, його ім'я біля каси, а щочетверга він відповідає на питання.","Фахівці є, але вони не завжди помітні. Із часом ви познайомитеся з усіма, хто може допомогти у питаннях.","Система проста, експерти не потрібні. Розберетеся самі, а якщо щось незрозуміло, то, може, це робота не для вас."],w:"Експертна підтримка має бути видимою: ім'я біля каси й час відповідей. «Познайомитеся з часом» чи «експерти не потрібні» допомоги не роблять доступною."},
{e:2,k:"Крок 8 · Закріпити в культурі",q:"Старші касири показують новачкам, як обходити нову систему, бо так швидше.",o:["Тому наставниками стають лише ті, хто пройшов атестацію з нової системи, а дотримання входить в оцінку.","Старші касири мають свій досвід, і новачки з часом самі оцінять різні підходи. Культура працює поступово.","Старші касири знають, як швидше. Новачки мають вчитися в них, а правила мережі існують лише для звіту й перевірок."],w:"Нову норму передає наставник, який її дотримується: атестація й оцінка. «Оцінять самі» чи «правила для звіту» обходи не припиняють."},
{e:3,k:"Крок 3 · Бачення",q:"Мені важко стежити за двома касами самообслуговування водночас. Це неможливо.",o:["Слушно. На пілоті одна людина стежить за чотирма касами, але в пікові години додаємо другу, ось розклад.","З часом ви звикнете стежити за кількома касами. Це питання навички, яка поступово з'явиться в кожного працівника.","Інші касири справляються з двома касами. Якщо вам важко, це питання вашої готовності, а не системи."],w:"Образ нової ролі має мати реалістичні рамки: скільки кас, коли додається друга людина. «Звикнете» чи «інші справляються» меж не окреслюють."},
{e:3,k:"Крок 7 · Закріпити здобутки",q:"Ми навчилися працювати зі сканерами, а тепер додали нові функції. Скільки можна?",o:["Розумію втому. Нових функцій у наступні пів року не буде, лише дрібні виправлення, перелік вивісимо біля каси.","Нові функції з'являються, бо система розвивається, і ми намагаємося зробити їх зручними. Потрібно трохи звикнути.","Нові функції зроблені для вашої користі. Скаржитися на них не варто, краще вивчайте їх, і все буде гаразд."],w:"Втому від змін знімає чесна пауза й видимий перелік мінімальних виправлень. «Потрібно звикнути» чи «скаржитися не варто» темпу не регулюють."},
{e:3,k:"Крок 2 · Коаліція",q:"Мені потрібен напарник на кожну зміну, а людей ледве вистачає на каси.",o:["Це реальне обмеження. У піковий час залучаємо резерв із сусідніх магазинів, графік на місяць затверджено.","Нестача людей це проблема всієї галузі. Ми шукаємо рішення разом, і воно обов'язково знайдеться найближчим часом.","Людей вистачає, просто їх треба розставити правильно. Плануйте зміни краще й не скаржтеся на брак персоналу."],w:"Бар'єр кадрів знімають резервом і затвердженим графіком. Спільне «шукаємо рішення» чи докір за планування навантаження не розв'язують."},
{e:4,k:"Крок 5 · Прибрати бар'єри",q:"Інвентаризацію ми й надалі робимо вручну, а система лише дублює залишки.",o:["Подвійна робота шкодить. З наступної інвентаризації залишки беруться зі сканерів, лист лишається для вибірки.","Системи вдосконалюються, і з часом дублювання зникне. Поки що потрібно рахувати вручну й вносити дані в систему.","Інвентаризація вимагає ручної перевірки, так було завжди. Не вигадуйте нових процедур замість перевіреної."],w:"Подвійна робота вбиває норму. Названий строк і рішення (залишки зі сканерів, вибірковий контроль) прибирають бар'єр; «з часом зникне» чи «так було завжди» його лишають."},
{e:4,k:"Крок 7 · Закріпити здобутки",q:"Через місяць після запуску ніхто не стежить, чи користуються касами покупці.",o:["Слушно. Щотижня рахуємо частку покупців на касах самообслуговування по магазинах і вивішуємо таблицю.","Увага до кас залишається, і ми це відстежуємо в робочому порядку. Дані з'являться, коли їх буде достатньо.","Покупці самі вирішують, чи користуватися. Стежити за їхнім вибором ніхто не повинен, це не ваша справа."],w:"Закріплення потребує вимірювання по магазинах: частка покупців щотижня й видима таблиця. «Відстежуємо в робочому порядку» чи «покупці вирішують» цього не забезпечують."},
{e:4,k:"Крок 2 · Коаліція",q:"Мережа велика, а правила для кас у кожного магазину свої. Хто за це відповідає?",o:["Єдині правила затвердила робоча група з директорів, відповідальний за дотримання вказаний у наказі.","Магазини різні, тому й правила дещо відрізняються. Згодом їх приведуть до єдиного виду, коли все налагодиться.","За правила відповідає кожен директор свого магазину. Не шукайте винних, робіть свою роботу згідно з вказівками."],w:"Єдині правила потребують спільного органу й названого відповідального. «Приведуть до єдиного виду згодом» чи «кожен директор сам» суперечностей не усувають."},
{e:0,k:"Крок 1 · Терміновість",q:"Продажі зростають і без кас самообслуговування. Навіщо щось додавати?",o:["Продажі ростуть, це добре. Але в сусідній мережі такі каси вже є, і наші покупці порівнюють черги та іноді йдуть туди.","Зростання справді є, але ринок змінюється швидко, і варто готуватися заздалегідь. Розвиток потрібен кожному, хто хоче лишитися.","Зростання нікого не заспокоює. Рішення про каси ухвалене, тож не питайте, навіщо, а допомагайте його виконати."],w:"Визнання зростання плюс конкретний сигнал із ринку (конкурент, порівняння черг). «Ринок змінюється» чи «не питайте» терміновості не пояснюють."},
{e:0,k:"Крок 1 · Терміновість",q:"Покупці в нашому районі літні. Вони не користуватимуться самообслуговуванням.",o:["Частина не буде, ви праві. Дві звичайні каси лишаємо, а вибір покупців щомісяця вимірюємо й ділимося цифрами.","Покупці бувають різні, і ми це враховуємо. З часом побачимо, як вони поставляться до нового формату обслуговування.","Покупці користуються тим, що дають. Не вигадуйте за них, як вони поводитимуться, і не заважайте запуску."],w:"Сумнів у попиті приймають як дані: лишити звичайні каси й міряти вибір. «З часом побачимо» чи «не вигадуйте» потребу не перевіряють."},
{e:0,k:"Крок 5 · Прибрати бар'єри",q:"Не бачу, що я можу зробити, якщо покупці просто відмовляться від кас.",o:["Ваша роль ключова: показати покупцю, як користуватися. На це в зміні виділено десять хвилин у залі.","Покупці рано чи пізно звикнуть, і це питання часу. Ваша допомога в цьому, звісно, також важлива для всіх.","Нічого особливого від вас не потрібно. Покупці самі вирішують, а ви виконуйте свої звичайні обов'язки."],w:"Конкретна роль працівника в зміні (показати, час у залі) дає сенс діям. «Рано чи пізно звикнуть» чи «нічого не потрібно» місця працівнику не лишають."},
{e:1,k:"Крок 1 · Терміновість",q:"Нам і так непогано з усім, що є. Навіщо йти на зайвий клопіт?",o:["Розумію, зараз стабільно. Але витрати зросли на п'ять відсотків, і швидші каси допоможуть втримати виручку.","Стабільність це добре, але світ не стоїть на місці. Зрештою всім доведеться пристосовуватися до нових умов.","Непогано, доки директор не скаже інакше. Не шукайте клопоту, а виконуйте те, що вимагає мережа."],w:"Інтерес з'являється, коли стабільність пов'язана з конкретним тиском (витрати +5%). «Світ не стоїть» чи «виконуйте» власного інтересу не показують."},
{e:1,k:"Крок 4 · Донесення бачення",q:"Мені ніхто не пояснює, навіщо мені вкладати зусилля, окрім наказу.",o:["Слушно. Для вас це вихідні без довгих черг і бонус від кожної каси, що працює без помилок, виплата щомісяця.","Зусилля окупляться, бо вони вкладаються у спільний результат. Просто потрібно трохи часу, щоб це стало видно кожному.","Окрім наказу, вам нічого не потрібно. Виконуйте розпорядження, а не вимагайте додаткових пояснень від керівництва."],w:"Донесення «навіщо» має містити особисту вигоду працівника (менше черг, бонус). «Окупляться» чи «окрім наказу нічого» причини не пояснюють."},
{e:1,k:"Крок 8 · Закріпити в культурі",q:"Директор магазину сам ігнорує нові правила. Чому я маю їх дотримуватись?",o:["Це підриває довіру. Директорів теж оцінюємо за дотриманням правил, а порушення фіксує районний менеджер, ось форма.","Керівники теж навчаються, і їм потрібен час. Ми розуміємо ваше занепокоєння й будемо працювати над цим разом.","Директор має свої повноваження. Порівнювати себе з ним не варто, ваше завдання виконувати правила без оглядки."],w:"Культуру тримає однакова відповідальність, зокрема керівників (оцінка директорів). «Керівники теж навчаються» чи «не порівнюйте» подвійного стандарту не знімають."},
{e:2,k:"Крок 5 · Прибрати бар'єри",q:"Я не вмію вирішувати проблеми з банківськими картками на касі. Куди дзвонити?",o:["Слушно. На кожній касі номер гарячої лінії з відповіддю за п'ять хвилин, а поруч інструкція з трьох кроків.","З проблемами з картками з часом навчаться справлятися всі, адже це типова ситуація. Спробуйте діяти за обставинами.","Картки це справа банку. Якщо не вирішується, відправляйте покупця до звичайної каси, а не шукайте вирішень."],w:"Потрібен готовий канал у момент проблеми: номер лінії й короткі кроки. «Діяти за обставинами» чи «відправляйте покупця» каналу не дають."},
{e:2,k:"Крок 4 · Донесення бачення",q:"Поясніть, як рахується мій бонус за касу самообслуговування. Я не розумію формули.",o:["Просто: за кожну зміну без розбіжностей у касі нараховується фіксована сума, а таблиця прикладів висить у кімнаті.","Формула складається з кількох показників, і її можна пояснити докладніше. Просто знайдемо відповідний час для цього.","Формула затверджена бухгалтерією й складна для пояснення. Достатньо знати, що бонус нараховується автоматично."],w:"Про винагороду потрібне просте правило й приклад. «Знайдемо час» чи «складна для пояснення» ясності не дають."},
{e:2,k:"Крок 8 · Закріпити в культурі",q:"Нових працівників навчають по-різному, залежно від зміни. Хто за це відповідає?",o:["Тепер єдина програма введення на два дні для всіх змін, відповідальний за її виконання вказаний у наказі.","Різниця природна, адже зміни мають свою специфіку. З часом підходи вирівняються, і це буде зручніше для всіх.","Кожна зміна навчає так, як їй зручно. Не втручайтеся в чужі процеси, відповідайте за свою частину роботи."],w:"Нових людей закріплює єдина програма введення й названий відповідальний. «Вирівняються з часом» чи «кожна зміна сама» розбіжностей не усувають."},
{e:3,k:"Крок 4 · Донесення бачення",q:"Покупці плутаються в підказках на екрані й питають мене. Я не встигаю відповідати всім.",o:["Підказки справді складні. До п'ятниці спростимо їх до трьох слів і додамо біля кас наклейку з кроками.","З часом покупці звикнуть до підказок, і питань стане менше. Потрібно трохи терпіння від усіх, хто працює.","Покупці мають читати підказки уважніше. Відповідайте по черзі й не скаржтеся на їхню неуважність."],w:"Перешкоду усувають змінюючи сам інтерфейс і підказку (спрощення, наклейка). «Покупці звикнуть» чи докір покупцям умов праці не змінюють."},
{e:3,k:"Крок 8 · Закріпити в культурі",q:"Колеги не повідомляють про збої, щоб не мати проблем. І я так само.",o:["Це сигнал. Запроваджуємо звіт про збої без покарання, а автори корисних повідомлень відзначаються щомісяця.","Повідомляти про збої важливо, і ми це цінуємо. Колектив поступово навчиться відкритості, коли побачить, що це безпечно.","Ховати збої не можна, це порушення. Хто мовчить про проблеми, відповідатиме за наслідки перед керівництвом."],w:"Звичку повідомляти про збої формують безпека (без покарання) і визнання. «Поступово навчаться» чи погроза відповідальністю мовчання не знімають."},
{e:3,k:"Крок 6 · Короткі перемоги",q:"Мені важко швидко рахувати здачу, коли покупець платить готівкою на касі.",o:["Розумію. Каса сама показує й видає здачу, ваш крок лише перевірити екран. На пілоті це вже працює без помилок.","З практикою здача рахується швидше, і з часом це стане звичкою. Потрібно просто більше тренуватися щодня.","Рахувати здачу має вміти кожен касир. Якщо не виходить, тренуйтеся в позаробочий час, а не скаржтеся."],w:"Складність зникає, коли видно, що система сама рахує, а працівник лише перевіряє. «Більше тренуйтеся» чи докір не змінюють самої операції."},
{e:4,k:"Крок 4 · Донесення бачення",q:"Повідомлення про нові правила приходять у різні чати. Я не знаю, що актуальне.",o:["Це плутає. Усі правила тепер тільки в одному чаті з закріпленим повідомленням, зміни надсилаємо щоп'ятниці.","Правила оновлюються, і це нормально для розвитку. Згодом кількість чатів скоротиться, коли все впорядкується.","Читайте всі чати уважно, там усе є. Слідкувати за змінами це ваш обов'язок, а не керівництва."],w:"Закріплення потребує одного каналу й регулярності. «Згодом впорядкується» чи «читайте всі чати» джерела правил не уніфікують."},
{e:4,k:"Крок 5 · Прибрати бар'єри",q:"Нова система вимагає окремого входу для кожної дії. Це гальмує, і ми повертаємося до старого способу.",o:["Це справжня причина відкату. До кінця місяця введемо єдиний вхід по картці, а до того діє спрощений.","Вхід можна буде вдосконалити, і над цим працюють. Тимчасові незручності неминучі, але вони минуться.","Старий спосіб недопустимий. Входьте так, як вимагає система, і не шукайте шляхів спрощення."],w:"Бар'єр, що спричиняє відкат, треба прибирати швидко: єдиний вхід зі строком і спрощена версія. «Вдосконалюють» чи «недопустимо» повернення не зупиняють."},
{e:4,k:"Крок 3 · Бачення",q:"Які в нас будуть магазини через рік? Мені потрібне бачення, а не нові накази.",o:["Через рік у кожному магазині половина покупців платить на касах самообслуговування, а зал працює на консультацію.","Магазини стануть сучаснішими й зручнішими для всіх, і це спільна мета. Деталі відкриємо поступово, коли будемо готові.","Бачення визначає керівництво мережі. Ваше завдання виконувати накази, а не будувати плани на рік."],w:"Закріплення потребує образу майбутнього з вимірною ознакою (половина оплат на самообслуговуванні). «Сучасніші й зручніші» чи «виконуйте накази» орієнтира не дають."}

function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

 if(S.c2>=5)return result();var it=S.p2[S.c2],q=S.qs[it.qi].q;

 if(it.pick){h+='<div class="fb"><p><b>'+(it.pick==it.c?"Правильно (2/2).":"Неправильно (0/2).")+'</b> Правильний крок: '+KS[it.c]+'.</p><p>'+KE[it.c]+'</p></div><button class="btn" onclick="S.c2++;phase2()">'+(S.c2==4?"Показати результат":"Далі")+'</button>'}
 app.innerHTML=h}

 DOM.forEach(function(d,i){var ok=ready(d);h+='<button class="opt'+(S.di==i&&ok?" l2":"")+'" '+(ok?"":"disabled")+' onclick="pd('+i+')">'+d.ic+' <b>'+d.n+'</b> · впровадження '+d.scn+(ok?'':' <span class="muted">(готується)</span>')+'</button>'});

function verdict(c){var s=c.sum,v;if(s>=8)v=["Союзник змін","Ви визнаєте емоцію й підкріплюєте відповідь фактом або кроком, а саме це знижує опір."];else if(s>=5)v=["Уважний слухач","Людину ви зазвичай чуєте, але іноді відповідь лишається без конкретики. Додавайте цифру, строк або відповідального."];else v=["Потрібне тренування","Відповіді надто часто тиснуть або розпливаються. Спробуйте формулу: визнати емоцію, назвати факт, запропонувати крок."];
 var edge="";if(c.cnt[2]==5)edge="Усі п'ять відповідей були відмахуваннями. Спробуйте уявити себе на місці скептика: що б ви хотіли почути?";else if(c.cnt[1]==5)edge="Усі п'ять відповідей були розмитими. Безпечно, але опір вони не знімають: бракує фактів і кроків.";else if(c.cnt[0]==5)edge="П'ять із п'яти сильних відповідей. Тепер перевірте себе на живих опонентах.";
 var mn=Math.min.apply(null,c.el),weak=E.filter(function(n,i){return c.el[i]==mn}),w="";if(mn<2&&weak.length<5)w="Найслабше: "+weak.join(", ")+".";return{t:v[0],d:v[1],edge:edge,weak:w}}
function report(){var c=calc(),v=verdict(c);var L=["Скептик на нараді (Заняття 7)","Ім'я: "+(S.name||"—"),"Галузь: "+S.dom.n,"Результат: "+c.sum+"/10 — "+v.t];E.forEach(function(n,i){L.push(n+": "+c.el[i]+"/2")});S.qs.forEach(function(it,i){L.push((i+1)+". «"+it.q.q+"» — "+T[S.ans[i].pick][0])});L.push("Коттер (діагноз): "+kpts()+"/10");L.push("Разом: "+(c.sum+kpts())+"/20");if(v.weak)L.push(v.weak);return L.join("\n")}
function result(){var c=calc(),v=verdict(c),h='<div class="bar"><i style="width:100%"></i></div><h2>Результат'+(S.name?", "+esc(S.name):"")+'</h2><div class="big">'+(c.sum+kpts())+'/20</div><p class="muted">Разом: відповіді скептикам (ADKAR) '+c.sum+'/10 + діагноз Коттера '+kpts()+'/10</p><h3>'+v.t+'</h3><p>'+v.d+'</p>'+(v.edge?'<p><b>'+v.edge+'</b></p>':"")+(v.weak?'<p class="muted">'+v.weak+'</p>':"");
 E.forEach(function(n,i){h+='<div class="row"><span>'+n+'</span><div class="trk"><i style="width:'+c.el[i]*50+'%"></i></div><b>'+c.el[i]+'/2</b></div>'});
 var kp=kpts();h+='<div class="row" style="border-top:1px solid var(--line);padding-top:12px;margin-top:12px"><span>Коттер</span><div class="trk"><i style="background:var(--ink-soft);width:'+kp*10+'%"></i></div><b>'+kp+'/10</b></div><p class="muted">'+(kp==10?"Усі п'ять кроків Коттера розпізнано.":kp>=8?"Кроки Коттера ви розпізнаєте впевнено.":kp>=4?"Частину кроків Коттера розпізнано, решту варто повторити.":kp==0?"Жоден крок не розпізнано: перегляньте вісім кроків Коттера перед нарадою.":"Кроки Коттера потребують повторення перед нарадою.")+'</p>';
 h+='<table><tr><th>Заперечення</th><th>Ваша відповідь</th></tr>';S.qs.forEach(function(it,i){h+='<tr><td>'+it.q.q+'</td><td>'+T[S.ans[i].pick][0]+'</td></tr>'});
 h+='</table><button class="btn" onclick="copyR()">Скопіювати результат</button><button class="btn sec" onclick="start()">Зіграти ще раз</button><button class="btn sec" onclick="home()">Змінити галузь</button><button class="btn sec" onclick="teacher()">Перегляд результатів групи (для викладача)</button><div id="box"></div>';app.innerHTML=h;save(c,v)}
function fallback(txt){var b=document.getElementById("box");b.innerHTML='<p class="muted">Скопіюйте текст вручну:</p><textarea rows="8" id="ta"></textarea>';var t=document.getElementById("ta");t.value=txt;t.select();return t}
function copyR(){var txt=report();try{navigator.clipboard.writeText(txt).then(function(){document.getElementById("box").innerHTML='<p class="muted">Скопійовано.</p>'},function(){fallback(txt)})}catch(e){var t=fallback(txt);try{document.execCommand("copy")}catch(x){}}}
function save(c,v){try{if(window.storage&&!S.saved){S.saved=1;var rec={ts:new Date().toISOString(),name:S.name||"—",d:S.dom.n,sum:c.sum,v:v.t,el:c.el,k:kpts(),a:S.ans.map(function(x){return T[x.pick][0]})};window.storage.set("sk:"+Date.now()+Math.floor(Math.random()*1000),JSON.stringify(rec),true).catch(function(){})}}catch(e){}}
async function teacher(){var rows=[];try{var l=await window.storage.list("sk:",true);for(var i=0;i<l.keys.length;i++){try{var r=await window.storage.get(l.keys[i],true);rows.push(JSON.parse(r.value))}catch(e){}}}catch(e){}
 rows.sort(function(a,b){return a.ts<b.ts?1:-1});var h='<h2>Результати групи</h2>';
 if(!rows.length)h+='<p class="muted">Збережених результатів немає. Збереження працює лише в перегляді чату; в окремому HTML-файлі використовуйте кнопку «Скопіювати результат».</p>';
 else{h+='<table><tr><th>Ім'+"'"+'я</th><th>Бали</th><th>Вердикт</th><th>Коттер</th></tr>';rows.forEach(function(r){h+='<tr><td>'+esc(r.name)+'</td><td>'+r.sum+'/10</td><td>'+esc(r.v)+'</td><td>'+(r.k===undefined?"—":r.k+"/10")+'</td></tr>'});h+='</table><button class="btn" onclick="csv()">Експорт CSV</button>'}
 h+='<button class="btn sec" onclick="home()">Назад</button><div id="box"></div>';app.innerHTML=h;window._rows=rows}
function csv(){var q=function(v){return '"'+String(v).replace(/"/g,'""')+'"'},L=[["Час","Ім'я","Галузь","Бали","Вердикт"].concat(E).concat(["Коттер","Відповіді"]).map(q).join(";")];
 (window._rows||[]).forEach(function(r){L.push([r.ts,r.name,r.d||"",r.sum,r.v].concat(r.el).concat([r.k===undefined?"":r.k,r.a.join(" | ")]).map(q).join(";"))});var txt="\uFEFF"+L.join("\r\n");
 try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/csv;charset=utf-8"}));a.download="skeptyk_rezultaty.csv";document.body.appendChild(a);a.click();a.remove()}catch(e){}fallback(txt)}
home();
</script></body></html>
