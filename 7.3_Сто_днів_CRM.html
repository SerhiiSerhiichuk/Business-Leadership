<!DOCTYPE html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Сто днів CRM</title>
<style>
:root{--ink:#1E2761;--ink2:#384080;--bg:#F3F6FC;--card:#fff;--gold:#C9962C;--goldsoft:#F3E4C6;--mut:#5B6685;--line:#DDE4F5;--hero:#1E2761;--red:#B3492F;--green:#2E7D6B;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#E8ECFF;--ink2:#B9C2F0;--bg:#10142B;--card:#1A2040;--gold:#E0AE45;--goldsoft:#3A3420;--mut:#A3ADD3;--line:#2E3664;--hero:#2B3575;--green:#4FB59E;--red:#E0795C}}
:root[data-theme="dark"]{--ink:#E8ECFF;--ink2:#B9C2F0;--bg:#10142B;--card:#1A2040;--gold:#E0AE45;--goldsoft:#3A3420;--mut:#A3ADD3;--line:#2E3664;--hero:#2B3575;--green:#4FB59E;--red:#E0795C}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.serif{font-family:Cambria,Georgia,serif}#app{display:flex;justify-content:center;padding:28px 16px}.st{width:100%;max-width:720px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:34px 30px;box-shadow:0 18px 40px -26px rgba(30,39,97,.4)}
@media(max-width:480px){.card{padding:24px 18px}}
.k{font-size:13px;color:var(--mut);margin:0 0 8px}h1{font-size:26px;line-height:1.2;margin:0}h2{font-size:18px;margin:26px 0 10px}p{margin:0 0 12px}.mut{color:var(--mut)}.sm{font-size:14px}
input,textarea{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);font:inherit;font-size:15px;color:var(--ink);background:var(--bg)}
.btn{display:inline-flex;justify-content:center;align-items:center;padding:13px 22px;border-radius:10px;border:1.5px solid var(--line);font:inherit;font-weight:600;font-size:15px;cursor:pointer;background:var(--bg);color:var(--ink)}
.pri{background:var(--ink);color:var(--bg);border-color:var(--ink);width:100%}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.row .btn{flex:1;min-width:150px}
.pg{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:18px}.pg i{display:block;height:100%;background:var(--gold);transition:width .3s}
.bar{margin-bottom:9px}.bl{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;margin-bottom:3px}.bt{height:11px;background:var(--bg);border:1px solid var(--line);border-radius:7px;overflow:hidden}.bt i{display:block;height:100%;border-radius:7px;transition:width .4s}
.hero{background:var(--hero);color:#fff;border-radius:14px;padding:20px 22px;margin-top:18px}.hero p{color:#DCE1F5;font-size:14.5px}.hero b{color:#fff}.hero .lb{font-size:12px;color:#F3E4C6;font-weight:700}.hero .nm{font-size:22px;font-weight:700;margin:2px 0 10px}
.box{margin-top:14px;padding:14px 16px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:14px}
.quote{margin:14px 0;padding:14px 16px;border-radius:14px;background:var(--goldsoft);border:1px solid var(--line);font-size:15.5px;line-height:1.5;color:#1E2761}
:root[data-theme="dark"] .quote{color:var(--ink)}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .quote{color:var(--ink)}}
.sc{display:flex;gap:14px;align-items:center;margin-bottom:12px}.ic{flex:none;width:52px;height:52px;border-radius:14px;background:var(--goldsoft);display:flex;align-items:center;justify-content:center}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:700;margin:0 6px 6px 0;border:1px solid var(--line)}.chip.up{color:var(--green);background:color-mix(in srgb,#2E7D6B 16%,var(--bg))}.chip.dn{color:var(--red);background:color-mix(in srgb,#B3492F 16%,var(--bg))}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.link{display:block;margin:18px auto 0;background:none;border:none;color:var(--mut);font-size:13px;text-decoration:underline;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(10,14,40,.62);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}.ov .card{max-height:90vh;overflow:auto;width:100%;max-width:760px}
.cb{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:13px 14px;margin-bottom:8px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px;cursor:pointer}.cb .em{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}.cb:hover{border-color:var(--gold)}
ol{margin:6px 0 0;padding-left:20px}li{margin-bottom:6px}
</style></head><body><div id="app"></div>
<script>
(function(){
var IND=[{k:"a",n:"Прийняття",c:"#2E7D6B"},{k:"t",n:"Довіра",c:"#384080"},{k:"i",n:"Імпульс змін",c:"#C9962C"},{k:"b",n:"Бюджет і час",c:"#B3492F"}];
var KS=[
{n:1,t:"Створити відчуття терміновості",c:"Люди не бачили, навіщо зміни, тож CRM сприймали як примху керівництва, а підтримка трималася на наказах."},
{n:2,t:"Зібрати коаліцію змін",c:"Проєкт тримався на одній-двох людях: звільнення чи збій одразу обвалювали темп, а скептиків не було кому переконувати."},
{n:3,t:"Сформувати бачення",c:"Кожен уявляв CRM по-своєму: продавці боялися контролю, склад — зайвої роботи, і спільного орієнтира не було."},
{n:4,t:"Донести бачення",c:"Інформація була, але не про вигоду для людей: порожнечу заповнювали чутки, і довіра знижувалась."},
{n:5,t:"Усунути перешкоди",c:"Громіздкі форми, старі бонуси й брак навчання лишилися, тож систему обходили: працювати в ній було важче, ніж без неї."},
{n:6,t:"Забезпечити швидкі перемоги",c:"Без видимого результату пілота скептики вирішили, що зміни — лише витрати, і підтримка слабшала."},
{n:7,t:"Закріпити успіхи й рухатися далі",c:"Успіх оголосили закінченням, імпульс зник, а процеси, що не вписувалися в систему, ніхто не змінив."},
{n:8,t:"Вкорінити зміни в культурі",c:"Нові дії не вписали в оцінювання й адаптацію, тож у складні моменти люди поверталися до таблиць."}];
function O(k,lbl,t,cov,fx,r,w){return{k:k,lbl:lbl,t:t,cov:cov,fx:{a:fx[0],t:fx[1],i:fx[2],b:fx[3]},r:r,w:w}}
var STAGES=[
{days:"1–10",title:"Чому саме зараз",ic:0,ctx:"Директорка Ірина підписала закупівлю CRM. Відділ продажів досі веде клієнтів у таблицях, і за квартал загубили кілька великих заявок. Ви — керівник змін, у вас сто днів.",o:[
O("g","Команда й факти","Зібрати Олену, Богдана й Тараса, показати їм дані про втрачені заявки й попросити разом очолити перехід на нову систему.",[1,2],[1,1,1,-1],"Олена гортає список втрачених заявок: «Вісім із них мої. Гаразд, я в групі». Богдан просить слова на загальних зборах, а Тарас береться оцінити терміни.","Дані про проблему створюють терміновість (крок 1), а троє впливових людей у групі формують коаліцію (крок 2), на яку можна спиратися далі."),
O("m","Загальні збори","Провести загальні збори, показати слайди про втрачені заявки й оголосити, що перехід на нову систему самостійно вестиме ІТ-відділ.",[1],[1,0,1,0],"Збори минули тихо: кілька кивків і жодного запитання. У коридорі чути: «Знову ІТ щось придумало, подивимося, скільки це затягнеться».","Терміновість показано (крок 1), але коаліції немає: проєкт лишається ініціативою ІТ, і впливові люди не відчувають його своїм."),
O("p","Наказ","Одразу вибрати постачальника й оголосити наказом дату переходу, щоб не втрачати час на обговорення, зустрічі та зайві суперечки.",[],[-1,-1,2,1],"Наказ з’явився в чаті о п’ятій вечора. Богдан пише: «Нас навіть не спитали». Ознайомлення підписали всі, проте навіщо це, ніхто не пояснив.","Наказ швидко запускає рух, але пропускає терміновість і коаліцію (кроки 1–2): люди виконують формально, а опір лишається невидимим.")]},
{days:"11–25",title:"Куди ми йдемо",ic:1,ctx:"Усі знають, що CRM буде, але уявляють її по-різному: продавці бояться контролю, склад чекає додаткової паперової роботи.",o:[
O("g","Бачення з відділами","Разом із групою написати бачення: що зміниться для продавця, складу й клієнта, і пройти цим текстом із кожним відділом.",[3,4],[2,1,0,0],"Склад уперше чує про зручніші накладні, а продавці — про те, що система не буде звітом для контролю. Пролунали живі запитання, чесніших розмов давно не було.","Бачення (крок 3) пояснює, що зміниться для кожного, а розмова з відділами (крок 4) показує його повторно й вислуховує запитання."),
O("m","Презентація постачальника","Розіслати всім презентацію постачальника з переліком функцій і датою запуску, не пояснюючи, що це дає кожному з відділів.",[4],[0,0,1,0],"Більшість відкрила файл на першій сторінці. Продавці знайшли слово «контроль», склад — «нові обов’язки». Питання «а мені що з цього» лишилося без відповіді.","Інформація поширена (крок 4), але без бачення (крок 3) люди самі домислюють, що система означає для них."),
O("p","Плакати й налаштування","Повісити в офісі плакати «Ми стаємо сучаснішими» й зосередитися на налаштуванні системи, а розмови про сенс відкласти на потім.",[],[-1,0,1,1],"Під плакатом хтось дописав: «Сучасніші — значить, звільнять?» Налаштування просувається швидко, але чутки йдуть швидше за графік.","Гасло без змісту не є баченням (крок 3) і не доносить його (крок 4): порожнечу заповнюють чутки.")]},
{days:"26–45",title:"Що заважає працювати",ic:2,ctx:"Налаштування майже завершено. Але форма угоди має двадцять три поля, бонуси досі рахують за старими таблицями, а навчання ніхто не проводив.",o:[
O("g","Спростити й навчити","Скоротити форму до семи ключових полів, перенести облік бонусів у систему й виділити тиждень на навчання з наставниками.",[5],[1,1,1,-2],"Олена: «Семи полів мені вистачить, і бонус нарешті враховує систему». Фінансовий директор бурчить через витрати на наставників, але підписує.","Форма, бонуси й навчання — головні перешкоди (крок 5): прибрані, вони перестають змушувати людей обирати між системою й власною вигодою."),
O("m","Навчання за день","Провести загальне навчання для всіх за один день, а форму й облік бонусів залишити, як було, до кінця пілоту.",[],[1,0,0,-1],"Після восьми годин слайдів учасники пам’ятають лише два пункти меню. Богдан: «Чудово, а як це впишеться в мій бонус?» Відповіді нема.","Навчання знімає частину перешкод, але форма й бонуси лишаються (крок 5 не виконано): працювати в системі й далі невигідно."),
O("p","Контроль наказом","Нічого не змінювати й пообіцяти перевіряти, чи вносять продавці дані, а тих, хто не вносить, нагадувати персонально й вимагати пояснень.",[],[-1,-2,1,1],"Через тиждень Богдан надсилає в чат фото таблиці: «Дані поки там, зручніше». Продавці вносять угоди двічі й дедалі частіше питають, навіщо цей контроль.","Вимога без усунення причин (пропущено крок 5) нагадує тиск: система лишається додатковою роботою, а не зручністю.")]},
{days:"46–65",title:"Пілот",ic:3,ctx:"Є пілот: група Олени з дванадцяти продавців. Перші тижні дали змішані результати, у системі вже є реальні дані.",o:[
O("g","Мета й показ результатів","Поставити пілоту мету на шість тижнів і показати іншим відділам реальні результати: швидші відповіді клієнтам, менше загублених заявок.",[6],[1,1,2,-1],"Через три тижні час відповіді клієнтам скоротився на третину. Олена розповідає про це на нараді сама, а троє продавців із інших груп просяться в пілот.","Чітка мета й відкритий показ результатів дають видиму коротку перемогу (крок 6), яка переконує скептиків краще за слова."),
O("m","Пілот без мети","Продовжити пілот без чіткої мети й вважати успіхом сам факт, що група дванадцяти почала вносити угоди в систему.",[],[0,0,1,1],"Звіт для директорки складається з кількості записів. Ірина питає: «А що це змінило для клієнтів?» Чіткої відповіді немає, і ентузіазм групи трохи згасає.","Активність не дорівнює результату: без вимірюваної мети перемоги (крок 6) показати нікому."),
O("p","Запуск для всіх","Пропустити довгий пілот і за два тижні підключити всі відділи одразу, щоб скоротити терміни та витрати на підтримку.",[],[-2,-1,2,2],"Підключення сталося в понеділок. До обіду склад не міг оформити відвантаження, а три продавці звернулися в ІТ з одним і тим самим питанням.","Без пілота немає перевіреної перемоги (крок 6): швидкість економить терміни, але множить помилки на всіх одночасно.")]},
{days:"66–85",title:"Не святкувати зарано",ic:4,ctx:"Пілот довів користь: час відповіді скоротився, а скептики мовчать. Ірина хоче оголосити проєкт завершеним на святковому обіді.",o:[
O("g","Рухатися далі","Подякувати групі, не оголошуючи завершення, і використати довіру, щоб підключити склад і змінити суміжні процеси разом із системою.",[7],[1,1,1,1],"Склад отримує свої пріоритети в системі, а Тарас пропонує змінити процес повернень. Ірина погоджується: «Свято буде, коли це стане звичним».","Не зупинятися після успіху (крок 7): довіра від перемог використана для подальших змін, а не витрачена на святкування."),
O("m","Вимога до всіх","Оголосити успіх пілоту й вимагати від решти відділів перейти в систему до кінця місяця без змін процесів і навчання.",[],[-1,0,2,1],"Відділи переходять у систему за зразком пілота, але процеси в них інші. Скарги: «В Олени працює, а в нас форми не підходять».","Успіх використано для тиску, але суміжні процеси не змінено (крок 7 не виконано): пілотна група перемогла, решта не вписується."),
O("p","Завершити проєкт","Оголосити проєкт завершеним, закрити робочу групу й повернути її учасників до звичних обов’язків без передачі досвіду іншим відділам.",[],[-1,1,-2,2],"На святі багато тостів. Через два тижні Олена повертається до своїх клієнтів, групи більше немає, а питання нових відділів ніхто не збирає.","Раннє оголошення перемоги (пропущено крок 7) зупиняє рух: тих, хто ще не вписався, ніхто не веде.")]},
{days:"86–100",title:"Нова норма",ic:5,ctx:"Система працює, але відкат ще можливий. Наближається кінець року: переглядають посадові інструкції, бонуси й програму адаптації нових співробітників.",o:[
O("g","Вписати в правила","Вписати роботу в системі в посадові інструкції та бонуси й показувати новачкам, як вона пов’язана з успіхом компанії.",[8],[1,2,0,0],"Новачок отримує в перший день профіль у системі та історію клієнтів. Богдан: «Дивно, але я вже не уявляю, як було без цього».","Звичка закріплюється, коли нові дії стають частиною оцінювання, інструкцій і адаптації (крок 8), а не окремим проєктом."),
O("m","Закрити таблиці","Закрити старі таблиці й нагадати в розсилці, що система — єдиний спосіб працювати з клієнтами, вимагаючи дисципліни від усіх відділів.",[],[0,-1,1,1],"Таблиці зникли, але деякі продавці ведуть нотатки в месенджерах, а наприкінці кварталу з’являється «тимчасова» таблиця. Вимога є, причин триматися мало.","Заборона закриває старий шлях, але без змін в оцінюванні та адаптації (крок 8 не виконано) нова поведінка тримається лише на контролі."),

function teacherHtml(){var t=st.teacher,b;
if(t==="load")b='<p class="mut">Завантаження…</p>';
else if(t===null||t===undefined)b='<p class="mut">Збереження результатів недоступне в цьому режимі (наприклад, файл відкрито без чату). Користуйтеся кнопкою «Скопіювати результат» на екрані підсумку.</p>';
else if(!t.length)b='<p class="mut">Результатів поки немає.</p>';
else{var n=t.length,avgSk=(t.reduce(function(s,r){return s+(r.sk||[]).length},0)/n).toFixed(1);
var ends=["A","B","C"].map(function(k){var c=t.filter(function(r){return r.end===END[k][0]}).length;return bar(END[k][0],c,n,k==="A"?"#2E7D6B":(k==="B"?"#C9962C":"#B3492F"))}).join("");
var inds=IND.map(function(x){var s=t.reduce(function(a,r){return a+((r.ind||{})[x.k]||0)},0);return bar(x.n+" (середнє)",Math.round(s/n*10)/10,10,x.c)}).join("");
var miss=KS.map(function(k){var c=t.filter(function(r){return(r.sk||[]).indexOf(k.n)>=0}).length;return bar(k.n+". "+k.t+" (пропустили)",c,n,"#384080")}).join("");
b='<p class="sm"><b>Учасників:</b> '+n+' · у середньому пропущено кроків: '+avgSk+' з 8</p><h2 style="margin-top:14px">Фінали</h2>'+ends+'<h2>Показники</h2>'+inds+'<h2>Які кроки пропускали</h2>'+miss+'<div style="overflow-x:auto;margin-top:12px"><table><tr><th>Ім’я</th><th>Дата</th><th>Фінал</th><th>Пропущено</th></tr>'+t.map(function(r){return'<tr><td>'+esc(r.name||"—")+'</td><td>'+esc(r.date||"")+'</td><td>'+esc(r.end||"")+'</td><td>'+(r.sk||[]).length+'</td></tr>'}).join("")+'</table></div>'}
return'<div class="ov"><div class="card"><h1 class="serif" style="font-size:22px;margin-bottom:10px">Результати групи</h1>'+b+(st.csvText?'<div class="box"><p class="sm">Завантаження недоступне. Скопіюйте CSV:</p><textarea rows="6" readonly>'+esc(st.csvText)+'</textarea></div>':"")+'<div class="row"><button class="btn" data-a="tcsv"'+(st.teacher&&st.teacher!=="load"&&st.teacher.length?"":" disabled")+'>Експорт CSV</button><button class="btn" data-a="trefresh">Оновити</button><button class="btn" data-a="tclose">Закрити</button></div></div></div>'}
function render(){var m={intro:intro,stage:stage,react:react,event:event,results:results};app.innerHTML='<div class="st">'+m[st.screen]()+'</div>'+(st.teacherOpen?teacherHtml():"");if(!st.teacherOpen)window.scrollTo(0,0)}
function openTeacher(){st.teacherOpen=true;st.teacher="load";st.csvText="";render();loadAll(function(r){st.teacher=r;render()})}
function pick(di){var s=st.s,ci=st.orders[s][di],o=STAGES[s].o[ci],d=stepStage(st.g,s,ci);st.last={ci:ci,d:d};st.journal.push({t:"act",s:s,lbl:o.lbl,d:d,ci:ci});st.screen="react";render()}
function advance(){if(st.s>=STAGES.length-1){st.screen="results";save()}else{st.s++;st.screen="stage"}render()}
function next(){if(st.screen==="react"){var p=st.plan.filter(function(x){return x.after===st.s})[0];if(p){var r=stepEvent(st.g,p.ev);st.lastEv={ev:p.ev,r:r};st.journal.push({t:"ev",title:p.ev.t,tag:r.out.tag,d:r.d});st.screen="event";render()}else advance()}else advance()}
function copyReport(){var t=report();function fb(){st.manual=t;render();var x=document.getElementById("man");if(x&&x.select)x.select()}
try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){st.manual="";var b=app.querySelector('[data-a="copy"]');if(b)b.textContent="Скопійовано ✓"},fb)}else fb()}catch(e){fb()}}
function downloadCsv(){var csv=toCsv(st.teacher);try{var bl=new Blob([csv],{type:"text/csv;charset=utf-8"}),u=URL.createObjectURL(bl),a=document.createElement("a");a.href=u;a.download="Сто_днів_CRM_результати.csv";document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(u)},1000)}catch(e){st.csvText=csv;render()}}
app.addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(!b)return;var a=b.dataset.a;
if(a==="start"){var n=document.getElementById("nm");st.name=n?n.value.trim():"";st.g=newGame();st.s=0;st.orders=mkOrders();st.plan=planEvents();st.journal=[];st.saved=false;st.manual="";st.screen="stage";render()}
else if(a==="pick")pick(+b.dataset.i);
else if(a==="next")next();
else if(a==="retry"){st.screen="intro";st.manual="";render()}
else if(a==="copy")copyReport();
else if(a==="teacher"||a==="trefresh")openTeacher();
else if(a==="tcsv")downloadCsv();
else if(a==="tclose"){st.teacherOpen=false;st.csvText="";render()}});
document.addEventListener("keydown",function(e){if(st.teacherOpen||/INPUT|TEXTAREA/.test(e.target.tagName||""))return;
if(st.screen==="stage"&&/^[1-3]$/.test(e.key))pick(+e.key-1);else if((st.screen==="react"||st.screen==="event")&&e.key==="Enter")next()});
window.__crm={STAGES:STAGES,EV:EV,KS:KS,TH:TH,newGame:newGame,stepStage:stepStage,stepEvent:stepEvent,ending:ending,mkOrders:mkOrders,planEvents:planEvents,toCsv:toCsv,st:st};
render();
})();
</script></body></html>
